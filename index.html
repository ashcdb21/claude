    if (!R) continue;
    const u = depthOf(team, p.x);
    if (R.behind && pressure > 2.5 && facing && u <= ctx.offU - 0.3 && ctx.offU - u < 14 && u > cu - 12 && ctx.offU < 96 && rng() < R.behind * k) {
      const endU = clamp(ctx.offU + 9 + rng() * 8, 0, PITCH.L - 3);
      const inward = p.R.cutIn ? 0.55 : 0.2;
      startRun(w, p, 'behind', { x: xAtDepth(team, endU), y: clamp(p.y + (MID - p.y) * inward, 3, PITCH.W - 3) }, 3.2);
    } else if (R.overlap && ballSide === p.side && Math.abs(c.y - MID) > 12 && cu >= u - 6 && cu > 30 && rng() < R.overlap * k * 1.6) {
      startRun(w, p, 'overlap', { x: xAtDepth(team, clamp(cu + 15, 0, Math.min(PITCH.L - 4, ctx.offU + 8))), y: MID + p.side * 30.5 }, 3.4);
    } else if (R.underlap && ballSide === (p.side || ballSide) && Math.abs(c.y - MID) > 15 && cu > 45 && rng() < R.underlap * k) {
      startRun(w, p, 'underlap', { x: xAtDepth(team, clamp(cu + 12, 0, ctx.offU + 6)), y: MID + ballSide * 12 }, 3);
    } else if (R.drop && cu < 62 && u > cu + 8 && rng() < R.drop * k) {
      startRun(w, p, 'drop', { x: xAtDepth(team, clamp(cu + 12, 0, PITCH.L)), y: clamp(c.y + (MID - c.y) * 0.5, 8, PITCH.W - 8) }, 2.2);
    }
  }
  if (cu > 64 && Math.abs(c.y - MID) > 12) boxZones(w, team, c, ctx);
}

// With the ball wide in the final third, runners take the crossing zones:
// near post, far post, penalty spot and the cut-back.
function boxZones(w, team, c, ctx) {
  const s = Math.sign(c.y - MID) || 1;
  const zones = [[99.5, MID + s * 4], [98.5, MID - s * 6], [93.5, MID - s], [88, MID + s * 3]];
  const cands = w.by[team].filter((p) => p !== c && p.pos !== 'GK' && p.pos !== 'CB' && !p.R.rest && p.stun <= w.t
    && (p.R.runs?.box || p.pos === 'ST') && !(p.mode === 'run' && p.until > w.t) && depthOf(team, p.x) > 55)
    .sort((a, b) => (b.R.runs?.box || 0.5) + (b.pos === 'ST' ? 1 : 0) - (a.R.runs?.box || 0.5) - (a.pos === 'ST' ? 1 : 0));
  cands.slice(0, 4).forEach((p, i) => {
    if (w.rng() > 0.35 + (p.R.runs?.box || 0.5) * 0.6) return;
    const [u, y] = zones[i];
    p.target = { x: xAtDepth(team, Math.min(u, ctx.offU - 0.5)), y: y + (w.rng() - 0.5) * 2 };
    p.spd = p.vmax * 0.9; p.mode = 'box'; p.until = w.t + 1.2; p.zone = i;
  });
}

/* ---------------- Off the ball: the team without it ---------------- */
function thinkDefend(w, team) {
  const Tm = w.T[team], ins = Tm.ins, b = w.ball, opp = oppOf(team);
  const bd = depthOf(team, b.x);
  const since = w.t - Tm.lostAt;
  const cpress = !w.setup && ((ins.onLoss === 'counterpress' && since < ENG.TR_LOSS) || (ins.onLoss === 'mixed' && since < 2.2));
  const regroup = ins.onLoss === 'regroup' && since < ENG.TR_LOSS;
  const carrier = b.state === 'held' && b.owner.team === opp ? b.owner : null;
  const L0 = LINE_U[ins.line];
  let lineU = clamp(Math.min(L0, bd - 9), 11.5, L0);
  // Offside trap: the line steps up together when the ball goes backwards.
  const away = b.state === 'held' ? depthVel(team, b.owner) : depthVel(team, b);
  if (ins.trap === 'on' && away > 1.5 && bd > lineU + 10) lineU = Math.min(lineU + 3.5, bd - 6);
  // No pressure on the ball and a man facing forward: the line drops off a few metres.
  else if (carrier && bd > lineU + 12 && nearestDist(carrier, w.by[team]) > 4 && depthVel(opp, carrier) > -0.5) lineU = Math.max(11.5, lineU - 4);
  Tm.lineU = lineU;
  const frontU = cpress ? clamp(bd, lineU + 18, 95) : clamp(bd - 3, lineU + 18, Math.max(FRONT_U[ins.engage], lineU + 18));
  const Wk = BLOCK_W[ins.compact];
  const cy = MID + (b.y - MID) * 0.52;
  const mine = w.by[team];
  const inFlight = b.state === 'air' || (b.state === 'roll' && b.kind !== 'loose');
  for (const d of mine) {
    if (d.stun > w.t) continue;
    if (inFlight && (d.mode === 'intercept' || d.mode === 'sweep')) continue;    // still going for the ball
    if (d.pos === 'GK') { d.target = keeperSpot(w, team, d); d.spd = d.jog; d.mode = 'keeper'; continue; }
    let f = { D: 0, DM: 0.22, M: 0.45, AM: 0.72, A: 1 }[d.unit];
    if (d.pos === 'FB' || d.pos === 'WB') f = d.unit === 'M' && bd > 45 && !d.R.rest ? 0.12 : 0;
    if (d.pos === 'W' || d.pos === 'WM') { const tr = d.R.track ?? 1; f = tr >= 1.2 ? 0.3 : tr >= 1 ? 0.42 : tr >= 0.6 ? 0.66 : 0.9; }
    let u = lineU + f * (frontU - lineU);
    if (d.R.dropOff) u -= 2.5;
    const y = clamp(cy + (d.slotY - MID) * Wk, 2, PITCH.W - 2);
    d.target = { x: xAtDepth(team, u), y };
    const far = hyp(d.target.x - d.x, d.target.y - d.y);
    d.spd = regroup || far > 10 ? d.vmax * (0.74 + 0.012 * at(d, 'work')) : d.jog;
    d.mode = 'shape';
  }
  if (w.setup) return;
  const attackers = w.by[opp].filter((a) => a.pos !== 'GK');
  const taken = new Set(), busy = new Set(inFlight ? mine.filter((d) => d.mode === 'intercept' || d.mode === 'sweep') : []);
  // Runners going beyond the line: the nearest defender tracks him, once
  // he has seen the run (reaction time, plus a moment watching the ball).
  for (const a of attackers) {
    if (a === carrier || !(a.mode === 'run' && a.until > w.t)) continue;
    const au = depthOf(team, a.x);
    if (au > lineU + 14) continue;
    let best = null, bdist = 18;
    for (const d of mine) {
      if (d.pos === 'GK' || busy.has(d) || d.stun > w.t) continue;
      if (a.runKind !== 'overlap' && d.unit !== 'D' && d.pos !== 'DM') continue;
      const dd = hyp(d.x - a.x, d.y - a.y);
      if (dd < bdist) { bdist = dd; best = d; }
    }
    if (!best || w.t - a.runStart < best.react + 0.25) continue;
    const g = { x: xAtDepth(team, 0), y: MID }, k = 1.4 / Math.max(hyp(a.x - g.x, a.y - g.y), 1);
    best.target = { x: a.x + a.vx * 0.4 + (g.x - a.x) * k, y: a.y + a.vy * 0.4 + (g.y - a.y) * k };
    best.spd = best.vmax * 0.97; best.mode = 'track'; best.marking = a.id;
    busy.add(best); taken.add(a);
  }
  // Pressing: once the ball is in our zone, the nearest by time (weighted by
  // how eager his role is) closes down; more with "more" intensity, with a
  // trigger, or in the counter-press. Outside the zone one man contains.
  if (carrier) {
    const on = bd <= PRESS_ZONE[ins.engage] || cpress;
    const cands = mine.filter((d) => d.pos !== 'GK' && !busy.has(d) && d.stun <= w.t)
      .map((d) => ({ d, t: pressTime(d, carrier) / Math.sqrt(d.R.press ?? 1) }))
      .sort((a, b) => a.t - b.t);
    // A stopper steps out to a forward who drops in front of the line.
    for (const d of mine) {
      if (!d.R.stepOut || busy.has(d)) continue;
      const cu = depthOf(team, carrier.x);
      if (cu > lineU + 1 && cu < lineU + 16 && Math.abs(carrier.y - d.y) < 13) {
        d.mode = 'press'; d.spd = d.vmax; busy.add(d);
        log(w, `${tag(d)} steps out to ${tag(carrier)}`, 'def', team);
      }
    }
    if (on) {
      let n = PRESSERS[ins.press] + (pressTrigger(w, team, carrier) || bd < 24 ? 1 : 0);
      if (cpress) n = Math.max(n, ins.onLoss === 'counterpress' ? 3 : 2);
      let used = 0;
      for (const { d, t } of cands) {
        if (used >= n || busy.has(d)) continue;
        if (used > 0 && (t > 2.6 || (d.R.rest && !cpress && used >= 1))) continue;
        // The counter-press is the job of the men near the ball; the back line and the holding men keep their places.
        if (cpress && used > 0 && bd > 30 && (d.unit === 'D' || d.R.rest)) continue;
        d.mode = 'press'; d.spd = d.vmax * (0.86 + 0.01 * at(d, 'work')); busy.add(d); used++;
      }
      // The next man cuts the most dangerous pass (a cover shadow).
      if (ins.press !== 'less' || cpress) {
        const cover = cands.find(({ d }) => !busy.has(d) && !d.R.dropOff);
        const opt = dangerousOption(w, opp, carrier, attackers);
        if (cover && opt) {
          const d = cover.d;
          d.target = { x: carrier.x + (opt.x - carrier.x) * 0.45, y: carrier.y + (opt.y - carrier.y) * 0.45 };
          d.mode = 'cover'; d.spd = d.vmax * 0.9; busy.add(d);
        }
      }
    } else if (cands.length) {
      const d = cands[0].d;
      if (!busy.has(d)) { d.mode = 'contain'; d.spd = d.vmax * 0.8; busy.add(d); }
    }
  }
  // Pressing as a unit: in the counter-press, or pressing hard in our zone,
  // the men near the ball lock onto the short options — standing ball-side
  // of them so the pass is cut out — and the ball carrier is left with only
  // the long ball.
  // When we press in their half the whole side steps up man-for-man: the
  // further forward the press, the further the midfield pushes onto theirs.
  const pressing = carrier && (bd <= PRESS_ZONE[ins.engage] || cpress);
  const lock = pressing && (cpress || ins.press !== 'less');
  if (lock) {
    const reach = cpress ? 22 : bd > 55 ? 32 : 22;           // how far from the ball we lock on
    const step = cpress || ins.press === 'more' ? 1.1 : 2.2;  // how tight (m, ball side)
    const ranked = attackers.filter((a) => a !== carrier && !taken.has(a) && hyp(a.x - carrier.x, a.y - carrier.y) < reach)
      .sort((a, c) => hyp(a.x - carrier.x, a.y - carrier.y) - hyp(c.x - carrier.x, c.y - carrier.y));
    for (const a of ranked) {
      let best = null, bdist = bd > 55 && !cpress ? 22 : 14;
      for (const d of mine) {
        if (d.pos === 'GK' || busy.has(d) || d.stun > w.t || d.R.dropOff) continue;
        // Defenders only step onto forwards near our line; midfield and attack go to theirs.
        if ((d.unit === 'D' || (cpress && d.R.rest)) && depthOf(team, a.x) > lineU + (cpress ? 8 : 16)) continue;
        const dd = hyp(d.x - a.x, d.y - a.y);
        if (dd < bdist) { bdist = dd; best = d; }
      }
      if (!best) continue;
      const bl = hyp(carrier.x - a.x, carrier.y - a.y) || 1, gl = hyp(xAtDepth(team, 0) - a.x, MID - a.y) || 1;
      best.target = { x: a.x + ((carrier.x - a.x) / bl) * step + ((xAtDepth(team, 0) - a.x) / gl) * 0.6, y: a.y + ((carrier.y - a.y) / bl) * step + ((MID - a.y) / gl) * 0.6 };
      best.mode = 'mark'; best.marking = a.id; best.spd = best.vmax * (0.8 + 0.01 * at(best, 'work'));
      busy.add(best); taken.add(a);
    }
  }
  // Everyone else: marking.
  const tight = ins.marking === 'tight', mixed = ins.marking === 'mixed';
  for (const d of mine) {
    if (d.pos === 'GK' || busy.has(d) || d.stun > w.t) continue;
    // An anchor screens the pass into the forward in front of the defence.
    if (d.R.screen && carrier) {
      const tgt = attackers.filter((a) => a !== carrier && depthOf(team, a.x) > lineU - 2 && depthOf(team, a.x) < lineU + 16 && Math.abs(a.y - MID) < 18)
        .sort((a, b) => depthOf(team, a.x) - depthOf(team, b.x))[0];
      if (tgt) { d.target = { x: tgt.x + (carrier.x - tgt.x) * 0.3, y: tgt.y + (carrier.y - tgt.y) * 0.3 }; d.mode = 'screen'; continue; }
    }
    // In and around the box everyone marks tight, whatever the plan.
    const man = tight || (mixed && d.unit === 'D') || bd < 30;
    const range = man ? (d.unit === 'D' ? 15 : 12) : d.unit === 'D' ? 8 : 6;
    let mark = null, md = range;
    for (const a of attackers) {
      if (a === carrier || taken.has(a)) continue;
      const dd = hyp(a.x - d.target.x, a.y - d.target.y);
      if (dd < md) { md = dd; mark = a; }
    }
    if (!mark) continue;
    taken.add(mark);
    const g = { x: xAtDepth(team, 0), y: MID }, k = 1.3 / Math.max(hyp(mark.x - g.x, mark.y - g.y), 1);
    const gs = { x: mark.x + (g.x - mark.x) * k, y: mark.y + (g.y - mark.y) * k };
    const mix = man ? 0.9 : d.unit === 'D' ? 0.5 : 0.25;
    d.target = { x: d.target.x + (gs.x - d.target.x) * mix, y: d.target.y + (gs.y - d.target.y) * mix };
    d.marking = mark.id;
    if (man) d.spd = Math.max(d.spd, d.vmax * 0.8);
  }
}

// A side counter-pressing right now: its instruction and the seconds since it lost the ball.
const counterPressing = (w, team) => { const T = w.T[team], s = w.t - T.lostAt; return (T.ins.onLoss === 'counterpress' && s < ENG.TR_LOSS) || (T.ins.onLoss === 'mixed' && s < 2.2); };
const pressTime = (d, c) => d.react + Math.max(0, hyp(d.x - c.x, d.y - c.y) - 1) / d.vmax;
// Pressing triggers: a pass backwards, a heavy touch, a receiver facing his
// own goal, or the ball near the touchline.
function pressTrigger(w, team, c) {
  const back = w.lastPass && w.lastPass.back && w.t - w.lastPass.t < 1.2 && w.lastPass.rec === c;
  const facingBack = depthVel(c.team, c) < -1;
  const touchline = Math.abs(c.y - MID) > 27;
  return back || c.heavy || facingBack || touchline;
}
// The pass a defender screening the ball should cut: the most dangerous
// attacker ahead of the ball and within reach.
function dangerousOption(w, opp, c, attackers) {
  let best = null, bv = -1;
  for (const a of attackers) {
    if (a === c) continue;
    const d = hyp(a.x - c.x, a.y - c.y);
    if (d > 28 || depthOf(opp, a.x) < depthOf(opp, c.x) - 3) continue;
    const v = threatAt(opp, a);
    if (v > bv) { bv = v; best = a; }
  }
  return best;
}
// A keeper stands on the line from the middle of his goal to the ball,
// further out when his line is high (much further for a sweeper keeper).
function keeperSpot(w, team, g) {
  const gx = xAtDepth(team, 0), b = w.ball, bd = depthOf(team, b.x);
  const dToBall = hyp(b.x - gx, b.y - MID);
  let out = clamp(0.6 + 0.07 * bd, 0.6, 5);
  const lineU = w.T[team].lineU;
  out = Math.max(out, g.R.sweep > 0.5 ? clamp((lineU - 18) * 0.6, 0, 15) : clamp((lineU - 24) * 0.3, 0, 7));
  out = Math.min(out, Math.max(dToBall - 6, 0.6));
  const k = out / Math.max(dToBall, 1);
  return { x: gx + (b.x - gx) * k, y: MID + (b.y - MID) * k };
}

/* ---------------- The ball carrier ---------------- */
const rollTime = (v0, s) => { const d = v0 * v0 - 2 * ENG.ROLL_F * s; return d <= 0 ? Infinity : (v0 - Math.sqrt(d)) / ENG.ROLL_F; };
const rollSpeedAt = (v0, s) => Math.sqrt(Math.max(0, v0 * v0 - 2 * ENG.ROLL_F * s));
// Weight of a ground pass: fast enough to arrive at ~8–11 m/s.
const groundV0 = (d, c, through) => clamp(Math.sqrt((through ? 4 + 0.05 * d : 7.5 + 0.1 * d) ** 2 + 2 * ENG.ROLL_F * d), 6, 16 + 0.45 * passSkill(c));

// Chance a player controls a ball arriving at `speed`, with the nearest
// opponent `pressure` metres away.
function ctrlProb(p, speed, lofted, pressure) {
  let pr = 0.985 - 0.013 * Math.max(0, speed - 9) - (lofted ? 0.1 - 0.004 * at(p, 'touch') : 0) + 0.004 * (at(p, 'touch') - 10);
  if (pressure < 1.8) pr -= 0.12 * (1.15 - at(p, 'touch') / 20);
  return clamp(pr, 0.35, 0.995);
}

// Estimated chance a ground pass reaches and is controlled by `q`, judged by
// who gets to points along its path first.
function groundOdds(w, c, to, q, v0, team) {
  const d = hyp(to.x - c.x, to.y - c.y) || 1, ux = (to.x - c.x) / d, uy = (to.y - c.y) / d;
  const tArr = rollTime(v0, d) + 0.08;
  let keep = 1, press = 99;
  for (const f of w.by[oppOf(team)]) {
    if (f.stun > w.t + 0.4) continue;
    const along = (f.x - c.x) * ux + (f.y - c.y) * uy;
    const perp = Math.abs((f.x - c.x) * uy - (f.y - c.y) * ux);
    press = Math.min(press, hyp(f.x - to.x, f.y - to.y));
    if (along < -3 || along > d + 4 || perp > f.vmax * Math.min(tArr, 3) + 2) continue;
    // Straight into a body close to the passer: blocked.
    let worst = along > 0.3 && along < 4 && perp < ENG.BODY + 0.2 ? 0.75 : 0;
    for (const fr of [0.15, 0.35, 0.55, 0.75, 1]) {
      const s = d * fr, px = c.x + ux * s, py = c.y + uy * s;
      const tb = rollTime(v0, s) + 0.08;
      const back = depthOf(f.team, px) < depthOf(f.team, f.x) - 3 ? 0.3 : 0;
      const td = Math.max(f.react * 0.7, f.react + back + Math.max(0, hyp(f.x - px, f.y - py) - ENG.REACH) / f.vmax);
      const reach = sigmoid((tb - td - 0.1) / 0.17);
      if (reach < 0.01) continue;
      const clean = clamp(0.78 - 0.025 * (rollSpeedAt(v0, s) - 8) + 0.012 * (at(f, 'positioning') - 10), 0.3, 0.92);
      worst = Math.max(worst, reach * (clean + (1 - clean) * 0.5));
    }
    keep *= 1 - worst;
  }
  // The receiver has to get there and take it.
  const tRec = q.react * 0.5 + Math.max(0, hyp(q.x - to.x, q.y - to.y) - ENG.REACH) / q.vmax;
  if (tRec > tArr + 0.25) keep *= clamp(1 - (tRec - tArr - 0.25), 0, 1);
  // A ball that would roll on out of play needs him there in good time.
  const vEnd = rollSpeedAt(v0, d), run = (vEnd * vEnd) / (2 * ENG.ROLL_F);
  const sx = to.x + ux * run, sy = to.y + uy * run;
  if ((sx < 0 || sx > PITCH.L || sy < 0 || sy > PITCH.W) && tRec > tArr - 0.2) keep *= 0.45;
  keep *= ctrlProb(q, rollSpeedAt(v0, d), false, press);
  keep *= 1 - clamp((d - 12) * (0.0065 - 0.00025 * passSkill(c)), 0, 0.25);
  return { p: keep, T: tArr };
}

// Aerial duel strength; a keeper in his own box can use his hands.
const aerialScore = (p, gkHands) => at(p, 'aerial') + 0.35 * at(p, 'strength') + (gkHands ? 6 + 0.5 * at(p, 'command') : 0);
const airFlight = (d) => { const vh = clamp(12 + 0.2 * d, 14, 22); return { vh, T: 0.15 + d / vh }; };
// Estimated chance a lofted ball (long pass, switch, cross) is won by our man where it lands.
function airOdds(w, c, to, q, team, cross) {
  const d = hyp(to.x - c.x, to.y - c.y);
  const { T } = airFlight(d);
  const skill = cross ? at(c, 'crossing') : passSkill(c);
  const sd = d * (0.085 - 0.0032 * skill);
  const acc = clamp(1 - sd / 6.5, 0.3, 0.97);
  const tRec = q.react * 0.5 + Math.max(0, hyp(q.x - to.x, q.y - to.y) - 1.4) / q.vmax;
  const recOk = tRec <= T + 0.2 ? 1 : clamp(1 - (tRec - T - 0.2) / 0.8, 0, 1);
  let best = -Infinity;
  const opp = oppOf(team);
  for (const f of w.by[opp]) {
    const hands = f.pos === 'GK' && inBox(team, to) && depthOf(team, to.x) > PITCH.L - 9 - at(f, 'command') * 0.15;
    const tf = f.react + Math.max(0, hyp(f.x - to.x, f.y - to.y) - 1.6) / f.vmax;
    if (tf < T + 0.1) best = Math.max(best, aerialScore(f, hands));
  }
  const win = best === -Infinity ? ctrlProb(q, 9, true, 5) : sigmoid((aerialScore(q, false) - best) / 3);
  return { p: acc * recOk * win, T };
}

// Expected goals for a shot from `p`: distance and the angle the goal mouth
// subtends, less for a header, under pressure, and for bodies in the way
// (each a chance to block). Open-play reference points, central: ~0.36 at
// 6 m, 0.18 at 11 m, 0.1 at 16 m, 0.03 at 25 m.
function shotModel(w, team, p, header) {
  const gx = team === 'home' ? PITCH.L : 0;
  const v1 = { x: gx - p.x, y: PITCH.goalY0 - p.y }, v2 = { x: gx - p.x, y: PITCH.goalY1 - p.y };
  const angle = Math.acos(clamp((v1.x * v2.x + v1.y * v2.y) / (hyp(v1.x, v1.y) * hyp(v2.x, v2.y) || 1), -1, 1));
  const d = hyp(gx - p.x, MID - p.y);
  const central = 2 * Math.atan((PITCH.goalY1 - PITCH.goalY0) / 2 / Math.max(d, 1));
  let xg = clamp(0.8 * Math.exp(-d / 7.5) * Math.pow(clamp(angle / central, 0, 1), 0.8), 0, 0.7);
  if (header) xg = Math.min(xg * 0.55, 0.4);
  const foes = w.by[oppOf(team)];
  let near = 99;
  for (const f of foes) if (f.pos !== 'GK') near = Math.min(near, hyp(f.x - p.x, f.y - p.y));
  if (near < 1.5) xg *= 0.82;
  // A keeper caught off his line leaves the goal open.
  const gk = foes[0], gkOff = hyp(gk.x - gx, gk.y - MID);
  if (gkOff > 6 && hyp(gk.x - p.x, gk.y - p.y) > 3) xg = Math.min(0.9, xg * (1 + (gkOff - 6) * 0.08));
  const goal = { x: gx, y: MID }, len = hyp(goal.x - p.x, goal.y - p.y) || 1, ux = (goal.x - p.x) / len, uy = (goal.y - p.y) / len;
  const blockers = [];
  let open = 1;
  for (const q of foes) {
    if (q.pos === 'GK' || q.stun > w.t) continue;
    const t = (q.x - p.x) * ux + (q.y - p.y) * uy;
    if (t <= 0.6 || t >= len - 0.5) continue;
    const perp = Math.abs((q.x - p.x) * uy - (q.y - p.y) * ux), wdt = 1.0 + t * 0.06;
    if (perp < wdt) { const pb = 0.65 * (1 - perp / wdt) + 0.08; blockers.push({ q, p: pb, t }); open *= 1 - pb; }
  }
  for (const q of foes) {
    if (q.pos === 'GK' || q.stun > w.t || blockers.some((b) => b.q === q)) continue;
    const dq = hyp(q.x - p.x, q.y - p.y);
    if (dq < 2.6 && (q.x - p.x) * ux + (q.y - p.y) * uy > -0.3) { const pb = 0.5 * (1 - dq / 2.6); blockers.push({ q, p: pb, t: 0.8 }); open *= 1 - pb; }
  }
  blockers.sort((a, b) => a.t - b.t);
  return { clear: xg, xg: xg * open, blockers };
}

// Every option the ball carrier has, each with its odds and its value.
function options(w, c) {
  const team = c.team, opp = oppOf(team), Tm = w.T[team], ins = Tm.ins, R = c.R;
  const foes = w.by[opp];
  const cu = depthOf(team, c.x), offU = offsideDepth(w, team);
  const pressure = nearestDist(c, foes);
  const since = w.t - Tm.wonAt;
  const counter = (ins.onWin === 'counter' && since < ENG.TR_WIN) || (ins.onWin === 'mixed' && since < 3);
  const secure = ins.onWin === 'hold' && since < 3;
  const tempo = TEMPO[ins.tempo];
  // Risk: what losing it costs, and what ground gained is worth.
  const aversion = tempo.risk * (1 - 0.4 * (R.risk || 0)) * (counter ? 0.7 : secure ? 1.6 : 1);
  const progW = tempo.prog * (counter ? 2 : secure ? 0.5 : 1);
  const vis = at(c, 'vision') + (R.vision || 0);
  const maxGround = 20 + 1.3 * vis;
  const seesRuns = w.rng() < 0.35 + 0.035 * vis;
  const lossAt = (pt) => (0.35 * Math.exp(-hyp(depthOf(team, pt.x), pt.y - MID) / 12) + 0.006) * aversion;
  const here = threatAt(team, c);
  const isGK = c.pos === 'GK';
  const deep = cu < 35 && (isGK || c.pos === 'CB' || c.unit === 'D');
  const opts = [];
  const pref = (d, air, to, gain) => {
    let p = 0;
    if (ins.passing === 'short') { if (d > 22) p -= 0.0005 * (d - 22); if (air) p -= 0.005; }
    else if (ins.passing === 'direct') { if (gain > 12) p += 0.00025 * gain; if (air) p += 0.002; }
    if (deep) {
      if (ins.buildUp === 'short' && air) p -= pressure < 2 ? 0.004 : 0.012;
      if (ins.buildUp === 'long') p += air ? 0.012 : -0.003;
    }
    if (ins.focus === 'wings' && Math.abs(to.y - MID) > 18 && gain > -5) p += 0.0025;
    if (ins.focus === 'middle' && Math.abs(to.y - MID) < 13 && gain > -5) p += 0.0025;
    if (R.long && air) p += 0.004 * R.long;
    return p;
  };
  const offU2 = offU + 0.2;
  const addPass = (q, to, kind) => {
    const d = hyp(to.x - c.x, to.y - c.y), gain = depthOf(team, to.x) - cu;
    if (d < 5) return;
    const air = kind === 'long' || kind === 'switch';
    if (!air && (d > maxGround || (gain < -4 && d > 22))) return;
    if (air && (d < 18 || d > (isGK ? 65 : 58) || (kind === 'long' && gain < 8))) return;
    let odds, v0 = 0, T;
    if (air) ({ p: odds, T } = airOdds(w, c, to, q, team, false));
    else { v0 = groundV0(d, c, kind === 'through'); ({ p: odds, T } = groundOdds(w, c, to, q, v0, team)); }
    const space = nearestDist(to, foes);
    let value = threatAt(team, to) * (0.75 + 0.25 * Math.min(space, 8) / 8) + Math.max(0, gain) * progW;
    // A long ball contested in the air is a second ball, not clean possession.
    if (air && kind === 'long') value *= q.R.target ? 0.75 : 0.55;
    // A switch hangs in the air while their block shifts across.
    if (kind === 'switch') value *= 0.75;
    const seenU = depthOf(team, q.x) + gauss(w.rng) * (1.3 - vis / 25);
    const off = seenU > offU2 && depthOf(team, q.x) > PITCH.L / 2 ? 0.25 : 0;
    const u = odds * value - (1 - odds) * lossAt(to) + pref(d, air, to, gain) - off;
    opts.push({ kind: 'pass', type: kind, to, rec: q, odds, v0, T, u, gain, d, air });
  };
  for (const q of w.by[team]) {
    if (q === c || q.stun > w.t) continue;
    const dq = hyp(q.x - c.x, q.y - c.y);
    if (dq > 62) continue;
    // Play it into his path: where he will be when the ball arrives.
    let to = { x: q.x, y: q.y };
    for (let k = 0; k < 2; k++) {
      const dd = hyp(to.x - c.x, to.y - c.y), T = dd > 34 ? airFlight(dd).T : rollTime(groundV0(dd, c, false), dd);
      const tt = Math.min(T, 2.5);
      to = { x: clamp(q.x + q.vx * tt, 1, PITCH.L - 1), y: clamp(q.y + q.vy * tt, 1, PITCH.W - 1) };
    }
    const dt = hyp(to.x - c.x, to.y - c.y);
    if (dt <= 34) addPass(q, to, 'feet');
    // A through ball into the space ahead of a runner.
    const sp = hyp(q.vx, q.vy);
    if (seesRuns && sp > 3 && depthVel(team, q) > 1.5 && q.pos !== 'GK') {
      for (const ahead of [5, 10]) addPass(q, { x: clamp(to.x + (q.vx / sp) * ahead, 1, PITCH.L - 1), y: clamp(to.y + (q.vy / sp) * ahead, 1, PITCH.W - 1) }, 'through');
    }
    // Longer balls: over the top, to the target man, or switching play.
    const longOk = vis >= 11 || R.long || ins.passing === 'direct' || (deep && ins.buildUp !== 'short') || counter;
    if (longOk && dt > 25) {
      const lateral = Math.abs(to.y - c.y);
      if (lateral > 25 && !isGK && depthOf(team, to.x) > cu - 3 && Math.abs(to.y - MID) > 16 && w.rng() < 0.15 + 0.03 * vis) addPass(q, to, 'switch');
      else if (q.pos !== 'GK' && (q.unit === 'A' || q.pos === 'ST' || q.mode === 'run')) addPass(q, sp > 3 ? { x: clamp(to.x + (q.vx / sp) * 6, 1, PITCH.L - 1), y: to.y } : to, 'long');
    }
  }
  // Crosses and cut-backs from wide in the final third.
  if (!isGK && cu > 66 && Math.abs(c.y - MID) > 12) addCrosses(w, c, opts, lossAt, R, ins);
  if (!isGK) {
    // Carry it: five directions within 70° of straight at goal.
    const dk = DRIB_K[ins.dribbling] * (1 + (R.dribble || 0));
    const base = team === 'home' ? 0 : Math.PI;
    for (const a of [-70, -35, 0, 35, 70]) {
      const ang = base + (a * Math.PI) / 180;
      const end = { x: clamp(c.x + Math.cos(ang) * 6, 1, PITCH.L - 1), y: clamp(c.y + Math.sin(ang) * 6, 1, PITCH.W - 1) };
      // How close can a defender get to each point of the carry by the time he is there?
      let closest = 99;
      const cv = carryOf(c);
      for (const q of foes) for (const f of [0.3, 0.6, 1]) {
        const px = c.x + (end.x - c.x) * f, py = c.y + (end.y - c.y) * f, tc = (6 * f) / cv;
        closest = Math.min(closest, hyp(q.x - px, q.y - py) - Math.max(0, tc - q.react) * q.vmax * 0.6);
      }
      const keep = sigmoid((closest - 1.8) / 0.7);
      const gainD = depthOf(team, end.x) - cu;
      const inward = R.cutIn && Math.abs(end.y - MID) < Math.abs(c.y - MID) ? 0.003 : 0;
      opts.push({ kind: 'carry', to: end, odds: keep, u: keep * (threatAt(team, end) + Math.max(0, gainD) * progW) * dk - (1 - keep) * lossAt(c) - 0.004 + inward });
    }
    // Take a man on: a defender square in front, space behind him.
    const front = foes.filter((q) => q.pos !== 'GK' && q.stun <= w.t && depthOf(team, q.x) > cu && hyp(q.x - c.x, q.y - c.y) < 4.5)
      .sort((a, b) => hyp(a.x - c.x, a.y - c.y) - hyp(b.x - c.x, b.y - c.y))[0];
    if (front && cu > 30) {
      const beyond = { x: xAtDepth(team, clamp(depthOf(team, front.x) + 6, 0, PITCH.L - 1)), y: clamp(front.y + (c.y - front.y) * 0.3, 1, PITCH.W - 1) };
      let p = takeOnP(c, front, ins);
      if (foes.some((q) => q !== front && hyp(q.x - beyond.x, q.y - beyond.y) < 5)) p *= 0.6;
      const value = threatAt(team, beyond) + Math.max(0, depthOf(team, beyond.x) - cu) * progW;
      opts.push({ kind: 'takeOn', to: beyond, vs: front, odds: p, u: (p * value - (1 - p) * lossAt(c) * 1.2) * dk - 0.012 });
    }
    // Shoot when it is on.
    const gx = team === 'home' ? PITCH.L : 0;
    if (hyp(gx - c.x, MID - c.y) < 32) {
      const sm = shotModel(w, team, c, false);
      if (sm.xg >= 0.015) {
        const box = inBox(team, c);
        const bias = (ins.final === 'workIn' ? (box ? 1.05 : 0.55) : ins.final === 'shoot' ? (box ? 1.05 : 1.6) : 1) * (1 + (R.shoot || 0));
        // Shooters see the goal more than the bodies in front of it.
        const seen = sm.xg * 0.2 + sm.clear * 0.8;
        opts.push({ kind: 'shoot', xg: sm.xg, u: seen * (box ? 1.15 : 1.4) * bias });
      }
    }
    // Shield it and wait for support (a target man with a defender on his back).
    if (R.holdUp && pressure < 2.5) opts.push({ kind: 'shield', u: here * 0.9 + 0.002 * R.holdUp });
    // Clear it when in trouble near our own goal.
    if (cu < 28 && pressure < 3) opts.push({ kind: 'clear', u: -lossAt(c) * 0.3 });
  }
  // Keep it: unpressed, nothing better on.
  if (pressure > 4.5) opts.push({ kind: 'hold', u: here * (ins.tempo === 'slow' ? 0.97 : ins.tempo === 'fast' ? 0.8 : 0.9) + (isGK ? 0.001 : 0) });
  return opts;
}

// Crosses to the near post, far post and penalty spot, and the cut-back.
function addCrosses(w, c, opts, lossAt, R, ins) {
  const team = c.team, s = Math.sign(c.y - MID) || 1, foes = w.by[oppOf(team)];
  const zones = [['near', 99.5, MID + s * 4, true], ['far', 98.5, MID - s * 6, true], ['spot', 93.5, MID - s, true], ['cutback', 88, MID + s * 3, false]];
  const k = CROSS_K[ins.crossing] * (1 + (R.cross || 0));
  for (const [name, u, y, air] of zones) {
    const to = { x: xAtDepth(team, u), y };
    // Who attacks it: the best-placed team-mate who can get there in time.
    let q = null, qt = Infinity;
    for (const m of w.by[team]) {
      if (m === c || m.pos === 'GK') continue;
      const t = Math.max(0, hyp(m.x - to.x, m.y - to.y) - 1.5) / m.vmax;
      if (t < qt) { qt = t; q = m; }
    }
    const d = hyp(to.x - c.x, to.y - c.y);
    if (!q || d < 8) continue;
    if (depthOf(team, q.x) + gauss(w.rng) * 0.8 > offsideDepth(w, team) + 0.2) continue;   // he'd be offside
    if (air) {
      const T = airFlight(d).T;
      if (qt > T + 0.9) continue;
      const odds = airOdds(w, c, to, q, team, true).p;
      const hx = shotModel(w, team, to, true).xg;
      const u = (odds * (hx * 0.75 + 0.006) - (1 - odds) * (lossAt(to) * 0.5 + 0.004)) * k;
      opts.push({ kind: 'pass', type: 'cross', zone: name, to, rec: q, odds, T, u, gain: depthOf(team, to.x) - depthOf(team, c.x), d, air: true });
    } else {
      const v0 = groundV0(d, c, false), g = groundOdds(w, c, to, q, v0, team);
      const sx = shotModel(w, team, to, false).xg;
      opts.push({ kind: 'pass', type: 'cutback', to, rec: q, odds: g.p, v0, T: g.T, u: (g.p * sx * 0.85 - (1 - g.p) * lossAt(to)) * (ins.crossing === 'rare' ? 1.1 : 1), gain: 0, d, air: false });
    }
    void foes;
  }
}

const takeOnP = (c, d, ins) => sigmoid((at(c, 'dribbling') - at(d, 'tackling')) * 0.2 + (at(c, 'pace') - at(d, 'pace')) * 0.08 + (at(c, 'composure') - 10) * 0.03 - 0.35 + (ins.dribbling === 'more' ? 0.1 : 0));

// A player picks among his few best options: hopeless passes are out unless
// nothing decent is on, then mostly the best of the top three, sometimes a
// near-equal alternative. Composure and pressure set how sharp the choice is.
function choose(w, c, opts) {
  // Crosses are long odds by nature; their value already allows for that.
  const risky = (o) => o.kind === 'pass' && o.type !== 'cross';
  const decent = opts.filter((o) => !risky(o) || o.odds >= 0.55);
  let pool = (decent.length ? decent : opts).filter((o) => !risky(o) || o.odds >= 0.3 || !decent.length);
  if (!pool.length) pool = opts;
  pool.sort((a, b) => b.u - a.u);
  const top = pool.slice(0, 3);
  const pressed = nearestDist(c, w.by[oppOf(c.team)]) < 2;
  const temp = 0.0015 * (1.4 - 0.04 * at(c, 'composure')) * (pressed ? 1.5 : 1);
  const best = top[0].u, weights = top.map((o) => Math.exp((o.u - best) / Math.max(temp, 0.0004)));
  let r = w.rng() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < top.length; i++) { r -= weights[i]; if (r <= 0) return top[i]; }
  return top[top.length - 1];
}

function decide(w, c) {
  const opts = options(w, c);
  if (!opts.length) { c.nextDecide = w.t + 0.3; return; }
  const o = choose(w, c, opts);
  const think = TEMPO[w.T[c.team].ins.tempo].think;
  if (o.kind === 'pass') return o.air ? kickAir(w, c, o) : kickGround(w, c, o);
  if (o.kind === 'shoot') return shoot(w, c, false);
  if (o.kind === 'clear') return clearBall(w, c);
  if (o.kind === 'carry') { c.target = o.to; c.spd = carryOf(c); c.mode = 'dribble'; c.nextDecide = w.t + think; }
  else if (o.kind === 'takeOn') { c.target = o.to; c.spd = carryOf(c) + 0.4; c.mode = 'takeOn'; c.vs = o.vs; c.nextDecide = w.t + 1.1; }
  else { c.target = { x: c.x, y: c.y }; c.spd = 1; c.mode = o.kind === 'shield' ? 'shield' : 'hold'; c.nextDecide = w.t + think; }
}

// What the defending side sees at the moment a ball is played: where its
// line is, who was pressing, who is offside.
function releaseInfo(w, c) {
  const team = c.team, foes = w.by[oppOf(team)];
  return { offIds: offsideSet(w, team), lineAt: secondLast(w, team), passerU: depthOf(team, c.x),
    pressers: foes.filter((f) => (f.mode === 'press' || f.mode === 'cover') && hyp(f.x - c.x, f.y - c.y) < 4).map((f) => f.id) };
}

function kickGround(w, c, o) {
  const team = c.team, b = w.ball, pressed = nearestDist(c, w.by[oppOf(team)]) < 2;
  const sd = (0.045 - 0.0018 * passSkill(c)) * (pressed ? 1.5 - 0.02 * at(c, 'composure') : 1);
  const ang = Math.atan2(o.to.y - c.y, o.to.x - c.x) + gauss(w.rng) * Math.max(sd, 0.004);
  const v0 = o.v0 * (1 + gauss(w.rng) * 0.05);
  Object.assign(b, { state: 'roll', owner: null, x: c.x + Math.cos(ang) * 0.6, y: c.y + Math.sin(ang) * 0.6, h: 0, vx: Math.cos(ang) * v0, vy: Math.sin(ang) * v0, kind: o.type, intended: o.rec,
    passer: c, t0: w.t, team, tried: new Set(), odds: o.odds, from: { x: c.x, y: c.y }, aim: o.to, ...releaseInfo(w, c) });
  o.rec.mode = 'receive'; o.rec.target = o.to; o.rec.spd = o.rec.vmax;
  c.mode = 'shape';
  const S = w.T[team].S;
  S.passes++; S.passLen += o.d; if (o.d > 30) S.long++;
  (w.passLog ||= []).push({ odds: o.odds, ok: null, d: o.d, gain: o.gain, air: false, team });
  const verb = o.type === 'through' ? 'slides a through ball to' : o.type === 'cutback' ? 'cuts it back for' : o.gain < -3 ? 'plays it back to' : 'passes to';
  log(w, `${tag(c)} ${verb} ${tag(o.rec)}`, 'pass', team);
  assignInterceptors(w, team);
}

function kickAir(w, c, o) {
  const team = c.team, b = w.ball, cross = o.type === 'cross';
  const skill = cross ? at(c, 'crossing') : passSkill(c);
  const pressed = nearestDist(c, w.by[oppOf(team)]) < 2;
  const sd = o.d * (0.085 - 0.0032 * skill) * (pressed ? 1.3 : 1);
  const land = { x: clamp(o.to.x + gauss(w.rng) * sd, 0.5, PITCH.L - 0.5), y: clamp(o.to.y + gauss(w.rng) * sd, 0.5, PITCH.W - 0.5) };
  const d = hyp(land.x - c.x, land.y - c.y), { T } = airFlight(d);
  Object.assign(b, { state: 'air', owner: null, x: c.x, y: c.y, h: 0, from: { x: c.x, y: c.y }, to: land, t0: w.t, T, H: cross ? 3 + 0.06 * d : 2.5 + 0.13 * d,
    kind: o.type, intended: o.rec, passer: c, team, contested: false, odds: o.odds, zone: o.zone, ...releaseInfo(w, c) });
  const S = w.T[team].S;
  if (cross) {
    S.crosses++;
    const inB = (t) => w.by[t].filter((p) => inBox(team, p)).length;
    moment(w, 'cross', team, { ids: [c.id], x: land.x, y: land.y, att: inB(team), def: inB(oppOf(team)), zone: o.zone });
    log(w, `${tag(c)} crosses to the ${{ near: 'near post', far: 'far post', spot: 'penalty spot' }[o.zone] || 'box'}`, 'pass', team);
  } else {
    S.passes++; S.passLen += o.d; S.long++;
    log(w, `${tag(c)} ${o.type === 'switch' ? 'switches play to' : 'goes long to'} ${tag(o.rec)}`, 'pass', team);
  }
  (w.passLog ||= []).push({ odds: o.odds, ok: null, d: o.d, gain: o.gain, air: true, cross, team });
  c.mode = 'shape';
  o.rec.mode = 'receive'; o.rec.target = land; o.rec.spd = o.rec.vmax;
  airChasers(w, team);
}

function clearBall(w, c) {
  const team = c.team, b = w.ball;
  const land = { x: xAtDepth(team, clamp(depthOf(team, c.x) + 38 + w.rng() * 16, 0, PITCH.L - 4)), y: clamp(c.y + (w.rng() - 0.5) * 30, 3, PITCH.W - 3) };
  const d = hyp(land.x - c.x, land.y - c.y), { T } = airFlight(d);
  Object.assign(b, { state: 'air', owner: null, x: c.x, y: c.y, h: 0, from: { x: c.x, y: c.y }, to: land, t0: w.t, T, H: 8 + 0.08 * d, kind: 'clear',
    intended: null, passer: c, team, contested: false, ...releaseInfo(w, c) });
  w.T[team].S.clearances++;
  log(w, `${tag(c)} clears it`, 'pass', team);
  c.mode = 'shape';
  airChasers(w, team);
}

// Defenders who can reach the path of a ground pass before the ball go for it.
function assignInterceptors(w, team) {
  const b = w.ball, sp = hyp(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
  const d = hyp(b.aim.x - b.x, b.aim.y - b.y) + 3;
  let n = 0;
  const cands = w.by[oppOf(team)].filter((f) => f.pos !== 'GK' && f.stun <= w.t)
    .map((f) => {
      let best = null;
      for (const fr of [0.2, 0.4, 0.6, 0.8, 1]) {
        const s = d * fr, pt = { x: b.x + ux * s, y: b.y + uy * s };
        const slack = rollTime(sp, s) - (f.react + Math.max(0, hyp(f.x - pt.x, f.y - pt.y) - ENG.REACH) / f.vmax);
        if (!best || slack > best.slack) best = { pt, slack };
      }
      return { f, ...best };
    }).filter((q) => q.slack > -0.25).sort((a, b) => b.slack - a.slack);
  for (const q of cands) { if (n++ >= 2) break; q.f.target = q.pt; q.f.spd = q.f.vmax; q.f.mode = 'intercept'; }
}
// Under a high ball, the receiver and the nearest defenders go for where it lands.
function airChasers(w, team) {
  const b = w.ball;
  const near = w.by[oppOf(team)].filter((f) => f.stun <= w.t && (f.pos !== 'GK' || inBox(team, b.to)))
    .sort((a, c) => hyp(a.x - b.to.x, a.y - b.to.y) - hyp(c.x - b.to.x, c.y - b.to.y)).slice(0, 2);
  for (const f of near) { f.target = { x: b.to.x, y: b.to.y }; f.spd = f.vmax; f.mode = 'intercept'; }
  if (b.kind === 'cross') {
    for (const p of w.by[team]) if (p.mode === 'box' && hyp(p.x - b.to.x, p.y - b.to.y) < 9) { p.target = { x: b.to.x, y: b.to.y }; p.spd = p.vmax; p.until = w.t + b.T + 0.4; }
  }
}

/* ---------------- Shots ---------------- */
function shoot(w, c, header) {
  const team = c.team, opp = oppOf(team), gx = team === 'home' ? PITCH.L : 0;
  const sm = shotModel(w, team, c, header);
  const S = w.T[team].S, gk = keeperOf(w, opp);
  S.shots++; S.xg += sm.xg; if (header) S.headers++;
  w.T[team].F.shot = true;
  let blocker = null;
  for (const bl of sm.blockers) if (w.rng() < bl.p) { blocker = bl.q; break; }
  const finish = header ? (at(c, 'aerial') + at(c, 'finishing')) / 2 : at(c, 'finishing');
  let pGoal = sm.clear * (0.7 + 0.03 * finish) * (1.15 - 0.015 * at(gk, 'reflexes'));
  if (sm.clear > 0.3) pGoal *= 0.85 + 0.015 * at(c, 'composure');
  pGoal = clamp(pGoal, 0, 0.95);
  let result;
  if (blocker) result = 'blocked';
  else { const r = w.rng(); result = r < pGoal ? 'goal' : r < pGoal + (1 - pGoal) * 0.38 ? 'saved' : 'off'; }
  let to;
  if (result === 'goal') to = { x: gx + (team === 'home' ? 0.8 : -0.8), y: PITCH.goalY0 + 0.5 + w.rng() * (PITCH.goalY1 - PITCH.goalY0 - 1) };
  else if (result === 'saved') to = { x: gk.x, y: gk.y + (w.rng() - 0.5) * 1.5 };
  else if (result === 'blocked') to = { x: blocker.x, y: blocker.y };
  else { const s = w.rng() < 0.5 ? -1 : 1; to = { x: gx + (team === 'home' ? 1 : -1), y: MID + s * (4.2 + w.rng() * 4) }; }
  const dist0 = hyp(to.x - c.x, to.y - c.y);
  const b = w.ball;
  Object.assign(b, { state: 'shot', owner: null, from: { x: c.x, y: c.y }, to, t0: w.t, T: Math.max(0.15, dist0 / (header ? 14 : 24)), result, blocker, shooter: c, team, h: 0 });
  const d = hyp(gx - c.x, MID - c.y);
  if (w.lastShotAt != null && w.t - w.lastShotAt < 3 && w.lastShotTeam === team) moment(w, 'rebound', team, { ids: [c.id], x: c.x, y: c.y, xg: sm.xg });
  const shot = { team, t: w.t, x: c.x, y: c.y, xg: sm.xg, header, result, id: c.id, cause: shotCause(w, team), counter: w.t - w.T[team].wonAt < 10 && w.T[team].wonAt >= 0 };
  w.shots.push(shot);
  const what = { goal: 'GOAL!', saved: 'saved', blocked: 'blocked', off: 'wide' }[result];
  log(w, `${tag(c)} ${header ? 'heads at goal' : 'shoots'} from ${d.toFixed(0)} m (xG ${sm.xg.toFixed(2)}): ${what}`, result === 'goal' ? 'goal' : 'shot', team);
  if (sm.xg >= 0.25) moment(w, 'bigChance', team, { ids: [c.id], x: c.x, y: c.y, xg: sm.xg });
  else if (sm.xg < 0.04 && d > 20) moment(w, 'speculative', team, { ids: [c.id], x: c.x, y: c.y, xg: sm.xg, d });
  w.lastShotAt = w.t; w.lastShotTeam = team;
}

// What set a shot up: the latest pattern in the team's favour in the ten
// seconds before it.
const CAUSES = ['inBehind', 'pressBeaten', 'lineBreak', 'betweenLines', 'overload', 'switch', 'dribblePast', 'timeOnBall', 'crossWon', 'rebound', 'regainHigh', 'counterPress', 'restExposed', 'penalty'];
function shotCause(w, team) {
  for (let i = w.moments.length - 1; i >= 0; i--) {
    const m = w.moments[i];
    if (w.t - m.t > 10) break;
    if (m.team === team && CAUSES.includes(m.kind)) return m.kind;
  }
  return 'settled';
}

function shotArrives(w) {
  const b = w.ball, team = b.team, opp = oppOf(team), S = w.T[team].S, gk = keeperOf(w, opp);
  if (b.result === 'goal') {
    S.onTarget++; S.goals++; w.T[team].F.goal = true;
    return endRun(w, 'goal', team);
  }
  if (b.result === 'off') return endRun(w, 'goalKick', opp);
  if (b.result === 'saved') {
    S.onTarget++;
    const d = hyp(b.from.x - b.to.x, b.from.y - b.to.y);
    const catchP = clamp((d > 16 ? 0.66 : 0.45) + 0.02 * (at(gk, 'handling') - 10), 0.1, 0.92);
    if (w.rng() < catchP) {
      log(w, `${tag(gk)} holds on to it`, 'def', opp);
      return takeBall(w, gk, 'save');
    }
    if (w.rng() < 0.4) { S.corners++; log(w, `${tag(gk)} tips it round the post`, 'def', opp); return endRun(w, 'corner', team); }
    log(w, `${tag(gk)} parries it`, 'def', opp);
    return looseFrom(w, gk, opp === 'home' ? 0 : Math.PI, 1.3, 7 + w.rng() * 4, opp);
  }
  // Blocked: it cannons off the defender.
  if (w.rng() < 0.25) { S.corners++; return endRun(w, 'corner', team); }
  const back = Math.atan2(b.from.y - b.to.y, b.from.x - b.to.x);
  return looseFrom(w, b.blocker, back, 1.2, 4 + w.rng() * 5, opp);
}

// The ball spills loose from a player in a rough direction.
function looseFrom(w, p, dir, spread, speed, touchTeam) {
  const a = dir + (w.rng() - 0.5) * 2 * spread, b = w.ball;
  Object.assign(b, { state: 'roll', owner: null, x: p.x + Math.cos(a) * 0.8, y: p.y + Math.sin(a) * 0.8, h: 0, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
    kind: 'loose', intended: null, passer: p, t0: w.t, team: touchTeam, tried: new Set([p.id]), offIds: null, aim: { x: p.x, y: p.y } });
}

/* ---------------- Getting the ball ---------------- */
function takeBall(w, p, how) {
  const b = w.ball, prev = w.poss, wasPass = b.state === 'roll' || b.state === 'air';
  if (b.offIds && b.offIds.has(p.id) && p.team === b.team) {
    const S = w.T[p.team].S; S.offsides++;
    const trap = w.T[oppOf(p.team)].ins.trap === 'on';
    log(w, `${tag(p)} is offside`, 'bad', p.team);
    moment(w, 'offside', oppOf(p.team), { ids: [p.id], x: p.x, y: p.y, trap });
    if (w.passLog?.length) w.passLog.at(-1).ok = false;
    return endRun(w, 'offside', oppOf(p.team));
  }
  const passer = b.passer, info = { pressers: b.pressers, lineAt: b.lineAt, passerU: b.passerU, kind: b.kind, from: b.from };
  Object.assign(b, { state: 'held', owner: p, team: p.team, h: 0, vx: 0, vy: 0, offIds: null, intended: null });
  p.gotAt = w.t; p.mode = 'carry'; p.heavy = false;
  p.nextDecide = w.t + clamp(0.52 - 0.012 * at(p, 'touch') + { slow: 0.08, normal: 0, fast: -0.07 }[w.T[p.team].ins.tempo], 0.18, 0.6);
  if (p.team !== prev) {
    if (wasPass && w.passLog?.length && w.passLog.at(-1).ok === null) w.passLog.at(-1).ok = false;
    turnover(w, p, how);
  } else if (wasPass && passer && passer.team === p.team && passer !== p) {
    if (w.passLog?.length && w.passLog.at(-1).ok === null) w.passLog.at(-1).ok = true;
    passDone(w, passer, p, info);
  }
  w.poss = p.team;
}

// A completed pass: count it and look for the patterns a coach cares about.
function passDone(w, passer, rec, info) {
  const team = rec.team, opp = oppOf(team), S = w.T[team].S, foes = w.by[opp];
  if (info.kind === 'cross') { S.crossesOk++; }
  if (info.kind === 'loose' || info.kind === 'clear') return;
  S.passesOk++;
  const pu = info.passerU ?? depthOf(team, passer.x), ru = depthOf(team, rec.x);
  const space = nearestDist(rec, foes);
  w.lastPass = { t: w.t, rec, back: ru < pu - 3 };
  // Past how many opponents did it go?
  let bypassed = 0;
  for (const f of foes) { if (f.pos === 'GK') continue; const fu = depthOf(team, f.x); if (fu > pu + 1 && fu < ru - 1) bypassed++; }
  const arrow = [info.from?.x ?? passer.x, info.from?.y ?? passer.y, rec.x, rec.y];
  if (info.pressers?.length && space > 4.5) {
    const beat = info.pressers.map((id) => w.players.find((q) => q.id === id)).filter((q) => q && depthOf(team, q.x) < ru - 2);
    if (beat.length) {
      const near = (t) => w.by[t].filter((q) => hyp(q.x - rec.x, q.y - rec.y) < 15).length;
      moment(w, 'pressBeaten', team, { ids: [passer.id, rec.id], foes: beat.map((q) => q.id), x: rec.x, y: rec.y, arrow, space, n: beat.length, att: near(team), def: near(opp) });
    }
  }
  if (info.lineAt != null && ru > info.lineAt + 1 && ru > PITCH.L / 2) {
    const chaser = foes.filter((f) => f.pos !== 'GK').sort((a, b) => hyp(a.x - rec.x, a.y - rec.y) - hyp(b.x - rec.x, b.y - rec.y))[0];
    moment(w, 'inBehind', team, { ids: [rec.id], foes: chaser ? [chaser.id] : [], x: rec.x, y: rec.y, arrow, line: info.lineAt, pace: at(rec, 'pace'), chaserPace: chaser ? at(chaser, 'pace') : 0 });
  } else if (bypassed >= 3 && ru - pu >= 10) {
    moment(w, 'lineBreak', team, { ids: [passer.id, rec.id], x: rec.x, y: rec.y, arrow, n: bypassed });
  }
  // Between the lines: in front of their defence, behind their midfield, with room.
  let dSum = 0, dN = 0, mSum = 0, mN = 0;
  for (const f of foes) { if (f.unit === 'D') { dSum += depthOf(team, f.x); dN++; } else if (f.unit === 'M' || f.unit === 'DM') { mSum += depthOf(team, f.x); mN++; } }
  const defU = dN ? dSum / dN : 90, midU = mN ? mSum / mN : 70;
  if (ru < defU - 1 && ru > midU + 1 && Math.abs(rec.y - MID) < 22 && space > 3.5 && defU - midU > 11)
    moment(w, 'betweenLines', team, { ids: [rec.id], x: rec.x, y: rec.y, arrow, gap: defU - midU });
  if (Math.abs(rec.y - passer.y) >= 28 && space >= 7 && info.kind !== 'cross') moment(w, 'switch', team, { ids: [passer.id, rec.id], x: rec.x, y: rec.y, arrow, space });
  if (Math.abs(rec.y - MID) > 16 && ru > 50) {
    const att = w.by[team].filter((q) => hyp(q.x - rec.x, q.y - rec.y) < 13).length;
    const def = foes.filter((q) => hyp(q.x - rec.x, q.y - rec.y) < 13).length;
    if (att >= 3 && att - def >= 1) moment(w, 'overload', team, { ids: w.by[team].filter((q) => hyp(q.x - rec.x, q.y - rec.y) < 13).map((q) => q.id), x: rec.x, y: rec.y, att, def, r: 13 });
  }
  void S;
}

// The ball has changed hands.
function turnover(w, p, how) {
  const team = p.team, lost = oppOf(team), St = w.T[team].S, Sl = w.T[lost].S;
  const cpr = w.t - w.T[team].lostAt <= 5 && w.T[team].lostAt >= 0;
  // Won it back within 8 s of them having it (from the start, or since we lost it).
  if (w.t - w.T[team].offBall <= 8 && how !== 'save' && how !== 'claim') w.T[team].F.quickWin = true;
  w.T[lost].offBall = w.t;
  w.T[team].wonAt = w.t; w.T[lost].lostAt = w.t; w.T[team].possStart = w.t;
  St.regains++; Sl.lost++;
  const u = depthOf(team, p.x);
  if (depthOf(lost, p.x) < 35) w.T[lost].F.lostOwnThird = true;
  (w.turnovers ||= []).push({ team, x: p.x, y: p.y, t: w.t, how });
  if (how !== 'save' && how !== 'claim') {
    if (cpr) { St.cpRegains++; w.T[team].F.cpRegain = true; moment(w, 'counterPress', team, { ids: [p.id], x: p.x, y: p.y }); }
    if (u >= PITCH.L / 2 + 5) { St.highRegains++; w.T[team].F.highRegain = true; if (!cpr) moment(w, 'regainHigh', team, { ids: [p.id], x: p.x, y: p.y, u }); }
  }
  // Rest defence: how many of the side that lost it are behind the ball,
  // against how many of the winners are ahead of it?
  const bu = depthOf(lost, p.x);
  if (bu > 40 && how !== 'save' && how !== 'claim') {
    const behind = w.by[lost].filter((q) => q.pos !== 'GK' && depthOf(lost, q.x) < bu).length;
    const ahead = w.by[team].filter((q) => q.pos !== 'GK' && q !== p && depthOf(team, q.x) > depthOf(team, p.x) - 2 && hyp(q.x - p.x, q.y - p.y) < 40).length;
    if (ahead + 1 >= behind) moment(w, 'restExposed', team, { ids: [p.id], foes: w.by[lost].filter((q) => q.pos !== 'GK' && depthOf(lost, q.x) < bu).map((q) => q.id), x: p.x, y: p.y, behind, ahead: ahead + 1 });
  }
  const verb = { tackle: 'wins it', intercept: 'intercepts', save: 'has it', claim: 'claims it', loose: 'picks up the loose ball', header: 'wins the header', control: 'gets to it first' }[how] || 'wins it';
  log(w, `${tag(p)} ${verb}`, 'win', team);
}

/* ---------------- Duels ---------------- */
function tackleTick(w) {
  const b = w.ball, c = b.owner, team = c.team, opp = oppOf(team), ins = w.T[opp].ins;
  if (w.t - c.gotAt < 0.3) return;                     // nobody is tackled on his first touch
  // A take-on is settled the moment he reaches his man.
  if (c.mode === 'takeOn' && c.vs && c.vs.stun <= w.t && hyp(c.vs.x - c.x, c.vs.y - c.y) < 1.4) {
    const d = c.vs, S = w.T[team].S;
    S.takeOns++;
    c.vs = null;
    if (w.rng() < takeOnP(c, d, w.T[team].ins)) {
      if (w.rng() < FOUL_P[ins.tackling] * 0.45) return foul(w, d, c);
      S.takeOnsOk++;
      d.stun = w.t + 0.9;
      log(w, `${tag(c)} beats ${tag(d)}`, 'run', team);
      if (depthOf(team, c.x) > 60) moment(w, 'dribblePast', team, { ids: [c.id], foes: [d.id], x: c.x, y: c.y });
      c.nextDecide = w.t + 0.35;
      return;
    }
    return tackle(w, d, c, true);
  }
  if (c.mode === 'dribble') {
    for (const d of w.by[opp]) {
      if (d.stun > w.t || d.pos === 'GK') continue;
      const dx = d.x - c.x, dy = d.y - c.y;
      if (hyp(dx, dy) < 1.0 && dx * c.vx + dy * c.vy > 0) { c.mode = 'takeOn'; c.vs = d; return tackleTick(w); }
    }
  }
  for (const d of w.by[opp]) {
    if (d.stun > w.t || d.pos === 'GK') continue;
    const dd = hyp(d.x - c.x, d.y - c.y);
    if (dd > 1.25) continue;
    const engaged = d.mode === 'press' || d.mode === 'intercept';
    let rate = (engaged ? 1 : 0.35) * TACKLE_RATE[ins.tackling] * (0.55 + 0.045 * at(d, 'tackling')) * (d.R.tackle || 1);
    if (depthOf(opp, c.x) < 24) rate *= inBox(team, c) ? (ins.tackling === 'hard' ? 1.6 : 1.1) : 1.8;
    else if (engaged && counterPressing(w, opp)) rate *= 2;
    if (w.rng() < rate * ENG.DT) return tackle(w, d, c, false);
  }
}

function tackle(w, d, c, takeOn) {
  const opp = d.team, team = c.team, ins = w.T[opp].ins, S = w.T[opp].S;
  S.tackles++;
  const ts = at(d, 'tackling') + 0.3 * (at(d, 'strength') - 10) + 0.2 * (at(d, 'positioning') - 10);
  const cs = 0.7 * at(c, 'dribbling') + 0.3 * at(c, 'composure') + 0.3 * (at(c, 'strength') - 10) + (c.mode === 'shield' ? 2 * (c.R.holdUp || 0.5) : 0) - (c.mode === 'dribble' ? 0.8 : 0);
  const p = takeOn ? 1 : sigmoid((ts - cs - 1.5) / 3);
  if (w.rng() < p) {
    S.tacklesOk++;
    if (w.rng() < 0.55) { log(w, `${tag(d)} tackles ${tag(c)}`, 'win', opp); return takeBall(w, d, 'tackle'); }
    log(w, `${tag(d)} pokes it away from ${tag(c)}`, 'win', opp);
    return looseFrom(w, c, Math.atan2(c.y - d.y, c.x - d.x), 1.4, 3 + w.rng() * 4, opp);
  }
  const foulP = FOUL_P[ins.tackling] * (1.25 - at(d, 'tackling') / 25);
  if (w.rng() < foulP) return foul(w, d, c);
  d.stun = w.t + (ins.tackling === 'hard' ? 0.9 : 0.55);
  if (takeOn) { w.T[team].S.takeOnsOk++; log(w, `${tag(c)} skips past ${tag(d)}`, 'run', team); if (depthOf(team, c.x) > 60) moment(w, 'dribblePast', team, { ids: [c.id], foes: [d.id], x: c.x, y: c.y }); }
}

// A foul: a free kick, or a penalty in the box.
function foul(w, d, c) {
  const opp = d.team, team = c.team, S = w.T[opp].S;
  {
    S.fouls++;
    if (inBox(team, c)) {
      log(w, `${tag(d)} brings down ${tag(c)}: penalty!`, 'bad', opp);
      moment(w, 'penalty', team, { ids: [c.id], foes: [d.id], x: c.x, y: c.y });
      const Sa = w.T[team].S, r = w.rng();
      Sa.shots++; Sa.xg += 0.76; w.T[team].F.shot = true;
      w.shots.push({ team, t: w.t, x: xAtDepth(team, PITCH.L - PITCH.spotX), y: MID, xg: 0.76, header: false, result: r < 0.76 ? 'goal' : 'saved', id: c.id, cause: 'penalty', counter: false, pen: true });
      if (r < 0.76) { Sa.onTarget++; Sa.goals++; w.T[team].F.goal = true; log(w, `${tag(c)} scores the penalty`, 'goal', team); return endRun(w, 'goal', team, { pen: true }); }
      Sa.onTarget++; log(w, 'Penalty saved!', 'shot', team);
      return endRun(w, 'penalty', team);
    }
    log(w, `Foul by ${tag(d)} on ${tag(c)}`, 'bad', opp);
    if (depthOf(team, c.x) > 70) moment(w, 'foul', team, { ids: [c.id], foes: [d.id], x: c.x, y: c.y });
    return endRun(w, 'foul', team);
  }
}

// A high ball comes down among several players.
function aerialContest(w, cands) {
  const b = w.ball, kteam = b.team, dteam = oppOf(kteam);
  const scored = cands.map((p) => {
    const hands = p.pos === 'GK' && inBox(kteam, p);
    return { p, s: aerialScore(p, hands) + 1.5 * (1 - hyp(p.x - b.x, p.y - b.y) / 1.7), hands };
  });
  const both = new Set(cands.map((p) => p.team)).size > 1;
  let win;
  if (!both && scored.length === 1) {
    const p = scored[0].p;
    if (b.kind === 'cross' && p.team === kteam && inBox(kteam, p) && !(b.offIds && b.offIds.has(p.id))) {
      w.T[kteam].S.crossesOk++; moment(w, 'crossWon', kteam, { ids: [p.id], x: p.x, y: p.y });
      const sm = shotModel(w, kteam, p, true);
      if (sm.xg > 0.03) { p.gotAt = w.t; return shoot(w, p, true); }
    }
    if (w.rng() < ctrlProb(p, 9, true, nearestDist(p, w.by[oppOf(p.team)]))) return takeBall(w, p, 'control');
    p.heavy = true;
    return looseFrom(w, p, Math.atan2(b.to.y - b.from.y, b.to.x - b.from.x), 1.2, 3 + w.rng() * 3, p.team);
  }
  const ws = scored.map((q) => Math.exp(q.s / 2.5)), tot = ws.reduce((a, c) => a + c, 0);
  let r = w.rng() * tot;
  for (let i = 0; i < scored.length; i++) { r -= ws[i]; if (r <= 0) { win = scored[i]; break; } }
  win ||= scored.at(-1);
  const p = win.p;
  for (const t of new Set(cands.map((q) => q.team))) { w.T[t].S.aerials++; }
  w.T[p.team].S.aerialsWon++;
  if (b.offIds && b.offIds.has(p.id) && p.team === kteam) return takeBall(w, p, 'header');
  if (win.hands) {
    if (w.rng() < 0.55 + 0.02 * at(p, 'handling')) { log(w, `${tag(p)} comes and claims it`, 'def', p.team); moment(w, 'claim', p.team, { ids: [p.id], x: p.x, y: p.y }); return takeBall(w, p, 'claim'); }
    log(w, `${tag(p)} punches it clear`, 'def', p.team);
    return looseFrom(w, p, p.team === 'home' ? 0 : Math.PI, 0.8, 10, p.team);
  }
  if (p.team === kteam) {
    if (b.kind === 'cross') { moment(w, 'crossWon', kteam, { ids: [p.id], x: p.x, y: p.y }); w.T[kteam].S.crossesOk++; }
    // A header at goal if he is in range, otherwise a knock-down.
    const sm = shotModel(w, kteam, p, true);
    if (sm.xg > 0.03 && inBox(kteam, p)) { p.gotAt = w.t; return shoot(w, p, true); }
    log(w, `${tag(p)} wins the header`, 'run', kteam);
    const mate = w.by[kteam].filter((q) => q !== p && q.pos !== 'GK').sort((a, c) => hyp(a.x - p.x, a.y - p.y) - hyp(c.x - p.x, c.y - p.y))[0];
    const dir = mate ? Math.atan2(mate.y - p.y, mate.x - p.x) : (kteam === 'home' ? 0 : Math.PI);
    return looseFrom(w, p, dir, 0.5, 5 + w.rng() * 3, kteam);
  }
  // The defending side heads it away.
  log(w, `${tag(p)} heads it away`, 'def', dteam);
  const away = (dteam === 'home' ? 0 : Math.PI);
  return looseFrom(w, p, away, 0.9, 9 + w.rng() * 5, dteam);
}

/* ---------------- One tick ---------------- */
function engStep(w) {
  const dt = ENG.DT;
  w.tick++; w.t = Math.round(w.tick * dt * 1000) / 1000;
  const b = w.ball;
  if (w.t >= w.nextThink) {
    w.nextThink = w.t + ENG.THINK;
    thinkAttack(w, w.poss);
    thinkDefend(w, oppOf(w.poss));
  }
  if (b.state === 'held') {
    const c = b.owner;
    // Closed down, he has to get rid of it sooner.
    if (c.nextDecide - w.t > 0.15 && nearestDist(c, w.by[oppOf(c.team)]) < 1.3) c.nextDecide = w.t + 0.15;
    if (w.t >= c.nextDecide) { decide(w, c); if (w.outcome) return; }
  }
  perTick(w);

// Things that need re-aiming every tick: pressers at where the carrier is
// heading, the receiver and chasers at the ball.
function perTick(w) {
  const b = w.ball;

    const c = b.owner, dteam = oppOf(c.team), ins = w.T[dteam].ins;
    const g = { x: xAtDepth(dteam, 0), y: MID }, cd = depthOf(dteam, c.x);
    const gap = cd < 24 || counterPressing(w, dteam) ? Math.min(0.9, PRESS_GAP[ins.press]) : PRESS_GAP[ins.press];
    const ahead = { x: c.x + c.vx * 0.3, y: c.y + c.vy * 0.3 };
    for (const d of w.by[dteam]) {
      if (d.stun > w.t) continue;
      if (d.mode !== 'press' && d.mode !== 'contain') continue;
      let vx = g.x - ahead.x, vy = g.y - ahead.y;
      const n = hyp(vx, vy) || 1; vx /= n; vy /= n;
      if (ins.show !== 'none' && d.mode === 'press') {
        // Stand off-centre so the open side is the one we want him to take.
        const toMid = Math.sign(MID - c.y) || 1;
        vy += (ins.show === 'outside' ? toMid : -toMid) * 0.7;
        const m = hyp(vx, vy); vx /= m; vy /= m;
      }
      const gp = d.mode === 'contain' ? 5 : gap;
      d.target = { x: ahead.x + vx * gp, y: ahead.y + vy * gp };
    }
  } else if (b.state === 'roll') {
    // Loose ball: the two nearest from each side go for it. A pass: the
    // receiver meets it.
    const intended = b.intended && b.kind !== 'loose' ? b.intended : null;
    if (intended) {
      const sp = hyp(b.vx, b.vy);
      if (w.tick % 2 === 0 && sp > 0.5) intended.target = meetPoint(intended, b);
    }
    if (!intended || hyp(b.vx, b.vy) < 2) {
      for (const team of ['home', 'away']) {
        const near = w.by[team].filter((p) => p.stun <= w.t && (p.pos !== 'GK' || inBox(oppOf(team), b))).sort((a, c) => hyp(a.x - b.x, a.y - b.y) - hyp(c.x - b.x, c.y - b.y)).slice(0, 2);
        for (const p of near) { p.target = { x: b.x + b.vx * 0.3, y: b.y + b.vy * 0.3 }; p.spd = p.vmax; p.mode = 'chase'; }
      }

  }

    const land = b.state === 'air' ? b.to : { x: b.x + b.vx * 0.8, y: b.y + b.vy * 0.8 };
    const lu = depthOf(dteam, land.x);
    if (gk.stun <= w.t && lu < 26 && Math.abs(land.y - MID) < 22) {
      const sweep = gk.R.sweep > 0.5 ? 1 : at(gk, 'sweeping') / 20;
      const tg = hyp(gk.x - land.x, gk.y - land.y) / gk.vmax;
      const tAtt = Math.min(...w.by[b.team].map((p) => hyp(p.x - land.x, p.y - land.y) / p.vmax));
      if (tg < tAtt * (0.75 + 0.35 * sweep)) { gk.target = land; gk.spd = gk.vmax; gk.mode = 'sweep'; }

}
// Where a player can meet a rolling ball soonest.
function meetPoint(p, b) {
  const sp = hyp(b.vx, b.vy), ux = b.vx / sp, uy = b.vy / sp;
  const stop = (sp * sp) / (2 * ENG.ROLL_F);
  let best = { x: b.x + ux * stop, y: b.y + uy * stop }, bs = Infinity;
  for (let s = 0; s <= stop; s += Math.max(1, stop / 10)) {
    const pt = { x: b.x + ux * s, y: b.y + uy * s };
    const tb = rollTime(sp, s), tp = Math.max(0, hyp(p.x - pt.x, p.y - pt.y) - ENG.REACH) / p.vmax;
    const slack = tp - tb;
    if (slack < 0) return pt;
    if (slack < bs) { bs = slack; best = pt; }
  }
  return best;
}

// Everyone moves towards his target: capped speed and acceleration, easing
// off in time to stop on the spot, slower to turn than to speed up.
function move(w) {
  const dt = ENG.DT, b = w.ball;
  for (const p of w.players) {
    const stunned = p.stun > w.t;
    let cap = stunned ? 1.2 : p.spd;
    // Jockeying backwards towards your own goal is slower than running forwards.
    if (p.mode === 'press' && depthOf(p.team, p.target.x) < depthOf(p.team, p.x)) cap = Math.min(cap, p.vmax * 0.8);
    if (b.state === 'held' && b.owner === p) cap = p.mode === 'dribble' || p.mode === 'takeOn' ? Math.min(p.spd, carryOf(p) + 0.4) : 1.2;
    const dx = p.target.x - p.x, dy = p.target.y - p.y, d = hyp(dx, dy);
    const want = d < 0.2 ? 0 : Math.min(cap, d / dt, Math.sqrt(2 * p.acc * d));
    const tvx = d ? (dx / d) * want : 0, tvy = d ? (dy / d) * want : 0;
    const turning = p.vx * tvx + p.vy * tvy < 0;
    const ax = tvx - p.vx, ay = tvy - p.vy, a = hyp(ax, ay), lim = p.acc * dt * (turning ? 0.55 : 1);
    const k = a > lim ? lim / a : 1;
    p.vx += ax * k; p.vy += ay * k;
    p.x = clamp(p.x + p.vx * dt, -1, PITCH.L + 1); p.y = clamp(p.y + p.vy * dt, -1, PITCH.W + 1);

}

function ballTick(w) {
  const b = w.ball, dt = ENG.DT;
  if (b.state === 'held') {
    const c = b.owner, sp = hyp(c.vx, c.vy);
    const dir = sp > 0.5 ? { x: c.vx / sp, y: c.vy / sp } : { x: c.team === 'home' ? 1 : -1, y: 0 };
    b.x = c.x + dir.x * 0.6; b.y = c.y + dir.y * 0.6; b.h = 0;
    return;
  }
  if (b.state === 'shot') {
    const f = clamp((w.t - b.t0) / b.T, 0, 1);
    b.x = b.from.x + (b.to.x - b.from.x) * f; b.y = b.from.y + (b.to.y - b.from.y) * f;
    b.h = b.result === 'off' ? Math.sin(Math.PI * f) * 1.2 : 0.4 * Math.sin(Math.PI * f);
    if (f >= 1) shotArrives(w);
    return;
  }
  if (b.state === 'air') {
    const f = clamp((w.t - b.t0) / b.T, 0, 1);
    b.x = b.from.x + (b.to.x - b.from.x) * f; b.y = b.from.y + (b.to.y - b.from.y) * f;
    b.h = 4 * b.H * f * (1 - f);
    if (f >= 0.5 && b.h <= ENG.HEAD_H && !b.contested) {
      const cands = w.players.filter((p) => p.stun <= w.t && hyp(p.x - b.x, p.y - b.y) < 1.7 && !(p === b.passer && w.t - b.t0 < 0.5));
      if (cands.length) { b.contested = true; return aerialContest(w, cands); }
    }
    if (f >= 1) {
      // Nobody got to it in the air: it bounces and runs on.
      const len = hyp(b.to.x - b.from.x, b.to.y - b.from.y) || 1, v = (len / b.T) * 0.3;
      Object.assign(b, { state: 'roll', h: 0, vx: ((b.to.x - b.from.x) / len) * v, vy: ((b.to.y - b.from.y) / len) * v, kind: b.kind === 'cross' || b.kind === 'clear' ? 'loose' : b.kind,
        tried: new Set(), aim: { x: b.to.x + ((b.to.x - b.from.x) / len) * 4, y: b.to.y + ((b.to.y - b.from.y) / len) * 4 } });
    }

  }

  const sp = hyp(b.vx, b.vy), dec = b.kind === 'loose' ? ENG.LOOSE_F : ENG.ROLL_F;
  const k = sp > 0 ? Math.max(0, sp - dec * dt) / sp : 0;
  b.vx *= k; b.vy *= k;
  const px = b.x, py = b.y;
  b.x += b.vx * dt; b.y += b.vy * dt;
  if (b.x < 0 || b.x > PITCH.L || b.y < 0 || b.y > PITCH.W) return outOfPlay(w, px, py);

  const cands = [];

    if (p.stun > w.t || b.tried.has(p.id)) continue;
    if (p === b.passer && since < 0.3) continue;
    const d = segDist(p, px, py, b.x, b.y);
    // Nobody reacts to a ball faster than his reaction time allows, unless
    // it is played straight into his body.
    const reach = since < p.react * 0.7 && b.kind !== 'loose' ? ENG.BODY : ENG.REACH;
    if (d <= reach) cands.push({ p, d });
  }
  cands.sort((a, c) => a.d - c.d);
  for (const { p } of cands) {
    b.tried.add(p.id);
    const pl = w.passLog?.at(-1);
    if (pl && !pl.touch && b.kind !== 'loose') pl.touch = (p === b.intended ? 'rec' : p.team === b.team ? 'mate' : 'opp') + ':' + (Math.round(hyp(b.vx, b.vy))) + ':' + (w.t - b.t0).toFixed(1) + ':' + p.mode;
    const speed = hyp(b.vx, b.vy);
    const pressure = nearestDist(p, w.by[oppOf(p.team)]);
    if (p.team === b.team) {
      if (w.rng() < ctrlProb(p, speed, false, pressure)) return takeBall(w, p, 'control');
      p.heavy = true;
      log(w, `${tag(p)} miscontrols`, 'bad', p.team);
      return looseFrom(w, p, Math.atan2(b.vy, b.vx), 1.1, speed * 0.35 + 1, p.team);
    }

    if (p.pos === 'GK' && inBox(oppOf(p.team), p)) return takeBall(w, p, 'claim');

    if (b.kind === 'loose' && speed < 4) { if (w.rng() < ctrlProb(p, speed, false, pressure)) return takeBall(w, p, 'loose'); }

    if (w.passLog?.length && w.passLog.at(-1).ok === null && b.kind !== 'loose') w.passLog.at(-1).ok = false;
    log(w, `${tag(p)} gets a touch on it`, 'win', p.team);
    return looseFrom(w, p, Math.atan2(b.vy, b.vx) + (w.rng() - 0.5) * 2, 0.6, speed * 0.4 + 1, p.team);
  }

}
const segDist = (p, x0, y0, x1, y1) => {
  const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((p.x - x0) * dx + (p.y - y0) * dy) / l2, 0, 1) : 0;

function outOfPlay(w, px, py) {
  const b = w.ball;
  b.x = clamp(b.x, 0, PITCH.L); b.y = clamp(b.y, 0, PITCH.W); b.vx = b.vy = 0;
  if (w.passLog?.length && w.passLog.at(-1).ok === null) w.passLog.at(-1).ok = false;
  if (b.y <= 0 || b.y >= PITCH.W) { log(w, 'Out for a throw-in', 'end'); return endRun(w, 'throw', oppOf(b.team)); }
  const defending = b.x <= 0 ? 'home' : 'away';            // whose goal line it crossed
  const yAt = py + (b.y - py);
  if (yAt > PITCH.goalY0 && yAt < PITCH.goalY1 && b.team === defending) {
    const scorer = oppOf(defending);
    w.T[scorer].S.goals++; w.T[scorer].F.goal = true;
    log(w, 'Own goal!', 'goal', scorer);
    return endRun(w, 'goal', scorer, { og: true });
  }
  if (b.team === defending) { w.T[oppOf(defending)].S.corners++; log(w, 'Corner', 'end'); return endRun(w, 'corner', oppOf(defending)); }
  log(w, 'Goal kick', 'end');

}

// Per tick bookkeeping: possession time, how far the ball has got, and a
// carrier left alone in a dangerous place.
function watchTick(w) {
  const b = w.ball;
  const team = b.state === 'held' ? b.owner.team : b.state === 'shot' ? b.team : w.poss;
  if (team) w.T[team].S.possT += ENG.DT;
  if (b.state !== 'held') return;
  const c = b.owner, F = w.T[c.team].F, S = w.T[c.team].S, u = depthOf(c.team, c.x);
  if (u > PITCH.L / 2 && !F.half) F.half = true;
  if (u > 70 && !F.final3) { F.final3 = true; S.final3++; log(w, `${w.T[c.team].name} into the final third`, 'milestone', c.team); }
  if (inBox(c.team, c) && !F.box) { F.box = true; S.boxEntries++; log(w, `${w.T[c.team].name} into the box`, 'milestone', c.team); }
  if (u > 68 && u < 90 && Math.abs(c.y - MID) < 17) {
    const free = nearestDist(c, w.by[oppOf(c.team)]) > 6;
    if (free) { c.freeT = (c.freeT || 0) + ENG.DT; if (c.freeT >= 1 && !c.freeLogged) { c.freeLogged = true; moment(w, 'timeOnBall', c.team, { ids: [c.id], x: c.x, y: c.y }); } }

function endRun(w, kind, team, extra = {}) {
  if (w.outcome) return;
  w.outcome = { kind, team, t: w.t, at: { x: w.ball.x, y: w.ball.y }, ...extra };

// Run one passage of play to the end. With `record`, keep every frame.
function engRun(input, record = false) {
  const w = engCreate(input);
  const snap = () => w.frames.push({ p: w.players.map((p) => [p.x, p.y]), b: [w.ball.x, w.ball.y, w.ball.h || 0, w.ball.state === 'held' ? w.players.indexOf(w.ball.owner) : -1] });

// Apply a situation's forced instructions (e.g. "they sit deep") to a side.
function withForce(teams, sit) {
  if (!sit.force) return teams;
  const out = { ...teams };
  for (const t in sit.force) out[t] = { ...teams[t], tactic: { ...teams[t].tactic, instr: { ...teams[t].tactic.instr, ...sit.force[t] } } };
  return out;
}

// Starting positions for a situation, from both sides' shapes.
function engSetup(teams, sit) {
  const poss = sit.has, other = oppOf(poss);
  const pos = { home: [], away: [] };
  for (const t of ['home', 'away']) {
    for (const s of FORMATIONS[teams[t].tactic.formation]) pos[t].push(t === 'home' ? [s[0], s[1]] : [PITCH.L - s[0], PITCH.W - s[1]]);
  }
  const ball = { x: xAtDepth(poss, sit.at[0]), y: poss === 'home' ? sit.at[1] : PITCH.W - sit.at[1] };
  // In a transition the side that just lost it is still in its attacking shape.
  const shaper = sit.transition ? other : poss;
  const w = engCreate({ teams, pos, ball, poss: shaper, seed: 1, setup: true });
  // Nobody holds the ball while the shapes settle, so nobody is left standing still.
  Object.assign(w.ball, { x: ball.x, y: ball.y, state: 'setup', owner: null });
  for (let k = 0; k < 6; k++) {
    thinkAttack(w, shaper);
    thinkDefend(w, oppOf(shaper));
    for (const p of w.players) { p.x += (p.target.x - p.x) * 0.8; p.y += (p.target.y - p.y) * 0.8; }
  }
  // The ball goes to the right man: the nearest player of the wanted
  // position to the spot (keeper situations always to the keeper).
  const mine = w.by[poss];
  let holder = null;
  for (const g of sit.carrier) {
    const c = mine.filter((p) => p.pos === g);
    if (c.length) { holder = nearestOf(c, ball); break; }
  }
  holder ||= nearestOf(mine.filter((p) => p.pos !== 'GK'), ball);
  const back = poss === 'home' ? -0.6 : 0.6;
  holder.x = ball.x + back; holder.y = ball.y;
  // Nobody starts on top of the ball carrier.
  const room = sit.transition ? 2.2 : holder.pos === 'GK' ? 8 : 3.5;
  for (const f of w.by[other]) {
    const d = hyp(f.x - holder.x, f.y - holder.y);
    if (d < room) { const k = room / Math.max(d, 0.1); f.x = holder.x + (f.x - holder.x) * k; f.y = clamp(holder.y + (f.y - holder.y) * k, 1, PITCH.W - 1); }
  }
  for (const p of w.players) { p.x = clamp(p.x, 0.5, PITCH.L - 0.5); p.y = clamp(p.y, 0.5, PITCH.W - 0.5); }
  const out = { home: w.by.home.map((p) => [p.x, p.y]), away: w.by.away.map((p) => [p.x, p.y]) };
  return { pos: out, ball: { x: holder.x - back, y: holder.y }, poss, holder: holder.i, transition: !!sit.transition };
}

// A side's shape with and without the ball, for the tactics screen: in
// possession with our midfielder on the ball just inside their half, and
// out of possession with theirs on it just inside ours.
function engShape(teams, team) {
  const ip = engSetup(teams, { has: team, at: [50, 34], carrier: ['DM', 'CM', 'AM'] });
  const oop = engSetup(teams, { has: oppOf(team), at: [48, 34], carrier: ['DM', 'CM', 'AM'] });
  return { ip: ip.pos[team], oop: oop.pos[team], ipBall: ip.ball, oopBall: oop.ball };
}

const TEST_RUNS = 100, TEST_SEED = 1;
const FLAG_KEYS = ['half', 'final3', 'box', 'shot', 'goal', 'highRegain', 'cpRegain', 'quickWin', 'lostOwnThird'];
function newAgg() {

// The change in a yes/no metric between two tests on the same seeds, in

function compareMetric(a, b, key) {

// Headline numbers from Blue's side, as percentages of runs (xG per run).

const METRICS = {
  quickWin: { label: 'Won it back within 8 s', good: 'up' },
  shotFor: { label: 'We got a shot away', good: 'up' }, shotAg: { label: 'They got a shot away', good: 'down' },
  goalFor: { label: 'We scored', good: 'up' }, goalAg: { label: 'They scored', good: 'down' },
  half: { label: 'Got it into their half', good: 'up' }, final3: { label: 'Reached their final third', good: 'up' }, box: { label: 'Got into their box', good: 'up' },
  halfAg: { label: 'They got into our half', good: 'down' }, final3Ag: { label: 'They reached our final third', good: 'down' }, boxAg: { label: 'They reached our box', good: 'down' },
  winHigh: { label: 'Won it back in their half', good: 'up' }, cpRegain: { label: 'Won it back within 5 s', good: 'up' }, lostOwnThird: { label: 'Lost it in our own third', good: 'down' },

/* ================================================================
   Moments: what each pattern teaches, from either side's point of view.
   `good` is the lesson when it happens for Blue, `bad` when it happens
   against Blue. Fixes are instruction or role changes worth testing.
   ================================================================ */
const MOMENT_INFO = {
  pressBeaten: { title: 'Press beaten', principle: 'A press works as a chain: when the first man goes, the next must cut the pass he leaves open.',
    good: (m) => `They pressed, and one pass took ${m.n > 1 ? `${m.n} pressers` : 'the presser'} out of the game. Draw them in, then play past them.`,
    bad: (m) => `One pass took ${m.n > 1 ? `${m.n} of your pressers` : 'your presser'} out of the game and found a man with ${m.space.toFixed(0)} m of space.` },
  inBehind: { title: 'In behind', principle: 'A high line squeezes the pitch but leaves space behind; its safety depends on pressure on the ball and pace at the back.',
    good: () => 'A runner got in behind their back line.', bad: (m) => `Their runner got in behind your line${m.pace && m.chaserPace ? ` (his pace ${m.pace} v ${m.chaserPace})` : ''}.` },
  lineBreak: { title: 'Line broken', principle: 'Passes that go past several opponents at once are worth far more than safe ones square.',
    good: (m) => `One pass went past ${m.n} of their players.`, bad: (m) => `One pass went past ${m.n} of your players.` },
  betweenLines: { title: 'Between the lines', principle: 'Space between the defence and midfield is where attackers can turn and play. Keep the distance between your lines short.',
    good: (m) => `Received between their lines, with ${m.gap.toFixed(0)} m between their defence and midfield.`, bad: (m) => `They received between your lines: ${m.gap.toFixed(0)} m between your defence and midfield.` },
  switch: { title: 'Switch of play', principle: 'A block shifts towards the ball; the far side is where the space is.',
    good: () => 'Switched play to the open side.', bad: () => 'They switched play to your weak side while your block was shifted across.' },
  overload: { title: 'Overload', principle: 'Get more players than them around the ball and someone is always free.',
    good: (m) => `${m.att} v ${m.def} around the ball out wide.`, bad: (m) => `They had ${m.att} v your ${m.def} around the ball out wide.` },
  dribblePast: { title: 'Beaten one-on-one', principle: 'Isolated defenders get beaten; cover and doubling up stop it.',
    good: () => 'Took his man on and beat him.', bad: () => 'Their man beat your defender one-on-one.' },
  timeOnBall: { title: 'Time on the ball', principle: 'Nobody stepped out to the ball in the most dangerous area on the pitch.',
    good: () => 'Given time on the ball just outside their box.', bad: () => 'Their man had time on the ball just outside your box.' },
  regainHigh: { title: 'Won it high', principle: 'The closer to their goal you win it, the fewer players stand between you and a chance.',
    good: () => 'Won the ball back in their half.', bad: () => 'Lost the ball in your own half.' },
  counterPress: { title: 'Counter-press', principle: 'The moment after losing the ball is when the opponent is least organised to keep it.',
    good: () => 'Won it straight back within five seconds of losing it.', bad: () => 'Lost it straight back to their counter-press.' },
  restExposed: { title: 'Counter exposed', principle: 'Rest defence: when you attack, keep enough players behind the ball for the moment you lose it.',

  cross: { title: 'Cross', principle: 'Crosses pay off with bodies in the box and players who win headers.',
    good: (m) => `Crossed with ${m.att} of ours against ${m.def} in the box.`, bad: (m) => `They crossed with ${m.att} in your box against your ${m.def}.` },
  crossWon: { title: 'Header won', principle: 'Aerial ability decides crosses.', good: () => 'Won the header from the cross.', bad: () => 'They won the header from the cross.' },
  bigChance: { title: 'Big chance', principle: 'Chances worth over 0.25 xG decide games.', good: (m) => `A big chance: xG ${m.xg.toFixed(2)}.`, bad: (m) => `A big chance against you: xG ${m.xg.toFixed(2)}.` },

    good: (m) => `Shot from ${m.d.toFixed(0)} m, worth only ${m.xg.toFixed(2)} xG.`, bad: (m) => `They tried from ${m.d.toFixed(0)} m, worth only ${m.xg.toFixed(2)} xG.` },

    good: (m) => (m.trap ? 'Your offside trap caught their runner.' : 'Their runner was caught offside.'), bad: (m) => (m.trap ? 'Their offside trap caught your runner.' : 'Your runner went too early and was offside.') },

// The moments of one run worth showing, best first, then in time order.
function keyMoments(w, max = 5) {

/* ================================================================

   shots for and against came about and what went wrong or right most
   often, and suggests changes that address those causes. Every

      fixes.push(ins.line === 'high' ? fix('line', 'standard') : ins.line === 'standard' ? fix('line', 'deep') : null);
      if (ins.line !== 'deep') fixes.push(ins.trap === 'off' ? fix('trap', 'on') : null);
      const cb = roleAt('CB'); if (cb.length && !cb.some((q) => q.r === 'cov')) fixes.push(roleFix(cb[cb.length > 2 ? 1 : 0].i, 'cov'));
      if (ins.press === 'less') fixes.push(fix('press', 'normal'));
    } else if (c1 === 'pressBeaten') {
      fixes.push(ins.press === 'more' ? fix('press', 'normal') : null, ins.engage === 'high' ? fix('engage', 'mid') : null, ins.show === 'none' ? fix('show', 'outside') : null, ins.marking === 'zonal' ? fix('marking', 'mixed') : null);
    } else if (c1 === 'betweenLines') {
      const dm = roleAt('DM'); if (dm.length && !dm.some((q) => q.r === 'anchor')) fixes.push(roleFix(dm[0].i, 'anchor'));
      fixes.push(ins.engage === 'high' ? fix('engage', 'mid') : null, ins.line === 'deep' ? fix('line', 'standard') : null, ins.marking === 'zonal' ? fix('marking', 'mixed') : null);
    } else if (c1 === 'restExposed' || c1 === 'counterPress' || c1 === 'regainHigh') {
      fixes.push(ins.onLoss !== 'counterpress' ? fix('onLoss', 'counterpress') : fix('onLoss', 'regroup'));
      const fb = [...roleAt('FB'), ...roleAt('WB')].filter((q) => q.r === 'wb');
      if (fb.length) fixes.push(roleFix(fb[0].i, 'ifb'));
      const dm = roleAt('DM'); if (dm.length && !dm.some((q) => ['anchor', 'hb'].includes(q.r))) fixes.push(roleFix(dm[0].i, 'anchor'));

    const fb = [...roleAt('FB'), ...roleAt('WB')].filter((q) => q.r === 'wb' || q.r === 'fb');
    out.push({ tone: 'bad', title: 'Caught short when you lose it', text: `In ${exposed} of ${n} runs you lost the ball with as many of them ahead of it as you had behind it. ${MOMENT_INFO.restExposed.principle}`,

      fixes: [ins.buildUp !== 'long' ? fix('buildUp', 'long') : fix('buildUp', 'mixed'), roleAt('DM').length && !roleAt('DM').some((q) => q.r === 'hb') ? roleFix(roleAt('DM')[0].i, 'hb') : null, gk && roles[gk.i] !== 'sk' ? roleFix(gk.i, 'sk') : null].filter(Boolean).slice(0, 3) });

    out.push({ tone: 'good', title: `Your chances came from ${CAUSE_LABEL[f1]}`, text: `${f1n} of your ${shotsFor} shots came after ${CAUSE_LABEL[f1]}. ${MOMENT_INFO[f1]?.principle || ''}`, fixes: [] });
  }

    const q = agg.S.home.xg / shotsFor;

    fixes: [ins.width !== 'wide' ? fix('width', 'wide') : null, ins.crossing !== 'often' ? fix('crossing', 'often') : null, ins.runs !== 'many' ? fix('runs', 'many') : null].filter(Boolean).slice(0, 3) });
  if (sit.id === 'counter' && M.shotFor < 30) out.push({ tone: 'bad', title: 'The counter is too slow', text: `Only ${Math.round(M.shotFor)}% of your counters ended in a shot. Speed matters more than safety in the first seconds.`,
    fixes: [ins.onWin !== 'counter' ? fix('onWin', 'counter') : null, ins.tempo !== 'fast' ? fix('tempo', 'fast') : null, ins.passing !== 'direct' ? fix('passing', 'direct') : null].filter(Boolean).slice(0, 3) });
  return out.filter((o) => o.fixes.length || o.tone === 'good').slice(0, 4);
}

/* ================================================================
   Matchday: a game told through its key moments
   No full 90 minutes: a match is a dozen passages per half, drawn from
   the situations in proportion to how the two styles meet (a side that
   presses high creates more "their build-up v our press" moments, a side
   that sits deep invites more "break down a low block"). Each is played
   once; the goals are real goals from the simulation.
   ================================================================ */
const MOMENTS_PER_HALF = 18;
// How often each situation comes up: build-up and midfield phases are
// common but rarely decisive, so the moments lean towards the final third
// (where a real game's chances come from), shaped by both styles.
function matchWeights(teams) {
  const u = teams.home.tactic.instr, t = teams.away.tactic.instr;
  const hi = (e) => (e === 'high' ? 0.8 : e === 'mid' ? 0.3 : 0);
  return {
    press: 0.4 + hi(u.engage), buildup: 0.4 + hi(t.engage), block: 0.4 + (u.engage !== 'high' ? 0.4 : 0), midfield: 0.6 + (u.passing === 'short' ? 0.3 : 0),
    lowblock: 0.5 + (t.line === 'deep' ? 0.8 : 0) + (t.engage === 'low' ? 0.4 : 0), overload: 1 + (u.focus === 'wings' ? 0.6 : 0) + (u.width === 'wide' ? 0.3 : 0),
    counter: 0.8 + (u.onWin === 'counter' ? 0.5 : 0) + (t.line === 'high' ? 0.4 : 0), rest: 0.8 + (t.onWin === 'counter' ? 0.5 : 0) + (u.line === 'high' ? 0.4 : 0),
    edge: 1 + (t.final === 'shoot' ? 0.3 : 0), theirwide: 1 + (t.focus === 'wings' ? 0.6 : 0) + (t.width === 'wide' ? 0.3 : 0),

}
function matchPlan(teams, seed, half) {
  const rng = rngFrom(seed * 31 + half), wts = matchWeights(teams), ids = Object.keys(wts), tot = ids.reduce((a, k) => a + wts[k], 0);
