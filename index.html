<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tactics Lab</title>
  <style>
    :root {
      --surround: #0b1410;
      --grass: #2f7a3f;
      --line: rgba(255, 255, 255, 0.9);
      --goal: rgba(255, 255, 255, 0.95);
      --home: #2563eb;
      --away: #dc2626;
      --select: #fbbf24;
      --offside: #fde047;
      --blocked: #f87171;
      --badge: #fde68a;
      --homeRun: #bfdbfe;
      --awayRun: #fecaca;
    }
    html, body { margin: 0; height: 100%; background: var(--surround); overflow: hidden; }
    #pitch { display: block; width: 100%; height: 100%; touch-action: none; }
    #readout { position: fixed; left: 8px; top: 8px; margin: 0; padding: 6px 8px; font: 12px/1.4 ui-monospace, monospace;
      color: #fff; background: rgba(0,0,0,0.55); border-radius: 6px; pointer-events: none; }
    #toolbar { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,0.6); border-radius: 10px; }
    #toolbar button { font: 600 14px system-ui, sans-serif; color: #fff; background: transparent; border: 0;
      padding: 8px 12px; border-radius: 7px; cursor: pointer; }
    #toolbar button[aria-pressed="true"] { background: rgba(255,255,255,0.22); }
    #toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translateX(-50%);
      padding: 8px 14px; border-radius: 8px; background: rgba(0,0,0,0.75); color: #fff; font: 600 14px system-ui, sans-serif;
      opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="pitch"></canvas>
  <pre id="readout"></pre>
  <div id="toolbar" role="toolbar" aria-label="Tools">
    <button data-tool="move" aria-pressed="true" title="Move (V)">Move</button>
    <button data-tool="runs" aria-pressed="false" title="Runs (R)">Runs</button>
    <button id="play" title="Play (Space)">▶ Play</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';

/* ================================================================
   Pitch geometry (metres)
   x = 0 is our goal line, x = 105 the opposition's.
   y = 0 is the touchline on our left as we attack towards x = 105.
   ================================================================ */
const PITCH = {
  L: 105, W: 68,
  goalY0: 30.34, goalY1: 37.66,     // 7.32 m goal mouth centred on y = 34
  goalDepth: 2,                     // drawn behind the line, outside the field
  boxD: 16.5, boxW: 40.32,
  sixD: 5.5, sixW: 18.32,
  spotX: 11,
  circleR: 9.15,
  cornerR: 1,
  lineW: 0.12,                      // real line width
};
const MARGIN = 4;                   // metres of surround kept visible around the pitch

/* ================================================================
   Data model
   Formation slots are [x, y, role, unit, number] for the home side
   (attacking towards x = 105). Unit is one of G / D / DM / M / AM / A
   and drives the "lines broken" model later. Away sides use the same
   tables mirrored through the pitch centre: (x, y) -> (L - x, W - y).
   ================================================================ */
const GK = [5, 34, 'GK', 'G', 1];
const BACK4 = [[26, 7, 'LB', 'D', 3], [23, 24, 'CB', 'D', 4], [23, 44, 'CB', 'D', 5], [26, 61, 'RB', 'D', 2]];
const BACK3 = [[23, 18, 'CB', 'D', 4], [21, 34, 'CB', 'D', 5], [23, 50, 'CB', 'D', 15]];
const FORMATIONS = {
  '4-3-3': [GK, ...BACK4, [33, 34, 'DM', 'DM', 6], [41, 23, 'CM', 'M', 8], [41, 45, 'CM', 'M', 10], [57, 11, 'LW', 'A', 11], [59, 34, 'ST', 'A', 9], [57, 57, 'RW', 'A', 7]],
  '4-2-3-1': [GK, ...BACK4, [33, 26, 'DM', 'DM', 6], [33, 42, 'DM', 'DM', 8], [50, 6, 'LW', 'AM', 11], [55, 34, 'AM', 'AM', 10], [50, 62, 'RW', 'AM', 7], [63, 34, 'ST', 'A', 9]],
  '4-4-2': [GK, ...BACK4, [42, 8, 'LM', 'M', 11], [40, 26, 'CM', 'M', 8], [40, 42, 'CM', 'M', 6], [42, 60, 'RM', 'M', 7], [57, 28, 'ST', 'A', 9], [57, 40, 'ST', 'A', 10]],
  '4-1-4-1': [GK, ...BACK4, [32, 34, 'DM', 'DM', 6], [44, 8, 'LM', 'M', 11], [42, 25, 'CM', 'M', 8], [42, 43, 'CM', 'M', 10], [44, 60, 'RM', 'M', 7], [59, 34, 'ST', 'A', 9]],
  '3-5-2': [GK, ...BACK3, [42, 6, 'LWB', 'M', 3], [32, 34, 'DM', 'DM', 6], [42, 24, 'CM', 'M', 8], [42, 44, 'CM', 'M', 10], [42, 62, 'RWB', 'M', 2], [57, 28, 'ST', 'A', 9], [57, 40, 'ST', 'A', 11]],
  '3-4-3': [GK, ...BACK3, [40, 7, 'LWB', 'M', 3], [38, 26, 'CM', 'M', 8], [38, 42, 'CM', 'M', 6], [40, 61, 'RWB', 'M', 2], [56, 13, 'LW', 'A', 11], [59, 34, 'ST', 'A', 9], [56, 55, 'RW', 'A', 7]],
  '5-3-2': [GK, [30, 6, 'LWB', 'D', 3], [22, 21, 'CB', 'D', 4], [21, 34, 'CB', 'D', 5], [22, 47, 'CB', 'D', 15], [30, 62, 'RWB', 'D', 2], [41, 22, 'CM', 'M', 8], [38, 34, 'CM', 'M', 6], [41, 46, 'CM', 'M', 10], [56, 28, 'ST', 'A', 9], [56, 40, 'ST', 'A', 11]],
};

const CARRY_R = 2.6;                // the carrier is the nearest player within this of the ball
const PLAYER_R = 1.2;               // drawn disc radius (m)
const BALL_R = 0.55;

const state = {
  players: [],
  ball: { x: 0, y: 0 },
  selected: null,                   // player id
  coverage: 'control',              // 'control' | 'zones' | 'off'
  possession: 'home',               // last team to have a carrier
  layers: { lanes: true, lines: true, offside: true, shape: true, roles: false },
  tool: 'move',                     // 'move' | 'runs' | 'pass'
  match: null,                      // match-play state when a game is running
};

// A player: current position, base position, and an optional run
// ({ x, y, bend }) with a base copy so "back to base" can restore it.
function makePlayer(team, slot, i) {
  const [sx, sy, role, unit, num] = slot;
  const x = team === 'home' ? sx : PITCH.L - sx;
  const y = team === 'home' ? sy : PITCH.W - sy;
  return {
    id: `${team}-${i}`, team, role, unit, num,
    x, y, base: { x, y },
    run: null, baseRun: null,
  };
}

function setupMatch(homeFormation, awayFormation) {
  state.players = [
    ...FORMATIONS[homeFormation].map((s, i) => makePlayer('home', s, i)),
    ...FORMATIONS[awayFormation].map((s, i) => makePlayer('away', s, i)),
  ];
  // Start the ball at the home #6's feet.
  const six = state.players.find((p) => p.team === 'home' && p.num === 6);
  state.ball = { x: six.x + 1.6, y: six.y };
  state.selected = null;
}

function carrier() {
  let best = null, bestD = CARRY_R;
  for (const p of state.players) {
    if (!visible(p)) continue;
    const d = Math.hypot(p.x - state.ball.x, p.y - state.ball.y);
    if (d <= bestD) { best = p; bestD = d; }
  }
  return best;
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function clampToPitch(pt) {
  pt.x = clamp(pt.x, 0, PITCH.L);
  pt.y = clamp(pt.y, 0, PITCH.W);
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* ================================================================
   Analysis 1 — Zones (exact Voronoi)
   Player i owns every point closer to i than to any other player j:
     |p - pi|² <= |p - pj|²  <=>  (pj - pi)·p <= (|pj|² - |pi|²) / 2
   Each cell starts as the pitch rectangle and is clipped by that
   half-plane for every j (Sutherland–Hodgman against one edge).
   ================================================================ */
function clipHalfPlane(poly, a, b, c) {       // keep a*x + b*y <= c
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length];
    const fp = a * P.x + b * P.y - c, fq = a * Q.x + b * Q.y - c;
    if (fp <= 0) out.push(P);
    if ((fp < 0 && fq > 0) || (fp > 0 && fq < 0)) {
      const t = fp / (fp - fq);
      out.push({ x: P.x + t * (Q.x - P.x), y: P.y + t * (Q.y - P.y) });
    }
  }
  return out;
}

function polyArea(poly) {                     // shoelace
  let s = 0;
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length];
    s += P.x * Q.y - Q.x * P.y;
  }
  return Math.abs(s) / 2;
}

function computeZones(players) {
  const rect = [{ x: 0, y: 0 }, { x: PITCH.L, y: 0 }, { x: PITCH.L, y: PITCH.W }, { x: 0, y: PITCH.W }];
  const zones = new Map();
  for (const pi of players) {
    let poly = rect;
    for (const pj of players) {
      if (pj === pi || (pj.x === pi.x && pj.y === pi.y)) continue;
      poly = clipHalfPlane(poly, pj.x - pi.x, pj.y - pi.y, (pj.x ** 2 + pj.y ** 2 - pi.x ** 2 - pi.y ** 2) / 2);
      if (poly.length < 3) break;
    }
    zones.set(pi.id, { poly, area: poly.length >= 3 ? polyArea(poly) : 0 });
  }
  return zones;
}

/* ================================================================
   Analysis 2 — Pitch control
   On a 0.5 m node grid, compare the nearest home and nearest away
   distance and squash the difference through a logistic:
     p = 1 / (1 + exp(-(d_away - d_home) / 2.6))
   p is the home side's control of that node; its mean is the home
   share of the pitch (away share = 1 - mean).
   ================================================================ */
const GRID = 0.5;
const NX = Math.round(PITCH.L / GRID) + 1, NY = Math.round(PITCH.W / GRID) + 1;
const controlP = new Float32Array(NX * NY);

function computeControl(home, away) {
  let sum = 0;
  for (let j = 0; j < NY; j++) {
    const y = j * GRID;
    for (let i = 0; i < NX; i++) {
      const x = i * GRID;
      let dh = Infinity, da = Infinity;
      for (const p of home) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < dh) dh = d; }
      for (const p of away) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < da) da = d; }
      let p;
      if (dh === Infinity && da === Infinity) p = 0.5;
      else if (da === Infinity) p = 1;
      else if (dh === Infinity) p = 0;
      else p = 1 / (1 + Math.exp(-(Math.sqrt(da) - Math.sqrt(dh)) / 2.6));
      controlP[j * NX + i] = p;
      sum += p;
    }
  }
  return sum / (NX * NY);
}

// Marching squares over the node grid at p = 0.5. Returns line segments
// [x0, y0, x1, y1] with each end linearly interpolated along a cell edge.
function controlContour() {
  const segs = [];
  const at = (i, j) => controlP[j * NX + i];
  // Point where p crosses 0.5 between nodes (i0,j0) and (i1,j1).
  const lerp = (i0, j0, i1, j1) => {
    const a = at(i0, j0), b = at(i1, j1);
    const t = (0.5 - a) / (b - a);
    return [(i0 + t * (i1 - i0)) * GRID, (j0 + t * (j1 - j0)) * GRID];
  };
  for (let j = 0; j < NY - 1; j++) {
    for (let i = 0; i < NX - 1; i++) {
      const c = (at(i, j) > 0.5 ? 1 : 0) | (at(i + 1, j) > 0.5 ? 2 : 0) | (at(i + 1, j + 1) > 0.5 ? 4 : 0) | (at(i, j + 1) > 0.5 ? 8 : 0);
      if (c === 0 || c === 15) continue;
      const top = () => lerp(i, j, i + 1, j), right = () => lerp(i + 1, j, i + 1, j + 1);
      const bottom = () => lerp(i, j + 1, i + 1, j + 1), left = () => lerp(i, j, i, j + 1);
      const add = (p, q) => segs.push([p[0], p[1], q[0], q[1]]);
      switch (c) {
        case 1: case 14: add(left(), top()); break;
        case 2: case 13: add(top(), right()); break;
        case 3: case 12: add(left(), right()); break;
        case 4: case 11: add(right(), bottom()); break;
        case 6: case 9: add(top(), bottom()); break;
        case 7: case 8: add(left(), bottom()); break;
        case 5: case 10: {
          // Saddle: resolve with the cell-centre average.
          const centre = (at(i, j) + at(i + 1, j) + at(i + 1, j + 1) + at(i, j + 1)) / 4 > 0.5;
          if ((c === 5) === centre) { add(left(), bottom()); add(top(), right()); }
          else { add(left(), top()); add(right(), bottom()); }
        }
      }
    }
  }
  return segs;
}

/* ================================================================
   Analysis 3 — Passing lanes
   A lane from passer P to teammate R (within 42 m) is blocked if any
   opponent O, projecting onto PR at distance t along it (0 < t < |PR|),
   sits closer to the segment than
     1.3 + 0.05 × min(t, |PR| - t)
   i.e. a defender needs to be tight to cut a lane near either end, but
   has more room to get across it in the middle of a long ball.
   ================================================================ */
const LANE_RANGE = 42;
const opponentsOf = (team) => state.players.filter((p) => p.team !== team && visible(p));
const teammatesOf = (p) => state.players.filter((q) => q.team === p.team && q !== p);
const attackDir = (team) => (team === 'home' ? 1 : -1);     // +x for home, -x for away
const visible = (p) => p.team === 'home' || state.showAway !== false;

function laneBlocker(from, to, opponents) {
  const len = dist(from, to);
  if (len < 1e-6) return null;
  const ux = (to.x - from.x) / len, uy = (to.y - from.y) / len;
  let worst = null, worstMargin = 0;
  for (const o of opponents) {
    const t = (o.x - from.x) * ux + (o.y - from.y) * uy;
    if (t <= 0 || t >= len) continue;
    const perp = Math.abs((o.x - from.x) * uy - (o.y - from.y) * ux);
    const margin = 1.3 + 0.05 * Math.min(t, len - t) - perp;
    if (margin > worstMargin) { worst = o; worstMargin = margin; }
  }
  return worst;
}

function lanesFrom(passer) {
  const opp = opponentsOf(passer.team);
  return teammatesOf(passer)
    .filter((r) => dist(passer, r) <= LANE_RANGE)
    .map((r) => {
      const blocker = laneBlocker(passer, r, opp);
      return { from: passer, to: r, len: dist(passer, r), blocker, breaks: linesBroken(passer, r) };
    });
}

/* ================================================================
   Analysis 4 — Lines broken
   Each team's outfielders are grouped by unit (D, DM, M, AM, A) and a
   unit's line is its mean x. A pass breaks an opposing line when that
   mean x lies strictly between passer and receiver, with the receiver
   further forward in the passer's attacking direction.
   ================================================================ */
function unitLines(team) {
  const groups = {};
  for (const p of state.players) {
    if (p.team !== team || p.unit === 'G' || !visible(p)) continue;
    (groups[p.unit] ||= []).push(p.x);
  }
  return Object.entries(groups).map(([unit, xs]) => ({ unit, x: xs.reduce((a, b) => a + b, 0) / xs.length }));
}

function linesBroken(from, to, team = from.team) {
  const dir = attackDir(team);
  const a = from.x * dir, b = to.x * dir;
  if (b <= a) return 0;
  const other = team === 'home' ? 'away' : 'home';
  return unitLines(other).filter((l) => l.x * dir > a && l.x * dir < b).length;
}

/* ================================================================
   Analysis 5 — Offside line
   For the team in possession: the second-last defender's depth, or the
   ball's if it is further forward, and never behind halfway. "Depth" is
   x × attackDir so the same rule works for both directions. Attackers
   beyond it (other than the carrier) are offside.
   ================================================================ */
function offsideLine(team) {
  const dir = attackDir(team);
  const depths = opponentsOf(team).map((p) => p.x * dir).sort((a, b) => b - a);
  const second = depths.length >= 2 ? depths[1] : -Infinity;
  const depth = Math.max(second, state.ball.x * dir, (PITCH.L / 2) * dir);
  return depth * dir;
}

function offsidePlayers(team, lineX, holder) {
  const dir = attackDir(team);
  return state.players.filter((p) => p.team === team && p !== holder && p.x * dir > lineX * dir + 1e-9);
}

/* ================================================================
   Analysis 6 — Team shape
   Convex hull of the outfielders (Andrew's monotone chain), with width
   across the pitch (y span), depth along it (x span) and hull area.
   ================================================================ */
function convexHull(pts) {
  const P = pts.map((p) => ({ x: p.x, y: p.y })).sort((a, b) => a.x - b.x || a.y - b.y);
  if (P.length < 3) return P;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [], upper = [];
  for (const p of P) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function teamShape(team) {
  const out = state.players.filter((p) => p.team === team && p.unit !== 'G' && visible(p));
  if (!out.length) return null;
  const xs = out.map((p) => p.x), ys = out.map((p) => p.y);
  const hull = convexHull(out);
  return {
    hull,
    width: Math.max(...ys) - Math.min(...ys),
    depth: Math.max(...xs) - Math.min(...xs),
    area: hull.length >= 3 ? polyArea(hull) : 0,
  };
}

/* ================================================================
   Analysis pass: everything the renderer and readout need, recomputed
   from scratch on every frame that changes the board.
   ================================================================ */
let A = null;   // latest analysis

function analyse() {
  const players = state.players.filter(visible);
  const home = players.filter((p) => p.team === 'home');
  const away = players.filter((p) => p.team === 'away');
  const homeShare = computeControl(home, away);
  const holder = carrier();
  if (holder) state.possession = holder.team;
  const team = state.possession;
  const offX = offsideLine(team);
  const sel = players.find((p) => p.id === state.selected) || null;
  A = {
    zones: computeZones(players),
    homeShare,
    carrier: holder,
    selected: sel,
    lanes: holder ? lanesFrom(holder) : [],
    selLanes: sel && sel !== holder ? lanesFrom(sel) : [],
    offsideX: offX,
    offside: offsidePlayers(team, offX, holder),
    shape: { home: teamShape('home'), away: teamShape('away') },
  };
  return A;
}

/* ================================================================
   View transform
   Every draw call works in pitch metres. `view` holds the affine map
   pitch -> CSS pixels; the canvas transform is that map times dpr.

   Landscape: screenX = ox + x*s,        screenY = oy + y*s
              (we attack left -> right, our left touchline at the top)
   Portrait:  screenX = ox + y*s,        screenY = oy + (L - x)*s
              (we attack up the screen, our left touchline on the left)

   Written as canvas setTransform(a, b, c, d, e, f):
     screenX = a*x + c*y + e,  screenY = b*x + d*y + f
   ================================================================ */
const canvas = document.getElementById('pitch');
const ctx = canvas.getContext('2d');
const view = { s: 1, a: 1, b: 0, c: 0, d: 1, e: 0, f: 0, portrait: false, dpr: 1, cssW: 0, cssH: 0 };

function layout() {
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  view.cssW = cssW; view.cssH = cssH; view.dpr = dpr;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));

  view.portrait = cssH > cssW * 1.08;
  // Board extent in metres along screen axes, including the margin.
  const bw = (view.portrait ? PITCH.W : PITCH.L) + 2 * MARGIN;
  const bh = (view.portrait ? PITCH.L : PITCH.W) + 2 * MARGIN;
  const s = Math.min(cssW / bw, cssH / bh);   // uniform scale: never stretched
  view.s = s;
  // Centre the pitch rectangle (without margin) in the viewport.
  const ox = (cssW - (bw - 2 * MARGIN) * s) / 2;
  const oy = (cssH - (bh - 2 * MARGIN) * s) / 2;
  if (view.portrait) {
    Object.assign(view, { a: 0, b: -s, c: s, d: 0, e: ox, f: oy + PITCH.L * s });
  } else {
    Object.assign(view, { a: s, b: 0, c: 0, d: s, e: ox, f: oy });
  }
}

// Switch the context into pitch-metre space.
function usePitchSpace() {
  const { a, b, c, d, e, f, dpr } = view;
  ctx.setTransform(a * dpr, b * dpr, c * dpr, d * dpr, e * dpr, f * dpr);
}

// Pitch metres -> CSS pixels.
function toScreen(x, y) {
  return { x: view.a * x + view.c * y + view.e, y: view.b * x + view.d * y + view.f };
}

// CSS pixels -> pitch metres (inverse of the 2x2 map plus translation).
function toPitch(px, py) {
  const { a, b, c, d, e, f } = view;
  const det = a * d - b * c;
  const u = px - e, v = py - f;
  return { x: (d * u - c * v) / det, y: (a * v - b * u) / det };
}

// Run `fn` in a frame anchored at pitch point (x, y) whose axes read
// upright on screen. In portrait the pitch is rotated -90°, so rotating
// the local frame +90° cancels it. Units stay in metres.
function uprightAt(x, y, fn) {
  ctx.save();
  ctx.translate(x, y);
  if (view.portrait) ctx.rotate(Math.PI / 2);
  fn();
  ctx.restore();
}

// Lines at real width, but never thinner than ~1.2 device-independent pixels.
function lineWidthM(metres) {
  return Math.max(metres, 1.2 / view.s);
}

/* ================================================================
   Pitch markings (all at real dimensions)
   ================================================================ */
// Canvas colours come from the CSS tokens; re-read when the theme changes.
const colors = {};
function readTokens() {
  const css = getComputedStyle(document.documentElement);
  for (const k of ['surround', 'grass', 'line', 'goal', 'home', 'away', 'select', 'offside', 'blocked', 'badge', 'homeRun', 'awayRun']) colors[k] = css.getPropertyValue('--' + k).trim();
  colors.homeRGB = hexToRGB(colors.home);
  colors.awayRGB = hexToRGB(colors.away);
}
function hexToRGB(h) {
  const n = parseInt(h.replace('#', ''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function drawPitch() {
  const { L, W } = PITCH;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = colors.surround;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  usePitchSpace();
  ctx.fillStyle = colors.grass;
  ctx.fillRect(-MARGIN, -MARGIN, L + 2 * MARGIN, W + 2 * MARGIN);

  ctx.strokeStyle = colors.line;
  ctx.fillStyle = colors.line;
  ctx.lineWidth = lineWidthM(PITCH.lineW);
  ctx.lineJoin = 'miter';

  // Outline and halfway line.
  ctx.strokeRect(0, 0, L, W);
  line(L / 2, 0, L / 2, W);

  // Centre circle and spot.
  circle(L / 2, W / 2, PITCH.circleR);
  dot(L / 2, W / 2, 0.25);

  // Both ends: `dir` = +1 at our goal (x = 0), -1 at theirs (x = L).
  for (const [gx, dir] of [[0, 1], [L, -1]]) {
    const boxY0 = (W - PITCH.boxW) / 2, sixY0 = (W - PITCH.sixW) / 2;
    ctx.strokeRect(Math.min(gx, gx + dir * PITCH.boxD), boxY0, PITCH.boxD, PITCH.boxW);
    ctx.strokeRect(Math.min(gx, gx + dir * PITCH.sixD), sixY0, PITCH.sixD, PITCH.sixW);

    const spotX = gx + dir * PITCH.spotX;
    dot(spotX, W / 2, 0.22);

    // Penalty arc: the part of the 9.15 m circle round the spot that lies
    // beyond the box edge. The edge is (boxD - spotX) = 5.5 m from the spot,
    // so the arc spans ±acos(5.5 / 9.15) about the direction into the field.
    const half = Math.acos((PITCH.boxD - PITCH.spotX) / PITCH.circleR);
    const mid = dir > 0 ? 0 : Math.PI;
    ctx.beginPath();
    ctx.arc(spotX, W / 2, PITCH.circleR, mid - half, mid + half);
    ctx.stroke();

    // Goal frame behind the line.
    ctx.save();
    ctx.strokeStyle = colors.goal;
    ctx.lineWidth = lineWidthM(0.12) * 1.5;
    ctx.strokeRect(Math.min(gx, gx - dir * PITCH.goalDepth), PITCH.goalY0, PITCH.goalDepth, PITCH.goalY1 - PITCH.goalY0);
    ctx.restore();
  }

  // Corner arcs, each a quarter circle opening into the field.
  const corners = [[0, 0, 0], [L, 0, Math.PI / 2], [L, W, Math.PI], [0, W, -Math.PI / 2]];
  for (const [cx, cy, start] of corners) {
    ctx.beginPath();
    ctx.arc(cx, cy, PITCH.cornerR, start, start + Math.PI / 2);
    ctx.stroke();
  }
}

function line(x0, y0, x1, y1) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
function circle(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
}
function dot(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

/* ================================================================
   Coverage layers
   Control is drawn as a tiny per-node image (one pixel per grid node)
   scaled up with smoothing, so the tint is soft without per-cell paths.
   ================================================================ */
const tintCanvas = document.createElement('canvas');
tintCanvas.width = NX; tintCanvas.height = NY;
const tintCtx = tintCanvas.getContext('2d');
const tintImage = tintCtx.createImageData(NX, NY);

function drawControl() {
  const d = tintImage.data, [hr, hg, hb] = colors.homeRGB, [ar, ag, ab] = colors.awayRGB;
  for (let k = 0; k < NX * NY; k++) {
    const p = controlP[k], home = p >= 0.5;
    // Alpha ∝ |2p - 1|^0.9, capped at 0.35 so the grass reads through.
    const a = 0.35 * Math.pow(Math.abs(2 * p - 1), 0.9);
    d[k * 4] = home ? hr : ar; d[k * 4 + 1] = home ? hg : ag; d[k * 4 + 2] = home ? hb : ab;
    d[k * 4 + 3] = a * 255;
  }
  tintCtx.putImageData(tintImage, 0, 0);
  usePitchSpace();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, PITCH.L, PITCH.W); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  // Pixel (i, j) is centred on node (i*GRID, j*GRID).
  ctx.drawImage(tintCanvas, -GRID / 2, -GRID / 2, NX * GRID, NY * GRID);
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = lineWidthM(0.18);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (const [x0, y0, x1, y1] of controlContour()) { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); }
  ctx.stroke();
}

function drawZones() {
  usePitchSpace();
  ctx.lineWidth = lineWidthM(0.12);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  for (const p of state.players) {
    const z = A.zones.get(p.id);
    if (!z || z.poly.length < 3) continue;
    ctx.beginPath();
    z.poly.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
    ctx.closePath();
    ctx.globalAlpha = p.id === state.selected ? 0.42 : 0.22;
    ctx.fillStyle = colors[p.team];
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.stroke();
  }
}

/* ================================================================
   Tactical overlays: shape, offside line, passing lanes
   ================================================================ */
function drawShape() {
  usePitchSpace();
  for (const team of ['home', 'away']) {
    const s = A.shape[team];
    if (!s || s.hull.length < 3) continue;
    ctx.beginPath();
    s.hull.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
    ctx.closePath();
    ctx.globalAlpha = 0.08; ctx.fillStyle = colors[team]; ctx.fill();
    ctx.globalAlpha = 0.7; ctx.strokeStyle = colors[team];
    ctx.lineWidth = lineWidthM(0.25); ctx.setLineDash([1.2, 0.8]); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
}

function drawOffside() {
  usePitchSpace();
  ctx.strokeStyle = colors.offside;
  ctx.lineWidth = lineWidthM(0.22);
  ctx.setLineDash([1.6, 1]);
  line(A.offsideX, 0, A.offsideX, PITCH.W);
  ctx.setLineDash([]);
}

// Open lanes are white and thin out with distance; blocked ones are dashed red.
function drawLanes(lanes, faint) {
  usePitchSpace();
  ctx.lineCap = 'round';
  for (const l of lanes) {
    const { from, to } = l;
    if (l.blocker) {
      ctx.strokeStyle = colors.blocked;
      ctx.globalAlpha = faint ? 0.5 : 0.85;
      ctx.lineWidth = lineWidthM(0.2);
      ctx.setLineDash([0.9, 0.7]);
    } else {
      ctx.strokeStyle = '#fff';
      ctx.globalAlpha = faint ? 0.45 : 0.85;
      ctx.lineWidth = Math.max(0.6 - 0.45 * (l.len / LANE_RANGE), 1.2 / view.s);
      ctx.setLineDash([]);
    }
    line(from.x, from.y, to.x, to.y);
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  if (!state.layers.lines) return;
  for (const l of lanes) {
    if (l.blocker || !l.breaks) continue;
    badge((l.from.x + l.to.x) / 2, (l.from.y + l.to.y) / 2, `+${l.breaks}`);
  }
}

// A small upright pill label centred on a pitch point.
function badge(x, y, text) {
  const h = Math.max(1.8, 13 / view.s);
  uprightAt(x, y, () => {
    ctx.font = `700 ${h * 0.72}px system-ui, sans-serif`;
    const w = ctx.measureText(text).width + h * 0.6;
    ctx.fillStyle = colors.badge;
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 0, h * 0.04);
  });
}

/* ================================================================
   Players and ball
   Sizes are in metres but floored in pixels so they stay legible and
   touchable on a phone, where 1 m can be ~5 px.
   ================================================================ */
const playerR = () => Math.max(PLAYER_R, 7 / view.s);
const ballR = () => Math.max(BALL_R, 3.5 / view.s);

function drawPlayers() {
  const r = playerR();
  const holder = carrier();
  usePitchSpace();

  const offside = new Set(state.layers.offside ? A.offside : []);
  for (const p of state.players) {
    if (!visible(p)) continue;
    if (offside.has(p)) {
      ctx.save();
      ctx.strokeStyle = colors.offside;
      ctx.lineWidth = r * 0.16;
      ctx.setLineDash([r * 0.3, r * 0.2]);
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.8, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = colors[p.team];
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = r * 0.14;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    if (p === holder) {
      ctx.save();
      ctx.lineWidth = r * 0.12;
      ctx.setLineDash([r * 0.35, r * 0.25]);
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.55, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    if (p.id === state.selected) {
      ctx.save();
      ctx.strokeStyle = colors.select;
      ctx.lineWidth = r * 0.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.3, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    uprightAt(p.x, p.y, () => {
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${r * 1.05}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(p.num), 0, r * 0.06);
    });
  }

  // Ball on top of everything.
  const br = ballR();
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#111';
  ctx.lineWidth = br * 0.25;
  ctx.beginPath(); ctx.arc(state.ball.x, state.ball.y, br, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

/* ================================================================
   Runs: geometry
   A run is a quadratic Bézier from the player S to the end point E.
   Its control point is pushed off the chord's midpoint M along the
   chord's left unit normal n by a signed fraction of the chord length:
     C = M + n × bend × |SE|
   The curve passes through B(½) = M + n × bend × |SE| / 2, which is
   where the handle sits. Dragging the handle to pointer Q solves back:
     bend = 2 × ((Q - M) · n) / |SE|
   so pulling it to either side of the chord gives the matching sign.
   ================================================================ */
const MAX_BEND = 0.7, SNAP_BEND = 0.04;

function runGeom(from, run) {
  const L = Math.max(dist(from, run), 1e-6);
  const nx = -(run.y - from.y) / L, ny = (run.x - from.x) / L;
  const M = { x: (from.x + run.x) / 2, y: (from.y + run.y) / 2 };
  const k = run.bend * L;
  return {
    S: { x: from.x, y: from.y }, E: { x: run.x, y: run.y }, M, L, nx, ny,
    C: { x: M.x + nx * k, y: M.y + ny * k },
    H: { x: M.x + nx * k / 2, y: M.y + ny * k / 2 },
  };
}

function bezier(g, t) {
  const u = 1 - t;
  return {
    x: u * u * g.S.x + 2 * u * t * g.C.x + t * t * g.E.x,
    y: u * u * g.S.y + 2 * u * t * g.C.y + t * t * g.E.y,
  };
}

function bendFromHandle(g, q) {
  const b = (2 * ((q.x - g.M.x) * g.nx + (q.y - g.M.y) * g.ny)) / g.L;
  const c = clamp(b, -MAX_BEND, MAX_BEND);
  return Math.abs(c) < SNAP_BEND ? 0 : c;
}

function drawRuns() {
  usePitchSpace();
  const r = playerR();
  for (const p of state.players) {
    if (!p.run || !visible(p)) continue;
    const g = runGeom(anim ? anim.starts.get(p) || p : p, p.run);
    ctx.strokeStyle = colors[p.team + 'Run'];
    ctx.lineWidth = lineWidthM(0.3);
    ctx.globalAlpha = anim ? 0.35 : 0.95;
    ctx.setLineDash([1, 0.7]);
    ctx.beginPath(); ctx.moveTo(g.S.x, g.S.y); ctx.quadraticCurveTo(g.C.x, g.C.y, g.E.x, g.E.y); ctx.stroke();
    ctx.setLineDash([]);
    // Arrowhead along the end tangent (E - C).
    const tl = Math.hypot(g.E.x - g.C.x, g.E.y - g.C.y) || 1;
    const tx = (g.E.x - g.C.x) / tl, ty = (g.E.y - g.C.y) / tl, h = r * 0.9;
    ctx.fillStyle = colors[p.team + 'Run'];
    ctx.beginPath();
    ctx.moveTo(g.E.x, g.E.y);
    ctx.lineTo(g.E.x - tx * h - ty * h * 0.55, g.E.y - ty * h + tx * h * 0.55);
    ctx.lineTo(g.E.x - tx * h + ty * h * 0.55, g.E.y - ty * h - tx * h * 0.55);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    if (anim || state.match) continue;
    // Bend handle.
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = colors[p.team];
    ctx.lineWidth = r * 0.18;
    ctx.beginPath(); ctx.arc(g.H.x, g.H.y, r * 0.45, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

/* ================================================================
   Interaction
   Hit-testing is done in metres against a touch-sized radius. The
   pointer keeps its grab offset so nothing jumps under the finger.
   Dragging the carrier moves the ball with them, keeping the ball at
   the same offset from their feet.
   ================================================================ */
let drag = null;

function pointerPitch(ev) {
  const r = canvas.getBoundingClientRect();
  return toPitch(ev.clientX - r.left, ev.clientY - r.top);
}

// Nearest thing under the pointer that the current tool can act on.
// Small targets (ball, run handles, run ends) win ties within half a
// player radius, so they can be grabbed even when sitting on a player.
function hitTest(pt, tool = state.tool) {
  const reach = Math.max(playerR() * 1.3, 22 / view.s);
  const bias = playerR() * 0.5;
  let best = null, bestD = reach;
  const consider = (kind, target, d) => { if (d < bestD) { best = { kind, target }; bestD = d; } };
  for (const p of state.players) {
    if (!visible(p)) continue;
    consider('player', p, dist(pt, p));
    if (p.run && tool !== 'pass') {
      const g = runGeom(p, p.run);
      consider('bend', p, dist(pt, g.H) - bias);
      consider('runEnd', p, dist(pt, g.E) - bias);
    }
  }
  if (tool !== 'runs') consider('ball', state.ball, dist(pt, state.ball) - bias);
  return best;
}

canvas.addEventListener('pointerdown', (ev) => {
  if (anim) return;
  const pt = pointerPitch(ev);
  const hit = hitTest(pt);
  if (!hit) {
    state.selected = null;
    requestRender();
    return;
  }
  const t = hit.target;
  drag = { kind: hit.kind, target: t, pointerId: ev.pointerId, dx: t.x - pt.x, dy: t.y - pt.y, carried: null, start: pt };
  if (hit.kind === 'player') {
    state.selected = t.id;
    if (state.tool === 'runs') drag.kind = 'newRun';
    else if (carrier() === t) drag.carried = { dx: state.ball.x - t.x, dy: state.ball.y - t.y };
  } else if (hit.kind === 'bend' || hit.kind === 'runEnd') {
    state.selected = t.id;
    drag.dx = t.run.x - pt.x; drag.dy = t.run.y - pt.y;
  }
  canvas.setPointerCapture(ev.pointerId);
  canvas.style.cursor = 'grabbing';
  requestRender();
});

canvas.addEventListener('pointermove', (ev) => {
  const pt = pointerPitch(ev);
  if (DEBUG) debugPointer = toScreen(pt.x, pt.y);
  if (!drag || ev.pointerId !== drag.pointerId) {
    if (ev.pointerType === 'mouse' && !anim) canvas.style.cursor = hitTest(pt) ? 'grab' : 'default';
    if (DEBUG) requestRender();
    return;
  }
  const t = drag.target;
  switch (drag.kind) {
    case 'player': case 'ball':
      t.x = pt.x + drag.dx;
      t.y = pt.y + drag.dy;
      clampToPitch(t);
      if (drag.carried) {
        state.ball.x = t.x + drag.carried.dx;
        state.ball.y = t.y + drag.carried.dy;
        clampToPitch(state.ball);
      }
      break;
    case 'newRun': {
      // Only becomes a run once the pointer has clearly left the player.
      if (!drag.moved && dist(pt, drag.start) < 1.5) break;
      drag.moved = true;
      const end = { x: pt.x, y: pt.y };
      clampToPitch(end);
      t.run = { x: end.x, y: end.y, bend: 0 };
      break;
    }
    case 'runEnd': {
      const end = { x: pt.x + drag.dx, y: pt.y + drag.dy };
      clampToPitch(end);
      t.run.x = end.x; t.run.y = end.y;
      break;
    }
    case 'bend':
      t.run.bend = bendFromHandle(runGeom(t, t.run), pt);
      break;
  }
  requestRender();
});

function endDrag(ev) {
  if (!drag || ev.pointerId !== drag.pointerId) return;
  // Runs too short to read as movement are dropped.
  if ((drag.kind === 'newRun' || drag.kind === 'runEnd') && drag.target.run && dist(drag.target, drag.target.run) < 2) {
    drag.target.run = null;
  }
  drag = null;
  canvas.style.cursor = ev.pointerType === 'mouse' && hitTest(pointerPitch(ev)) ? 'grab' : 'default';
  requestRender();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ================================================================
   Play
   All runs animate together over 2.2 s with an ease-in-out, each along
   its own Bézier. A carrier with a run dribbles: the ball keeps its
   offset from their feet. Analysis recomputes every frame.
   ================================================================ */
const PLAY_MS = 2200;
let anim = null;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function play() {
  if (anim || state.match) return;
  const movers = state.players.filter((p) => p.run && visible(p));
  if (!movers.length) { toast('Nothing to play yet: draw a run first'); return; }
  const holder = carrier();
  anim = {
    t0: performance.now(),
    dur: PLAY_MS,
    starts: new Map(movers.map((p) => [p, { x: p.x, y: p.y }])),
    geoms: new Map(movers.map((p) => [p, runGeom(p, p.run)])),
    dribble: holder && holder.run ? { p: holder, dx: state.ball.x - holder.x, dy: state.ball.y - holder.y } : null,
  };
  requestAnimationFrame(tick);
}

function tick(now) {
  if (!anim) return;
  const raw = clamp((now - anim.t0) / anim.dur, 0, 1);
  const e = easeInOut(raw);
  for (const [p, g] of anim.geoms) Object.assign(p, bezier(g, e));
  if (anim.dribble) {
    state.ball.x = anim.dribble.p.x + anim.dribble.dx;
    state.ball.y = anim.dribble.p.y + anim.dribble.dy;
    clampToPitch(state.ball);
  }
  if (raw >= 1) finishPlay();
  else requestAnimationFrame(tick);
  requestRender();
}

function finishPlay() {
  for (const p of anim.geoms.keys()) { clampToPitch(p); p.run = null; }
  anim = null;
}

/* ================================================================
   Toolbar, toasts, shortcuts
   ================================================================ */
function setTool(tool) {
  state.tool = tool;
  for (const b of document.querySelectorAll('[data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === tool));
  requestRender();
}
for (const b of document.querySelectorAll('[data-tool]')) b.addEventListener('click', () => setTool(b.dataset.tool));
document.getElementById('play').addEventListener('click', play);

let toastTimer = 0;
function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = kind), 2600);
}

window.addEventListener('keydown', (ev) => {
  if (ev.target.closest('input, textarea, select') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === 'v') setTool('move');
  else if (k === 'r') setTool('runs');
  else if (k === ' ') { ev.preventDefault(); play(); }
  else if (k === 'c') state.coverage = { control: 'zones', zones: 'off', off: 'control' }[state.coverage];
  else if (k === 'escape') state.selected = null;
  else if (k === 'delete' || k === 'backspace') {
    const p = state.players.find((q) => q.id === state.selected);
    if (p && p.run && !anim) p.run = null;
  } else return;
  requestRender();
});

/* ================================================================
   Debug overlay (?debug): a known-coordinate marker, attack arrow,
   upright text and the pointer position in metres, to sanity-check
   the transform and its inverse.
   ================================================================ */
const DEBUG = new URLSearchParams(location.search).has('debug');
let debugPointer = null;

function drawDebug() {
  usePitchSpace();
  // Marker on the far box edge's corner: (105 - 16.5, 13.84).
  const mx = PITCH.L - PITCH.boxD, my = (PITCH.W - PITCH.boxW) / 2;
  ctx.fillStyle = '#ffcc00';
  dot(mx, my, 0.8);
  uprightAt(mx, my, () => {
    ctx.font = '600 2.2px system-ui, sans-serif';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`(${mx}, ${my})`, 1, -1);
  });

  // Attack direction arrow along the halfway line area.
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 0.5;
  line(40, 4, 65, 4);
  ctx.beginPath(); ctx.moveTo(65, 4); ctx.lineTo(62, 2.5); ctx.lineTo(62, 5.5); ctx.closePath(); ctx.fill();
  uprightAt(52.5, 7.5, () => {
    ctx.font = '600 2px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WE ATTACK', 0, 0);
  });

  if (debugPointer) {
    const p = toPitch(debugPointer.x, debugPointer.y);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`x ${p.x.toFixed(2)}  y ${p.y.toFixed(2)}  s ${view.s.toFixed(2)}px/m  ${view.portrait ? 'portrait' : 'landscape'}`, 10, 20);
  }
}

/* ================================================================
   Readout (minimal, replaced by the panel later)
   ================================================================ */
const readoutEl = document.getElementById('readout');
function updateReadout() {
  const fmtShape = (s) => (s ? `${s.width.toFixed(0)}w × ${s.depth.toFixed(0)}d m, ${s.area.toFixed(0)} m²` : '—');
  const laneSummary = (lanes) => {
    const open = lanes.filter((l) => !l.blocker);
    const best = open.reduce((b, l) => (l.breaks > (b?.breaks ?? 0) ? l : b), null);
    return `${open.length}/${lanes.length} lanes open` + (best ? `, best +${best.breaks} to #${best.to.num}` : '');
  };
  const c = A.carrier, sel = A.selected;
  const lines = [
    `Space controlled — Home ${(A.homeShare * 100).toFixed(1)}%  ·  Away ${((1 - A.homeShare) * 100).toFixed(1)}%`,
    `Possession ${state.possession}` + (c ? ` — #${c.num} ${c.role}: ${laneSummary(A.lanes)}` : ' — ball loose'),
    `Offside line x = ${A.offsideX.toFixed(1)} m` + (A.offside.length ? ` (offside: ${A.offside.map((p) => '#' + p.num).join(', ')})` : ''),
    `Shape home ${fmtShape(A.shape.home)}`,
    `Shape away ${fmtShape(A.shape.away)}`,
    sel ? `Selected ${sel.team} #${sel.num} ${sel.role} — zone ${A.zones.get(sel.id).area.toFixed(0)} m²` +
      (sel !== c ? `, ${laneSummary(A.selLanes)}` : '') : 'Tap a player to select',
  ];
  readoutEl.textContent = lines.join('\n');
}

/* ================================================================
   Render loop (on demand) and resize
   ================================================================ */
let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    analyse();
    drawPitch();
    if (state.coverage === 'control') drawControl();
    else if (state.coverage === 'zones') drawZones();
    if (state.layers.shape) drawShape();
    if (state.layers.offside) drawOffside();
    if (state.layers.lanes) { drawLanes(A.selLanes, true); drawLanes(A.lanes, false); }
    drawRuns();
    if (DEBUG) drawDebug();
    drawPlayers();
    updateReadout();
  });
}

readTokens();
setupMatch('4-3-3', '4-4-2');


new ResizeObserver(() => { layout(); requestRender(); }).observe(canvas);
// A devicePixelRatio change (moving between screens) doesn't always resize the element,
// so watch the current ratio and re-arm the query each time it changes.
function watchDpr() {
  matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
    .addEventListener('change', () => { layout(); requestRender(); watchDpr(); }, { once: true });
}
watchDpr();
</script>
</body>
