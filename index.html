<title>Tactics Lab</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a full-bleed floodlit pitch; a slim top bar with the five modes,
     one thumb-reach action bar at the bottom, and a side drawer (a bottom
     sheet on phones) for everything you set. One visual world, a night
     match, so a single dark palette on purpose. */
  :root {
    --night: #0a1511;          /* stand shadow around the pitch */
    --surface: #111f1a;        /* top bar, drawer, cards */
    --surface-2: #1a2c25;      /* raised controls */
    --line-soft: rgba(226, 240, 232, 0.12);
    --chalk: #eef5f0;          /* primary text: touchline chalk */
    --muted: #93a89e;
    --armband: #f5b83d;        /* accent: captain's armband */
    --armband-ink: #1c1405;
    --good: #4ade80;
    --bad: #fb7185;
    /* canvas tokens (read by the renderer) */
    --surround: #0a1511;
    --flood: #1d3a2c;
    --grass: #2f7a3f;
    --line: rgba(255, 255, 255, 0.9);
    --goal: rgba(255, 255, 255, 0.95);
    --home: #2f6fed;
    --away: #e2334f;
    --select: #f5b83d;
    --offside: #fde047;
    --blocked: #fb7185;
    --badge: #f5b83d;
    --homeRun: #bfd4ff;
    --awayRun: #ffc9d2;
    --display: 'Big Shoulders Display', 'Oswald', 'Arial Narrow', sans-serif-condensed, Impact, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --r: 10px;
    --drawer-w: 360px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--chalk); font: 15px/1.45 var(--body); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--armband); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { margin: 0; }

  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

  /* ---------- Top bar: wordmark, mode switch ---------- */
  #topbar { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
    background: var(--surface); border-bottom: 1px solid var(--line-soft); z-index: 6; min-width: 0; }
  .wordmark { font: 900 22px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .wordmark span { color: var(--armband); }
  .modes { display: inline-flex; background: var(--night); border-radius: 999px; padding: 3px; margin-inline: auto; min-width: 0; }
  .modes button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font: 800 15px var(--display);
    letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .modes button[aria-pressed="true"] { background: var(--armband); color: var(--armband-ink); }
  .iconbtn { border: 1px solid var(--line-soft); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-weight: 600; white-space: nowrap; }
  @media (max-width: 720px) { .wordmark { display: none; } .modes { margin-inline: 0; } }
  @media (max-width: 520px) { #topbar { gap: 4px; padding-inline: 6px; } .modes { padding: 2px; } .modes button { padding: 6px 6px; font-size: 12.5px; letter-spacing: .02em; }
    .iconbtn { padding: 6px 8px; font-size: 13px; } .iconbtn .long { display: none; } }
  @media (min-width: 521px) { .iconbtn .short { display: none; } }

  /* ---------- Stage ---------- */
  #main { position: relative; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1; min-width: 0; }
  #board { position: absolute; top: 0; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); }
  #stage.with-timeline #board { bottom: calc(env(safe-area-inset-bottom, 0px) + 124px); }
  #pitch { display: block; width: 100%; height: 100%; touch-action: none; }

  /* Bottom bars (one per mode) */
  .bar { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; padding: 6px; background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: calc(100% - 24px); z-index: 3; }
  .bar button { border: 0; background: transparent; padding: 10px 14px; border-radius: 10px; font: 800 17px/1 var(--display);
    letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: var(--chalk); }
  .bar button[aria-pressed="true"] { background: var(--surface-2); color: var(--armband); }
  .bar .sep { width: 1px; align-self: stretch; background: var(--line-soft); margin: 4px 2px; }
  .bar .go { background: var(--armband); color: var(--armband-ink); padding: 12px 24px; font-size: 21px; }
  .bar .go:disabled, .bar button:disabled { opacity: .45; cursor: default; }
  .bar .ghost { color: var(--muted); }
  @media (max-width: 480px) { .bar { gap: 2px; padding: 5px; } .bar button { padding: 10px 8px; font-size: 16px; } .bar .go { padding: 12px 16px; } .bar .wide { display: none; }
    .tabs button { font-size: 14px; letter-spacing: .04em; } }

  /* Replay timeline, above the bar */
  #timeline { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); z-index: 3;
    width: min(620px, calc(100% - 24px)); display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line-soft); }
  #timeline button { border: 0; background: var(--surface-2); border-radius: 8px; width: 34px; height: 30px; flex: none; font-weight: 700; }
  #tl-track { position: relative; flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; }
  #tl-range { width: 100%; accent-color: var(--armband); margin: 0; }
  #tl-marks { position: absolute; inset: 0; pointer-events: none; }
  #tl-marks button { position: absolute; top: -2px; width: 12px; height: 12px; padding: 0; border-radius: 50%; transform: translateX(-50%);
    pointer-events: auto; border: 2px solid var(--night); background: var(--armband); }
  #tl-marks button.bad { background: var(--bad); } #tl-marks button.good { background: var(--good); }
  #tl-time { font: 600 13px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: right; }

  #toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); transform: translateX(-50%);
    padding: 10px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-soft); font-weight: 600;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 24px); text-align: center; z-index: 5; }
  #toast.show { opacity: 1; }
  #stage.with-timeline #toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 136px); }
  #toast.good { border-color: var(--good); color: var(--good); }
  #toast.bad { border-color: var(--bad); color: var(--bad); }

  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 4; }
  #flash.goal { background: radial-gradient(circle, transparent 35%, rgba(245,184,61,.5)); animation: flash .9s ease-out; }
  #flash.against { background: radial-gradient(circle, transparent 35%, rgba(226,51,79,.55)); animation: flash .9s ease-out; }
  #flash.win { background: radial-gradient(circle, transparent 35%, rgba(74,222,128,.4)); animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  #ticker { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 3; max-width: calc(100% - 24px);
    padding: 8px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-soft);
    font: 800 18px/1.15 var(--display); letter-spacing: .03em; text-transform: uppercase; text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  #ticker.show { opacity: 1; }
  #ticker.win { color: var(--good); } #ticker.goal { color: var(--armband); } #ticker.shot { color: var(--bad); } #ticker.focus { color: var(--armband); }
  #scorebug { position: absolute; left: 12px; top: 12px; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line-soft); font: 800 20px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  #scorebug .sc { font-size: 26px; font-variant-numeric: tabular-nums; }
  #scorebug .min { color: var(--muted); font-size: 16px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .dot.home { background: var(--home); } .dot.away { background: var(--away); }

  /* ---------- Controls ---------- */
  .seg { display: inline-flex; border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 7px 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line-soft); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--armband); box-shadow: inset 0 -2px 0 var(--armband); }
  .seg.full { display: flex; width: 100%; } .seg.full button { flex: 1 1 0; min-width: 0; padding: 7px 4px; overflow: hidden; text-overflow: ellipsis; }
  .btn { border: 1px solid var(--line-soft); background: var(--surface-2); border-radius: 10px; padding: 8px 13px; font-weight: 600; }
  .btn.primary { background: var(--armband); border-color: var(--armband); color: var(--armband-ink); font: 800 18px/1 var(--display);
    letter-spacing: .06em; text-transform: uppercase; padding: 11px 18px; }
  .btn.small { padding: 5px 9px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { border: 0; background: none; padding: 0; color: var(--armband); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Drawers ---------- */
  #panel, #side { width: var(--drawer-w); flex: none; background: var(--surface); border-left: 1px solid var(--line-soft); z-index: 5; }
  #panel { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); min-height: 0; }
  #side { overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: grid; gap: 18px; align-content: start; grid-template-columns: minmax(0, 1fr); }
  #side section { display: grid; gap: 10px; min-width: 0; }
  #side h2 { font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #side h3 { font: 800 18px/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line-soft); }
  .tabs button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; padding: 8px 2px 10px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font: 800 15px var(--display);
    letter-spacing: .08em; text-transform: uppercase; border-bottom: 3px solid transparent; }
  .tabs button[aria-selected="true"], .tabs button[aria-pressed="true"] { color: var(--chalk); border-bottom-color: var(--armband); }
  .tabs.inline { padding: 0; }
  .tabpanes { overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .pane { display: grid; gap: 14px; }
  .pane h3 { font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .group { display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > label { display: flex; gap: 6px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  select, input[type=text], textarea { background: var(--night); border: 1px solid var(--line-soft); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  select.full { width: 100%; font-weight: 600; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  dl.stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
  dl.stats dt { color: var(--muted); }
  dl.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  ul.plain li { display: flex; gap: 6px; align-items: center; }
  kbd { display: inline-block; min-width: 1.7em; text-align: center; padding: 1px 5px; border: 1px solid var(--line-soft);
    border-bottom-width: 2px; border-radius: 5px; font: 12px ui-monospace, monospace; }
  .card { background: var(--night); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; min-width: 0; }
  .card.blue { box-shadow: inset 3px 0 0 var(--home); } .card.red { box-shadow: inset 3px 0 0 var(--away); }
  .card.bad { box-shadow: inset 3px 0 0 var(--bad); } .card.good { box-shadow: inset 3px 0 0 var(--good); } .card.gold { box-shadow: inset 3px 0 0 var(--armband); }
  details.card > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  details.card > summary::after { content: 'Show'; font-size: 13px; color: var(--muted); flex: none; }
  details.card[open] > summary::after { content: 'Hide'; }
  details.card > summary::-webkit-details-marker { display: none; }
  .irow { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .irow .seg { width: 100%; display: flex; } .irow .seg button { flex: 1 1 0; min-width: 0; padding: 7px 3px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .irow .lbl { display: flex; justify-content: space-between; gap: 8px; }
  .callout { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .callout b { color: var(--armband); }

  /* Results */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { display: grid; gap: 2px; padding: 10px; border-radius: var(--r); background: var(--night); align-content: start; }
  .tile .k { font-size: 12px; color: var(--muted); line-height: 1.2; min-height: 2.4em; }
  .tile .v { font: 900 30px/1 var(--display); font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 11px; color: var(--muted); }
  .delta { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.noise { color: var(--muted); font-weight: 500; }
  .progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--armband); }
  .fixes { display: flex; flex-wrap: wrap; gap: 6px; }
  .legend { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .lg { display: inline-block; width: 10px; height: 10px; }
  .lg.shot { border: 2px solid var(--home); border-radius: 50%; } .lg.shotag { border: 2px solid var(--away); border-radius: 50%; }
  .lg.won { background: linear-gradient(45deg, transparent 42%, var(--good) 42% 58%, transparent 58%), linear-gradient(-45deg, transparent 42%, var(--good) 42% 58%, transparent 58%); }
  .moment { text-align: left; border: 0; background: var(--night); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 4px; }
  .moment .top { display: flex; gap: 8px; align-items: baseline; }
  .moment .t { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .moment b { font: 800 16px var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .moment.good b { color: var(--good); } .moment.bad b { color: var(--bad); }
  .moment[aria-pressed="true"] { outline: 2px solid var(--armband); }
  .moment .why { font-size: 13px; color: var(--muted); }
  ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  ol.log li { display: grid; grid-template-columns: 3.2em 1fr; gap: 6px; }
  ol.log .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  ol.log .home { color: #b9ccff; } ol.log .away { color: #ffc2cc; }
  ol.log .goal { color: var(--armband); font-weight: 700; } ol.log .shot { font-weight: 600; } ol.log .milestone, ol.log .run { color: var(--muted); }

  /* Tactics */
  .styles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .styles button { text-align: left; border: 1px solid var(--line-soft); background: var(--night); border-radius: 10px; padding: 8px 10px; display: grid; gap: 1px; }
  .styles button b { font: 800 15px/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .styles button span { font-size: 12px; color: var(--muted); }
  .styles button[aria-pressed="true"] { border-color: var(--armband); box-shadow: inset 0 0 0 1px var(--armband); }
  .attrs { display: grid; gap: 4px; }
  .attr { display: grid; grid-template-columns: 8.2em 1fr 2em auto; gap: 8px; align-items: center; font-size: 13px; }
  .attr .bar2 { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .attr .bar2 i { display: block; height: 100%; }
  .attr .val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .attr .step { display: inline-flex; gap: 2px; }
  .attr .step button { border: 1px solid var(--line-soft); background: var(--surface-2); border-radius: 6px; width: 24px; height: 22px; padding: 0; line-height: 1; }
  .squad { display: grid; gap: 2px; }
  .squad button { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; }
  .squad button:hover { background: var(--surface-2); }
  .squad button[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--armband); }
  .squad .n { font: 800 16px var(--display); color: var(--muted); }
  .squad .r { font-size: 12px; color: var(--muted); }
  .warn { color: var(--armband); font-size: 13px; }

  /* Lessons */
  .lessons { display: grid; gap: 8px; }
  .lessons button { text-align: left; border: 0; background: var(--night); border-radius: var(--r); padding: 12px; display: grid; gap: 4px; }
  .lessons b { font: 800 18px var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .stars { color: var(--armband); letter-spacing: .1em; font-size: 15px; }
  .stars .off { color: var(--surface-2); }
  .goal { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
  .goal .mk { width: 1.2em; flex: none; font-weight: 700; }
  .goal.met .mk { color: var(--good); } .goal.miss .mk { color: var(--muted); }

  /* Match */
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: var(--night); border-radius: var(--r); padding: 12px; }
  .scoreboard .tm { font: 800 17px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .scoreboard .tm.r { text-align: right; }
  .scoreboard .sc { font: 900 40px/1 var(--display); font-variant-numeric: tabular-nums; }
  .feed { display: grid; gap: 6px; }
  .feed .it { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 8px; align-items: center; background: var(--night); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .feed .it .m { font: 800 16px var(--display); color: var(--muted); }
  .feed .it.goal { box-shadow: inset 3px 0 0 var(--armband); } .feed .it.goal .txt { font-weight: 700; }
  .feed .it .sit { display: block; font-size: 12px; color: var(--muted); }
  .feed .it[aria-current="true"] { outline: 2px solid var(--armband); }
  table.mstats { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.mstats td { padding: 5px 0; border-bottom: 1px solid var(--line-soft); }
  table.mstats td:first-child, table.mstats td:last-child { width: 3.5em; font-weight: 700; }
  table.mstats td:last-child { text-align: right; } table.mstats td:nth-child(2) { text-align: center; color: var(--muted); }

  /* Narrow screens: the drawers become bottom sheets over the pitch. */
  @media (max-width: 899px), (orientation: portrait) {
    #panel, #side { position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 72%; border-left: 0; border-top: 1px solid var(--line-soft);
      border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.5); }
    .tile .v { font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) { #flash, #ticker { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header id="topbar">
    <div class="wordmark">Tactics <span>Lab</span></div>
    <nav class="modes" aria-label="Mode">
      <button data-mode="tactics" aria-pressed="false">Tactics</button>
      <button data-mode="lab" aria-pressed="true">Lab</button>
      <button data-mode="lessons" aria-pressed="false">Lessons</button>
      <button data-mode="match" aria-pressed="false">Match</button>
      <button data-mode="board" aria-pressed="false">Board</button>
    </nav>
    <button class="iconbtn" id="panel-open" aria-expanded="false">Panel</button>
  </header>
  <div id="main">
    <main id="stage">
      <div id="board"><canvas id="pitch" aria-label="Tactics board"></canvas></div>
      <div id="ticker" aria-live="polite"></div>
      <div id="scorebug" hidden></div>
      <div id="flash"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="timeline" hidden>

              <li><kbd>Space</kbd> Play <kbd>B</kbd> Back to base <kbd>L</kbd> View</li>

              <button class="btn primary" id="scenario-build">Build</button>
              <button class="btn" id="scenario-cancel" hidden>Cancel</button>
              <button class="btn" id="scenario-example">Load example</button>

            <form class="row" id="save-form">
              <input type="text" id="save-name" class="grow" placeholder="Name this setup" maxlength="40" aria-label="Setup name">
              <button class="btn primary">Save</button>
