// --- Tap a red lane to cut it ---------------------------------------------
// Finds the open lane under the pointer and sends the defender who can reach
// it with the shortest move. Ground passes are cut anywhere on the line;
// long lofted balls can only be won near the landing spot.
function laneAt(pt) {
  const T = A.threats, b = state.ball;
  if (!T) return null;
  const tol = Math.max(1.6, 18 / view.s);
  let best = null, bd = tol;
  for (const p of T.passes) {
    if (!p.open) continue;
    const len = dist(b, p.to), ux = (p.to.x - b.x) / len, uy = (p.to.y - b.y) / len;
    const t = clamp((pt.x - b.x) * ux + (pt.y - b.y) * uy, 0, len);
    const d = Math.hypot(pt.x - (b.x + ux * t), pt.y - (b.y + uy * t));
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
function cutLane(p) {
  const m = state.match, R = RING[m.difficulty], b = state.ball, to = p.to;
  const len = dist(b, to), ux = (to.x - b.x) / len, uy = (to.y - b.y) / len;
  const threatScore = () => { const T = computeThreats(); return T ? T.open * 10 + (T.shotOn ? 6 : 0) : 0; };
  let best = null;
  for (const q of homeSide()) {
    const s = m.starts.get(q.id);
    const t = len > LOFT_OVER ? len - 2 : clamp((s.x - b.x) * ux + (s.y - b.y) * uy, BALL_KEEPOUT + 0.4, len - 1.2);
    const target = { x: b.x + ux * t, y: b.y + uy * t };
    const d = dist(s, target);
    if (d > R) continue;
    // Try the move and score the whole picture, so covering this lane
    // doesn't quietly open another one.
    const was = { x: q.x, y: q.y };
    q.x = target.x; q.y = target.y;
    const score = threatScore() + d * 0.02 + (q.unit === 'G' ? 3 : 0);
    q.x = was.x; q.y = was.y;
    if (!best || score < best.score) best = { q, target, score };
  }
  if (!best) { toast('Nobody can reach that lane from where they started. Drag a player closer first.'); return; }
  moveTo(best.q, best.target);
}

// Short slide for tap-to-cut moves.
const tweens = [];
function moveTo(p, to) {
  tweens.push({ p, from: { x: p.x, y: p.y }, to, t0: performance.now(), dur: 260 });
  requestRender();
}
function stepTweens() {
  const now = performance.now();
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i], k = clamp((now - tw.t0) / tw.dur, 0, 1), e = 1 - (1 - k) ** 3;
    tw.p.x = tw.from.x + (tw.to.x - tw.from.x) * e;
    tw.p.y = tw.from.y + (tw.to.y - tw.from.y) * e;
    if (k >= 1) { if (state.match) constrainDefender(tw.p); tweens.splice(i, 1); }
  }
  if (tweens.length) requestRender();
}

/* ================================================================
   Match play: model opponent and debrief
   The model sees exactly what the engine will use, with the resolution
   rules written from the same constants, so its stated reasoning and
   the outcome agree. Anything unusable falls back to the heuristic.
   ================================================================ */
let aiOff = false;           // set when no route to a model exists; retried each new match
let noModelShown = false;
function noModelNotice() {
  if (noModelShown) return;
  noModelShown = true;
  toast('No model connected: you’re playing the built-in opponent');
}
const f1 = (v) => v.toFixed(1);
const rulesText = () => `Resolution rules (the board's engine applies exactly these):
- Your committed runs happen first; the defenders do NOT move after locking in. Only a run's end point matters for the outcome.
- The ball carrier does not make a run; they pass, dribble or shoot.
- PASS to a teammate at their run end (or current position if they don't run). A pass of ${LOFT_OVER} m or less is intercepted if any defender whose projection falls on the straight line from the ball to that end point is within 1.0 + 0.045 × pass length metres of the line. A pass longer than ${LOFT_OVER} m is lofted: nobody can intercept it in flight, but it is lost if any defender is within ${LOFT_LOSE_R} m of the landing point.
- OFFSIDE: a pass to a player who was beyond the offside line (x smaller than the line, since you attack towards x = 0) at the START of the phase is offside and you lose the ball.
- DRIBBLE up to ${DRIBBLE_CAP} m from the ball: lost if any defender is within ${DRIBBLE_TACKLE} m of the straight path.
- SHOOT: five lanes run from the ball to x = 0 at y = ${GOAL_LANES.join(', ')}. A lane is blocked by an outfield defender within ${SHOT_BLOCK} m of it (projection on the lane). On the clearest open lane the keeper saves if he is within 1.2 + 0.07 × shot length metres of it. Otherwise it scores with probability clamp(1.1 − distance to goal centre / 25, 0.1, 0.9). If every lane is blocked the shot is blocked.
- You lose on any turnover, block, save, miss or offside, or if the last phase ends without reaching the target. You win by scoring or ending a phase with the ball in the target area.`;

function matchPrompt() {
  const m = state.match, holder = carrier(), ball = state.ball;
  const home = homeSide(), away = awaySide();
  const line = (p) => `#${p.num} ${p.role} (${f1(p.x)}, ${f1(p.y)})`;
  const options = away.filter((r) => r !== holder).map((r) => {
    const end = plannedAt(r), o = resolvePass('away', { ...ball, id: holder.id }, end, r, plannedAt);
    const off = m.offsideAtStart.has(r.id);
    const status = off ? 'OFFSIDE (was beyond the line at phase start)' : o.result === 'complete' ? 'open right now' : o.result === 'intercepted' ? `cut out by your opponent's #${o.winner.num}` : `lofted, lost to #${o.winner.num}`;
    return `  to #${r.num} at (${f1(end.x)}, ${f1(end.y)}): ${f1(dist(ball, end))} m, breaks ${linesBroken(ball, end, 'away')} line(s), ${status}`;
  }).join('\n');
  const nearest = away.map((p) => {
    const d = home.reduce((b, h) => (dist(h, p) < dist(b, p) ? h : b));
    return `  #${p.num}: nearest defender #${d.num} at ${f1(dist(d, p))} m`;
  }).join('\n');
  const shot = evaluateShot(ball);
  const shotText = shot.best
    ? `${shot.lanes.filter((l) => !l.blocker).length} of 5 lanes open; on the clearest lane the keeper ${shot.saved ? 'WOULD save' : `would not reach it; scoring chance ${Math.round(shot.odds * 100)}%`}; distance ${f1(shot.d)} m`
    : 'all five lanes blocked';
  const log = m.log.length ? m.log.map((e) => `  Phase ${e.phase}: ${e.action}. ${e.outcome}`).join('\n') : '  (first phase)';
  return `You are the attacking side in a turn-based football tactics game. You control the AWAY team (red), attacking towards x = 0. The user controls the HOME team (blue) and defends.

${COORDS_TEXT()}

${rulesText()}

Situation: ${m.setup.name}. You win if you ${WIN_TEXT[m.win]}. This is phase ${m.phase} of ${m.total}.

Ball at (${f1(ball.x)}, ${f1(ball.y)}), carried by your #${holder.num}.
Your players (away): ${away.map(line).join('; ')}.
Defenders (home): ${home.map(line).join('; ')}.
Offside line at the start of this phase: x = ${f1(m.offsideLineAtStart)}. Offside right now: ${[...m.offsideAtStart].map((id) => '#' + state.players.find((p) => p.id === id).num).join(', ') || 'nobody'}.
Passes from the carrier to where each player will be after the committed runs:
${options}
Nearest defender to each of your players:
${nearest}
Shot from here right now: ${shotText}.
Previous phases:
${log}

Your runs this phase are already committed and the user can see them: ${[...(m.planned || [])].map(([id, e]) => `#${state.players.find((p) => p.id === id).num} runs to (${f1(e.x)}, ${f1(e.y)})`).join('; ') || 'none'}. Passes to those players go to their run end.
Choose the action for this phase. Find the weakness in the user's defensive shape and exploit it, checking your action against the rules above.
Reply with JSON only:
{"thinking": "one or two sentences to the user, in the second person, naming the gap in their shape (e.g. 'Your #8 has stepped out, so the lane to our #10 is open.')", "action": {"type": "pass", "to": 9}}
action is one of {"type": "pass", "to": <shirt number>}, {"type": "dribble", "x": <end x>, "y": <end y>} or {"type": "shoot"}.`;
}

async function withTimeout(ms, fn) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { return await fn(c.signal); } finally { clearTimeout(t); }
}

getOpponentPlan = async () => {
  const m = state.match;
  if (aiOff) return null;
  try {
    const raw = await withTimeout(90000, (signal) => askClaude(matchPrompt(), { json: true, signal, maxTokens: 4000 }));
    const plan = sanitizePlan(raw);
    if (plan) m.source = 'model';
    return plan;
  } catch (err) {
    if (err.unavailable) aiOff = true;
    if (!err.unavailable) toast('The model’s move was unusable: using the built-in opponent');
    else noModelNotice();
    return null;
  }
};

// Ask the model for a match setup; the preset's built-in one is the fallback.
function setupPrompt(description) {
  return `You set up a turn-based football defending exercise. The AWAY team attacks towards x = 0; the user's HOME team defends.

${COORDS_TEXT()}

Create a starting position for this situation: ${description}
Give all 22 positions, with the ball at the feet of an away player, no home player within 2 m of the ball, and players at least 2 m apart. Choose a win condition for the attackers: "half" (get the ball into the home half, x < 52.5), "final3" (x < 35), "box" (into the home penalty area) or "score", and a number of phases from 3 to 5 that makes it a fair challenge.
Reply with JSON only:
{"name": "short title", "desc": "one sentence for the defender", "win": "box", "phases": 4, "homeFormation": "4-4-2", "awayFormation": "4-3-3", "ball": {"x": 0, "y": 0}, "home": [{"num": 1, "x": 0, "y": 0}], "away": [{"num": 1, "x": 0, "y": 0}]}
Each of "home" and "away" must list all 11 players.`;
}

function validateSetup(raw, fallback) {
  const s = validateScenario({ ...raw, pass: null });
  if (!s) return null;
  const win = ['half', 'final3', 'box', 'score'].includes(raw.win) ? raw.win : fallback?.win || 'box';
  const phases = clamp(Math.round(num(raw.phases)) || fallback?.phases || 4, 3, 5);
  const P2 = (q) => P(q.num, q.x, q.y);
  return {
    name: str(raw.name, 60) || fallback?.name || 'Custom', desc: str(raw.desc, 200) || fallback?.desc || '', win, phases,
    homeFormation: s.homeFormation, awayFormation: s.awayFormation, ball: s.ball, home: s.home.map(P2), away: s.away.map(P2),
  };
}

async function startFromModel(description, fallback) {
  if (anim || matchBusy) return;
  aiOff = false;
  matchBusy = true;
  renderMatchUI();
  let setup = null;
  try {
    const raw = await withTimeout(90000, (signal) => askClaude(setupPrompt(description), { json: true, signal, maxTokens: 8000 }));
    setup = validateSetup(raw, fallback);
    if (!setup) throw new AIError('The model’s setup was unusable.');
  } catch (err) {
    if (err.unavailable) aiOff = true;
    if (!fallback) { matchBusy = false; matchNote = err.message; renderMatchUI(); return; }
    if (err.unavailable) noModelNotice(); else toast('Model setup unusable: using the built-in setup');
  }
  matchBusy = false;
  matchNote = '';
  startMatch(setup || fallback, matchDifficulty);
  // Nobody may start inside the ball's keep-out.
  for (const p of homeSide()) if (dist(p, state.ball) < BALL_KEEPOUT) { state.match.starts.set(p.id, { x: p.x, y: p.y }); constrainDefender(p); }
  beginPhase();
  renderMatchUI();
  requestRender();
}

requestDebrief = async () => {
  const m = state.match;
  if (!m || m.debriefing) return;
  m.debriefing = true;
  m.debrief = 'Writing the debrief…';
  renderMatchUI();
  const prompt = `You are a football coach giving a short debrief to a player who has just defended in a turn-based tactics exercise (they controlled the HOME team; the AWAY team attacked towards x = 0).

${COORDS_TEXT()}

Exercise: ${m.setup.name}. ${m.setup.desc} The attackers had ${m.total} phases to ${WIN_TEXT[m.win]}.
Result: ${m.result.you ? 'the defender won' : 'the attackers won'}: ${m.result.reason}
Phase log:
${m.log.map((e) => `Phase ${e.phase}: attackers' read: "${e.thinking}" Action: ${e.action}. Outcome: ${e.outcome}`).join('\n')}
Final positions: defenders ${homeSide().map((p) => `#${p.num} (${f1(p.x)}, ${f1(p.y)})`).join(', ')}.

Write exactly three short paragraphs of plain text, no markdown, no headings, no lists: what happened, what the defender did well or badly with specific shirt numbers, and one concrete thing to try next time.`;
  try {
    const text = await withTimeout(90000, (signal) => askClaude(prompt, { signal, maxTokens: 2000, onText: (_, all) => { m.debrief = all; renderMatchUI(); } }));
    // Plain text was asked for; strip any markdown that slipped through, keeping shirt numbers like #6.
    m.debrief = text.replace(/^\s{0,3}#{1,6}\s+/gm, '').replace(/(\*\*|__|`)/g, '').replace(/^\s*[-*>]\s+/gm, '').trim();
  } catch (err) {
    m.debrief = err.unavailable ? `The debrief needs the model. ${err.message}` : `Couldn’t write a debrief: ${err.message}`;
  }
  m.debriefing = false;
  renderMatchUI();
  renderResult();
};

/* ================================================================
   Simulation lab: engine
   A continuous, time-based simulation of one attacking move, so a coach
   can set a situation and instructions, watch it, run it many times and
   compare. Everything is judged in seconds, not metres:
   • players accelerate to a sprint of 7.5 m/s (keeper 6) after a
     0.25 s reaction; off the ball they jog unless pressing, tracking a
     runner or making a run;
   • a ground pass leaves at ~15 m/s, a lofted ball at ~17 m/s plus hang
     time, and a point on its path is lost if a defender can get there
     before the ball does (the carrier estimates exactly this when it
     chooses a pass);
   • lofted balls must go forward and backward passes must be short
     recycles, so the carrier chooses passes a player would choose:
     likelihood of arrival × danger of the receiving spot, against the
     cost of losing it there;
   • the defending block (line height, pressing zone, width) shifts with
     the ball; the nearest defender presses, one covers, and defenders
     pick up runners who go beyond the line;
   • attackers hold width, offer support angles and make runs in behind
     timed to stay onside.
   Every run has its own random seed, so 50 runs give a spread of
   outcomes rather than one fixed answer.
   ================================================================ */
const SIM = {
  DT: 0.1, MAX_T: 12, SPRINT: 7.5, GK_SPRINT: 6, JOG: 4.5, ACCEL: 6, REACT: 0.25,
  DRIBBLE_V: 5.5, GROUND_V: 15, LOFT_V: 17, GROUND_MAX: 32, LOFT_MAX: 50, RECYCLE_MAX: 22,
  CONTROL_R: 1.0, TACKLE_R: 1.1, DECIDE_EVERY: 0.3,
};
const LINE_DEPTH = { deep: 20, mid: 32, high: 44 };      // m from own goal for the back line
const PRESS_ZONE = { off: 38, mid: 62, high: 110 };        // press once the ball is this close to our goal (m)
const BLOCK_WIDTH = { narrow: 32, normal: 40, wide: 50 };  // m across the back line
const DEFAULT_INSTR = { line: 'mid', press: 'mid', width: 'normal', attWidth: 'wide', runs: 'some', tempo: 'balanced' };

// Seeded random numbers so any run can be replayed exactly.
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const sigmoid = (z) => 1 / (1 + Math.exp(-z));

// Distance "up the pitch" for a team: 0 at its own goal line, 105 at the
// goal it attacks. Keeps every rule the same for both directions.
const depthOf = (team, x) => (team === 'home' ? x : PITCH.L - x);
const xAtDepth = (team, u) => (team === 'home' ? u : PITCH.L - u);
const oppOf = (team) => (team === 'home' ? 'away' : 'home');

// How dangerous a spot is for the team attacking from it: roughly the
// chance a move ends in a goal from there (an expected-threat style
// surface: ~0.4 on the penalty spot, ~0.1 at 30 m, ~0.01 at halfway).
function threatAt(team, p) {
  const u = depthOf(team, p.x), dg = Math.hypot(PITCH.L - u, p.y - PITCH.W / 2);
  const central = 1 - Math.min(1, Math.abs(p.y - PITCH.W / 2) / 40) * 0.35;
  return 0.9 * Math.exp(-dg / 14) * central;
}

// Expected goals for a shot from p: distance and the angle the goal mouth
// subtends, reduced by bodies in the way.
function shotXG(team, p, defenders) {
  const gx = team === 'home' ? PITCH.L : 0;
  // Angle between the lines to each post (dot product: no wrap-around at ±π).
  const v1 = { x: gx - p.x, y: PITCH.goalY0 - p.y }, v2 = { x: gx - p.x, y: PITCH.goalY1 - p.y };
  const angle = Math.acos(clamp((v1.x * v2.x + v1.y * v2.y) / (Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y) || 1), -1, 1));
  const d = Math.hypot(gx - p.x, PITCH.W / 2 - p.y);
  let xg = clamp(1.25 * angle * (1 - d / 45), 0, 0.85);
  const goal = { x: gx, y: PITCH.W / 2 }, len = dist(p, goal), ux = (goal.x - p.x) / len, uy = (goal.y - p.y) / len;
  for (const q of defenders) {
    const t = (q.x - p.x) * ux + (q.y - p.y) * uy;
    if (t <= 0 || t >= len) continue;
    const perp = Math.abs((q.x - p.x) * uy - (q.y - p.y) * ux);
    if (perp < 1.5) xg *= q.unit === 'G' ? 0.6 : 0.55;     // a body on the line
    else if (perp < 3) xg *= 0.85;
  }
  return xg;
}

function simCreate(opts) {
  const { players, ball, attTeam, instr, seed } = opts;
  const world = {
    t: 0, rng: rngFrom(seed), instr, attTeam, defTeam: oppOf(attTeam),
    players: players.map((p) => ({ ...p, vx: 0, vy: 0, target: { x: p.x, y: p.y }, speed: SIM.JOG, mode: 'shape', until: 0 })),
    ball: { x: ball.x, y: ball.y, state: 'held', owner: null, lift: 0 },
    nextDecide: 0.35, events: [], outcome: null, milestones: { final3: false, box: false }, frames: [],
  };
  const holder = world.players.filter((p) => p.team === attTeam).sort((a, b) => dist(a, ball) - dist(b, ball))[0];
  world.ball.owner = holder;
  world.ball.x = holder.x; world.ball.y = holder.y;
  return world;
}

const simTeam = (w, team) => w.players.filter((p) => p.team === team);
const sprintOf = (p) => (p.unit === 'G' ? SIM.GK_SPRINT : SIM.SPRINT);
const timeToReach = (p, pt) => SIM.REACT + Math.max(0, dist(p, pt) - SIM.CONTROL_R) / sprintOf(p);
function log(w, text, kind = '') { w.events.push({ t: w.t, text, kind }); }
const tag = (p) => `${p.team === 'home' ? 'Blue' : 'Red'} #${p.num}`;

// Offside line for attackers of `team`: second-last defender or the ball,
// never behind halfway (in the attackers' depth coordinate).
function simOffsideDepth(w, team) {
  const depths = simTeam(w, oppOf(team)).map((p) => depthOf(team, p.x)).sort((a, b) => b - a);
  return Math.max(depths[1] ?? 0, depthOf(team, w.ball.x), PITCH.L / 2);
}

// --- Where each player wants to be ---------------------------------------
function defendTargets(w) {
  const team = w.defTeam, ins = w.instr[team], ball = w.ball;
  const ballU = depthOf(team, ball.x);                      // how far the ball is from our goal
  const lineU = clamp(Math.min(LINE_DEPTH[ins.line], ballU - 6), 7, LINE_DEPTH[ins.line]);
  const span = ins.width === 'narrow' ? 26 : 30;
  const W = BLOCK_WIDTH[ins.width], cy = PITCH.W / 2 + (ball.y - PITCH.W / 2) * 0.55;
  const attackers = simTeam(w, w.attTeam);
  const defs = simTeam(w, team);
  const carrier = ball.state === 'held' ? ball.owner : null;
  // Pressing: nearest outfielder by time if the ball is inside our pressing zone.
  const pressOn = ballU <= PRESS_ZONE[ins.press];
  let presser = null, cover = null;
  if (carrier && pressOn) {
    const byTime = defs.filter((d) => d.unit !== 'G').sort((a, b) => timeToReach(a, carrier) - timeToReach(b, carrier));
    presser = byTime[0]; cover = ins.press === 'high' ? byTime[1] : null;
  }
  const taken = new Set();
  for (const d of defs) {
    const [su, sy] = [d.slot[0], d.slot[1]];
    if (d.unit === 'G') {
      d.target = { x: xAtDepth(team, clamp(2 + lineU * 0.12, 2, 9)), y: PITCH.W / 2 + (ball.y - PITCH.W / 2) * 0.12 };
      d.speed = SIM.JOG; d.mode = 'keeper';
      continue;
    }
    // Block position: back line at lineU, other units stacked in front of it.
    const u = lineU + clamp((su - 23) * (span / 36), 0, span);
    let tgt = { x: xAtDepth(team, u), y: clamp(cy + (sy - 34) * (W / 54), 2, PITCH.W - 2) };
    d.mode = 'shape'; d.speed = SIM.JOG;
    if (d === presser) {
      // Close down from the goal side, showing him away from goal.
      const g = { x: xAtDepth(team, 0), y: PITCH.W / 2 }, k = 1.3 / Math.max(dist(carrier, g), 1);
      tgt = { x: carrier.x + (g.x - carrier.x) * k, y: carrier.y + (g.y - carrier.y) * k };
      d.mode = 'press'; d.speed = sprintOf(d);
    } else if (d === cover) {
      // Screen the nearest forward option.
      const opt = attackers.filter((a) => a !== carrier && depthOf(w.attTeam, a.x) >= depthOf(w.attTeam, carrier.x) - 5)
        .sort((a, b) => dist(a, carrier) - dist(b, carrier))[0];
      if (opt) { tgt = { x: carrier.x + (opt.x - carrier.x) * 0.45, y: carrier.y + (opt.y - carrier.y) * 0.45 }; d.mode = 'cover'; d.speed = sprintOf(d); }
    } else {
      // Pick up anyone in or beyond our line near our zone: stay goal-side.
      let mark = null, md = 9;
      for (const a of attackers) {
        if (a === carrier || taken.has(a)) continue;
        // Defenders, or anyone with a runner level with or beyond our line,
        // look 9 m for a man; midfielders otherwise only pick up within 6 m.
        const behind = depthOf(team, a.x) < lineU + 3;
        const dd = dist(a, tgt), range = behind || d.unit === 'D' ? 9 : 6;
        if (dd < Math.min(md, range)) { md = dd; mark = a; }
      }
      if (mark) {
        taken.add(mark);
        const g = { x: xAtDepth(team, 0), y: PITCH.W / 2 }, k = 1.6 / Math.max(dist(mark, g), 1);
        const goalSide = { x: mark.x + (g.x - mark.x) * k, y: mark.y + (g.y - mark.y) * k };
        const running = mark.mode === 'run';
        const mix = running ? 0.85 : d.unit === 'D' ? 0.55 : 0.4;
        tgt = { x: tgt.x + (goalSide.x - tgt.x) * mix, y: tgt.y + (goalSide.y - tgt.y) * mix };
        if (running) { d.mode = 'track'; d.speed = sprintOf(d); }
      }
    }
    d.target = tgt;
  }
}

function attackTargets(w) {
  const team = w.attTeam, ins = w.instr[team], ball = w.ball, rng = w.rng;
  const carrier = ball.state === 'held' ? ball.owner : null;
  const ballV = depthOf(team, ball.x), offV = simOffsideDepth(w, team);
  const spread = ins.attWidth === 'wide' ? 1.12 : 0.82;
  const defs = simTeam(w, w.defTeam);
  const pressure = carrier ? Math.min(...defs.map((d) => dist(d, carrier))) : 99;
  const runRate = { few: 0.12, some: 0.3, many: 0.6 }[ins.runs];
  const mates = simTeam(w, team).filter((p) => p !== carrier);
  // Two nearest team-mates offer angles to the carrier.
  const supporters = carrier ? mates.filter((p) => p.unit !== 'G').sort((a, b) => dist(a, carrier) - dist(b, carrier)).slice(0, 2) : [];
  for (const p of mates) {
    if (p.mode === 'run' && w.t < p.until) continue;         // keep running
    if (p.mode === 'receive' && ball.state === 'flight') continue;   // keep going to the ball
    const [su, sy] = p.slot;
    if (p.unit === 'G') { p.target = { x: xAtDepth(team, 6), y: PITCH.W / 2 }; p.speed = SIM.JOG; p.mode = 'keeper'; continue; }
    // Team shape moves up with the ball; nobody drifts offside.
    let v = clamp(ballV + (su - 40) * 0.75, 4, offV - 0.8);
    let tgt = { x: xAtDepth(team, v), y: clamp(PITCH.W / 2 + (sy - 34) * spread + (ball.y - PITCH.W / 2) * 0.2, 2, PITCH.W - 2) };
    p.mode = 'shape'; p.speed = SIM.JOG;
    if (supporters.includes(p)) {
      // Best of six angles 10-14 m from the ball, away from defenders.
      let best = null, bs = -Infinity;
      for (let k = 0; k < 6; k++) {
        const ang = (k / 6) * Math.PI * 2, r = 12;
        const c = { x: clamp(carrier.x + Math.cos(ang) * r, 2, PITCH.L - 2), y: clamp(carrier.y + Math.sin(ang) * r, 2, PITCH.W - 2) };
        if (depthOf(team, c.x) > offV - 0.8) continue;
        const space = Math.min(...defs.map((d) => dist(d, c)));
        const fwd = depthOf(team, c.x) - ballV;
        const s = Math.min(space, 10) + fwd * 0.25 - dist(p, c) * 0.15;
        if (s > bs) { bs = s; best = c; }
      }
      if (best) { tgt = best; p.speed = SIM.SPRINT * 0.85; p.mode = 'support'; }
    } else if (carrier && ['A', 'AM', 'M'].includes(p.unit) && pressure > 4 && depthOf(team, p.x) > ballV - 5
      && rng() < runRate * SIM.DECIDE_EVERY && Math.abs(depthOf(team, p.x) - offV) < 12) {
      // Run in behind, starting onside, into the channel he's in.
      const endV = clamp(offV + 8 + rng() * 6, 0, PITCH.L - 4);
      tgt = { x: xAtDepth(team, endV), y: clamp(p.y + (PITCH.W / 2 - p.y) * 0.25, 4, PITCH.W - 4) };
      p.mode = 'run'; p.speed = SIM.SPRINT; p.until = w.t + 2.6;
      log(w, `${tag(p)} runs in behind`, 'run');
    }
    p.target = tgt;
  }
}

// --- The carrier's choice --------------------------------------------------
// Estimated chance a pass from `from` to `to` arrives with `rec`, judged
// by who gets to points along its path first.
function passOdds(w, from, to, rec, lofted) {
  const d = dist(from, to);
  const dur = lofted ? 0.6 + d / SIM.LOFT_V : 0.15 + d / SIM.GROUND_V;
  const defs = simTeam(w, w.defTeam);
  const fracs = lofted ? [0.9, 1] : [0.25, 0.5, 0.75, 1];
  const tRec = SIM.REACT * 0.5 + Math.max(0, dist(rec, to) - SIM.CONTROL_R) / sprintOf(rec);
  let keep = 1;
  for (const q of defs) {
    let worst = 0;
    for (const f of fracs) {
      const pt = { x: from.x + (to.x - from.x) * f, y: from.y + (to.y - from.y) * f };
      const tBall = f === 1 ? Math.max(dur, tRec) : dur * f;
      worst = Math.max(worst, sigmoid((tBall - timeToReach(q, pt)) / 0.18));
    }
    keep *= 1 - worst;
  }
  // Long passes are harder to hit.
  keep *= lofted ? 0.8 : 1 - 0.006 * Math.max(0, d - 15);
  return { p: keep, dur };
}

function carrierOptions(w, c) {
  const team = w.attTeam, ins = w.instr[team];
  const defs = simTeam(w, w.defTeam);
  const cu = depthOf(team, c.x), offV = simOffsideDepth(w, team);
  const riskAversion = { patient: 1.6, balanced: 1, direct: 0.6 }[ins.tempo];
  const loseCost = (pt) => (0.9 * Math.exp(-depthOf(team, pt.x) / 14) * 0.7 + 0.015) * riskAversion;
  const here = threatAt(team, c);
  const opts = [];
  for (const q of simTeam(w, team)) {
    if (q === c) continue;
    const lead = q.mode === 'run' ? 0.8 : 0.3;
    const to = { x: clamp(q.x + q.vx * lead, 1, PITCH.L - 1), y: clamp(q.y + q.vy * lead, 1, PITCH.W - 1) };
    const d = dist(c, to), gain = depthOf(team, to.x) - cu;
    if (d < 5) continue;
    let lofted = false;
    if (d > SIM.GROUND_MAX) { if (d > SIM.LOFT_MAX || gain < 10) continue; lofted = true; }
    if (gain < -4 && d > SIM.RECYCLE_MAX) continue;           // no long balls backwards
    const odds = passOdds(w, c, to, q, lofted);
    const space = Math.min(...defs.map((dd) => dist(dd, to)));
    const value = threatAt(team, to) * (0.75 + 0.25 * Math.min(space, 8) / 8);
    const offside = depthOf(team, q.x) > offV + 0.01 && depthOf(team, q.x) > PITCH.L / 2;
    const u = odds.p * value - (1 - odds.p) * loseCost(to) - (offside ? 0.2 : 0);
    opts.push({ kind: 'pass', to, rec: q, lofted, odds: odds.p, dur: odds.dur, u, gain, d });
  }
  // Carry it: up to five directions within 70° of straight at goal.
  const pressure = Math.min(...defs.map((d) => dist(d, c)));
  for (const a of [-70, -35, 0, 35, 70]) {
    const base = team === 'home' ? 0 : Math.PI, ang = base + (a * Math.PI) / 180;
    const end = { x: clamp(c.x + Math.cos(ang) * 5, 1, PITCH.L - 1), y: clamp(c.y + Math.sin(ang) * 5, 1, PITCH.W - 1) };
    let closest = 99;
    for (const q of defs) {
      for (const f of [0.3, 0.6, 1]) closest = Math.min(closest, dist(q, { x: c.x + (end.x - c.x) * f, y: c.y + (end.y - c.y) * f }));
    }
    const keep = sigmoid((closest - 1.8) / 0.7);
    opts.push({ kind: 'dribble', to: end, odds: keep, u: keep * threatAt(team, end) - (1 - keep) * loseCost(c) - 0.004 });
  }
  // Shoot when it's on.
  const gx = team === 'home' ? PITCH.L : 0;
  if (Math.hypot(gx - c.x, PITCH.W / 2 - c.y) < 30) {
    const xg = shotXG(team, c, defs);
    if (xg > 0.03) opts.push({ kind: 'shoot', xg, u: xg * 1.15 });
  }
  // A player under no pressure with nothing on keeps the ball.
  if (pressure > 6) opts.push({ kind: 'hold', u: here * 0.9 });
  return opts;
}

function chooseOption(w, opts) {
  const temp = 0.015, best = Math.max(...opts.map((o) => o.u));
  const weights = opts.map((o) => Math.exp((o.u - best) / temp));
  let r = w.rng() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < opts.length; i++) { r -= weights[i]; if (r <= 0) return opts[i]; }
  return opts[opts.length - 1];
}

function carrierDecides(w) {
  const c = w.ball.owner;
  const o = chooseOption(w, carrierOptions(w, c));
  if (o.kind === 'pass') {
    // Offside is judged the moment the ball is played.
    const offV = simOffsideDepth(w, w.attTeam);
    if (depthOf(w.attTeam, o.rec.x) > offV + 0.01 && depthOf(w.attTeam, o.rec.x) > PITCH.L / 2) {
      log(w, `${tag(c)} finds ${tag(o.rec)}, but he's offside`, 'bad');
      return simEnd(w, 'offside', o.rec);
    }
    Object.assign(w.ball, { state: 'flight', owner: null, from: { x: c.x, y: c.y }, to: o.to, t0: w.t, dur: o.dur, lofted: o.lofted, rec: o.rec, passer: c });
    o.rec.target = o.to; o.rec.speed = sprintOf(o.rec); o.rec.mode = 'receive';
    log(w, `${tag(c)} ${o.lofted ? 'lofts it' : o.gain < -3 ? 'plays it back' : 'passes'} to ${tag(o.rec)} (${o.d.toFixed(0)} m)`, 'pass');
  } else if (o.kind === 'dribble') {
    c.target = o.to; c.speed = SIM.DRIBBLE_V; c.mode = 'dribble';
  } else if (o.kind === 'shoot') {
    return shoot(w, c, o.xg);
  } else {
    c.target = { x: c.x, y: c.y }; c.speed = 1; c.mode = 'hold';
  }
}

function shoot(w, c, xg) {
  const r = w.rng();
  const goalY = PITCH.W / 2 + (w.rng() - 0.5) * 6;
  const gx = w.attTeam === 'home' ? PITCH.L + 0.8 : -0.8;
  w.ball.shot = { from: { x: c.x, y: c.y }, to: { x: gx, y: goalY }, t0: w.t, dur: dist(c, { x: gx, y: goalY }) / 24 };
  w.ball.state = 'shot'; w.ball.owner = null;
  const result = r < xg ? 'goal' : r < xg + (1 - xg) * 0.45 ? 'saved' : r < xg + (1 - xg) * 0.75 ? 'blocked' : 'wide';
  log(w, `${tag(c)} shoots from ${dist(c, { x: gx, y: PITCH.W / 2 }).toFixed(0)} m (xG ${xg.toFixed(2)}): ${{ goal: 'GOAL', saved: 'saved', blocked: 'blocked', wide: 'wide' }[result]}`, result === 'goal' ? 'goal' : 'shot');
  w.pendingShot = { result, xg, at: { x: c.x, y: c.y } };
}

function simEnd(w, kind, who, at) {
  w.outcome = { kind, t: w.t, at: at || { x: w.ball.x, y: w.ball.y }, who: who ? tag(who) : '', xg: w.pendingShot?.xg || 0, milestones: { ...w.milestones } };
}

// --- One tick ----------------------------------------------------------------
function simStep(w) {
  const dt = SIM.DT;
  w.t += dt;
  const ball = w.ball;
  if (w.t >= w.nextDecide) {
    w.nextDecide = w.t + SIM.DECIDE_EVERY;
    defendTargets(w);
    attackTargets(w);
    if (ball.state === 'held' && ball.owner.team === w.attTeam) carrierDecides(w);
    if (w.outcome) return;
  }
  // During a pass, the two defenders nearest the landing spot attack it.
  if (ball.state === 'flight') {
    const near = simTeam(w, w.defTeam).filter((d) => d.unit !== 'G').sort((a, b) => dist(a, ball.to) - dist(b, ball.to)).slice(0, 2);
    for (const d of near) { d.target = ball.to; d.speed = sprintOf(d); }
  }
  // Move everyone towards their target with a speed and acceleration cap.
  for (const p of w.players) {
    const dx = p.target.x - p.x, dy = p.target.y - p.y, d = Math.hypot(dx, dy);
    const want = d < 0.2 ? 0 : Math.min(p.speed, d / dt);
    const tvx = d ? (dx / d) * want : 0, tvy = d ? (dy / d) * want : 0;
    const ax = tvx - p.vx, ay = tvy - p.vy, a = Math.hypot(ax, ay), cap = SIM.ACCEL * dt;
    const k = a > cap ? cap / a : 1;
    p.vx += ax * k; p.vy += ay * k;
    p.x = clamp(p.x + p.vx * dt, 0, PITCH.L); p.y = clamp(p.y + p.vy * dt, 0, PITCH.W);
  }
  if (ball.state === 'held') {
    const c = ball.owner;
    ball.x = c.x + attackDir(c.team) * 0.7; ball.y = c.y;
    // Tackles: a defender touch-tight has a chance each tick.
    for (const d of simTeam(w, oppOf(c.team))) {
      if (dist(d, c) < SIM.TACKLE_R && w.rng() < 0.2) {
        log(w, `${tag(d)} wins it off ${tag(c)}`, 'win');
        return simEnd(w, 'turnover', d, { x: c.x, y: c.y });
      }
    }
  } else if (ball.state === 'flight') {
    const f = clamp((w.t - ball.t0) / ball.dur, 0, 1);
    ball.x = ball.from.x + (ball.to.x - ball.from.x) * f; ball.y = ball.from.y + (ball.to.y - ball.from.y) * f;
    ball.lift = ball.lofted ? Math.sin(Math.PI * f) : 0;
    const catchable = !ball.lofted || f > 0.85;
    if (catchable) {
      for (const d of simTeam(w, w.defTeam)) {
        if (dist(d, ball) < SIM.CONTROL_R) {
          log(w, `${tag(d)} intercepts`, 'win');
          return simEnd(w, 'turnover', d, { x: ball.x, y: ball.y });
        }
      }
    }
    if (f >= 1) {
      // Whoever is closest to where it lands controls it.
      const near = w.players.slice().sort((a, b) => dist(a, ball) - dist(b, ball))[0];
      if (dist(near, ball) > 2.5 || near.team !== w.attTeam) {
        log(w, near.team !== w.attTeam ? `${tag(near)} gets to it first` : 'The pass runs away from everyone', 'win');
        return simEnd(w, 'turnover', near, { x: ball.x, y: ball.y });
      }
      ball.state = 'held'; ball.owner = near; ball.lift = 0;
      near.mode = 'shape';
      w.nextDecide = w.t + 0.35;                               // a touch to control it
    }
  } else if (ball.state === 'shot') {
    const s = ball.shot, f = clamp((w.t - s.t0) / s.dur, 0, 1);
    ball.x = s.from.x + (s.to.x - s.from.x) * f; ball.y = s.from.y + (s.to.y - s.from.y) * f;
    if (f >= 1) return simEnd(w, w.pendingShot.result === 'goal' ? 'goal' : 'shot');
  }
  // Milestones for the attack.
  if (ball.state === 'held') {
    const u = depthOf(w.attTeam, ball.x);
    if (u > 70 && !w.milestones.final3) { w.milestones.final3 = true; log(w, 'Into the final third', 'milestone'); }
    const inBox = u > PITCH.L - PITCH.boxD && Math.abs(ball.y - PITCH.W / 2) < PITCH.boxW / 2;
    if (inBox && !w.milestones.box) { w.milestones.box = true; log(w, 'Into the box', 'milestone'); }
  }
  if (w.t >= SIM.MAX_T) {
    log(w, 'They keep the ball but go nowhere', 'end');
    simEnd(w, 'held');
  }
}

// Run one move to the end. With `record`, keep every frame for playback.
function simRun(opts, record = false) {
  const w = simCreate(opts);
  const snap = () => w.frames.push({ t: w.t, p: w.players.map((p) => [p.x, p.y, p.mode]), b: [w.ball.x, w.ball.y, w.ball.lift || 0, w.ball.owner ? w.ball.owner.id : null] });
  if (record) snap();
  while (!w.outcome) { simStep(w); if (record) snap(); }
  return w;
}

// Many runs with different seeds: the spread a coach actually needs.
function simBatch(opts, n) {
  const res = { n, goal: 0, shot: 0, box: 0, final3: 0, turnover: 0, offside: 0, held: 0, xg: 0, time: 0, marks: [] };
  for (let i = 0; i < n; i++) {
    const w = simRun({ ...opts, seed: (opts.seed || 1) * 7919 + i });
    const o = w.outcome;
    res[o.kind === 'goal' ? 'goal' : o.kind]++;
    if (o.kind === 'goal') res.shot++;
    if (o.milestones.box) res.box++;
    if (o.milestones.final3) res.final3++;
    res.xg += o.xg;
    res.time += o.t;
    res.marks.push({ kind: o.kind, x: o.at.x, y: o.at.y });
  }
  res.xg /= n; res.time /= n;
  return res;
}

/* ================================================================
   Toolbar, toasts, shortcuts
   ================================================================ */
function setTool(tool) {
  state.tool = tool;
  for (const b of document.querySelectorAll('[data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === tool));
  requestRender();
}
for (const b of document.querySelectorAll('[data-tool]')) b.addEventListener('click', () => setTool(b.dataset.tool));
document.getElementById('play').addEventListener('click', play);

let toastTimer = 0;
function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = kind), 2600);
}

window.addEventListener('keydown', (ev) => {
  if (ev.target.closest('input, textarea, select') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === 'v') setTool('move');
  else if (k === 'r') setTool('runs');
  else if (k === 'p') setTool('pass');
  else if (k === 'b') backToBase();
  else if (k === ' ') { ev.preventDefault(); state.match ? lockIn() : play(); }
  else if (k === 'c') { state.coverage = { control: 'zones', zones: 'off', off: 'control' }[state.coverage]; state.view = 'custom'; }
  else if (k === 'l') cycleView();
  else if (k === 'escape') state.selected = null;
  else if (k === 'delete' || k === 'backspace') {
    const p = state.players.find((q) => q.id === state.selected);
    if (p && p.run && !anim) p.run = null;
    else state.pendingPass = null;
  } else return;
  requestRender();
});

/* ================================================================
   Debug overlay (?debug): a known-coordinate marker, attack arrow,
   upright text and the pointer position in metres, to sanity-check
   the transform and its inverse.
   ================================================================ */
const DEBUG = new URLSearchParams(location.search).has('debug');
let debugPointer = null;

function drawDebug() {
  usePitchSpace();
  // Marker on the far box edge's corner: (105 - 16.5, 13.84).
  const mx = PITCH.L - PITCH.boxD, my = (PITCH.W - PITCH.boxW) / 2;
  ctx.fillStyle = '#ffcc00';
  dot(mx, my, 0.8);
  uprightAt(mx, my, () => {
    ctx.font = '600 2.2px system-ui, sans-serif';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`(${mx}, ${my})`, 1, -1);
  });

  // Attack direction arrow along the halfway line area.
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 0.5;
  line(40, 4, 65, 4);
  ctx.beginPath(); ctx.moveTo(65, 4); ctx.lineTo(62, 2.5); ctx.lineTo(62, 5.5); ctx.closePath(); ctx.fill();
  uprightAt(52.5, 7.5, () => {
    ctx.font = '600 2px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WE ATTACK', 0, 0);
  });

  if (debugPointer) {
    const p = toPitch(debugPointer.x, debugPointer.y);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`x ${p.x.toFixed(2)}  y ${p.y.toFixed(2)}  s ${view.s.toFixed(2)}px/m  ${view.portrait ? 'portrait' : 'landscape'}`, 10, 20);
  }
}

/* ================================================================
   Panel: readout, selected player, layers, saved tactics
   Panel HTML is only rewritten when its content changes, so a drag
   doesn't thrash the DOM.
   ================================================================ */

function laneStats(lanes) {
  const open = lanes.filter((l) => !l.blocker);
  const best = open.reduce((b, l) => (l.breaks > (b?.breaks ?? 0) ? l : b), null);
  return { open: open.length, total: lanes.length, best };
}

function updateReadout() {
  const h = A.homeShare * 100, c = A.carrier;
  const shape = (s) => (s ? `${s.width.toFixed(0)}×${s.depth.toFixed(0)} m, ${s.area.toFixed(0)} m²` : '—');
  const ls = laneStats(A.lanes);
  setHTML($('#readout'), `
    <div class="bar" aria-hidden="true"><i style="width:${h}%;background:var(--home)"></i><i style="flex:1;background:var(--away)"></i></div>
    <dl class="stats">
      <dt>Space owned</dt><dd>Blue ${h.toFixed(0)}% · Red ${(100 - h).toFixed(0)}%</dd>
      <dt>Ball</dt><dd>${c ? esc(who(c)) : `Loose (${state.possession} last)`}</dd>
      <dt>Lanes open</dt><dd>${c ? `${ls.open} of ${ls.total}` : '—'}</dd>
      <dt>Best line break</dt><dd>${ls.best ? `+${ls.best.breaks} to #${ls.best.to.num}` : '—'}</dd>
      <dt>Offside line</dt><dd>x = ${A.offsideX.toFixed(1)} m${A.offside.length ? ` · offside ${A.offside.map((p) => '#' + p.num).join(', ')}` : ''}</dd>
      <dt>Blue shape</dt><dd>${shape(A.shape.home)}</dd>
      <dt>Red shape</dt><dd>${shape(A.shape.away)}</dd>
    </dl>`);

  const s = A.selected;
  if (!s) { setHTML($('#selected'), '<p class="muted">Tap a player to see their space and options.</p>'); return; }
  const sl = laneStats(s === c ? A.lanes : A.selLanes);
  setHTML($('#selected'), `
    <dl class="stats">
      <dt>Player</dt><dd>${esc(who(s))}</dd>
      <dt>Space owned</dt><dd>${A.zones.get(s.id)?.area.toFixed(0) ?? 0} m²</dd>
      <dt>Passing lanes</dt><dd>${sl.open} of ${sl.total} open</dd>
      <dt>Best line break</dt><dd>${sl.best ? `+${sl.best.breaks} to #${sl.best.to.num}` : '—'}</dd>
      <dt>Offside</dt><dd>${A.offside.includes(s) ? 'Yes' : 'No'}</dd>
      <dt>Planned run</dt><dd>${s.run ? `${dist(s, s.run).toFixed(0)} m` : 'None'}</dd>
    </dl>
    ${s.run && !state.match ? '<div class="row"><button class="btn" id="remove-run">Remove run</button></div>' : ''}`);
}
$('#selected').addEventListener('click', (ev) => {
  if (ev.target.id !== 'remove-run') return;
  const p = A.selected;
  if (p && !anim) { p.run = null; requestRender(); }
});

// Layers
$('#views').innerHTML = VIEW_ORDER.map((v) => `<button data-view="${v}">${VIEWS[v].label}</button>`).join('');
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => setView(b.dataset.view));
for (const b of document.querySelectorAll('[data-cov]')) b.addEventListener('click', () => { state.coverage = b.dataset.cov; state.view = 'custom'; requestRender(); });
for (const cb of document.querySelectorAll('[data-layer]')) cb.addEventListener('change', () => { state.layers[cb.dataset.layer] = cb.checked; if (cb.dataset.layer !== 'roles') state.view = 'custom'; requestRender(); });
function syncLayers() {
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
  const vb = $('#view-btn .wide');
  if (vb) vb.textContent = `: ${VIEWS[state.view]?.label || 'Custom'}`;
  for (const b of document.querySelectorAll('[data-cov]')) b.setAttribute('aria-pressed', String(b.dataset.cov === state.coverage));
  for (const cb of document.querySelectorAll('[data-layer]')) cb.checked = state.layers[cb.dataset.layer];
}

// Saved tactics
const SAVED_KEY = 'tacticsLab.saved.v1';
let saved = store.get(SAVED_KEY, []);
if (!Array.isArray(saved)) saved = [];
function renderSaved() {
  $('#saved-list').innerHTML = saved.length ? saved.map((s, i) => `
    <li><span class="grow">${esc(s.name)} <span class="muted">${esc(s.board.formations.home)} v ${esc(s.board.formations.away)}</span></span>
      <button class="btn" data-load="${i}">Load</button><button class="btn" data-del="${i}" aria-label="Delete ${esc(s.name)}">Delete</button></li>`).join('')
    : '<li class="muted">No saved setups yet.</li>';
}
$('#save-form').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const name = $('#save-name').value.trim() || `Setup ${saved.length + 1}`;
  saved.unshift({ name, board: snapshot() });
  if (!store.set(SAVED_KEY, saved)) toast('Saved for this session only: browser storage is unavailable', 'bad');
  else toast(`Saved “${name}”`);
  $('#save-name').value = '';
  renderSaved();
});
$('#saved-list').addEventListener('click', (ev) => {
  const load = ev.target.dataset.load, del = ev.target.dataset.del;
  if (load != null && !anim && !state.match) {
    if (restore(saved[+load].board)) toast(`Loaded “${saved[+load].name}”`);
    requestRender();
  } else if (del != null) {
    saved.splice(+del, 1);
    store.set(SAVED_KEY, saved);
    renderSaved();
  }
});
renderSaved();

// Modes and the Board drawer. On wide landscape screens the drawer sits
// beside the pitch; otherwise it is a bottom sheet toggled from the top bar.
const isNarrow = () => !matchMedia('(min-width: 900px) and (orientation: landscape)').matches;
let panelOpen = !isNarrow();
function syncPanel() {
  const show = appMode === 'board' && panelOpen;
  $('#panel').hidden = !show;
  $('#panel-open').hidden = appMode !== 'board';
  $('#panel-open').setAttribute('aria-expanded', String(show));
  $('#panel-open').textContent = show ? 'Close panel' : 'Panel';
}
function setPanel(open) {
  if (!open && !isNarrow()) return;      // the side drawer stays put on wide screens
  panelOpen = open;
  syncPanel();
}
$('#panel-open').addEventListener('click', () => { panelOpen = !panelOpen; syncPanel(); });

function setMode(mode) {
  if (anim) return;
  if (mode === 'board' && state.match) exitMatch();
  appMode = mode;
  store.set('tacticsLab.mode', mode);
  $('#mode-play').setAttribute('aria-pressed', String(mode === 'play'));
  $('#mode-board').setAttribute('aria-pressed', String(mode === 'board'));
  if (mode === 'board') setTool(state.tool || 'move');
  syncPanel();
  renderMatchUI();
  requestRender();
}
$('#mode-play').addEventListener('click', () => setMode('play'));
$('#mode-board').addEventListener('click', () => setMode('board'));

for (const b of document.querySelectorAll('[data-tab]')) {
  b.addEventListener('click', () => {
    for (const t of document.querySelectorAll('[data-tab]')) t.setAttribute('aria-selected', String(t === b));
    for (const pane of document.querySelectorAll('[data-pane]')) pane.hidden = pane.dataset.pane !== b.dataset.tab;
  });
}
$('#view-btn').addEventListener('click', cycleView);

/* ================================================================
   Render loop (on demand) and resize
   ================================================================ */
let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    stepTweens();
    analyse();
    drawPitch();
    if (state.coverage === 'control' && !state.match) drawControl();
    else if (state.coverage === 'zones' && !state.match) drawZones();
    if (state.layers.shape && !state.match) drawShape();
    if (state.layers.offside || state.match) drawOffside();
    if (state.layers.lanes && !state.match) { drawLanes(A.selLanes.filter((l) => !l.blocker), true); drawLanes(A.lanes, false); }
    if (state.match) drawMatch();
    drawRuns();
    drawPasses();
    if (DEBUG) drawDebug();
    drawPlayers();
    drawFx();
    updateReadout();
    updateHud();
    syncControls();
    syncLayers();
    if (!anim && !drag) scheduleSave();
  });
}

// One dark palette on purpose (a night match), so tokens are read once.
readTokens();
renderBackground();
document.fonts?.ready.then(() => { renderBackground(); requestRender(); });

if (!restore(store.get(BOARD_KEY, null))) setupMatch('4-3-3', '4-4-2');
syncControls();
setMode(store.get('tacticsLab.mode', 'play') === 'board' ? 'board' : 'play');


new ResizeObserver(() => { layout(); requestRender(); }).observe(canvas);
// A devicePixelRatio change (moving between screens) doesn't always resize the element,
// so watch the current ratio and re-arm the query each time it changes.
function watchDpr() {
  matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
    .addEventListener('change', () => { layout(); requestRender(); watchDpr(); }, { once: true });
}
watchDpr();
</script>
