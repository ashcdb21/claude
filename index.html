<title>Tactics Lab</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a full-bleed floodlit pitch is the whole screen; a slim scoreboard bar on top,
     one thumb-reach action bar at the bottom, and the tactics drawer only in Board mode.
     One visual world (a night match), so a single dark palette on purpose. */
  :root {
    --night: #0a1511;          /* stand shadow around the pitch */
    --surface: #111f1a;        /* scoreboard, drawer, cards */
    --surface-2: #1a2c25;      /* raised controls */
    --line-soft: rgba(226, 240, 232, 0.12);
    --chalk: #eef5f0;          /* primary text: touchline chalk */
    --muted: #93a89e;
    --armband: #f5b83d;        /* accent: captain's armband */
    --armband-ink: #1c1405;
    --good: #4ade80;
    --bad: #fb7185;
    /* canvas tokens (read by the renderer) */
    --surround: #0a1511;
    --flood: #1d3a2c;
    --grass: #2f7a3f;
    --line: rgba(255, 255, 255, 0.9);
    --goal: rgba(255, 255, 255, 0.95);
    --home: #2f6fed;
    --away: #e2334f;
    --select: #f5b83d;
    --offside: #fde047;
    --blocked: #fb7185;
    --badge: #f5b83d;
    --homeRun: #bfd4ff;
    --awayRun: #ffc9d2;
    --display: 'Big Shoulders Display', 'Oswald', 'Arial Narrow', sans-serif-condensed, Impact, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --r: 10px;
    --drawer-w: 340px;
    --bar-h: 52px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--chalk); font: 15px/1.45 var(--body); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--armband); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }

  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

  /* ---------- Top bar: wordmark, mode switch, record ---------- */
  #topbar { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
    background: var(--surface); border-bottom: 1px solid var(--line-soft); z-index: 6; }
  .wordmark { font: 900 22px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .wordmark span { color: var(--armband); }
  .modes { display: inline-flex; background: var(--night); border-radius: 999px; padding: 3px; margin-inline: auto; }
  .modes button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font: 800 15px var(--display);
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .modes button[aria-pressed="true"] { background: var(--armband); color: var(--armband-ink); }
  .chip { font: 600 13px var(--body); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip b { color: var(--chalk); }
  .iconbtn { border: 1px solid var(--line-soft); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
  @media (max-width: 520px) { #topbar { gap: 8px; } .wordmark { font-size: 18px; } .modes button { padding: 6px 12px; } .chip { display: none; } }

  /* ---------- Stage ---------- */
  #main { position: relative; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1; min-width: 0; }
  #board { position: absolute; top: 0; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); }
  #pitch { display: block; width: 100%; height: 100%; touch-action: none; }
  /* In a match the scoreboard gets its own strip, so no lane runs underneath it. */
  #stage.in-match #board { top: 64px; }

  /* Bottom bars (one per mode) */
  .bar { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; padding: 6px; background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: calc(100% - 24px); z-index: 3; }
  .bar button { border: 0; background: transparent; padding: 10px 14px; border-radius: 10px; font: 800 17px/1 var(--display);
    letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: var(--chalk); }
  .bar button[aria-pressed="true"] { background: var(--surface-2); color: var(--armband); }
  .bar .sep { width: 1px; align-self: stretch; background: var(--line-soft); margin: 4px 2px; }
  .bar .go { background: var(--armband); color: var(--armband-ink); padding: 12px 28px; font-size: 22px; }
  .bar .go:disabled { opacity: .45; cursor: default; }
  .bar .ghost { color: var(--muted); }
  @media (max-width: 480px) { .bar { gap: 2px; padding: 5px; } .bar button { padding: 10px 8px; font-size: 16px; } .bar .go { padding: 12px 20px; } .bar .wide { display: none; }
    .tabs button { font-size: 14px; letter-spacing: .04em; } }

  /* ---------- Match HUD: a scoreboard strip ---------- */
  #hud { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 3; display: flex; align-items: stretch;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: calc(100% - 24px); }
  #hud .cell { padding: 6px 14px; display: grid; align-content: center; gap: 2px; border-right: 1px solid var(--line-soft); }
  #hud .cell:last-child { border-right: 0; }
  #hud .k { font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  #hud .v { font: 800 20px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
  #hud .bad { color: var(--bad); } #hud .good { color: var(--good); }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line-soft); }
  .pips i.done { background: var(--muted); } .pips i.now { background: var(--armband); border-color: var(--armband); }
  .pulse { animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  @media (max-width: 520px) { #hud .cell { padding: 5px 10px; } #hud .v { font-size: 17px; } #hud .obj { display: none; } }

  /* Coach bubble for the first level */
  #coach { position: absolute; left: 50%; top: 76px; transform: translateX(-50%); z-index: 3; width: min(420px, calc(100% - 24px));
    background: var(--armband); color: var(--armband-ink); border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 14px; line-height: 1.35;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); display: flex; gap: 10px; align-items: start; }
  @media (max-width: 600px) { #coach { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); } }
  #coach button { margin-left: auto; border: 0; background: rgba(0,0,0,.12); border-radius: 8px; padding: 4px 10px; font-weight: 700; }

  #toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); transform: translateX(-50%);
    padding: 10px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-soft); font-weight: 600;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 24px); text-align: center; z-index: 5; }
  #toast.show { opacity: 1; }
  #toast.good { border-color: var(--good); color: var(--good); }
  #toast.bad { border-color: var(--bad); color: var(--bad); }

  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 4; }
  #flash.goal { background: radial-gradient(circle, transparent 35%, rgba(226,51,79,.55)); animation: flash .9s ease-out; }
  #flash.win { background: radial-gradient(circle, transparent 35%, rgba(74,222,128,.4)); animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- Overlays: level map and result ---------- */
  .overlay { position: absolute; inset: 0; z-index: 4; overflow-y: auto; padding: 24px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: rgba(10,21,17,.93); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .sheet { width: min(760px, 100%); margin-inline: auto; display: grid; gap: 16px; }
  .eyebrow { font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--armband); }
  .headline { font: 900 clamp(34px, 7vw, 56px)/.95 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .lede { color: var(--muted); max-width: 60ch; margin: 0; }
  .difficulty { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 7px 12px; color: var(--muted); font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--armband); }
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .level.custom { grid-column: 1 / -1; }
  .level { position: relative; text-align: left; border: 1px solid var(--line-soft); background: var(--surface); border-radius: var(--r);
    padding: 14px 16px 16px; display: grid; gap: 6px; align-content: start; min-height: 150px; transition: transform .15s, border-color .15s; }
  .level:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--armband); }
  .level:disabled { cursor: default; opacity: .5; }
  .level .n { font: 900 44px/1 var(--display); color: var(--armband); }
  .level .name { font: 800 22px/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .level .brief { color: var(--muted); font-size: 14px; }
  .level .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .stars { color: var(--armband); letter-spacing: .1em; font-size: 16px; }
  .stars .off { color: var(--surface-2); }
  .level .lock { position: absolute; right: 14px; top: 14px; font-size: 13px; color: var(--muted); }
  .custom { border-style: dashed; }
  .custom textarea { width: 100%; resize: vertical; min-height: 56px; background: var(--night); border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px; }

  .card { width: min(440px, 100%); margin: 10vh auto 0; padding: 22px; border-radius: 16px; background: var(--surface);
    border: 1px solid var(--line-soft); box-shadow: 0 20px 60px rgba(0,0,0,.55); display: grid; gap: 10px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  .card.won { border-top: 6px solid var(--good); } .card.lost { border-top: 6px solid var(--away); }
  .card .big { font: 900 44px/.95 var(--display); text-transform: uppercase; }
  .card .stars { font-size: 34px; }
  .card p { margin: 0; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .debrief { color: var(--muted); font-size: 14px; display: grid; gap: 8px; }
  @keyframes pop { from { transform: scale(.88); opacity: 0; } to { transform: none; opacity: 1; } }

  .btn { border: 1px solid var(--line-soft); background: var(--surface-2); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
  .btn.primary { background: var(--armband); border-color: var(--armband); color: var(--armband-ink); font: 800 18px/1 var(--display);
    letter-spacing: .06em; text-transform: uppercase; padding: 11px 18px; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- Board drawer ---------- */
  #panel { width: var(--drawer-w); flex: none; background: var(--surface); border-left: 1px solid var(--line-soft);
    display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); min-height: 0; z-index: 5; }
  #panel[hidden] { display: none !important; }
  .tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line-soft); }
  .tabs button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; padding: 8px 2px 10px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font: 800 15px var(--display);
    letter-spacing: .08em; text-transform: uppercase; border-bottom: 3px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--armband); }
  .tabpanes { overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .pane { display: grid; gap: 14px; }
  .pane h3 { font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .group { display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > label { display: flex; gap: 6px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  select, input[type=text], textarea { background: var(--night); border: 1px solid var(--line-soft); border-radius: 8px; padding: 7px 9px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  dl.stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
  dl.stats dt { color: var(--muted); }
  dl.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .bar-split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
  .bar-split i { display: block; }
  .muted { color: var(--muted); }
  ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  ul.plain li { display: flex; gap: 6px; align-items: center; }
  kbd { display: inline-block; min-width: 1.7em; text-align: center; padding: 1px 5px; border: 1px solid var(--line-soft);
    border-bottom-width: 2px; border-radius: 5px; font: 12px ui-monospace, monospace; }
  /* Narrow screens: the drawer becomes a bottom sheet over the pitch. */
  @media (max-width: 899px), (orientation: portrait) {
    #panel { position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 72%; border-left: 0; border-top: 1px solid var(--line-soft);
      border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.5); }
  }
  @media (prefers-reduced-motion: reduce) { .card, .pulse, #flash, .level { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header id="topbar">
    <div class="wordmark">Tactics <span>Lab</span></div>
    <div class="modes" role="tablist" aria-label="Mode">
      <button id="mode-play" aria-pressed="true">Play</button>
      <button id="mode-board" aria-pressed="false">Board</button>
    </div>
    <span class="chip" id="record-chip"></span>
    <button class="iconbtn" id="panel-open" aria-controls="panel" aria-expanded="false" hidden>Panel</button>
  </header>
  <div id="main">
    <main id="stage">
      <div id="board"><canvas id="pitch" aria-label="Tactics board"></canvas></div>
      <div id="hud" hidden aria-live="polite"></div>
      <div id="coach" hidden></div>
      <section id="levels" class="overlay" hidden></section>
      <section id="result" class="overlay" hidden></section>
      <div id="flash"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <nav id="playbar" class="bar" hidden aria-label="Match controls">
        <button class="ghost" id="reset-phase" title="Put your players back where this phase started">Reset</button>
        <button class="go" id="lockin" title="Lock in (Space)">Lock in</button>
        <button class="ghost" id="quit-match">Quit</button>
      </nav>
      <nav id="toolbar" class="bar" role="toolbar" aria-label="Board tools" hidden>
        <button data-tool="move" aria-pressed="true" title="Move (V)">Move</button>
        <button data-tool="runs" aria-pressed="false" title="Runs (R)">Runs</button>
        <button data-tool="pass" aria-pressed="false" title="Pass (P)">Pass</button>
        <span class="sep"></span>
        <button id="play" title="Play (Space)">▶<span class="wide"> Play</span></button>
        <button id="view-btn" title="Change view (L)">View<span class="wide">: Passing</span></button>
      </nav>
    </main>
    <aside id="panel" aria-label="Board panel" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="stats" aria-selected="true">Stats</button>
        <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
        <button role="tab" data-tab="scen" aria-selected="false">Scenarios</button>
        <button role="tab" data-tab="saved" aria-selected="false">Saved</button>
      </div>
      <div class="tabpanes">
        <div class="pane" data-pane="stats">
          <div class="group"><h3>Readout</h3><div id="readout"></div></div>
          <div class="group"><h3>Selected player</h3><div id="selected"></div></div>
        </div>
        <div class="pane" data-pane="setup" hidden>
          <div class="group"><h3>What the board shows</h3>
            <div class="row"><span class="seg" id="views"></span></div>
            <div class="row">Coverage
              <span class="seg" id="coverage"><button data-cov="control">Control</button><button data-cov="zones">Zones</button><button data-cov="off">Off</button></span>
            </div>
            <div class="checks">
              <label><input type="checkbox" data-layer="lanes"> Passing lanes</label>
              <label><input type="checkbox" data-layer="lines"> Lines broken</label>
              <label><input type="checkbox" data-layer="offside"> Offside line</label>
              <label><input type="checkbox" data-layer="shape"> Team shape</label>
              <label><input type="checkbox" data-layer="roles"> Role labels</label>
            </div>
          </div>
          <div class="group"><h3>Teams</h3>
            <div class="row">
              <label>Blue <select id="formation-home"></select></label>
              <label>Red <select id="formation-away"></select></label>
            </div>
            <div class="row">
              <label>Ball <select id="possession"><option value="home">Blue</option><option value="away">Red</option></select></label>
              <label><input type="checkbox" id="show-away"> Show red team</label>
            </div>
            <div class="row"><button class="btn" id="to-base">Back to base</button><button class="btn" id="make-base">Make this the base</button></div>
          </div>
          <div class="group"><h3>Shortcuts</h3>
            <ul class="plain">
              <li><kbd>V</kbd> Move <kbd>R</kbd> Runs <kbd>P</kbd> Pass</li>
              <li><kbd>Space</kbd> Play <kbd>B</kbd> Back to base <kbd>L</kbd> View</li>
              <li><kbd>C</kbd> Coverage <kbd>Esc</kbd> Deselect <kbd>Delete</kbd> Remove run</li>
            </ul>
          </div>
        </div>
        <div class="pane" data-pane="scen" hidden>
          <div class="group"><h3>Build scenarios</h3>
            <textarea id="scenario-text" rows="3" placeholder="Describe a situation, e.g. ‘their full-back keeps getting free on the overlap’"></textarea>
            <div class="row">
              <button class="btn primary" id="scenario-build">Build</button>
              <button class="btn" id="scenario-cancel" hidden>Cancel</button>
              <button class="btn" id="scenario-example">Load example</button>
            </div>
            <p class="muted" id="scenario-status" role="status"></p>
          </div>
          <div id="scenario-ui"></div>
        </div>
        <div class="pane" data-pane="saved" hidden>
          <div class="group"><h3>Save this setup</h3>
            <form class="row" id="save-form">
              <input type="text" id="save-name" class="grow" placeholder="Name this setup" maxlength="40" aria-label="Setup name">
              <button class="btn primary">Save</button>
            </form>
          </div>
          <ul class="plain" id="saved-list"></ul>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
'use strict';

/* ================================================================
   Pitch geometry (metres)
   x = 0 is our goal line, x = 105 the opposition's.
   y = 0 is the touchline on our left as we attack towards x = 105.
   ================================================================ */
const PITCH = {
  L: 105, W: 68,
  goalY0: 30.34, goalY1: 37.66,     // 7.32 m goal mouth centred on y = 34
  goalDepth: 2,                     // drawn behind the line, outside the field
  boxD: 16.5, boxW: 40.32,
  sixD: 5.5, sixW: 18.32,
  spotX: 11,
  circleR: 9.15,
  cornerR: 1,
  lineW: 0.12,                      // real line width
};
const MARGIN = 4;                   // metres of surround kept visible around the pitch

/* ================================================================
   Data model
   Formation slots are [x, y, role, unit, number] for the home side
   (attacking towards x = 105). Unit is one of G / D / DM / M / AM / A
   and drives the "lines broken" model later. Away sides use the same
   tables mirrored through the pitch centre: (x, y) -> (L - x, W - y).
   ================================================================ */
const GK = [5, 34, 'GK', 'G', 1];
const BACK4 = [[26, 7, 'LB', 'D', 3], [23, 24, 'CB', 'D', 4], [23, 44, 'CB', 'D', 5], [26, 61, 'RB', 'D', 2]];
const BACK3 = [[23, 18, 'CB', 'D', 4], [21, 34, 'CB', 'D', 5], [23, 50, 'CB', 'D', 15]];
const FORMATIONS = {
  '4-3-3': [GK, ...BACK4, [33, 34, 'DM', 'DM', 6], [41, 23, 'CM', 'M', 8], [41, 45, 'CM', 'M', 10], [57, 11, 'LW', 'A', 11], [59, 34, 'ST', 'A', 9], [57, 57, 'RW', 'A', 7]],
  '4-2-3-1': [GK, ...BACK4, [33, 26, 'DM', 'DM', 6], [33, 42, 'DM', 'DM', 8], [50, 6, 'LW', 'AM', 11], [55, 34, 'AM', 'AM', 10], [50, 62, 'RW', 'AM', 7], [63, 34, 'ST', 'A', 9]],
  '4-4-2': [GK, ...BACK4, [42, 8, 'LM', 'M', 11], [40, 26, 'CM', 'M', 8], [40, 42, 'CM', 'M', 6], [42, 60, 'RM', 'M', 7], [57, 28, 'ST', 'A', 9], [57, 40, 'ST', 'A', 10]],
  '4-1-4-1': [GK, ...BACK4, [32, 34, 'DM', 'DM', 6], [44, 8, 'LM', 'M', 11], [42, 25, 'CM', 'M', 8], [42, 43, 'CM', 'M', 10], [44, 60, 'RM', 'M', 7], [59, 34, 'ST', 'A', 9]],
  '3-5-2': [GK, ...BACK3, [42, 6, 'LWB', 'M', 3], [32, 34, 'DM', 'DM', 6], [42, 24, 'CM', 'M', 8], [42, 44, 'CM', 'M', 10], [42, 62, 'RWB', 'M', 2], [57, 28, 'ST', 'A', 9], [57, 40, 'ST', 'A', 11]],
  '3-4-3': [GK, ...BACK3, [40, 7, 'LWB', 'M', 3], [38, 26, 'CM', 'M', 8], [38, 42, 'CM', 'M', 6], [40, 61, 'RWB', 'M', 2], [56, 13, 'LW', 'A', 11], [59, 34, 'ST', 'A', 9], [56, 55, 'RW', 'A', 7]],
  '5-3-2': [GK, [30, 6, 'LWB', 'D', 3], [22, 21, 'CB', 'D', 4], [21, 34, 'CB', 'D', 5], [22, 47, 'CB', 'D', 15], [30, 62, 'RWB', 'D', 2], [41, 22, 'CM', 'M', 8], [38, 34, 'CM', 'M', 6], [41, 46, 'CM', 'M', 10], [56, 28, 'ST', 'A', 9], [56, 40, 'ST', 'A', 11]],
};

const CARRY_R = 2.6;                // the carrier is the nearest player within this of the ball
const PLAYER_R = 1.2;               // drawn disc radius (m)
const BALL_R = 0.55;

const state = {
  players: [],
  ball: { x: 0, y: 0 },
  selected: null,                   // player id
  coverage: 'off',                  // 'control' | 'zones' | 'off'
  possession: 'home',               // last team to have a carrier
  layers: { lanes: true, lines: true, offside: true, shape: false, roles: false },
  view: 'passing',                  // a named preset of coverage + layers, or 'custom'
  tool: 'move',                     // 'move' | 'runs' | 'pass'
  pendingPass: null,                // { passerId, receiverId, x, y } queued behind runs
  match: null,                      // match-play state when a game is running
  formations: { home: '4-3-3', away: '4-4-2' },
  showAway: true,
  baseBall: { x: 0, y: 0 },
};

// A player: current position, base position, and an optional run
// ({ x, y, bend }) with a base copy so "back to base" can restore it.
function makePlayer(team, slot, i) {
  const [sx, sy, role, unit, num] = slot;
  const x = team === 'home' ? sx : PITCH.L - sx;
  const y = team === 'home' ? sy : PITCH.W - sy;
  return {
    id: `${team}-${i}`, team, role, unit, num,
    x, y, base: { x, y },
    run: null, baseRun: null,
  };
}

function setupMatch(homeFormation, awayFormation) {
  state.formations = { home: homeFormation, away: awayFormation };
  state.players = [
    ...FORMATIONS[homeFormation].map((s, i) => makePlayer('home', s, i)),
    ...FORMATIONS[awayFormation].map((s, i) => makePlayer('away', s, i)),
  ];
  // Start the ball at the home #6's feet.
  const six = state.players.find((p) => p.team === 'home' && p.num === 6);
  state.ball = { x: six.x + 1.6, y: six.y };
  state.baseBall = { ...state.ball };
  state.selected = null;
  state.pendingPass = null;
  state.basePass = null;
}

// Swap one side's formation; the side keeps the ball if it had it.
function setFormation(team, name) {
  const had = state.possession === team && carrier();
  state.formations[team] = name;
  const fresh = FORMATIONS[name].map((s, i) => makePlayer(team, s, i));
  state.players = team === 'home' ? [...fresh, ...state.players.filter((p) => p.team !== team)]
    : [...state.players.filter((p) => p.team !== team), ...fresh];
  state.pendingPass = null;
  state.selected = null;
  if (had) giveBall(nearestTo(state.ball, team));
}

function nearestTo(pt, team) {
  let best = null, bestD = Infinity;
  for (const p of state.players) {
    if (p.team !== team || !visible(p)) continue;
    const d = dist(p, pt);
    if (d < bestD) { best = p; bestD = d; }
  }
  return best;
}

function giveTeamBall(team) {
  if (team === 'away') state.showAway = true;
  giveBall(nearestTo(state.ball, team));
  state.pendingPass = null;
}

const copyRun = (r) => (r ? { ...r } : null);
function backToBase() {
  if (anim || state.match) return;
  for (const p of state.players) { p.x = p.base.x; p.y = p.base.y; p.run = copyRun(p.baseRun); }
  state.ball = { ...state.baseBall };
  state.pendingPass = state.basePass ? { ...state.basePass } : null;
  toast('Back to base');
}
function makeBase() {
  if (anim || state.match) return;
  for (const p of state.players) { p.base = { x: p.x, y: p.y }; p.baseRun = copyRun(p.run); }
  state.baseBall = { ...state.ball };
  state.basePass = state.pendingPass ? { ...state.pendingPass } : null;
  toast('Saved as the base position');
}

/* ================================================================
   Views: named sets of layers so only one question is on screen at a
   time ("who can I pass to?", "who owns the space?"...). Changing a
   single layer by hand switches the view to "Custom".
   ================================================================ */
const VIEWS = {
  clean: { label: 'Clean', coverage: 'off', layers: { lanes: false, lines: false, offside: false, shape: false } },
  passing: { label: 'Passing', coverage: 'off', layers: { lanes: true, lines: true, offside: true, shape: false } },
  space: { label: 'Space', coverage: 'control', layers: { lanes: false, lines: false, offside: false, shape: false } },
  zones: { label: 'Zones', coverage: 'zones', layers: { lanes: false, lines: false, offside: false, shape: false } },
  shape: { label: 'Shape', coverage: 'off', layers: { lanes: false, lines: false, offside: true, shape: true } },
};
const VIEW_ORDER = Object.keys(VIEWS);
function setView(name) {
  const v = VIEWS[name];
  if (!v) return;
  state.view = name;
  state.coverage = v.coverage;
  Object.assign(state.layers, v.layers);
  requestRender();
}
function cycleView() {
  const i = VIEW_ORDER.indexOf(state.view);
  setView(VIEW_ORDER[(i + 1) % VIEW_ORDER.length]);
  toast(`View: ${VIEWS[state.view].label}`);
}

/* ================================================================
   Persistence
   Storage can be missing, full or blocked (private windows), so every
   access is wrapped and the board always has an in-memory fallback.
   ================================================================ */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
  },
};
const BOARD_KEY = 'tacticsLab.board.v1';
const isPt = (p) => p && Number.isFinite(p.x) && Number.isFinite(p.y);
const cleanPt = (p) => { const q = { x: p.x, y: p.y }; clampToPitch(q); return q; };
const cleanRun = (r) => (r && isPt(r) ? { ...cleanPt(r), bend: clamp(Number(r.bend) || 0, -MAX_BEND, MAX_BEND) } : null);

function snapshot() {
  return structuredClone({
    formations: state.formations, showAway: state.showAway, coverage: state.coverage, layers: state.layers, view: state.view,
    possession: state.possession, ball: state.ball, baseBall: state.baseBall,
    players: state.players.map((p) => ({ x: p.x, y: p.y, base: p.base, run: p.run, baseRun: p.baseRun })),
  });
}

// Apply a snapshot, ignoring anything malformed. Returns false if unusable.
function restore(s) {
  if (!s || !s.formations || !FORMATIONS[s.formations.home] || !FORMATIONS[s.formations.away]) return false;
  setupMatch(s.formations.home, s.formations.away);
  if (Array.isArray(s.players) && s.players.length === state.players.length) {
    s.players.forEach((q, i) => {
      const p = state.players[i];
      if (isPt(q)) Object.assign(p, cleanPt(q));
      if (isPt(q.base)) p.base = cleanPt(q.base);
      p.run = cleanRun(q.run);
      p.baseRun = cleanRun(q.baseRun);
    });
  }
  if (isPt(s.ball)) state.ball = cleanPt(s.ball);
  if (isPt(s.baseBall)) state.baseBall = cleanPt(s.baseBall);
  if (['control', 'zones', 'off'].includes(s.coverage)) state.coverage = s.coverage;
  if (s.layers && typeof s.layers === 'object') for (const k in state.layers) if (typeof s.layers[k] === 'boolean') state.layers[k] = s.layers[k];
  state.showAway = s.showAway !== false;
  state.view = VIEWS[s.view] || s.view === 'custom' ? s.view : 'custom';
  if (s.possession === 'home' || s.possession === 'away') state.possession = s.possession;
  return true;
}

let saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (!anim && !state.match) store.set(BOARD_KEY, snapshot()); }, 300);
}

function carrier() {
  let best = null, bestD = CARRY_R;
  for (const p of state.players) {
    if (!visible(p)) continue;
    const d = Math.hypot(p.x - state.ball.x, p.y - state.ball.y);
    if (d <= bestD) { best = p; bestD = d; }
  }
  return best;
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function clampToPitch(pt) {
  pt.x = clamp(pt.x, 0, PITCH.L);
  pt.y = clamp(pt.y, 0, PITCH.W);
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* ================================================================
   Analysis 1 — Zones (exact Voronoi)
   Player i owns every point closer to i than to any other player j:
     |p - pi|² <= |p - pj|²  <=>  (pj - pi)·p <= (|pj|² - |pi|²) / 2
   Each cell starts as the pitch rectangle and is clipped by that
   half-plane for every j (Sutherland–Hodgman against one edge).
   ================================================================ */
function clipHalfPlane(poly, a, b, c) {       // keep a*x + b*y <= c
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length];
    const fp = a * P.x + b * P.y - c, fq = a * Q.x + b * Q.y - c;
    if (fp <= 0) out.push(P);
    if ((fp < 0 && fq > 0) || (fp > 0 && fq < 0)) {
      const t = fp / (fp - fq);
      out.push({ x: P.x + t * (Q.x - P.x), y: P.y + t * (Q.y - P.y) });
    }
  }
  return out;
}

function polyArea(poly) {                     // shoelace
  let s = 0;
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length];
    s += P.x * Q.y - Q.x * P.y;
  }
  return Math.abs(s) / 2;
}

function computeZones(players) {
  const rect = [{ x: 0, y: 0 }, { x: PITCH.L, y: 0 }, { x: PITCH.L, y: PITCH.W }, { x: 0, y: PITCH.W }];
  const zones = new Map();
  for (const pi of players) {
    let poly = rect;
    for (const pj of players) {
      if (pj === pi || (pj.x === pi.x && pj.y === pi.y)) continue;
      poly = clipHalfPlane(poly, pj.x - pi.x, pj.y - pi.y, (pj.x ** 2 + pj.y ** 2 - pi.x ** 2 - pi.y ** 2) / 2);
      if (poly.length < 3) break;
    }
    zones.set(pi.id, { poly, area: poly.length >= 3 ? polyArea(poly) : 0 });
  }
  return zones;
}

/* ================================================================
   Analysis 2 — Pitch control
   On a 0.5 m node grid, compare the nearest home and nearest away
   distance and squash the difference through a logistic:
     p = 1 / (1 + exp(-(d_away - d_home) / 2.6))
   p is the home side's control of that node; its mean is the home
   share of the pitch (away share = 1 - mean).
   ================================================================ */
const GRID = 0.5;
const NX = Math.round(PITCH.L / GRID) + 1, NY = Math.round(PITCH.W / GRID) + 1;
const controlP = new Float32Array(NX * NY);

function computeControl(home, away) {
  let sum = 0;
  for (let j = 0; j < NY; j++) {
    const y = j * GRID;
    for (let i = 0; i < NX; i++) {
      const x = i * GRID;
      let dh = Infinity, da = Infinity;
      for (const p of home) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < dh) dh = d; }
      for (const p of away) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < da) da = d; }
      let p;
      if (dh === Infinity && da === Infinity) p = 0.5;
      else if (da === Infinity) p = 1;
      else if (dh === Infinity) p = 0;
      else p = 1 / (1 + Math.exp(-(Math.sqrt(da) - Math.sqrt(dh)) / 2.6));
      controlP[j * NX + i] = p;
      sum += p;
    }
  }
  return sum / (NX * NY);
}

// Marching squares over the node grid at p = 0.5. Returns line segments
// [x0, y0, x1, y1] with each end linearly interpolated along a cell edge.
function controlContour() {
  const segs = [];
  const at = (i, j) => controlP[j * NX + i];
  // Point where p crosses 0.5 between nodes (i0,j0) and (i1,j1).
  const lerp = (i0, j0, i1, j1) => {
    const a = at(i0, j0), b = at(i1, j1);
    const t = (0.5 - a) / (b - a);
    return [(i0 + t * (i1 - i0)) * GRID, (j0 + t * (j1 - j0)) * GRID];
  };
  for (let j = 0; j < NY - 1; j++) {
    for (let i = 0; i < NX - 1; i++) {
      const c = (at(i, j) > 0.5 ? 1 : 0) | (at(i + 1, j) > 0.5 ? 2 : 0) | (at(i + 1, j + 1) > 0.5 ? 4 : 0) | (at(i, j + 1) > 0.5 ? 8 : 0);
      if (c === 0 || c === 15) continue;
      const top = () => lerp(i, j, i + 1, j), right = () => lerp(i + 1, j, i + 1, j + 1);
      const bottom = () => lerp(i, j + 1, i + 1, j + 1), left = () => lerp(i, j, i, j + 1);
      const add = (p, q) => segs.push([p[0], p[1], q[0], q[1]]);
      switch (c) {
        case 1: case 14: add(left(), top()); break;
        case 2: case 13: add(top(), right()); break;
        case 3: case 12: add(left(), right()); break;
        case 4: case 11: add(right(), bottom()); break;
        case 6: case 9: add(top(), bottom()); break;
        case 7: case 8: add(left(), bottom()); break;
        case 5: case 10: {
          // Saddle: resolve with the cell-centre average.
          const centre = (at(i, j) + at(i + 1, j) + at(i + 1, j + 1) + at(i, j + 1)) / 4 > 0.5;
          if ((c === 5) === centre) { add(left(), bottom()); add(top(), right()); }
          else { add(left(), top()); add(right(), bottom()); }
        }
      }
    }
  }
  return segs;
}

/* ================================================================
   Analysis 3 — Passing lanes
   A lane from passer P to teammate R (within 42 m) is blocked if any
   opponent O, projecting onto PR at distance t along it (0 < t < |PR|),
   sits closer to the segment than
     1.3 + 0.05 × min(t, |PR| - t)
   i.e. a defender needs to be tight to cut a lane near either end, but
   has more room to get across it in the middle of a long ball.
   ================================================================ */
const LANE_RANGE = 42;
const opponentsOf = (team) => state.players.filter((p) => p.team !== team && visible(p));
const teammatesOf = (p) => state.players.filter((q) => q.team === p.team && q !== p);
const attackDir = (team) => (team === 'home' ? 1 : -1);     // +x for home, -x for away
const visible = (p) => p.team === 'home' || state.showAway !== false;

function laneBlocker(from, to, opponents) {
  const len = dist(from, to);
  if (len < 1e-6) return null;
  const ux = (to.x - from.x) / len, uy = (to.y - from.y) / len;
  let worst = null, worstMargin = 0;
  for (const o of opponents) {
    const t = (o.x - from.x) * ux + (o.y - from.y) * uy;
    if (t <= 0 || t >= len) continue;
    const perp = Math.abs((o.x - from.x) * uy - (o.y - from.y) * ux);
    const margin = 1.3 + 0.05 * Math.min(t, len - t) - perp;
    if (margin > worstMargin) { worst = o; worstMargin = margin; }
  }
  return worst;
}

function lanesFrom(passer) {
  const opp = opponentsOf(passer.team);
  return teammatesOf(passer)
    .filter((r) => dist(passer, r) <= LANE_RANGE)
    .map((r) => {
      const blocker = laneBlocker(passer, r, opp);
      return { from: passer, to: r, len: dist(passer, r), blocker, breaks: linesBroken(passer, r) };
    });
}

/* ================================================================
   Analysis 4 — Lines broken
   Each team's outfielders are grouped by unit (D, DM, M, AM, A) and a
   unit's line is its mean x. A pass breaks an opposing line when that
   mean x lies strictly between passer and receiver, with the receiver
   further forward in the passer's attacking direction.
   ================================================================ */
function unitLines(team) {
  const groups = {};
  for (const p of state.players) {
    if (p.team !== team || p.unit === 'G' || !visible(p)) continue;
    (groups[p.unit] ||= []).push(p.x);
  }
  return Object.entries(groups).map(([unit, xs]) => ({ unit, x: xs.reduce((a, b) => a + b, 0) / xs.length }));
}

function linesBroken(from, to, team = from.team) {
  const dir = attackDir(team);
  const a = from.x * dir, b = to.x * dir;
  if (b <= a) return 0;
  const other = team === 'home' ? 'away' : 'home';
  return unitLines(other).filter((l) => l.x * dir > a && l.x * dir < b).length;
}

/* ================================================================
   Analysis 5 — Offside line
   For the team in possession: the second-last defender's depth, or the
   ball's if it is further forward, and never behind halfway. "Depth" is
   x × attackDir so the same rule works for both directions. Attackers
   beyond it (other than the carrier) are offside.
   ================================================================ */
function offsideLine(team) {
  const dir = attackDir(team);
  const depths = opponentsOf(team).map((p) => p.x * dir).sort((a, b) => b - a);
  const second = depths.length >= 2 ? depths[1] : -Infinity;
  const depth = Math.max(second, state.ball.x * dir, (PITCH.L / 2) * dir);
  return depth * dir;
}

function offsidePlayers(team, lineX, holder) {
  const dir = attackDir(team);
  return state.players.filter((p) => p.team === team && p !== holder && p.x * dir > lineX * dir + 1e-9);
}

/* ================================================================
   Analysis 6 — Team shape
   Convex hull of the outfielders (Andrew's monotone chain), with width
   across the pitch (y span), depth along it (x span) and hull area.
   ================================================================ */
function convexHull(pts) {
  const P = pts.map((p) => ({ x: p.x, y: p.y })).sort((a, b) => a.x - b.x || a.y - b.y);
  if (P.length < 3) return P;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [], upper = [];
  for (const p of P) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function teamShape(team) {
  const out = state.players.filter((p) => p.team === team && p.unit !== 'G' && visible(p));
  if (!out.length) return null;
  const xs = out.map((p) => p.x), ys = out.map((p) => p.y);
  const hull = convexHull(out);
  return {
    hull,
    width: Math.max(...ys) - Math.min(...ys),
    depth: Math.max(...xs) - Math.min(...xs),
    area: hull.length >= 3 ? polyArea(hull) : 0,
  };
}

/* ================================================================
   Analysis pass: everything the renderer and readout need, recomputed
   from scratch on every frame that changes the board.
   ================================================================ */
let A = null;   // latest analysis

function analyse() {
  const players = state.players.filter(visible);
  const home = players.filter((p) => p.team === 'home');
  const away = players.filter((p) => p.team === 'away');
  const homeShare = computeControl(home, away);
  const holder = carrier();
  if (holder) state.possession = holder.team;
  const team = state.possession;
  const offX = offsideLine(team);
  const sel = players.find((p) => p.id === state.selected) || null;
  A = {
    zones: computeZones(players),
    homeShare,
    carrier: holder,
    selected: sel,
    lanes: holder ? lanesFrom(holder) : [],
    selLanes: sel && sel !== holder ? lanesFrom(sel) : [],
    offsideX: offX,
    offside: offsidePlayers(team, offX, holder),
    shape: { home: teamShape('home'), away: teamShape('away') },
    threats: state.match && state.match.status === 'defending' ? computeThreats() : null,
  };
  return A;
}

/* ================================================================
   View transform
   Every draw call works in pitch metres. `view` holds the affine map
   pitch -> CSS pixels; the canvas transform is that map times dpr.

   Landscape: screenX = ox + x*s,        screenY = oy + y*s
              (we attack left -> right, our left touchline at the top)
   Portrait:  screenX = ox + y*s,        screenY = oy + (L - x)*s
              (we attack up the screen, our left touchline on the left)

   Written as canvas setTransform(a, b, c, d, e, f):
     screenX = a*x + c*y + e,  screenY = b*x + d*y + f
   ================================================================ */
const canvas = document.getElementById('pitch');
let ctx = canvas.getContext('2d');   // swapped to the background canvas while it is rebuilt
const view = { s: 1, a: 1, b: 0, c: 0, d: 1, e: 0, f: 0, portrait: false, dpr: 1, cssW: 0, cssH: 0 };

function layout() {
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  view.cssW = cssW; view.cssH = cssH; view.dpr = dpr;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));

  view.portrait = cssH > cssW * 1.08;
  // Board extent in metres along screen axes, including the margin.
  const bw = (view.portrait ? PITCH.W : PITCH.L) + 2 * MARGIN;
  const bh = (view.portrait ? PITCH.L : PITCH.W) + 2 * MARGIN;
  const s = Math.min(cssW / bw, cssH / bh);   // uniform scale: never stretched
  view.s = s;
  // Centre the pitch rectangle (without margin) in the viewport.
  const ox = (cssW - (bw - 2 * MARGIN) * s) / 2;
  const oy = (cssH - (bh - 2 * MARGIN) * s) / 2;
  if (view.portrait) {
    Object.assign(view, { a: 0, b: -s, c: s, d: 0, e: ox, f: oy + PITCH.L * s });
  } else {
    Object.assign(view, { a: s, b: 0, c: 0, d: s, e: ox, f: oy });
  }
  renderBackground();
}

// Switch the context into pitch-metre space.
function usePitchSpace() {
  const { a, b, c, d, e, f, dpr } = view;
  ctx.setTransform(a * dpr, b * dpr, c * dpr, d * dpr, e * dpr, f * dpr);
}

// Pitch metres -> CSS pixels.
function toScreen(x, y) {
  return { x: view.a * x + view.c * y + view.e, y: view.b * x + view.d * y + view.f };
}

// CSS pixels -> pitch metres (inverse of the 2x2 map plus translation).
function toPitch(px, py) {
  const { a, b, c, d, e, f } = view;
  const det = a * d - b * c;
  const u = px - e, v = py - f;
  return { x: (d * u - c * v) / det, y: (a * v - b * u) / det };
}

// Run `fn` in a frame anchored at pitch point (x, y) whose axes read
// upright on screen. In portrait the pitch is rotated -90°, so rotating
// the local frame +90° cancels it. Units stay in metres.
function uprightAt(x, y, fn) {
  ctx.save();
  ctx.translate(x, y);
  if (view.portrait) ctx.rotate(Math.PI / 2);
  fn();
  ctx.restore();
}

// A screen-direction offset (right, down) expressed in pitch metres.
function screenOffset(dx, dy) {
  return view.portrait ? { x: -dy, y: dx } : { x: dx, y: dy };
}

// Lines at real width, but never thinner than ~1.2 device-independent pixels.
function lineWidthM(metres) {
  return Math.max(metres, 1.2 / view.s);
}

/* ================================================================
   Pitch markings (all at real dimensions)
   ================================================================ */
// Canvas colours come from the CSS tokens; re-read when the theme changes.
const colors = {};
function readTokens() {
  const css = getComputedStyle(document.documentElement);
  for (const k of ['surround', 'flood', 'grass', 'line', 'goal', 'home', 'away', 'select', 'offside', 'blocked', 'badge', 'homeRun', 'awayRun']) colors[k] = css.getPropertyValue('--' + k).trim();
  colors.homeRGB = hexToRGB(colors.home);
  colors.awayRGB = hexToRGB(colors.away);
}
function hexToRGB(h) {
  const n = parseInt(h.replace('#', ''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/* ================================================================
   Background (cached)
   Surround, floodlight, pitch shadow, mown stripes, noise and markings
   never change between frames, so they are drawn once into an
   offscreen canvas on resize or theme change and blitted each frame.
   ================================================================ */
const bgCanvas = document.createElement('canvas');
let noisePattern = null;

function makeNoise() {
  const n = document.createElement('canvas');
  n.width = n.height = 128;
  const nctx = n.getContext('2d'), img = nctx.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 18;
  }
  nctx.putImageData(img, 0, 0);
  return n;
}

function renderBackground() {
  if (!colors.grass) return;
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  const main = ctx;
  ctx = bgCanvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  noisePattern ||= ctx.createPattern(makeNoise(), 'repeat');

  // Floodlit surround: a bright pool towards the top, falling off to a vignette.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = colors.surround;
  ctx.fillRect(0, 0, W, H);
  const flood = ctx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.3, Math.max(W, H) * 0.75);
  flood.addColorStop(0, colors.flood);
  flood.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = flood;
  ctx.fillRect(0, 0, W, H);

  // Soft shadow under the pitch.
  usePitchSpace();
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 40 * view.dpr;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = colors.grass;
  ctx.fillRect(-MARGIN, -MARGIN, PITCH.L + 2 * MARGIN, PITCH.W + 2 * MARGIN);
  ctx.restore();

  // Mown stripes: 18 bands across the length, alternating light and dark.
  const bands = 18, bw = (PITCH.L + 2 * MARGIN) / bands;
  for (let i = 0; i < bands; i++) {
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.04)';
    ctx.fillRect(-MARGIN + i * bw, -MARGIN, bw, PITCH.W + 2 * MARGIN);
  }
  // Floodlight highlight on the grass itself.
  const c = { x: PITCH.L / 2, y: PITCH.W / 2 };
  const glow = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, PITCH.L * 0.65);
  glow.addColorStop(0, 'rgba(255,255,255,0.07)');
  glow.addColorStop(1, 'rgba(0,0,0,0.18)');
  ctx.fillStyle = glow;
  ctx.fillRect(-MARGIN, -MARGIN, PITCH.L + 2 * MARGIN, PITCH.W + 2 * MARGIN);

  drawMarkings();

  // Noise over everything, in device pixels so the grain stays fine.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = noisePattern;
  ctx.fillRect(0, 0, W, H);
  // Vignette.
  const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  ctx = main;
  bgStamp++;
}
let bgStamp = 0;

function drawPitch() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgCanvas, 0, 0);
}

// Pitch markings, all at real dimensions.
function drawMarkings() {
  const { L, W } = PITCH;
  usePitchSpace();
  ctx.strokeStyle = colors.line;
  ctx.fillStyle = colors.line;
  ctx.lineWidth = lineWidthM(PITCH.lineW);
  ctx.lineJoin = 'miter';

  // Outline and halfway line.
  ctx.strokeRect(0, 0, L, W);
  line(L / 2, 0, L / 2, W);

  // Centre circle and spot.
  circle(L / 2, W / 2, PITCH.circleR);
  dot(L / 2, W / 2, 0.25);

  // Both ends: `dir` = +1 at our goal (x = 0), -1 at theirs (x = L).
  for (const [gx, dir] of [[0, 1], [L, -1]]) {
    const boxY0 = (W - PITCH.boxW) / 2, sixY0 = (W - PITCH.sixW) / 2;
    ctx.strokeRect(Math.min(gx, gx + dir * PITCH.boxD), boxY0, PITCH.boxD, PITCH.boxW);
    ctx.strokeRect(Math.min(gx, gx + dir * PITCH.sixD), sixY0, PITCH.sixD, PITCH.sixW);

    const spotX = gx + dir * PITCH.spotX;
    dot(spotX, W / 2, 0.22);

    // Penalty arc: the part of the 9.15 m circle round the spot that lies
    // beyond the box edge. The edge is (boxD - spotX) = 5.5 m from the spot,
    // so the arc spans ±acos(5.5 / 9.15) about the direction into the field.
    const half = Math.acos((PITCH.boxD - PITCH.spotX) / PITCH.circleR);
    const mid = dir > 0 ? 0 : Math.PI;
    ctx.beginPath();
    ctx.arc(spotX, W / 2, PITCH.circleR, mid - half, mid + half);
    ctx.stroke();

    // Goal frame behind the line, with a faint net.
    const gx0 = Math.min(gx, gx - dir * PITCH.goalDepth), gh = PITCH.goalY1 - PITCH.goalY0;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(gx0, PITCH.goalY0, PITCH.goalDepth, gh);
    ctx.strokeStyle = colors.goal;
    ctx.lineWidth = lineWidthM(0.12) * 1.5;
    ctx.strokeRect(gx0, PITCH.goalY0, PITCH.goalDepth, gh);
    ctx.restore();
  }

  // Corner arcs, each a quarter circle opening into the field.
  const corners = [[0, 0, 0], [L, 0, Math.PI / 2], [L, W, Math.PI], [0, W, -Math.PI / 2]];
  for (const [cx, cy, start] of corners) {
    ctx.beginPath();
    ctx.arc(cx, cy, PITCH.cornerR, start, start + Math.PI / 2);
    ctx.stroke();
  }
}

function line(x0, y0, x1, y1) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
function circle(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
}
function dot(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

/* ================================================================
   Coverage layers
   Control is drawn as a tiny per-node image (one pixel per grid node)
   scaled up with smoothing, so the tint is soft without per-cell paths.
   ================================================================ */
const tintCanvas = document.createElement('canvas');
tintCanvas.width = NX; tintCanvas.height = NY;
const tintCtx = tintCanvas.getContext('2d');
const tintImage = tintCtx.createImageData(NX, NY);

function drawControl() {
  const d = tintImage.data, [hr, hg, hb] = colors.homeRGB, [ar, ag, ab] = colors.awayRGB;
  for (let k = 0; k < NX * NY; k++) {
    const p = controlP[k], home = p >= 0.5;
    // Alpha ∝ |2p - 1|^0.9, capped at 0.3 so the grass reads through.
    const a = 0.3 * Math.pow(Math.abs(2 * p - 1), 0.9);
    d[k * 4] = home ? hr : ar; d[k * 4 + 1] = home ? hg : ag; d[k * 4 + 2] = home ? hb : ab;
    d[k * 4 + 3] = a * 255;
  }
  tintCtx.putImageData(tintImage, 0, 0);
  usePitchSpace();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, PITCH.L, PITCH.W); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  // Pixel (i, j) is centred on node (i*GRID, j*GRID).
  ctx.drawImage(tintCanvas, -GRID / 2, -GRID / 2, NX * GRID, NY * GRID);
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = lineWidthM(0.14);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (const [x0, y0, x1, y1] of controlContour()) { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); }
  ctx.stroke();
}

function drawZones() {
  usePitchSpace();
  ctx.lineWidth = lineWidthM(0.12);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  for (const p of state.players) {
    const z = A.zones.get(p.id);
    if (!z || z.poly.length < 3) continue;
    ctx.beginPath();
    z.poly.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
    ctx.closePath();
    ctx.globalAlpha = p.id === state.selected ? 0.42 : 0.22;
    ctx.fillStyle = colors[p.team];
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.stroke();
  }
}

/* ================================================================
   Tactical overlays: shape, offside line, passing lanes
   ================================================================ */
function drawShape() {
  usePitchSpace();
  for (const team of ['home', 'away']) {
    const s = A.shape[team];
    if (!s || s.hull.length < 3) continue;
    ctx.beginPath();
    s.hull.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
    ctx.closePath();
    ctx.globalAlpha = 0.07; ctx.fillStyle = colors[team]; ctx.fill();
    ctx.globalAlpha = 0.45; ctx.strokeStyle = shade(colors[team], 0.5);
    ctx.lineWidth = lineWidthM(0.16); ctx.setLineDash([0.25, 0.6]); ctx.lineCap = 'round'; ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
}

function drawOffside() {
  usePitchSpace();
  ctx.strokeStyle = colors.offside;
  ctx.lineWidth = lineWidthM(0.22);
  ctx.setLineDash([1.6, 1]);
  line(A.offsideX, 0, A.offsideX, PITCH.W);
  ctx.setLineDash([]);
}

// Open lanes are white and thin out with distance; blocked ones are dashed red.
// Open lanes are white and thin out with distance; the best line-breaking
// option is gold. Blocked lanes only show for the player you've selected,
// so the default picture is "where can the ball go", not every option.
function drawLanes(lanes, faint) {
  usePitchSpace();
  ctx.lineCap = 'round';
  const focus = !faint && A.carrier && A.carrier.id === state.selected;
  const open = lanes.filter((l) => !l.blocker);
  const best = open.filter((l) => l.breaks).sort((a, b) => b.breaks - a.breaks || b.len - a.len)[0] || null;
  for (const l of lanes) {
    const { from, to } = l;
    if (l.blocker) {
      if (!focus && !faint) continue;
      ctx.strokeStyle = colors.blocked;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = lineWidthM(0.16);
      ctx.setLineDash([0.9, 0.7]);
    } else if (l === best && !faint) {
      ctx.strokeStyle = colors.badge;
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = Math.max(0.55, 2 / view.s);
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = '#fff';
      ctx.globalAlpha = faint ? 0.35 : 0.7;
      ctx.lineWidth = Math.max(0.45 - 0.33 * (l.len / LANE_RANGE), 1.1 / view.s);
      ctx.setLineDash([]);
    }
    line(from.x, from.y, to.x, to.y);
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  if (!state.layers.lines || faint) return;
  // Label only the two most line-breaking open passes.
  for (const l of open.filter((q) => q.breaks).sort((a, b) => b.breaks - a.breaks).slice(0, 2)) {
    badge((l.from.x + l.to.x) / 2, (l.from.y + l.to.y) / 2, `+${l.breaks}`);
  }
}

// A small upright pill label centred on a pitch point.
function badge(x, y, text) {
  const h = Math.max(1.8, 13 / view.s);
  uprightAt(x, y, () => {
    ctx.font = `700 ${h * 0.8}px ${FONT_COND}`;
    const w = ctx.measureText(text).width + h * 0.6;
    ctx.fillStyle = colors.badge;
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 0, h * 0.04);
  });
}

/* ================================================================
   Players and ball
   Sizes are in metres but floored in pixels so they stay legible and
   touchable on a phone, where 1 m can be ~5 px.
   ================================================================ */
const playerR = () => Math.max(PLAYER_R, (state.match ? 9 : 7) / view.s);
const FONT_COND = "'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif";

// Lighten (amt > 0) or darken (amt < 0) a #rrggbb colour.
function shade(hex, amt) {
  const [r, g, b] = hexToRGB(hex);
  const f = (c) => Math.round(amt > 0 ? c + (255 - c) * amt : c * (1 + amt));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
const ballR = () => Math.max(BALL_R, 3.5 / view.s);

function drawPlayers() {
  const r = playerR();
  const holder = carrier();
  usePitchSpace();

  const offside = new Set(state.layers.offside || state.match ? A.offside : []);
  for (const p of state.players) {
    if (!visible(p)) continue;
    if (offside.has(p)) {
      ctx.save();
      ctx.strokeStyle = colors.offside;
      ctx.lineWidth = r * 0.16;
      ctx.setLineDash([r * 0.3, r * 0.2]);
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.8, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    // Drop shadow: a soft offset ellipse, far cheaper than shadowBlur per disc.
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    const sh = screenOffset(r * 0.15, r * 0.3);
    ctx.beginPath(); ctx.arc(p.x + sh.x, p.y + sh.y, r * 1.06, 0, Math.PI * 2); ctx.fill();
    if (p.id === state.selected) {
      ctx.fillStyle = colors.select;
      ctx.globalAlpha = 0.28;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.75, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Shaded disc: lit from the top-left of the screen, whatever the rotation.
    const lo = screenOffset(-r * 0.4, -r * 0.4), lit = { x: p.x + lo.x, y: p.y + lo.y };
    const g = ctx.createRadialGradient(lit.x, lit.y, r * 0.1, p.x, p.y, r);
    g.addColorStop(0, shade(colors[p.team], 0.35));
    g.addColorStop(1, shade(colors[p.team], -0.15));
    ctx.fillStyle = g;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = r * 0.14;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    if (p === holder) {
      ctx.save();
      ctx.lineWidth = r * 0.12;
      ctx.setLineDash([r * 0.35, r * 0.25]);
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.55, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    if (p.id === state.selected) {
      ctx.save();
      ctx.strokeStyle = colors.select;
      ctx.lineWidth = r * 0.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.3, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    if (state.layers.roles || p.id === state.selected || p.id === state.hover) {
      uprightAt(p.x, p.y, () => {
        ctx.font = `600 ${r * 0.85}px ${FONT_COND}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.lineWidth = r * 0.25; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.strokeText(p.role, 0, r * 1.45);
        ctx.fillStyle = '#fff';
        ctx.fillText(p.role, 0, r * 1.45);
      });
    }
    uprightAt(p.x, p.y, () => {
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${r * 1.2}px ${FONT_COND}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(p.num), 0, r * 0.06);
    });
  }

  // Ball trail while a pass is in the air.
  if (state.trail?.length) {
    state.trail.forEach((q, i) => {
      ctx.fillStyle = `rgba(255,255,255,${(0.5 * (i + 1)) / state.trail.length})`;
      dot(q.x, q.y, ballR() * (0.35 + (0.5 * (i + 1)) / state.trail.length));
    });
  }
  // Ball on top of everything.
  const br = ballR() * (1 + 0.7 * (state.ballLift || 0));
  if (state.ballLift) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    dot(state.ball.x, state.ball.y + br * 1.2 * state.ballLift, ballR());
  }
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#111';
  ctx.lineWidth = br * 0.25;
  ctx.beginPath(); ctx.arc(state.ball.x, state.ball.y, br, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

/* ================================================================
   Runs: geometry
   A run is a quadratic Bézier from the player S to the end point E.
   Its control point is pushed off the chord's midpoint M along the
   chord's left unit normal n by a signed fraction of the chord length:
     C = M + n × bend × |SE|
   The curve passes through B(½) = M + n × bend × |SE| / 2, which is
   where the handle sits. Dragging the handle to pointer Q solves back:
     bend = 2 × ((Q - M) · n) / |SE|
   so pulling it to either side of the chord gives the matching sign.
   ================================================================ */
const MAX_BEND = 0.7, SNAP_BEND = 0.04;

function runGeom(from, run) {
  const L = Math.max(dist(from, run), 1e-6);
  const nx = -(run.y - from.y) / L, ny = (run.x - from.x) / L;
  const M = { x: (from.x + run.x) / 2, y: (from.y + run.y) / 2 };
  const k = run.bend * L;
  return {
    S: { x: from.x, y: from.y }, E: { x: run.x, y: run.y }, M, L, nx, ny,
    C: { x: M.x + nx * k, y: M.y + ny * k },
    H: { x: M.x + nx * k / 2, y: M.y + ny * k / 2 },
  };
}

function bezier(g, t) {
  const u = 1 - t;
  return {
    x: u * u * g.S.x + 2 * u * t * g.C.x + t * t * g.E.x,
    y: u * u * g.S.y + 2 * u * t * g.C.y + t * t * g.E.y,
  };
}

function bendFromHandle(g, q) {
  const b = (2 * ((q.x - g.M.x) * g.nx + (q.y - g.M.y) * g.ny)) / g.L;
  const c = clamp(b, -MAX_BEND, MAX_BEND);
  return Math.abs(c) < SNAP_BEND ? 0 : c;
}

function drawRuns() {
  usePitchSpace();
  const r = playerR();
  for (const p of state.players) {
    if (!p.run || !visible(p)) continue;
    const g = runGeom(anim ? anim.starts.get(p) || p : p, p.run);
    ctx.strokeStyle = colors[p.team + 'Run'];
    ctx.lineWidth = lineWidthM(0.3);
    ctx.globalAlpha = anim ? 0.35 : 0.95;
    ctx.setLineDash([1, 0.7]);
    ctx.beginPath(); ctx.moveTo(g.S.x, g.S.y); ctx.quadraticCurveTo(g.C.x, g.C.y, g.E.x, g.E.y); ctx.stroke();
    ctx.setLineDash([]);
    // Arrowhead along the end tangent (E - C).
    const tl = Math.hypot(g.E.x - g.C.x, g.E.y - g.C.y) || 1;
    const tx = (g.E.x - g.C.x) / tl, ty = (g.E.y - g.C.y) / tl, h = r * 0.9;
    ctx.fillStyle = colors[p.team + 'Run'];
    ctx.beginPath();
    ctx.moveTo(g.E.x, g.E.y);
    ctx.lineTo(g.E.x - tx * h - ty * h * 0.55, g.E.y - ty * h + tx * h * 0.55);
    ctx.lineTo(g.E.x - tx * h + ty * h * 0.55, g.E.y - ty * h - tx * h * 0.55);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    if (anim || state.match) continue;
    // Bend handle.
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = colors[p.team];
    ctx.lineWidth = r * 0.18;
    ctx.beginPath(); ctx.arc(g.H.x, g.H.y, r * 0.45, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

/* ================================================================
   Interaction
   Hit-testing is done in metres against a touch-sized radius. The
   pointer keeps its grab offset so nothing jumps under the finger.
   Dragging the carrier moves the ball with them, keeping the ball at
   the same offset from their feet.
   ================================================================ */
let drag = null;

function pointerPitch(ev) {
  const r = canvas.getBoundingClientRect();
  return toPitch(ev.clientX - r.left, ev.clientY - r.top);
}

// Nearest thing under the pointer that the current tool can act on.
// Small targets (ball, run handles, run ends) win ties within half a
// player radius, so they can be grabbed even when sitting on a player.
function hitTest(pt, tool = state.tool) {
  const reach = Math.max(playerR() * 1.3, 22 / view.s);
  const bias = playerR() * 0.5;
  let best = null, bestD = reach;
  const consider = (kind, target, d) => { if (d < bestD) { best = { kind, target }; bestD = d; } };
  for (const p of state.players) {
    if (!visible(p)) continue;
    consider('player', p, dist(pt, p));
    if (p.run && tool !== 'pass' && !state.match) {
      const g = runGeom(p, p.run);
      consider('bend', p, dist(pt, g.H) - bias);
      consider('runEnd', p, dist(pt, g.E) - bias);
    }
  }
  if (tool !== 'runs' && !state.match) consider('ball', state.ball, dist(pt, state.ball) - bias);
  return best;
}

canvas.addEventListener('pointerdown', (ev) => {
  if (anim) return;
  const pt = pointerPitch(ev);
  const hit = hitTest(pt);
  if (!hit && state.match?.status === 'defending') {
    const lane = laneAt(pt);
    if (lane) { cutLane(lane); return; }
  }
  if (!hit) {
    state.selected = null;
    requestRender();
    return;
  }
  const t = hit.target;
  // A tap near (but not on) one of your players still cuts the lane under it.
  if (state.match?.status === 'defending' && hit.kind === 'player' && t.team === 'home' && dist(pt, t) > playerR() * 1.05) {
    const lane = laneAt(pt);
    if (lane) { cutLane(lane); return; }
  }
  if (state.match && (hit.kind !== 'player' || t.team !== 'home' || state.match.status !== 'defending')) {
    const lane = state.match.status === 'defending' && laneAt(pt);
    if (lane) { cutLane(lane); return; }
    if (hit.kind === 'player') state.selected = t.id;
    requestRender();
    return;
  }
  drag = { kind: hit.kind, target: t, pointerId: ev.pointerId, dx: t.x - pt.x, dy: t.y - pt.y, carried: null, start: pt };
  if (state.tool === 'pass' && hit.kind === 'ball') {
    const passer = carrier();
    if (!passer) { drag = null; toast('Nobody has the ball: move a player onto it first'); return; }
    drag.kind = 'pass';
    drag.passer = passer;
  } else if (state.tool === 'pass') {
    drag = null;
    if (hit.kind === 'player') state.selected = t.id;
    requestRender();
    return;
  } else if (hit.kind === 'player') {
    state.selected = t.id;
    if (state.tool === 'runs') drag.kind = 'newRun';
    else if (carrier() === t) drag.carried = { dx: state.ball.x - t.x, dy: state.ball.y - t.y };
  } else if (hit.kind === 'bend' || hit.kind === 'runEnd') {
    state.selected = t.id;
    drag.dx = t.run.x - pt.x; drag.dy = t.run.y - pt.y;
  }
  canvas.setPointerCapture(ev.pointerId);
  canvas.style.cursor = 'grabbing';
  requestRender();
});

canvas.addEventListener('pointermove', (ev) => {
  const pt = pointerPitch(ev);
  if (DEBUG) debugPointer = toScreen(pt.x, pt.y);
  if (!drag || ev.pointerId !== drag.pointerId) {
    const hit = ev.pointerType === 'mouse' && !anim ? hitTest(pt) : null;
    if (ev.pointerType === 'mouse') canvas.style.cursor = hit ? 'grab' : 'default';
    const hover = hit && hit.kind === 'player' ? hit.target.id : null;
    if (hover !== state.hover || DEBUG) { state.hover = hover; requestRender(); }
    return;
  }
  const t = drag.target;
  switch (drag.kind) {
    case 'player': case 'ball':
      t.x = pt.x + drag.dx;
      t.y = pt.y + drag.dy;
      clampToPitch(t);
      if (state.match) constrainDefender(t);
      else if (drag.carried) {
        state.ball.x = t.x + drag.carried.dx;
        state.ball.y = t.y + drag.carried.dy;
        clampToPitch(state.ball);
      }
      break;
    case 'newRun': {
      // Only becomes a run once the pointer has clearly left the player.
      if (!drag.moved && dist(pt, drag.start) < 1.5) break;
      drag.moved = true;
      const end = { x: pt.x, y: pt.y };
      clampToPitch(end);
      t.run = { x: end.x, y: end.y, bend: 0 };
      break;
    }
    case 'runEnd': {
      const end = { x: pt.x + drag.dx, y: pt.y + drag.dy };
      clampToPitch(end);
      t.run.x = end.x; t.run.y = end.y;
      break;
    }
    case 'bend':
      t.run.bend = bendFromHandle(runGeom(t, t.run), pt);
      break;
    case 'pass':
      drag.to = dist(pt, drag.start) > 2 ? passTarget(drag.passer, pt) : null;
      break;
  }
  requestRender();
});

function endDrag(ev) {
  if (!drag || ev.pointerId !== drag.pointerId) return;
  // Runs too short to read as movement are dropped.
  if ((drag.kind === 'newRun' || drag.kind === 'runEnd') && drag.target.run && dist(drag.target, drag.target.run) < 2) {
    drag.target.run = null;
  }
  const done = drag;
  drag = null;
  if (done.kind === 'pass' && done.to) commitPass(done.passer, done.to);
  canvas.style.cursor = ev.pointerType === 'mouse' && hitTest(pointerPitch(ev)) ? 'grab' : 'default';
  requestRender();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ================================================================
   Pass resolution
   Positions are where everyone will be when the ball arrives (after
   their planned runs), so a pass is judged against the finished picture.
   • Ground pass (≤ 35 m): intercepted by the first defender, along the
     path, whose projection lands on the path (0 ≤ t ≤ length) and who
     sits within 1.0 + 0.045 × length of it. The path runs from the
     release point to the receiver's end position.
   • Lofted pass (> 35 m): clears everyone in transit, but is lost if any
     defender ends within 4 m of the landing point.
   • Into space: the ball goes to whoever ends nearest the landing point,
     from either side.
   ================================================================ */
const LOFT_OVER = 35, LOFT_LOSE_R = 4;
const finalPos = (p) => (p.run ? { x: p.run.x, y: p.run.y } : { x: p.x, y: p.y });
const interceptRadius = (len) => 1.0 + 0.045 * len;

function resolvePass(team, from, to, receiver, at = finalPos) {
  const len = dist(from, to);
  const opp = opponentsOf(team);
  const lofted = len > LOFT_OVER;
  if (lofted) {
    for (const o of opp) {
      if (dist(at(o), to) < LOFT_LOSE_R) return { result: 'lost', winner: o, point: to, lofted, len };
    }
  } else if (len > 1e-6) {
    const ux = (to.x - from.x) / len, uy = (to.y - from.y) / len, r = interceptRadius(len);
    let first = null, firstT = Infinity;
    for (const o of opp) {
      const q = at(o);
      const t = (q.x - from.x) * ux + (q.y - from.y) * uy;
      if (t < 0 || t > len) continue;
      if (Math.abs((q.x - from.x) * uy - (q.y - from.y) * ux) < r && t < firstT) { first = o; firstT = t; }
    }
    if (first) return { result: 'intercepted', winner: first, point: { x: from.x + ux * firstT, y: from.y + uy * firstT }, lofted, len };
  }
  if (receiver) return { result: 'complete', winner: receiver, point: to, lofted, len };
  let near = null, nearD = Infinity;
  for (const p of state.players) {
    if (!visible(p) || p.id === from.id) continue;
    const d = dist(at(p), to);
    if (d < nearD) { near = p; nearD = d; }
  }
  return { result: near && near.team === team ? 'complete' : 'lost-space', winner: near, point: to, lofted, len, space: true };
}

function passToast(o) {
  const who = (p) => `${p.team === 'home' ? '' : 'away '}#${p.num}`;
  if (o.result === 'complete') toast(o.space ? `Into space: ${who(o.winner)} gets there first` : `${o.lofted ? 'Lofted pass finds' : 'Pass complete to'} ${who(o.winner)}`, 'good');
  else if (o.result === 'intercepted') toast(`Intercepted by ${who(o.winner)}`, 'bad');
  else if (o.result === 'lost') toast(`Lofted ball lost: ${who(o.winner)} was within 4 m of the landing spot`, 'bad');
  else toast(o.winner ? `Into space: ${who(o.winner)} gets there first` : 'Pass runs out of play', 'bad');
}

// Put the ball at a player's feet, just ahead of them.
function giveBall(p) {
  state.ball = { x: p.x + 0.9 * attackDir(p.team), y: p.y };
  clampToPitch(state.ball);
  state.possession = p.team;
}

/* ================================================================
   Play
   All runs animate together over 2.2 s with an ease-in-out, each along
   its own Bézier. A carrier with a run dribbles: the ball keeps its
   offset from their feet. Analysis recomputes every frame.
   ================================================================ */
const PLAY_MS = 2200, RELEASE_AT = 0.3;
let anim = null;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// Plan and start an animation of every planned run plus an optional pass.
// With runs, the pass is released 30% of the way in and lands as the
// runs finish; a pass on its own plays straight away at ball speed.
function play() {
  if (anim || state.match) return;
  const movers = state.players.filter((p) => p.run && visible(p));
  const pp = state.pendingPass;
  let pass = null;
  if (pp) {
    state.pendingPass = null;
    const passer = state.players.find((p) => p.id === pp.passerId);
    if (passer && carrier() === passer) pass = { passer, to: { x: pp.x, y: pp.y }, receiver: state.players.find((p) => p.id === pp.receiverId) || null };
    else toast('Pass cancelled: the passer no longer has the ball', 'bad');
  }
  if (!movers.length && !pass) { if (!pp) toast('Nothing to play yet: draw a run or a pass'); requestRender(); return; }
  startAnim(movers, pass);
}

// Animate `movers` along their runs, with an optional ball flight
// { passer, to, receiver, outcome? }. Without a precomputed outcome the
// pass is resolved here. opts.silent suppresses the toast; opts.extra is
// handed to onPlayFinished.
function startAnim(movers, pass, opts = {}) {
  const holder = carrier();
  anim = {
    t0: performance.now(),
    dur: PLAY_MS,
    starts: new Map(movers.map((p) => [p, { x: p.x, y: p.y }])),
    geoms: new Map(movers.map((p) => [p, runGeom(p, p.run)])),
    dribble: holder ? { p: holder, dx: state.ball.x - holder.x, dy: state.ball.y - holder.y } : null,
    pass: null,
    silent: !!opts.silent,
    extra: opts.extra,
  };
  if (pass) {
    const releaseT = movers.length ? RELEASE_AT : 0;
    const g = anim.geoms.get(pass.passer);
    const at = g ? bezier(g, easeInOut(releaseT)) : pass.passer;
    const off = anim.dribble || { dx: 0, dy: 0 };
    const from = { x: at.x + off.dx, y: at.y + off.dy, id: pass.passer.id };
    const outcome = pass.outcome || resolvePass(pass.passer.team, from, pass.to, pass.receiver);
    const flightLen = dist(from, outcome.point);
    if (!movers.length) anim.dur = clamp(dist(from, pass.to) * 28, 450, 1400) + (outcome.lofted ? 300 : 0);
    // An interception meets the ball part-way along the full flight.
    const arriveT = releaseT + (1 - releaseT) * (outcome.len > 0 ? clamp(flightLen / outcome.len, 0, 1) : 1);
    anim.pass = { from, outcome, releaseT, arriveT };
  }
  requestAnimationFrame(tick);
}

function tick(now) {
  if (!anim) return;
  const raw = clamp((now - anim.t0) / anim.dur, 0, 1);
  const e = easeInOut(raw);
  for (const [p, g] of anim.geoms) Object.assign(p, bezier(g, e));
  const pass = anim.pass;
  state.ballLift = 0;
  if (pass && raw >= pass.releaseT) {
    const f = clamp((raw - pass.releaseT) / Math.max(pass.arriveT - pass.releaseT, 1e-6), 0, 1);
    const k = 1 - (1 - f) * (1 - f);            // ball decelerates slightly as it arrives
    const to = pass.outcome.point;
    if (f < 1) {
      state.ball.x = pass.from.x + (to.x - pass.from.x) * k;
      state.ball.y = pass.from.y + (to.y - pass.from.y) * k;
      (state.trail ||= []).push({ x: state.ball.x, y: state.ball.y });
      if (state.trail.length > 16) state.trail.shift();
      if (pass.outcome.lofted) state.ballLift = Math.sin(Math.PI * f);
    } else if (pass.outcome.winner) {
      // Arrived: the ball stays at the winner's feet while runs finish.
      state.ball.x = pass.outcome.winner.x; state.ball.y = pass.outcome.winner.y;
    }
  } else if (anim.dribble) {
    state.ball.x = anim.dribble.p.x + anim.dribble.dx;
    state.ball.y = anim.dribble.p.y + anim.dribble.dy;
    clampToPitch(state.ball);
  }
  if (raw >= 1) finishPlay();
  else requestAnimationFrame(tick);
  requestRender();
}

function finishPlay() {
  for (const p of anim.geoms.keys()) { clampToPitch(p); p.run = null; }
  const { pass, silent, extra } = anim;
  anim = null;
  state.ballLift = 0;
  state.trail = [];
  if (pass) {
    if (pass.outcome.winner) giveBall(pass.outcome.winner);
    else state.ball = { ...pass.outcome.point };
    if (!silent) passToast(pass.outcome);
  }
  onPlayFinished(pass && pass.outcome, extra);
}
let onPlayFinished = () => {};

// Pass tool: drop target is a teammate's planned run end, a teammate
// (who receives wherever their run takes them), or empty space.
function passTarget(passer, pt) {
  const snap = Math.max(playerR() * 1.6, 24 / view.s);
  let best = null, bestD = snap;
  for (const q of teammatesOf(passer)) {
    if (!visible(q)) continue;
    if (q.run && dist(pt, q.run) < bestD) { best = { receiver: q, x: q.run.x, y: q.run.y }; bestD = dist(pt, q.run); }
    if (dist(pt, q) < bestD) { const f = finalPos(q); best = { receiver: q, x: f.x, y: f.y }; bestD = dist(pt, q); }
  }
  if (best) return best;
  const p = { x: pt.x, y: pt.y };
  clampToPitch(p);
  return { receiver: null, x: p.x, y: p.y };
}

function commitPass(passer, target) {
  state.pendingPass = { passerId: passer.id, receiverId: target.receiver?.id ?? null, x: target.x, y: target.y };
  if (state.players.some((p) => p.run && visible(p))) toast('Pass queued: it plays with the runs');
  else play();
}

function drawPassArrow(from, to, dashed) {
  usePitchSpace();
  ctx.strokeStyle = '#fff';
  ctx.fillStyle = '#fff';
  ctx.lineWidth = lineWidthM(0.28);
  ctx.setLineDash(dashed ? [0.5, 0.6] : []);
  line(from.x, from.y, to.x, to.y);
  ctx.setLineDash([]);
  const len = dist(from, to) || 1, ux = (to.x - from.x) / len, uy = (to.y - from.y) / len, h = playerR() * 0.9;
  ctx.beginPath();
  ctx.moveTo(to.x, to.y);
  ctx.lineTo(to.x - ux * h - uy * h * 0.5, to.y - uy * h + ux * h * 0.5);
  ctx.lineTo(to.x - ux * h + uy * h * 0.5, to.y - uy * h - ux * h * 0.5);
  ctx.closePath(); ctx.fill();
  if (len > LOFT_OVER) {
    ctx.globalAlpha = 0.5;
    circle(to.x, to.y, LOFT_LOSE_R);
    ctx.globalAlpha = 1;
  }
}

function drawPasses() {
  if (state.pendingPass && !anim) drawPassArrow(state.ball, state.pendingPass, true);
  if (drag && drag.kind === 'pass' && drag.to) drawPassArrow(state.ball, drag.to, false);
}

/* ================================================================
   Board controls
   ================================================================ */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const who = (p) => `${p.team === 'home' ? 'Blue' : 'Red'} #${p.num} ${p.role}`;
function setHTML(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; } }
for (const team of ['home', 'away']) {
  const sel = $(`#formation-${team}`);
  sel.innerHTML = Object.keys(FORMATIONS).map((f) => `<option>${f}</option>`).join('');
  sel.addEventListener('change', () => { if (!anim && !state.match) setFormation(team, sel.value); requestRender(); });
}

$('#show-away').addEventListener('change', (ev) => { state.showAway = ev.target.checked; state.pendingPass = null; requestRender(); });
