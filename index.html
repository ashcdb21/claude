    out.push({ sit: SITUATIONS.findIndex((q) => q.id === id), minute: 0, seed: (seed * 1000 + half * 100 + i) >>> 0 });
  }
  const mins = out.map(() => Math.floor(rng() * 44) + 1 + (half === 2 ? 45 : 0)).sort((a, b) => a - b);
  out.forEach((m, i) => { m.minute = mins[i]; });
  return out;
}
// One line for the match feed: what happened in a passage, from its events.
function summarize(w, sit) {
  const o = w.outcome, shots = w.shots, name = (t) => w.T[t].name;
  const last = shots[shots.length - 1];
  if (o.kind === 'goal') {
    const s = shots.filter((q) => q.team === o.team && q.result === 'goal').pop();
    const p = s && w.players.find((q) => q.id === s.id);
    if (o.og) return { text: `Own goal! ${name(o.team)} score`, kind: 'goal', team: o.team };
    return { text: `GOAL! ${p ? `${tag(p)} ${p.name}` : name(o.team)} ${s?.pen ? 'scores from the spot' : s?.header ? 'heads in' : 'scores'}${s && !s.pen ? ` (xG ${s.xg.toFixed(2)})` : ''}`, kind: 'goal', team: o.team };
  }
  if (last) {
    const p = w.players.find((q) => q.id === last.id);
    const how = { saved: 'saved', blocked: 'blocked', off: 'wide', goal: 'in' }[last.result] || last.result;
    return { text: `${name(last.team)} chance: ${p ? `${tag(p)} ${p.name}` : ''} ${last.header ? 'heads' : 'shoots'}, ${how} (xG ${last.xg.toFixed(2)})`, kind: 'shot', team: last.team };
  }
  const regain = (w.turnovers || [])[0];
  if (o.kind === 'offside') return { text: `${name(oppOf(o.team))} caught offside`, kind: '', team: o.team };
  if (o.kind === 'foul') return { text: `Free kick to ${name(o.team)}`, kind: '', team: o.team };
  if (regain) return { text: `${name(regain.team)} win it back${depthOf(regain.team, regain.x) > PITCH.L / 2 ? ' high up' : ''}`, kind: '', team: regain.team };

}

   ================================================================ */
const fx = [];
function burst(x, y, color, big = false) { fx.push({ kind: 'burst', x, y, color, t0: performance.now(), dur: big ? 900 : 650, big }); requestRender(); }
function flash(kind) {
  const el = $('#flash');
  el.className = ''; void el.offsetWidth; el.className = kind;
}
function drawFx() {
  const now = performance.now();
  for (let i = fx.length - 1; i >= 0; i--) if (now - fx[i].t0 > fx[i].dur) fx.splice(i, 1);
  if (!fx.length) return;
  usePitchSpace();
  for (const f of fx) {
    const t = clamp((now - f.t0) / f.dur, 0, 1);
    ctx.strokeStyle = f.color;
    for (const k of f.big ? [0, 0.18, 0.36] : [0, 0.2]) {
      const tt = clamp(t - k, 0, 1);
      if (!tt) continue;
      ctx.globalAlpha = 1 - tt;
      ctx.lineWidth = Math.max(0.5 * (1 - tt), 1 / view.s);
      circle(f.x, f.y, 1 + tt * (f.big ? 12 : 7));
    }
    ctx.globalAlpha = 1;
  }
  requestRender();
}

}

const sideOf = (src, team) => (team === 'home' ? src.us : src.them);

function styleLabel(t) {

/* ================================================================
   The board during coaching: players placed from an engine setup,
   labelled with their roles; and the setup read back after dragging.
   ================================================================ */
function placeSetup(teams, setup) {
  setupMatch(teams.home.tactic.formation, teams.away.tactic.formation);
  state.showAway = true;
  for (const team of ['home', 'away']) {
    const tm = teams[team];
    state.players.filter((p) => p.team === team).forEach((p, i) => {
      const [x, y] = setup.pos[team][i];
      Object.assign(p, { x, y, base: { x, y }, run: null, baseRun: null, name: tm.lineup[i]?.name || '', tag: ROLES[tm.tactic.roles[i]]?.short || p.role });
    });
  }
  state.ball = { ...setup.ball }; state.baseBall = { ...setup.ball };
  state.possession = setup.poss; state.pendingPass = null; state.selected = null;
}
const slotOf = (p) => +p.id.split('-')[1];
function boardSetup(transition) {
  const pos = { home: [], away: [] };
  for (const p of state.players) pos[p.team][slotOf(p)] = [p.x, p.y];
  const holder = carrier();
  const poss = holder ? holder.team : state.possession;
  return { pos, ball: { ...state.ball }, poss, holder: holder && holder.team === poss ? slotOf(holder) : null, transition: !!transition };
}

/* ================================================================
   Replays: one simulated passage, played back on the board with a
   timeline you can scrub, pause and jump along to its key moments.
   ================================================================ */
const replay = { w: null, t: 0, playing: false, speed: 1, last: 0, shown: 0, focus: null, key: [], start: null, onEnd: null };
function saveStart() { return { players: state.players.map((p) => [p.x, p.y]), ball: { ...state.ball }, possession: state.possession }; }
function restoreStart(s) {
  if (!s) return;
  state.players.forEach((p, i) => { if (s.players[i]) { p.x = s.players[i][0]; p.y = s.players[i][1]; } });
  state.ball = { ...s.ball }; state.possession = s.possession; state.ballLift = 0;
}
function startReplay(w, onEnd) {
  replay.w = w; replay.t = 0; replay.playing = true; replay.shown = 0; replay.focus = null; replay.key = keyMoments(w); replay.last = performance.now();
  replay.start = replay.start || saveStart(); replay.onEnd = onEnd || null;
  state.selected = null;
  $('#stage').classList.add('with-timeline');
  $('#timeline').hidden = false;
  renderTimeline(true);
  renderSide();
  layout();
  requestAnimationFrame(replayTick);
}
function clearReplay(restore = true) {
  if (!replay.w && !replay.start) return;
  replay.playing = false;
  if (restore) restoreStart(replay.start);
  replay.w = null; replay.start = null; replay.focus = null; replay.key = [];
  $('#timeline').hidden = true;
  $('#stage').classList.remove('with-timeline');
  layout();
  requestRender();
}
function applyFrame(t) {
  const w = replay.w, frames = w.frames, dt = ENG.DT;
  const i = clamp(Math.floor(t / dt), 0, frames.length - 1), k = clamp(t / dt - i, 0, 1);
  const a = frames[i], b = frames[Math.min(frames.length - 1, i + 1)];
  state.players.forEach((p) => {
    const j = w.players.findIndex((q) => q.id === p.id);
    if (j < 0) return;
    p.x = a.p[j][0] + (b.p[j][0] - a.p[j][0]) * k;
    p.y = a.p[j][1] + (b.p[j][1] - a.p[j][1]) * k;
  });
  state.ball.x = a.b[0] + (b.b[0] - a.b[0]) * k;
  state.ball.y = a.b[1] + (b.b[1] - a.b[1]) * k;
  state.ballLift = clamp((a.b[2] + (b.b[2] - a.b[2]) * k) / 6, 0, 1);
  replay.owner = a.b[3] >= 0 ? w.players[a.b[3]].id : null;
}
function replayTick(now) {
  if (!replay.w || !replay.playing) return;
  const w = replay.w;
  replay.t = Math.min(w.t, replay.t + ((now - replay.last) / 1000) * replay.speed);
  replay.last = now;
  applyFrame(replay.t);
  const due = w.events.filter((e) => e.t <= replay.t + 1e-6).length;
  if (due > replay.shown) {
    const e = w.events[due - 1];
    replay.shown = due;
    if (!['milestone', 'run'].includes(e.kind)) ticker(e.text, e.kind === 'goal' ? 'goal' : e.kind === 'shot' ? 'shot' : e.kind === 'win' ? 'win' : '');
    if (e.kind === 'goal') { flash(e.team === 'home' ? 'goal' : 'against'); burst(state.ball.x, state.ball.y, e.team === 'home' ? colors.home : colors.away, true); }
    renderLog();
  }
  renderTimeline();
  requestRender();
  if (replay.t >= w.t - 1e-9) { replay.playing = false; renderTimeline(true); replayEnded(); return; }
  requestAnimationFrame(replayTick);
}
function replayEnded() {
  const w = replay.w, o = w.outcome;
  ticker(outcomeText(o, w), o.kind === 'goal' ? 'goal' : '', 2600);
  replay.onEnd?.(w);
  renderSide();
}
function outcomeText(o, w) {
  const n = o.team ? w.T[o.team].name : '';
  switch (o.kind) {
    case 'goal': return `Goal: ${n}`;
    case 'goalKick': return `Goal kick to ${n}`;
    case 'corner': return `Corner to ${n}`;
    case 'throw': return `Throw-in to ${n}`;
    case 'foul': return `Free kick to ${n}`;
    case 'penalty': return 'Penalty saved';
    case 'offside': return `Offside: free kick to ${n}`;

  }
}
function seek(t, focus = null) {
  if (!replay.w) return;

  replay.t = clamp(t, 0, replay.w.t);
  replay.shown = replay.w.events.filter((e) => e.t <= replay.t + 1e-6).length;
  replay.focus = focus;
  applyFrame(replay.t);
  renderTimeline(true);
  renderLog();
  if (focus) ticker(MOMENT_INFO[focus.kind].title, 'focus', 0);
  else $('#ticker').className = '';
  renderSide();
  requestRender();
}
function togglePlay() {
  if (!replay.w) return;
  if (replay.playing) { replay.playing = false; renderTimeline(true); return; }
  if (replay.t >= replay.w.t - 1e-9) { replay.t = 0; replay.shown = 0; }
  replay.focus = null; $('#ticker').className = '';
  replay.playing = true; replay.last = performance.now();
  renderTimeline(true); renderSide();
  requestAnimationFrame(replayTick);
}
function renderTimeline(full) {
  if (!replay.w) return;
  const w = replay.w;
  $('#tl-range').value = String(Math.round((1000 * replay.t) / Math.max(w.t, 0.1)));
  $('#tl-time').textContent = `${replay.t.toFixed(1)} / ${w.t.toFixed(1)} s`;
  $('#tl-play').textContent = replay.playing ? '❚❚' : '▶';
  if (!full) return;
  setHTML($('#tl-marks'), replay.key.map((m, i) => `<button data-km="${i}" class="${m.team === 'home' ? 'good' : 'bad'}" style="left:${(100 * m.t) / Math.max(w.t, 0.1)}%" title="${esc(MOMENT_INFO[m.kind].title)} at ${m.t.toFixed(1)} s"></button>`).join(''));
}
$('#tl-play').addEventListener('click', togglePlay);
$('#tl-range').addEventListener('input', (ev) => { if (replay.w) seek((+ev.target.value / 1000) * replay.w.t); });
$('#tl-marks').addEventListener('click', (ev) => { const b = ev.target.closest('[data-km]'); if (b) focusMoment(replay.key[+b.dataset.km]); });

  if (lab.busy || anim) return;
  if (replay.w) clearReplay(true);
  lab.busy = true; lab.progress = 0; lab.coachNote = '';
  renderSide(); syncBars();
  const teams = labTeams(), setup = boardSetup(lab.setupT), sit = labSit(), agg = newAgg();
  const t0 = performance.now();
  for (let i = 0; i < TEST_RUNS; i += 10) {
    for (let k = i; k < Math.min(TEST_RUNS, i + 10); k++) addRun(agg, engRun(runInput(teams, setup, TEST_SEED * 7919 + k)));
    lab.progress = (i + 10) / TEST_RUNS;
    renderSide();
    await new Promise((r) => setTimeout(r, 0));
  }
  lab.result = { agg, M: metricsOf(agg), sit: lab.sit, label: `${teamLine(teams.home)} v ${teamLine(teams.away)}`, ms: performance.now() - t0,
    tactics: JSON.stringify([teams.home.tactic, teams.away.tactic]) };
  lab.insights = appMode === 'lessons' ? [] : insights(agg, teams, sit);
  lab.marks = [...agg.shots.map((s) => ({ kind: s.result === 'goal' ? 'goal' : 'shot', team: s.team, x: s.x, y: s.y })),
    ...agg.regains.filter((r) => r.team === 'home').map((r) => ({ kind: 'won', team: 'home', x: r.x, y: r.y }))];
  lab.busy = false;
  if (appMode === 'lessons') lessonScored();
  renderSide(); syncBars();
  requestRender();
}

// Apply one of the assistant's suggestions and test it against what you had.
function tryFix(f) {
  if (lab.busy) return;
  if (lab.result) lab.pinned = lab.result;
  const src = labSrc();
  if (f.key) setInstr(src, f.team, f.key, f.value);
  else if (f.role) setRole(src, f.team, f.slot, f.role);
  toast(`Testing: ${f.label}`);
  refreshSituation();
  labTest();
}

// Tiles: the situation's headline number, then shots for and against.
function tileKeys(sit) {
  const keys = [sit.primary.key];
  for (const k of ['shotFor', 'shotAg', 'box', 'boxAg']) if (keys.length < 3 && !keys.includes(k)) keys.push(k);
  return keys;
}
function tilesHTML(r, pin) {
  const sit = SITUATIONS[r.sit];
  return tileKeys(sit).map((k) => {
    const meta = METRICS[k], v = Math.round(r.M[k]);
    let delta = '';
    if (pin && pin !== r && pin.sit === r.sit) {
      const c = compareMetric(pin.agg, r.agg, k), d = Math.round(c.d);
      const better = (d > 0) === (meta.good === 'up');
      delta = !c.sig ? `<span class="delta noise" title="Within the noise of 100 runs">${d > 0 ? '+' : ''}${d} · noise</span>`
        : `<span class="delta ${better ? 'good' : 'bad'}">${d > 0 ? '+' : ''}${d} pts</span>`;
    }
    const sub = k === 'shotFor' ? `xG ${r.M.xgFor.toFixed(2)} per run` : k === 'shotAg' ? `xG ${r.M.xgAg.toFixed(2)} per run` : '';
    return `<div class="tile"><span class="k">${esc(meta.label)}</span><span class="v">${v}%</span>${delta}<span class="sub">${sub}</span></div>`;
  }).join('');
}

/* ================================================================

const LESSON_KEY = 'tacticsLab.lessons.v1';

if (typeof lesson.progress !== 'object' || Array.isArray(lesson.progress)) lesson.progress = {};

/* ================================================================
   Match: your tactic against an opponent, told through its key moments
   (a dozen passages a half), with a half-time report and the chance to
   change things before the second half.
   ================================================================ */
const match = { phase: 'pre', seed: 0, items: [], shown: 0, score: { home: 0, away: 0 }, halves: [null, null], timer: 0, current: -1, minute: 0 };
function kickOff() {
  match.seed = (Math.random() * 1e6) >>> 0;
  match.items = []; match.shown = 0; match.score = { home: 0, away: 0 }; match.halves = [null, null]; match.current = -1; match.minute = 0;
  playHalf(1);
}
function playHalf(half) {
  const teams = teamsOf(club), agg = newAgg(), plan = matchPlan(teams, match.seed, half);
  for (const m of plan) {
    const sit = SITUATIONS[m.sit], t = withForce(teams, sit), setup = engSetup(t, sit);
    const w = engRun(runInput(t, setup, m.seed));
    addRun(agg, w);
    match.items.push({ ...m, half, teams: t, setup, sum: summarize(w, sit), goal: w.outcome.kind === 'goal' ? w.outcome.team : null, xg: { home: w.T.home.S.xg, away: w.T.away.S.xg } });
  }
  match.halves[half - 1] = { agg, teams };
  match.phase = half === 1 ? 'first' : 'second';
  revealNext();
}
function revealNext() {
  clearTimeout(match.timer);
  const pending = match.items.slice(match.shown);
  if (!pending.length) {
    match.phase = match.phase === 'first' ? 'ht' : 'ft';
    ticker(match.phase === 'ht' ? `Half-time: ${match.score.home}–${match.score.away}` : `Full time: ${match.score.home}–${match.score.away}`, match.phase === 'ft' && match.score.home > match.score.away ? 'win' : '', 3000);
    if (match.phase === 'ft' && match.score.home > match.score.away) flash('win');
    renderSide(); syncBars();
    return;
  }
  const it = pending[0];
  match.shown++; match.minute = it.minute;
  if (it.goal) {
    match.score[it.goal]++;
    flash(it.goal === 'home' ? 'goal' : 'against');
  }
  ticker(`${it.minute}’ ${it.sum.text}`, it.goal ? 'goal' : it.sum.kind === 'shot' ? 'shot' : '', 1600);
  renderScorebug(); renderSide(); syncBars();
  match.timer = setTimeout(revealNext, it.goal ? 1500 : 800);
}
function skipReveal() { clearTimeout(match.timer); while (match.shown < match.items.length) { const it = match.items[match.shown++]; if (it.goal) match.score[it.goal]++; match.minute = it.minute; } revealNext(); }
function watchItem(i) {
  const it = match.items[i];
  if (!it) return;
  clearReplay(false);
  match.current = i;
  placeSetup(it.teams, it.setup);
  replay.start = saveStart();
  startReplay(engRun(runInput(it.teams, it.setup, it.seed), true));
}
function renderScorebug() {
  const el = $('#scorebug');
  el.hidden = appMode !== 'match' || match.phase === 'pre';
  if (el.hidden) return;
  setHTML(el, `<span class="dot home"></span><span class="sc">${match.score.home}–${match.score.away}</span><span class="dot away"></span><span class="min">${match.phase === 'ft' ? 'FT' : match.phase === 'ht' ? 'HT' : `${match.minute}’`}</span>`);
}
function matchStats(which) {
  const aggs = match.halves.filter(Boolean).slice(0, which === 'ht' ? 1 : 2).map((h) => h.agg);
  const sum = (t, k) => aggs.reduce((a, g) => a + g.S[t][k], 0);
  const poss = sum('home', 'possT') / Math.max(sum('home', 'possT') + sum('away', 'possT'), 1);
  const row = (label, h, a) => `<tr><td>${h}</td><td>${esc(label)}</td><td>${a}</td></tr>`;
  const pct = (t) => `${Math.round((100 * sum(t, 'passesOk')) / Math.max(sum(t, 'passes'), 1))}%`;
  return `<table class="mstats">${row('Possession', `${Math.round(poss * 100)}%`, `${Math.round((1 - poss) * 100)}%`)}${row('Shots', sum('home', 'shots'), sum('away', 'shots'))}
    ${row('On target', sum('home', 'onTarget'), sum('away', 'onTarget'))}${row('xG', sum('home', 'xg').toFixed(2), sum('away', 'xg').toFixed(2))}
    ${row('Pass completion', pct('home'), pct('away'))}${row('Won it back high', sum('home', 'highRegains'), sum('away', 'highRegains'))}</table>`;
}
function matchReport(half) {
  const h = match.halves[half - 1];
  if (!h) return '';
  const qs = insights(h.agg, h.teams, { id: 'match' }).filter((q) => q.tone === 'bad' || q.tone === 'good').slice(0, 3);
  if (!qs.length) return '<p class="muted small">Nothing stood out: the game is even on the patterns that matter.</p>';
  return qs.map((q) => `<div class="card ${q.tone}"><b>${esc(q.title)}</b><p class="small">${esc(q.text)}</p>${q.fixes.length ? `<p class="small muted">Worth trying: ${q.fixes.map((f) => esc(f.label)).join('; ')}.</p>` : ''}</div>`).join('');
}
function renderMatchSide() {
  const us = club.us, them = club.them;
  if (match.phase === 'pre') {
    return `<section><h2>Matchday</h2><p class="muted small">No full ninety minutes: the game is played as its key moments, eighteen passages each half, picked by how the two styles meet. Goals are goals the simulation scores.</p></section>
      <section><div class="card blue"><div class="row"><b class="grow">${esc(teamLine(teamsOf(club).home))}</b><button class="link" data-goto="tactics">Change</button></div></div>
      <div class="card red"><label class="irow"><span>Opponent</span><select class="full" id="opp-select">${OPPONENTS.map((o) => `<option value="${o.id}" ${o.id === club.oppId ? 'selected' : ''}>${esc(o.name)} (${esc(STYLES[o.style].name)})</option>`).join('')}</select></label>
      <p class="muted small">${esc(OPPONENTS.find((o) => o.id === club.oppId)?.blurb || '')}</p></div></section>

  }

    `<div class="it ${it.goal ? 'goal' : ''}" ${match.current === i ? 'aria-current="true"' : ''}><span class="m">${it.minute}’</span><span class="txt">${esc(it.sum.text)}<span class="sit">${esc(SITUATIONS[it.sit].name)}</span></span><button class="btn small" data-watch-item="${i}">Watch</button></div>`).join('');
  const ht = match.phase === 'ht', ft = match.phase === 'ft';
  return `
    <section><div class="scoreboard"><span class="tm">${esc(us.name)}</span><span class="sc">${match.score.home}–${match.score.away}</span><span class="tm r">${esc(them.name)}</span></div>
      <p class="muted small">${ft ? 'Full time' : ht ? 'Half-time' : `${match.minute}’`}</p></section>
    ${ht ? `<section><h2>Half-time report</h2>${matchStats('ht')}${matchReport(1)}<div class="row"><button class="btn" data-goto="tactics">Change tactics</button><button class="btn primary" id="match-second">Second half</button></div></section>` : ''}
    ${ft ? `<section><h2>Full time</h2>${matchStats('ft')}${matchReport(2)}<button class="btn primary" id="match-again">New match</button></section>` : ''}
    <section><h2>Moments</h2><div class="feed">${feed || '<p class="muted small">Kick-off…</p>'}</div></section>
    ${replay.w ? `<section><h2>Key moments in this passage</h2>${momentsHTML()}</section>` : ''}`;
}

/* ================================================================
   Drawing for the coaching modes
   ================================================================ */
function drawCoaching() {
  usePitchSpace();
  const r = playerR();
  if (appMode === 'tactics' && tac.ghost) {
    // Where each player goes in the other phase: a faint ring and a thread.
    const mine = state.players.filter((p) => p.team === tac.team);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = lineWidthM(0.15);
    ctx.setLineDash([0.6, 0.6]);
    mine.forEach((p, i) => { const g = tac.ghost[i]; if (g) line(p.x, p.y, g[0], g[1]); });
    ctx.setLineDash([]);
    ctx.strokeStyle = colors[tac.team]; ctx.globalAlpha = 0.55;
    mine.forEach((p, i) => { const g = tac.ghost[i]; if (g) circle(g[0], g[1], r * 0.7); });
    ctx.globalAlpha = 1;
    return;
  }
  // Test marks: shots (ours blue, theirs red, goals filled) and where we won it back.
  if (!replay.w && lab.marks.length && lab.result && lab.result.sit === lab.sit && (appMode === 'lab' || (appMode === 'lessons' && lesson.id))) {
    for (const m of lab.marks) {
      if (m.kind === 'won') {
        ctx.strokeStyle = 'rgba(74,222,128,0.8)'; ctx.lineWidth = lineWidthM(0.16);
        const q = r * 0.35; line(m.x - q, m.y - q, m.x + q, m.y + q); line(m.x - q, m.y + q, m.x + q, m.y - q);
      } else {
        ctx.strokeStyle = colors[m.team]; ctx.fillStyle = colors[m.team]; ctx.lineWidth = lineWidthM(0.2);
        if (m.kind === 'goal') dot(m.x, m.y, r * 0.5); else circle(m.x, m.y, r * 0.5);
      }
    }
  }
  if (!replay.w) return;
  // The ball's recent path.
  const w = replay.w, i = Math.floor(replay.t / ENG.DT);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = lineWidthM(0.18); ctx.setLineDash([0.5, 0.5]);
  ctx.beginPath();
  for (let k = Math.max(0, i - 30); k <= Math.min(i, w.frames.length - 1); k++) { const b = w.frames[k].b; k === Math.max(0, i - 30) ? ctx.moveTo(b[0], b[1]) : ctx.lineTo(b[0], b[1]); }
  ctx.stroke(); ctx.setLineDash([]);
  const m = replay.focus;
  if (!m) return;
  // The moment's annotation: who was involved, the pass, the line, the overload.
  const find = (id) => state.players.find((p) => p.id === id);
  if (m.line != null) {
    const x = xAtDepth(m.team, m.line);
    ctx.strokeStyle = colors.offside; ctx.lineWidth = lineWidthM(0.25); ctx.setLineDash([1.2, 0.8]);
    line(x, 0, x, PITCH.W); ctx.setLineDash([]);
  }
  if (m.r) { ctx.fillStyle = 'rgba(245,184,61,0.12)'; ctx.strokeStyle = colors.select; ctx.lineWidth = lineWidthM(0.2); ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  if (m.arrow) {
    const [x0, y0, x1, y1] = m.arrow, len = Math.hypot(x1 - x0, y1 - y0) || 1, ux = (x1 - x0) / len, uy = (y1 - y0) / len, h = r * 0.9;
    ctx.strokeStyle = colors.select; ctx.fillStyle = colors.select; ctx.lineWidth = lineWidthM(0.35);
    line(x0, y0, x1 - ux * h, y1 - uy * h);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - ux * h - uy * h * 0.55, y1 - uy * h + ux * h * 0.55); ctx.lineTo(x1 - ux * h + uy * h * 0.55, y1 - uy * h - ux * h * 0.55); ctx.closePath(); ctx.fill();
  }
  ctx.lineWidth = lineWidthM(0.3);
  for (const id of m.ids || []) { const p = find(id); if (p) { ctx.strokeStyle = colors.select; circle(p.x, p.y, r * 1.9); } }
  for (const id of m.foes || []) { const p = find(id); if (p) { ctx.strokeStyle = colors.blocked; ctx.setLineDash([0.6, 0.4]); circle(p.x, p.y, r * 1.9); ctx.setLineDash([]); } }
}

/* ================================================================
   Ask the coach (AI): turns a test into plain advice. Needs a model
   connection; the lab works fully without it.
   ================================================================ */
async function askCoach() {
  const r = lab.result;
  if (!r || lab.coachBusy) return;
  lab.coachBusy = true; lab.coachNote = 'Reading your numbers…'; renderSide();
  const sit = SITUATIONS[r.sit], teams = labTeams(), fmt = (x) => tileKeys(sit).map((k) => `${METRICS[k].label} ${Math.round(x.M[k])}%`).join('; ');
  const tactic = (t) => `${styleLabel(t.tactic)}, ${t.tactic.formation}; roles ${t.tactic.roles.map((k, i) => `${FORMATIONS[t.tactic.formation][i][2]} ${ROLES[k].name}`).join(', ')}; instructions ${Object.entries(t.tactic.instr).map(([k, v]) => `${INSTR[k].label} ${INSTR[k].opts.find((o) => o[0] === v)[1]}`).join(', ')}`;
  const prompt = `You are an experienced football coach helping another coach read a tactics simulation.
Situation: ${sit.name}. ${sit.brief}
Blue (the coach's side): ${tactic(teams.home)}.
Red: ${teams.away.name}: ${tactic(teams.away)}.
Result over ${r.agg.n} simulated passages: ${fmt(r)}. Blue xG per passage ${r.M.xgFor.toFixed(2)}, Red ${r.M.xgAg.toFixed(2)}.${lab.pinned && lab.pinned !== r ? `\nPinned earlier test: ${fmt(lab.pinned)}.` : ''}
How the shots came about: Blue ${JSON.stringify(r.agg.causes.home)}, Red ${JSON.stringify(r.agg.causes.away)}.
In two short paragraphs of plain text (no markdown, no lists), explain what the numbers say about Blue's approach in this situation and name one specific change to test next, using the role and instruction names above.`;
  try {
    const text = await askClaude(prompt, { maxTokens: 1500, onText: (_, all) => { lab.coachNote = all; renderSide(); } });
    lab.coachNote = text.replace(/^\s{0,3}#{1,6}\s+/gm, '').replace(/(\*\*|__|`)/g, '').trim();
  } catch (err) {
    lab.coachNote = err.unavailable ? `The coach needs an AI connection. ${err.message}` : `Couldn’t get advice: ${err.message}`;
  }
  lab.coachBusy = false;
  renderSide();
}

function setTool(tool) {

  requestRender();
}

let toastTimer = 0;
function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = kind), 2600);

window.addEventListener('keydown', (ev) => {
  if (ev.target.closest('input, textarea, select') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (appMode !== 'board') {
    // Coaching screens: Space watches a run, or plays and pauses the one on screen.
    if (k === ' ' && (appMode === 'lab' || (appMode === 'lessons' && lesson.id) || (appMode === 'match' && replay.w))) { ev.preventDefault(); replay.w ? togglePlay() : labWatch(); }
    else if (k === 'escape' && replay.w) { replay.focus = null; renderSide(); requestRender(); }
    return;
  }
  if (k === 'v') setTool('move');
  else if (k === 'r') setTool('runs');
  else if (k === 'p') setTool('pass');
  else if (k === 'b') backToBase();
  else if (k === ' ') { ev.preventDefault(); play(); }
  else if (k === 'c') { state.coverage = { control: 'zones', zones: 'off', off: 'control' }[state.coverage]; state.view = 'custom'; }
  else if (k === 'l') cycleView();
  else if (k === 'escape') state.selected = null;
  else if (k === 'delete' || k === 'backspace') {
    const p = state.players.find((q) => q.id === state.selected);
    if (p && p.run && !anim) p.run = null;
    else state.pendingPass = null;
  } else return;
  requestRender();
});

/* ================================================================
   Debug overlay (?debug): a known-coordinate marker, attack arrow,
   upright text and the pointer position in metres, to sanity-check
   the transform and its inverse.
   ================================================================ */
const DEBUG = new URLSearchParams(location.search).has('debug');
let debugPointer = null;

function drawDebug() {
  usePitchSpace();
  // Marker on the far box edge's corner: (105 - 16.5, 13.84).
  const mx = PITCH.L - PITCH.boxD, my = (PITCH.W - PITCH.boxW) / 2;
  ctx.fillStyle = '#ffcc00';
  dot(mx, my, 0.8);
  uprightAt(mx, my, () => {
    ctx.font = '600 2.2px system-ui, sans-serif';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`(${mx}, ${my})`, 1, -1);
  });

  // Attack direction arrow along the halfway line area.
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 0.5;
  line(40, 4, 65, 4);
  ctx.beginPath(); ctx.moveTo(65, 4); ctx.lineTo(62, 2.5); ctx.lineTo(62, 5.5); ctx.closePath(); ctx.fill();
  uprightAt(52.5, 7.5, () => {
    ctx.font = '600 2px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WE ATTACK', 0, 0);
  });

  if (debugPointer) {
    const p = toPitch(debugPointer.x, debugPointer.y);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`x ${p.x.toFixed(2)}  y ${p.y.toFixed(2)}  s ${view.s.toFixed(2)}px/m  ${view.portrait ? 'portrait' : 'landscape'}`, 10, 20);
  }
}

/* ================================================================
   Panel: readout, selected player, layers, saved tactics
   Panel HTML is only rewritten when its content changes, so a drag
   doesn't thrash the DOM.
   ================================================================ */

function laneStats(lanes) {
  const open = lanes.filter((l) => !l.blocker);
  const best = open.reduce((b, l) => (l.breaks > (b?.breaks ?? 0) ? l : b), null);
  return { open: open.length, total: lanes.length, best };
}

function updateReadout() {
  const h = A.homeShare * 100, c = A.carrier;
  const shape = (s) => (s ? `${s.width.toFixed(0)}×${s.depth.toFixed(0)} m, ${s.area.toFixed(0)} m²` : '—');
  const ls = laneStats(A.lanes);
  setHTML($('#readout'), `
    <div class="bar" aria-hidden="true"><i style="width:${h}%;background:var(--home)"></i><i style="flex:1;background:var(--away)"></i></div>
    <dl class="stats">
      <dt>Space owned</dt><dd>Blue ${h.toFixed(0)}% · Red ${(100 - h).toFixed(0)}%</dd>
      <dt>Ball</dt><dd>${c ? esc(who(c)) : `Loose (${state.possession} last)`}</dd>
      <dt>Lanes open</dt><dd>${c ? `${ls.open} of ${ls.total}` : '—'}</dd>
      <dt>Best line break</dt><dd>${ls.best ? `+${ls.best.breaks} to #${ls.best.to.num}` : '—'}</dd>
      <dt>Offside line</dt><dd>x = ${A.offsideX.toFixed(1)} m${A.offside.length ? ` · offside ${A.offside.map((p) => '#' + p.num).join(', ')}` : ''}</dd>
      <dt>Blue shape</dt><dd>${shape(A.shape.home)}</dd>
      <dt>Red shape</dt><dd>${shape(A.shape.away)}</dd>
    </dl>`);

  const s = A.selected;
  if (!s) { setHTML($('#selected'), '<p class="muted">Tap a player to see their space and options.</p>'); return; }
  const sl = laneStats(s === c ? A.lanes : A.selLanes);
  setHTML($('#selected'), `
    <dl class="stats">
      <dt>Player</dt><dd>${esc(who(s))}</dd>
      <dt>Space owned</dt><dd>${A.zones.get(s.id)?.area.toFixed(0) ?? 0} m²</dd>
      <dt>Passing lanes</dt><dd>${sl.open} of ${sl.total} open</dd>
      <dt>Best line break</dt><dd>${sl.best ? `+${sl.best.breaks} to #${sl.best.to.num}` : '—'}</dd>
      <dt>Offside</dt><dd>${A.offside.includes(s) ? 'Yes' : 'No'}</dd>
      <dt>Planned run</dt><dd>${s.run ? `${dist(s, s.run).toFixed(0)} m` : 'None'}</dd>
    </dl>
    ${s.run && !lab.play ? '<div class="row"><button class="btn" id="remove-run">Remove run</button></div>' : ''}`);
}
$('#selected').addEventListener('click', (ev) => {
  if (ev.target.id !== 'remove-run') return;
  const p = A.selected;
  if (p && !anim) { p.run = null; requestRender(); }
});

// Layers
$('#views').innerHTML = VIEW_ORDER.map((v) => `<button data-view="${v}">${VIEWS[v].label}</button>`).join('');
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => setView(b.dataset.view));
for (const b of document.querySelectorAll('[data-cov]')) b.addEventListener('click', () => { state.coverage = b.dataset.cov; state.view = 'custom'; requestRender(); });
for (const cb of document.querySelectorAll('[data-layer]')) cb.addEventListener('change', () => { state.layers[cb.dataset.layer] = cb.checked; if (cb.dataset.layer !== 'roles') state.view = 'custom'; requestRender(); });
function syncLayers() {
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
  const vb = $('#view-btn .wide');
  if (vb) vb.textContent = `: ${VIEWS[state.view]?.label || 'Custom'}`;
  for (const b of document.querySelectorAll('[data-cov]')) b.setAttribute('aria-pressed', String(b.dataset.cov === state.coverage));
  for (const cb of document.querySelectorAll('[data-layer]')) cb.checked = state.layers[cb.dataset.layer];
}

// Saved tactics
const SAVED_KEY = 'tacticsLab.saved.v1';
let saved = store.get(SAVED_KEY, []);
if (!Array.isArray(saved)) saved = [];
function renderSaved() {
  $('#saved-list').innerHTML = saved.length ? saved.map((s, i) => `
    <li><span class="grow">${esc(s.name)} <span class="muted">${esc(s.board.formations.home)} v ${esc(s.board.formations.away)}</span></span>
      <button class="btn" data-load="${i}">Load</button><button class="btn" data-del="${i}" aria-label="Delete ${esc(s.name)}">Delete</button></li>`).join('')
    : '<li class="muted">No saved setups yet.</li>';
}
$('#save-form').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const name = $('#save-name').value.trim() || `Setup ${saved.length + 1}`;
  saved.unshift({ name, board: snapshot() });
  if (!store.set(SAVED_KEY, saved)) toast('Saved for this session only: browser storage is unavailable', 'bad');
  else toast(`Saved “${name}”`);
  $('#save-name').value = '';
  renderSaved();
});
$('#saved-list').addEventListener('click', (ev) => {
  const load = ev.target.dataset.load, del = ev.target.dataset.del;
  if (load != null && !anim && !lab.play) {
    if (restore(saved[+load].board)) toast(`Loaded “${saved[+load].name}”`);
    requestRender();
  } else if (del != null) {
    saved.splice(+del, 1);
    store.set(SAVED_KEY, saved);
    renderSaved();
  }
});
renderSaved();

// Modes and drawers. On wide landscape screens the drawer sits beside the
// pitch; otherwise it is a bottom sheet toggled from the top bar.
const MODES = ['tactics', 'lab', 'lessons', 'match', 'board'];
const isNarrow = () => !matchMedia('(min-width: 900px) and (orientation: landscape)').matches;
let panelOpen = !isNarrow();
function syncPanel() {
  $('#panel').hidden = !(appMode === 'board' && panelOpen);
  $('#side').hidden = !(appMode !== 'board' && panelOpen);
  $('#panel-open').setAttribute('aria-expanded', String(panelOpen));
  $('#panel-open').innerHTML = panelOpen ? '<span class="long">Hide panel</span><span class="short">Hide</span>' : 'Panel';
}
function setPanel(open) {
  if (!open && !isNarrow()) return;      // the side drawer stays put on wide screens
  panelOpen = open;
  syncPanel();
}
$('#panel-open').addEventListener('click', () => { panelOpen = !panelOpen; syncPanel(); layout(); requestRender(); });

let boardSnap = null, labSitSaved = null;
function setMode(mode, init = false) {
  if (anim || !MODES.includes(mode)) return;
  const prev = init ? null : appMode;
  if (prev === 'match' && (match.phase === 'first' || match.phase === 'second')) skipReveal();
  if (prev === 'board') { boardSnap = snapshot(); store.set(BOARD_KEY, boardSnap); }
  clearReplay(false);
  $('#ticker').className = '';
  // The lab and the lessons each keep their own situation and results.
  if (prev === 'lab') labSitSaved = lab.sit;
  if ((prev === 'lab' && mode === 'lessons') || (prev === 'lessons' && mode === 'lab')) { lab.result = null; lab.pinned = null; lab.marks = []; lab.insights = []; }
  appMode = mode;
  showOnly = null;
  store.set('tacticsLab.mode', mode);
  for (const b of document.querySelectorAll('[data-mode]')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
  state.selected = null;
  setTool(mode === 'board' ? state.tool || 'move' : 'move');
  if (mode === 'board') { if (!restore(boardSnap || store.get(BOARD_KEY, null))) setupMatch('4-3-3', '4-4-2'); }
  else if (mode === 'tactics') { showOnly = tac.team; showShape(); }
  else if (mode === 'lab') { if (labSitSaved != null) lab.sit = labSitSaved; loadSituation(lab.sit, true); }
  else if (mode === 'lessons') { if (lesson.id) loadSituation(lab.sit, true); else showLessonPreview(); }
  else if (mode === 'match') {
    const it = match.items[match.current];
    if (it) placeSetup(it.teams, it.setup);
    else { const teams = teamsOf(club), sit = SITUATIONS.find((s) => s.id === 'midfield'); placeSetup(teams, engSetup(teams, sit)); }
  }
  syncPanel();
  renderSide();
  syncBars();
  layout();
  requestRender();
}
for (const b of document.querySelectorAll('[data-mode]')) b.addEventListener('click', () => setMode(b.dataset.mode));

for (const b of document.querySelectorAll('[data-tab]')) {
  b.addEventListener('click', () => {
    for (const t of document.querySelectorAll('[data-tab]')) t.setAttribute('aria-selected', String(t === b));
    for (const pane of document.querySelectorAll('[data-pane]')) pane.hidden = pane.dataset.pane !== b.dataset.tab;
  });
}
$('#view-btn').addEventListener('click', cycleView);

/* ================================================================
   Render loop (on demand) and resize
   ================================================================ */
let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const board = appMode === 'board';
    const space = !board && lab.showSpace && (appMode === 'lab' || appMode === 'lessons');
    analyse(board || space);
    drawPitch();
    if ((board && state.coverage === 'control') || space) drawControl();
    else if (board && state.coverage === 'zones') drawZones();
    if (board && state.layers.shape) drawShape();
    if (board && state.layers.offside && !lab.play) drawOffside();
    if (board && state.layers.lanes) { drawLanes(A.selLanes.filter((l) => !l.blocker), true); drawLanes(A.lanes, false); }
    if (!board) drawCoaching();
    if (board) { drawRuns(); drawPasses(); }
    if (DEBUG) drawDebug();
    drawPlayers();
    drawFx();
    if (board) { updateReadout(); syncControls(); syncLayers(); if (!anim && !drag) scheduleSave(); }
  });
}

// One dark palette on purpose (a night match), so tokens are read once.
readTokens();
renderBackground();
document.fonts?.ready.then(() => { renderBackground(); requestRender(); });

if (!restore(store.get(BOARD_KEY, null))) setupMatch('4-3-3', '4-4-2');
boardSnap = snapshot();
syncControls();
const firstMode = store.get('tacticsLab.mode', 'lab');
setMode(MODES.includes(firstMode) ? firstMode : 'lab', true);

new ResizeObserver(() => { layout(); requestRender(); }).observe(canvas);
// A devicePixelRatio change (moving between screens) doesn't always resize the element,
// so watch the current ratio and re-arm the query each time it changes.
function watchDpr() {
  matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
    .addEventListener('change', () => { layout(); requestRender(); watchDpr(); }, { once: true });
}
watchDpr();
</script>
