/* ================================================================
   AI adapter
   Every model call goes through askClaude(). Inside a host that provides
   window.claude.complete it uses that; otherwise it streams from the
   bundled server's /api/claude proxy, which holds the API key. Failures
   carry `unavailable` when there is simply no route to a model, so
   callers can fall back quietly instead of showing an error.
   ================================================================ */
class AIError extends Error {
  constructor(message, unavailable = false) { super(message); this.unavailable = unavailable; }
}

// Whether the bundled server has a key, asked once per page load. null means
// no answer (e.g. a plain static host), in which case calls are attempted anyway.
let proxyStatus;
function proxyReady() {
  proxyStatus ||= fetch('/api/status').then((r) => (r.ok ? r.json() : null)).then((j) => (j ? !!j.ai : null)).catch(() => null);
  return proxyStatus;
}

async function askClaude(prompt, { json = false, onText, signal, system, maxTokens } = {}) {
  let text = '';
  if (window.claude?.complete) {
    text = await window.claude.complete(system ? `${system}\n\n${prompt}` : prompt);
    onText?.(text, text);
  } else {
    if (location.protocol === 'file:') throw new AIError('AI features need the bundled server: run `node server.js` and open http://localhost:3000.', true);
    if ((await proxyReady()) === false) throw new AIError('ANTHROPIC_API_KEY is not set on the server. Add it to .env or the environment and restart.', true);
    let res;
    try {
      res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ prompt, system, maxTokens }),
        signal,
      });
    } catch (err) {
      if (err.name === 'AbortError') throw err;
      throw new AIError('Could not reach the Tactics Lab server. Is `node server.js` running?', true);
    }
    if (!res.ok) {
      let msg = `Server error ${res.status}`;
      try { msg = (await res.json()).error || msg; } catch {}
      // 404/405: a plain static host with no proxy. 503: the server has no key.
      throw new AIError(res.status === 404 || res.status === 405 ? 'This host has no /api/claude proxy: run `node server.js` to enable AI features.' : msg,
        [404, 405, 503].includes(res.status));
    }
    text = await readSSE(res, onText);
  }
  return json ? parseModelJSON(text) : text;
}

// Accumulate text deltas from an Anthropic Messages SSE stream.
async function readSSE(res, onText) {
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buf = '', text = '', stop = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0) {
      const event = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      const data = event.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('');
      if (!data) continue;
      let msg;
      try { msg = JSON.parse(data); } catch { continue; }
      if (msg.type === 'content_block_delta' && msg.delta?.type === 'text_delta') {
        text += msg.delta.text;
        onText?.(msg.delta.text, text);
      } else if (msg.type === 'message_delta' && msg.delta?.stop_reason) {
        stop = msg.delta.stop_reason;
      } else if (msg.type === 'error') {
        throw new AIError(`Model error: ${msg.error?.message || 'unknown'}`);
      }
    }
  }
  if (stop === 'refusal') throw new AIError('The model declined this request.');
  return text;
}

// Models sometimes wrap JSON in prose or code fences; take the outermost
// object or array and parse that.
function parseModelJSON(text) {
  const s = text.replace(/```(?:json)?/gi, '');
  const i = s.search(/[[{]/);
  const close = s[i] === '[' ? ']' : '}';
  const j = s.lastIndexOf(close);
  if (i < 0 || j <= i) throw new AIError('The model did not return JSON.');
  try { return JSON.parse(s.slice(i, j + 1)); } catch { throw new AIError('The model returned malformed JSON.'); }
}

/* ================================================================
   Scenario builder
   The model describes 2–4 one-phase scenarios as JSON. Nothing from it
   is trusted: every scenario is rebuilt from a known formation, with
   positions clamped to the pitch, runs capped at 20 m, bends clamped,
   text trimmed, and the pass kept only if its receiver exists. The
   built-in example set goes through the same validator.
   ================================================================ */
const RUN_CAP = 20;
const P = (num, x, y, rx, ry, bend = 0) => ({ num, x, y, run: rx == null ? null : { x: rx, y: ry, bend } });
const EXAMPLE_SET = {

      away: [P(1, 101, 34), P(2, 84, 5, 82, 4), P(5, 95, 15), P(4, 95, 53), P(3, 84, 63), P(6, 88, 34, 86, 30),

      homeFormation: '4-3-3', awayFormation: '4-3-3', ball: { x: 99.6, y: 34 },
      home: [P(1, 40, 34), P(3, 58, 9), P(4, 55, 26), P(5, 55, 42), P(2, 58, 59), P(6, 68, 34, 74, 34),

    {
      name: 'Long to the target man',
      theyDo: 'With every short option pressed, the keeper goes long to their #9 on halfway.',
      weDo: '#5 steps onto the target man before the ball lands while #6 drops to cover the knock-down.',
      cues: ['Keeper takes an extra touch and looks up', 'Their #9 turns his back to our goal', 'Their midfielders push up for the second ball'],
      risk: 'If #5 stays on the line, their #9 wins the header and their midfield runs onto the second ball behind our press.',
      homeFormation: '4-3-3', awayFormation: '4-3-3', ball: { x: 99.6, y: 34 },
      home: [P(1, 40, 34), P(3, 58, 9), P(4, 55, 27), P(5, 54, 40, 60.5, 34.5, 0.2), P(2, 58, 59), P(6, 68, 34, 64, 36),
        P(8, 80, 22), P(10, 80, 46), P(11, 90, 16), P(9, 93, 30), P(7, 90, 52)],
      away: [P(1, 101, 34), P(2, 82, 4), P(5, 95, 14), P(4, 95, 54), P(3, 82, 64), P(6, 88, 34),
        P(10, 80, 24, 70, 28), P(8, 80, 44, 70, 42), P(7, 66, 9), P(9, 64, 36, 61, 33), P(11, 66, 59)],
      pass: { team: 'away', to: 9 },
    },
  ],
};

const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : typeof v === 'string' && v.trim() !== '' && Number.isFinite(+v) ? +v : NaN);

// Rebuild one side from a formation, placing each slot from the entry with
// the same shirt number, or failing that the next unused entry.
function validateSide(entries, team, formation) {
  if (!Array.isArray(entries) || entries.length !== 11) return null;
  const clean = entries.map((e) => ({ num: num(e?.num), x: num(e?.x), y: num(e?.y), run: e?.run }));
  if (clean.some((e) => !Number.isFinite(e.x) || !Number.isFinite(e.y))) return null;
  const used = new Set();
  return FORMATIONS[formation].map((slot) => {
    let i = clean.findIndex((e, k) => !used.has(k) && e.num === slot[4]);
    if (i < 0) i = clean.findIndex((_, k) => !used.has(k));
    used.add(i);
    const e = clean[i], pos = cleanPt(e);
    let run = null;
    if (e.run && Number.isFinite(num(e.run.x)) && Number.isFinite(num(e.run.y))) {
      const end = cleanPt({ x: num(e.run.x), y: num(e.run.y) });
      const d = dist(pos, end);
      if (d > RUN_CAP) { end.x = pos.x + ((end.x - pos.x) * RUN_CAP) / d; end.y = pos.y + ((end.y - pos.y) * RUN_CAP) / d; }
      if (dist(pos, end) >= 2) run = { ...end, bend: clamp(num(e.run.bend) || 0, -MAX_BEND, MAX_BEND) };
    }
    return { num: slot[4], ...pos, run };
  });
}

function validateScenario(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const homeFormation = FORMATIONS[raw.homeFormation] ? raw.homeFormation : state.formations.home;
  const awayFormation = FORMATIONS[raw.awayFormation] ? raw.awayFormation : state.formations.away;
  const home = validateSide(raw.home, 'home', homeFormation);
  const away = validateSide(raw.away, 'away', awayFormation);
  if (!home || !away) return null;
  const ball = isPt({ x: num(raw.ball?.x), y: num(raw.ball?.y) }) ? cleanPt({ x: num(raw.ball.x), y: num(raw.ball.y) }) : null;
  let pass = null;
  if (raw.pass && (raw.pass.team === 'home' || raw.pass.team === 'away')) {
    const side = raw.pass.team === 'home' ? home : away;
    if (side.some((p) => p.num === num(raw.pass.to))) pass = { team: raw.pass.team, to: num(raw.pass.to) };
  }
  const cues = (Array.isArray(raw.cues) ? raw.cues : []).map((c) => str(c, 140)).filter(Boolean).slice(0, 4);
  return {
    name: str(raw.name, 60) || 'Untitled scenario', theyDo: str(raw.theyDo, 280), weDo: str(raw.weDo, 280),
    cues, risk: str(raw.risk, 280), homeFormation, awayFormation, home, away, ball, pass,
  };
}

function validateScenarioSet(raw) {
  const list = Array.isArray(raw) ? raw : raw?.scenarios;
  if (!Array.isArray(list)) throw new AIError('The model’s reply had no scenarios in it.');
  const scenarios = list.slice(0, 4).map(validateScenario).filter(Boolean);
  if (!scenarios.length) throw new AIError('None of the model’s scenarios were usable (each side needs 11 players with coordinates).');
  return { title: str(raw.title, 80) || 'Scenarios', scenarios, dropped: Math.min(list.length, 4) - scenarios.length };
}

// Put a validated scenario on the board and make it the base, so B replays it.
function loadScenario(s) {
  if (anim || lab.play) return;
  setupMatch(s.homeFormation, s.awayFormation);
  for (const team of ['home', 'away']) {
    const side = team === 'home' ? s.home : s.away;
    state.players.filter((p) => p.team === team).forEach((p, i) => {
      Object.assign(p, { x: side[i].x, y: side[i].y, run: side[i].run ? { ...side[i].run } : null });
    });
  }
  // The ball must sit with someone on the passing side if there is a pass.
  const passTeam = s.pass?.team;
  const holder = passTeam ? nearestTo(s.ball || { x: PITCH.L / 2, y: PITCH.W / 2 }, passTeam) : null;
  if (s.ball) state.ball = { ...s.ball };
  if (holder && dist(holder, state.ball) > CARRY_R) giveBall(holder);
  state.showAway = true;
  if (s.pass) {
    const passer = carrier();
    const receiver = state.players.find((p) => p.team === s.pass.team && p.num === s.pass.to);
    if (passer && receiver && passer !== receiver) {
      const f = finalPos(receiver);
      state.pendingPass = { passerId: passer.id, receiverId: receiver.id, x: f.x, y: f.y };
    }
  }
  for (const p of state.players) { p.base = { x: p.x, y: p.y }; p.baseRun = copyRun(p.run); }
  state.baseBall = { ...state.ball };
  state.basePass = state.pendingPass ? { ...state.pendingPass } : null;
}

const COORDS_TEXT = () => `Coordinates are metres on a 105 × 68 pitch. x = 0 is the HOME goal line and x = 105 the AWAY goal line; y = 0 is the touchline on the home team's left as they attack towards x = 105. The HOME team is blue; the AWAY team is red and attacks towards x = 0. Goal mouths span y = 30.34 to 37.66; penalty areas are 16.5 m deep and 40.32 m wide (y = 13.84 to 54.16).

Formations available (use these names exactly): ${Object.keys(FORMATIONS).join(', ')}.
Shirt numbers by formation (in slot order): ${Object.entries(FORMATIONS).map(([f, s]) => `${f}: ${s.map((q) => `${q[4]} ${q[2]}`).join(', ')}`).join(' | ')}.`;

function scenarioPrompt(description) {
  return `You are a football (soccer) coach designing drills on a tactics board. The user describes a situation; design 2 to 4 distinct scenarios for it. Each scenario is one phase of play lasting about 2 seconds. "We" / "us" are the HOME team.

${COORDS_TEXT()}

How the board resolves a pass (runs finish first, then the ball is judged against where everyone ends up):
- A ground pass (35 m or shorter) is intercepted by any defender whose projection falls on the ball's straight path and who is within 1.0 + 0.045 × pass length metres of it.
- A pass over 35 m is lofted: it clears everyone in transit but is lost if a defender ends within 4 m of the landing point.
- Runs are at most 20 m. A run's "bend" in [-0.7, 0.7] curves it: positive bends towards the left of the direction of travel.

For each scenario give all 22 starting positions, a run for each player who moves (null otherwise), the ball's position (at the feet of the player who has it), and optionally one pass by the team in possession, named by the receiver's shirt number. Keep it realistic: players 2+ m apart, the ball within 2 m of its carrier.

Reply with JSON only, no prose, in exactly this shape:
{"title": "short title", "scenarios": [{"name": "…", "theyDo": "one sentence", "weDo": "one sentence", "cues": ["2 to 4 short triggers to watch for"], "risk": "one sentence on what goes wrong", "homeFormation": "4-3-3", "awayFormation": "4-4-2", "ball": {"x": 0, "y": 0}, "home": [{"num": 1, "x": 0, "y": 0, "run": null}], "away": [{"num": 1, "x": 0, "y": 0, "run": {"x": 0, "y": 0, "bend": 0}}], "pass": {"team": "home", "to": 9}}]}
Each of "home" and "away" must list all 11 players.

The situation: ${description}`;
}

let scenarioSet = null, scenarioIdx = -1, scenarioBusy = null, scenarioStatus = '';

async function buildScenarios() {

/* ================================================================
   Simulation lab: engine
   A continuous, time-based simulation of one attacking move, so a coach
   can set a situation and instructions, watch it, run it many times and
   compare. Everything is judged in seconds, not metres:
   • players accelerate to a sprint of 7.5 m/s (keeper 6) after a
     0.25 s reaction; off the ball they jog unless pressing, tracking a
     runner or making a run;
   • a ground pass leaves at ~15 m/s, a lofted ball at ~17 m/s plus hang
     time, and a point on its path is lost if a defender can get there
     before the ball does (the carrier estimates exactly this when it
     chooses a pass);
   • lofted balls must go forward and backward passes must be short
     recycles, so the carrier chooses passes a player would choose:
     likelihood of arrival × danger of the receiving spot, against the
     cost of losing it there;
   • the defending block (line height, pressing zone, width) shifts with
     the ball; the nearest defender presses, one covers, and defenders
     pick up runners who go beyond the line;
   • attackers hold width, offer support angles and make runs in behind
     timed to stay onside.
   Every run has its own random seed, so 50 runs give a spread of
   outcomes rather than one fixed answer.
   ================================================================ */
const SIM = {
  DT: 0.1, MAX_T: 20, SPRINT: 7.5, GK_SPRINT: 6, JOG: 4.5, ACCEL: 6, REACT: 0.25,
  DRIBBLE_V: 5.5, GROUND_V: 15, LOFT_V: 17, GROUND_MAX: 32, LOFT_MAX: 50, RECYCLE_MAX: 22,
  CONTROL_R: 1.0, TACKLE_R: 1.1, DECIDE_EVERY: 0.3,
  // Defending intensity near goal, tuned against real-football reference
  // rates (see the balance notes where they're used).
  // Swept against reference rates (shots from the edge of the box ~45-65%,
  // from breaking a low block ~20-35%, mid-block final-third entry ~20-35%).
  TACKLE_P: 0.02, INTO_P: 0.06, TIGHT_ZONE: 15, SECOND_ZONE: 0, INTERCEPT_P: 0.35,
};
const LINE_DEPTH = { deep: 20, mid: 32, high: 44 };      // m from own goal for the back line
const PRESS_ZONE = { off: 38, mid: 62, high: 110 };        // press once the ball is this close to our goal (m)
const BLOCK_WIDTH = { narrow: 32, normal: 40, wide: 50 };  // m across the back line
const DEFAULT_INSTR = { line: 'mid', press: 'mid', width: 'normal', attWidth: 'wide', runs: 'some', tempo: 'balanced' };

// Seeded random numbers so any run can be replayed exactly.
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const sigmoid = (z) => 1 / (1 + Math.exp(-z));

// Distance "up the pitch" for a team: 0 at its own goal line, 105 at the
// goal it attacks. Keeps every rule the same for both directions.
const depthOf = (team, x) => (team === 'home' ? x : PITCH.L - x);
const xAtDepth = (team, u) => (team === 'home' ? u : PITCH.L - u);
const oppOf = (team) => (team === 'home' ? 'away' : 'home');

// How dangerous a spot is for the team attacking from it: roughly the
// chance a move ends in a goal from there (an expected-threat style
// surface: ~0.14 on the penalty spot, ~0.03 at 30 m, ~0.004 at halfway).
// It sits just below the xG of a clean shot from the same spot, so a
// player shoots when a shot is really on and passes when it isn't.
function threatAt(team, p) {
  const u = depthOf(team, p.x), dg = Math.hypot(PITCH.L - u, p.y - PITCH.W / 2);
  const central = 1 - Math.min(1, Math.abs(p.y - PITCH.W / 2) / 40) * 0.35;
  return 0.35 * Math.exp(-dg / 12) * central;
}

// Expected goals for a shot from p: distance and the angle the goal mouth
// subtends, reduced by bodies in the way.
function shotXG(team, p, defenders) {
  const gx = team === 'home' ? PITCH.L : 0;
  // Angle between the lines to each post (dot product: no wrap-around at ±π).
  const v1 = { x: gx - p.x, y: PITCH.goalY0 - p.y }, v2 = { x: gx - p.x, y: PITCH.goalY1 - p.y };
  const angle = Math.acos(clamp((v1.x * v2.x + v1.y * v2.y) / (Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y) || 1), -1, 1));
  const d = Math.hypot(gx - p.x, PITCH.W / 2 - p.y);
  // Open-play reference points, central: ~0.36 at 6 m, 0.18 at 11 m, 0.1 at
  // 16 m, 0.03 at 25 m; less from wider angles.
  const central = 2 * Math.atan((PITCH.goalY1 - PITCH.goalY0) / 2 / Math.max(d, 1));
  let xg = clamp(0.8 * Math.exp(-d / 7.5) * Math.pow(clamp(angle / central, 0, 1), 0.8), 0, 0.7);
  const goal = { x: gx, y: PITCH.W / 2 }, len = dist(p, goal), ux = (goal.x - p.x) / len, uy = (goal.y - p.y) / len;
  for (const q of defenders) {
    const t = (q.x - p.x) * ux + (q.y - p.y) * uy;
    if (t <= 0 || t >= len) continue;
    const perp = Math.abs((q.x - p.x) * uy - (q.y - p.y) * ux);
    if (perp < 1.5) xg *= q.unit === 'G' ? 0.6 : 0.55;     // a body on the line
    else if (perp < 3) xg *= 0.85;
  }
  return xg;
}

function simCreate(opts) {
  const { players, ball, attTeam, instr, seed } = opts;
  const world = {
    t: 0, rng: rngFrom(seed), instr, attTeam, defTeam: oppOf(attTeam),
    players: players.map((p) => ({ ...p, vx: 0, vy: 0, target: { x: p.x, y: p.y }, speed: SIM.JOG, mode: 'shape', until: 0 })),
    ball: { x: ball.x, y: ball.y, state: 'held', owner: null, lift: 0 },
    nextDecide: 0.35, events: [], outcome: null, milestones: { final3: false, box: false }, frames: [],
  };
  const holder = world.players.filter((p) => p.team === attTeam).sort((a, b) => dist(a, ball) - dist(b, ball))[0];
  world.ball.owner = holder;
  world.ball.x = holder.x; world.ball.y = holder.y;
  return world;
}

const simTeam = (w, team) => w.players.filter((p) => p.team === team);
const sprintOf = (p) => (p.unit === 'G' ? SIM.GK_SPRINT : SIM.SPRINT);
// Time for a player to get to a point. Running back towards his own goal
// means turning first (~0.35 s), which is what makes a ball in behind work.
const timeToReach = (p, pt) => {
  const back = depthOf(p.team, pt.x) < depthOf(p.team, p.x) - 3 ? 0.35 : 0;
  return SIM.REACT + back + Math.max(0, dist(p, pt) - SIM.CONTROL_R) / sprintOf(p);
};
function log(w, text, kind = '') { w.events.push({ t: w.t, text, kind }); }
const tag = (p) => `${p.team === 'home' ? 'Blue' : 'Red'} #${p.num}`;

// Offside line for attackers of `team`: second-last defender or the ball,
// never behind halfway (in the attackers' depth coordinate).
function simOffsideDepth(w, team) {
  const depths = simTeam(w, oppOf(team)).map((p) => depthOf(team, p.x)).sort((a, b) => b - a);
  return Math.max(depths[1] ?? 0, depthOf(team, w.ball.x), PITCH.L / 2);
}

// --- Where each player wants to be ---------------------------------------
function defendTargets(w) {
  const team = w.defTeam, ins = w.instr[team], ball = w.ball;
  const ballU = depthOf(team, ball.x);                      // how far the ball is from our goal
  // The line drops with the ball but holds around the edge of the box
  // rather than retreating into the six-yard area.
  const lineU = clamp(Math.min(LINE_DEPTH[ins.line], ballU - 6), Math.min(13, ballU - 1), LINE_DEPTH[ins.line]);
  const span = ins.width === 'narrow' ? 26 : 30;
  const W = BLOCK_WIDTH[ins.width], cy = PITCH.W / 2 + (ball.y - PITCH.W / 2) * 0.55;
  const attackers = simTeam(w, w.attTeam);
  const defs = simTeam(w, team);
  const carrier = ball.state === 'held' ? ball.owner : null;
  // Pressing: nearest outfielder by time if the ball is inside our pressing zone.
  const pressOn = ballU <= PRESS_ZONE[ins.press];
  let presser = null, cover = null;
  if (carrier && pressOn) {
    const byTime = defs.filter((d) => d.unit !== 'G').sort((a, b) => timeToReach(a, carrier) - timeToReach(b, carrier));
    presser = byTime[0];
    // In our final third (or with a high press) a second man engages too.
    cover = ins.press === 'high' || ballU < SIM.SECOND_ZONE ? byTime[1] : null;
  }
  const taken = new Set();
  for (const d of defs) {
    const [su, sy] = [d.slot[0], d.slot[1]];
    if (d.unit === 'G') {
      d.target = { x: xAtDepth(team, clamp(2 + lineU * 0.12, 2, 9)), y: PITCH.W / 2 + (ball.y - PITCH.W / 2) * 0.12 };
      d.speed = SIM.JOG; d.mode = 'keeper';
      continue;
    }
    // Block position: back line at lineU, other units stacked in front of it.
    const u = lineU + clamp((su - 23) * (span / 36), 0, span);
    let tgt = { x: xAtDepth(team, u), y: clamp(cy + (sy - 34) * (W / 54), 2, PITCH.W - 2) };
    d.mode = 'shape'; d.speed = SIM.JOG;
    if (d === presser) {
      // Close down touch-tight from the goal side, showing him away from goal.
      const g = { x: xAtDepth(team, 0), y: PITCH.W / 2 }, k = 0.7 / Math.max(dist(carrier, g), 1);
      tgt = { x: carrier.x + (g.x - carrier.x) * k, y: carrier.y + (g.y - carrier.y) * k };
      d.mode = 'press'; d.speed = sprintOf(d);
    } else if (d === cover && ballU < SIM.SECOND_ZONE) {
      // Second man engages from the side he's coming from.
      tgt = { x: carrier.x, y: carrier.y }; d.mode = 'press'; d.speed = sprintOf(d);
    } else if (d === cover) {
      // Screen the nearest forward option.
      const opt = attackers.filter((a) => a !== carrier && depthOf(w.attTeam, a.x) >= depthOf(w.attTeam, carrier.x) - 5)
        .sort((a, b) => dist(a, carrier) - dist(b, carrier))[0];
      if (opt) { tgt = { x: carrier.x + (opt.x - carrier.x) * 0.45, y: carrier.y + (opt.y - carrier.y) * 0.45 }; d.mode = 'cover'; d.speed = sprintOf(d); }
    } else {
      // Pick up anyone in or beyond our line near our zone: stay goal-side.
      let mark = null, md = 9;
      for (const a of attackers) {
        if (a === carrier || taken.has(a)) continue;
        // Defenders, or anyone with a runner level with or beyond our line,
        // look 9 m for a man; midfielders otherwise only pick up within 6 m.
        const behind = depthOf(team, a.x) < lineU + 3;
        const dd = dist(a, tgt), range = behind || d.unit === 'D' ? 9 : 6;
        if (dd < Math.min(md, range)) { md = dd; mark = a; }
      }
      if (mark) {
        taken.add(mark);
        const g = { x: xAtDepth(team, 0), y: PITCH.W / 2 }, k = 1.6 / Math.max(dist(mark, g), 1);
        const goalSide = { x: mark.x + (g.x - mark.x) * k, y: mark.y + (g.y - mark.y) * k };
        // A defender facing the ball spots a run about 0.4 s late and has to
        // turn, so he tracks a little slower than the runner.
        const running = mark.mode === 'run' && w.t - mark.runStart > 0.4;
        // Defenders mark tighter; midfielders mostly hold their zone.
        const mix = running ? 0.85 : d.unit === 'D' ? 0.55 : 0.25;
        tgt = { x: tgt.x + (goalSide.x - tgt.x) * mix, y: tgt.y + (goalSide.y - tgt.y) * mix };
        if (running) { d.mode = 'track'; d.speed = sprintOf(d) * 0.92; }
      }
    }
    d.target = tgt;
  }
}

function attackTargets(w) {
  const team = w.attTeam, ins = w.instr[team], ball = w.ball, rng = w.rng;
  const carrier = ball.state === 'held' ? ball.owner : null;
  const ballV = depthOf(team, ball.x), offV = simOffsideDepth(w, team);
  const spread = ins.attWidth === 'wide' ? 1.12 : 0.82;
  const defs = simTeam(w, w.defTeam);
  const pressure = carrier ? Math.min(...defs.map((d) => dist(d, carrier))) : 99;
  const runRate = { few: 0.2, some: 0.5, many: 1 }[ins.runs];     // runs per second, per eligible player
  const mates = simTeam(w, team).filter((p) => p !== carrier);
  // The three nearest team-mates offer angles to the carrier.
  const supporters = carrier ? mates.filter((p) => p.unit !== 'G').sort((a, b) => dist(a, carrier) - dist(b, carrier)).slice(0, 3) : [];
  // How clear the passing line from the ball to a spot is (m to the nearest
  // defender beside it): support play is about opening a lane, not just space.
  const laneClear = (c) => {
    const len = dist(carrier, c) || 1, ux = (c.x - carrier.x) / len, uy = (c.y - carrier.y) / len;
    let m = 8;
    for (const d of defs) {
      const t = (d.x - carrier.x) * ux + (d.y - carrier.y) * uy;
      if (t > 0 && t < len) m = Math.min(m, Math.abs((d.x - carrier.x) * uy - (d.y - carrier.y) * ux));
    }
    return m;
  };
  for (const p of mates) {
    if (p.mode === 'run' && w.t < p.until) continue;         // keep running
    if (p.mode === 'receive' && ball.state === 'flight') continue;   // keep going to the ball
    const [su, sy] = p.slot;
    if (p.unit === 'G') { p.target = { x: xAtDepth(team, 6), y: PITCH.W / 2 }; p.speed = SIM.JOG; p.mode = 'keeper'; continue; }
    // The team spreads through the thirds: from the back line (~10 m behind
    // the ball) to the strikers on the last defender's shoulder, with the
    // midfield in between, in the spaces between the opposition's lines.
    // Nobody drifts offside.
    const back = Math.max(4, ballV - 10), front = offV - 1.5;
    const f = clamp((su - 22) / (60 - 22), 0, 1);
    let v = clamp(back + f * (front - back), 4, front);
    let tgt = { x: xAtDepth(team, v), y: clamp(PITCH.W / 2 + (sy - 34) * spread + (ball.y - PITCH.W / 2) * 0.2, 2, PITCH.W - 2) };
    p.mode = 'shape'; p.speed = SIM.JOG;
    if (supporters.includes(p)) {
      // Best of twelve spots 10-18 m from the ball: a clear passing line
      // first, then space around the spot and ground gained.
      let best = null, bs = -Infinity;
      for (let k = 0; k < 12; k++) {
        const ang = (k / 12) * Math.PI * 2, r = k % 2 ? 16 : 11;
        const c = { x: clamp(carrier.x + Math.cos(ang) * r, 2, PITCH.L - 2), y: clamp(carrier.y + Math.sin(ang) * r, 2, PITCH.W - 2) };
        if (depthOf(team, c.x) > offV - 0.8) continue;
        const space = Math.min(...defs.map((d) => dist(d, c)));
        const fwd = depthOf(team, c.x) - ballV;
        const s = Math.min(laneClear(c), 5) * 1.2 + Math.min(space, 8) * 0.6 + fwd * 0.2 - dist(p, c) * 0.12;
        if (s > bs) { bs = s; best = c; }
      }
      if (best) { tgt = best; p.speed = SIM.SPRINT * 0.85; p.mode = 'support'; }
    } else if (carrier && ['A', 'AM', 'M'].includes(p.unit) && depthOf(team, p.x) > ballV - 5
      && rng() < runRate * SIM.DECIDE_EVERY && Math.abs(depthOf(team, p.x) - offV) < 12) {
      // Run in behind, starting onside, into the channel he's in.
      const endV = clamp(offV + 8 + rng() * 6, 0, PITCH.L - 4);
      tgt = { x: xAtDepth(team, endV), y: clamp(p.y + (PITCH.W / 2 - p.y) * 0.25, 4, PITCH.W - 4) };
      p.mode = 'run'; p.speed = SIM.SPRINT; p.until = w.t + 2.6; p.runStart = w.t;
      log(w, `${tag(p)} runs in behind`, 'run');
    }
    p.target = tgt;
  }
}

// --- The carrier's choice --------------------------------------------------
// Estimated chance a pass from `from` to `to` arrives with `rec`, judged
// by who gets to points along its path first.
function passOdds(w, from, to, rec, lofted) {
  const d = dist(from, to);
  const dur = lofted ? 0.6 + d / SIM.LOFT_V : 0.15 + d / SIM.GROUND_V;
  const defs = simTeam(w, w.defTeam);
  const fracs = lofted ? [0.9, 1] : [0.25, 0.5, 0.75, 1];
  // The receiver keeps running his line, so he's there when the ball is;
  // any extra distance he'd have to cover costs him a sprint.
  const onPath = { x: rec.x + rec.vx * dur, y: rec.y + rec.vy * dur };
  const tRec = dur + Math.max(0, dist(onPath, to) - SIM.CONTROL_R) / sprintOf(rec);
  let keep = 1;
  const len = d || 1, ux = (to.x - from.x) / len, uy = (to.y - from.y) / len;
  for (const q of defs) {
    let worst = 0;
    // Someone already standing on the line (a cover shadow) gets a touch on
    // it more than once as it passes (~two ticks), so most go.
    const along = (q.x - from.x) * ux + (q.y - from.y) * uy;
    if (!lofted && along > 1.5 && along < len && Math.abs((q.x - from.x) * uy - (q.y - from.y) * ux) < SIM.CONTROL_R * 1.2) worst = 1 - (1 - SIM.INTERCEPT_P) ** 2;
    for (const f of fracs) {
      const pt = { x: from.x + (to.x - from.x) * f, y: from.y + (to.y - from.y) * f };
      const tBall = f === 1 ? Math.max(dur, tRec) : dur * f;
      // Defenders only change course on a decision tick and then have to
      // accelerate, so their real reaction is ~0.4 s (checked against runs).
      worst = Math.max(worst, sigmoid((tBall - timeToReach(q, pt) - 0.15) / 0.18));
    }
    keep *= 1 - worst;
  }
  // Long passes are harder to hit.
  keep *= lofted ? 0.8 : 1 - 0.006 * Math.max(0, d - 15);
  return { p: keep, dur };
}

function carrierOptions(w, c) {
  const team = w.attTeam, ins = w.instr[team];
  const defs = simTeam(w, w.defTeam);
  const cu = depthOf(team, c.x), offV = simOffsideDepth(w, team);
  const riskAversion = { patient: 1.6, balanced: 1, direct: 0.6 }[ins.tempo];
  const progressW = { patient: 0.0006, balanced: 0.0012, direct: 0.002 }[ins.tempo];
  // Losing it costs roughly what the other side could make of it from there.
  const loseCost = (pt) => (0.35 * Math.exp(-Math.hypot(depthOf(team, pt.x), pt.y - PITCH.W / 2) / 12) + 0.006) * riskAversion;
  const here = threatAt(team, c);
  const opts = [];
  for (const q of simTeam(w, team)) {
    if (q === c) continue;
    // Play it into his path: where he'll be when the ball gets there
    // (flight time depends on the distance, so solve it twice).
    let to = { x: q.x, y: q.y };
    for (let k = 0; k < 2; k++) {
      const dd = dist(c, to), T = dd > SIM.GROUND_MAX ? 0.6 + dd / SIM.LOFT_V : 0.15 + dd / SIM.GROUND_V;
      to = { x: clamp(q.x + q.vx * T, 1, PITCH.L - 1), y: clamp(q.y + q.vy * T, 1, PITCH.W - 1) };
    }
    // For a runner, also try the space ahead of him along his run: a
    // through ball he runs onto.
    const targets = [to];
    const sp = Math.hypot(q.vx, q.vy);
    if (q.mode === 'run' && sp > 2) {
      for (const ahead of [4, 8]) targets.push({ x: clamp(to.x + (q.vx / sp) * ahead, 1, PITCH.L - 1), y: clamp(to.y + (q.vy / sp) * ahead, 1, PITCH.W - 1) });
    }
    let bestForQ = null;
    for (const tgt of targets) {
      const d = dist(c, tgt), gain = depthOf(team, tgt.x) - cu;
      if (d < 5) continue;
      let lofted = false;
      // A cross: from wide in the final third, lofted into the box.
      const wide = Math.abs(c.y - PITCH.W / 2) > 14 && cu > 72;
      const inBox = depthOf(team, tgt.x) > PITCH.L - PITCH.boxD && Math.abs(tgt.y - PITCH.W / 2) < PITCH.boxW / 2;
      if (wide && inBox && d >= 10 && d <= 40) lofted = true;
      else if (d > SIM.GROUND_MAX) { if (d > SIM.LOFT_MAX || gain < 10) continue; lofted = true; }
      if (gain < -4 && d > SIM.RECYCLE_MAX) continue;           // no long balls backwards
      const odds = passOdds(w, c, tgt, q, lofted);
      const space = Math.min(...defs.map((dd) => dist(dd, tgt)));
      // Danger of the receiving spot, plus a reward for ground gained (teams
      // try to progress, not just keep it); a direct side values it more.
      const value = threatAt(team, tgt) * (0.75 + 0.25 * Math.min(space, 8) / 8) + Math.max(0, gain) * progressW;
      const offside = depthOf(team, q.x) > offV + 0.01 && depthOf(team, q.x) > PITCH.L / 2;
      const u = odds.p * value - (1 - odds.p) * loseCost(tgt) - (offside ? 0.2 : 0);
      if (!bestForQ || u > bestForQ.u) bestForQ = { kind: 'pass', to: tgt, rec: q, lofted, odds: odds.p, dur: odds.dur, u, gain, d, through: tgt !== to };
    }
    if (bestForQ) opts.push(bestForQ);
  }
  // Carry it: up to five directions within 70° of straight at goal.
  const pressure = Math.min(...defs.map((d) => dist(d, c)));
  for (const a of [-70, -35, 0, 35, 70]) {
    const base = team === 'home' ? 0 : Math.PI, ang = base + (a * Math.PI) / 180;
    const end = { x: clamp(c.x + Math.cos(ang) * 5, 1, PITCH.L - 1), y: clamp(c.y + Math.sin(ang) * 5, 1, PITCH.W - 1) };
    let closest = 99;
    for (const q of defs) {
      for (const f of [0.3, 0.6, 1]) closest = Math.min(closest, dist(q, { x: c.x + (end.x - c.x) * f, y: c.y + (end.y - c.y) * f }));
    }
    const keep = sigmoid((closest - 1.8) / 0.7);
    // Carrying it into open grass gains ground like a pass does (the basis
    // of a counter-attack).
    const gainD = depthOf(team, end.x) - cu;
    opts.push({ kind: 'dribble', to: end, odds: keep, u: keep * (threatAt(team, end) + Math.max(0, gainD) * progressW) - (1 - keep) * loseCost(c) - 0.004 });
  }
  // Shoot when it's on.
  const gx = team === 'home' ? PITCH.L : 0;
  if (Math.hypot(gx - c.x, PITCH.W / 2 - c.y) < 30) {
    // Shoot when it's genuinely on, not whenever the goal is in range.
    const xg = shotXG(team, c, defs);
    if (xg >= 0.03) opts.push({ kind: 'shoot', xg, u: xg * 1.15 });
  }
  // A player under no pressure with nothing on keeps the ball.
  if (pressure > 6) opts.push({ kind: 'hold', u: here * 0.9 });
  return opts;
}

function chooseOption(w, opts) {
  // A player picks among his few best options: hopeless passes are out
  // unless nothing decent is on, then mostly the best of the top three,
  // sometimes a near-equal alternative, so runs vary without silly choices.
  const decent = opts.filter((o) => o.kind !== 'pass' || o.odds >= 0.55);
  const pool = (decent.length ? decent : opts).filter((o) => o.kind !== 'pass' || o.odds >= 0.3 || !decent.length);
  opts = (pool.length ? pool : opts).sort((a, b) => b.u - a.u).slice(0, 3);
  const temp = 0.0015, best = opts[0].u;
  const weights = opts.map((o) => Math.exp((o.u - best) / temp));
  let r = w.rng() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < opts.length; i++) { r -= weights[i]; if (r <= 0) return opts[i]; }
  return opts[opts.length - 1];
}

function carrierDecides(w) {
  const c = w.ball.owner;
  const o = chooseOption(w, carrierOptions(w, c));
  if (o.kind === 'pass') {
    // Offside is judged the moment the ball is played.
    const offV = simOffsideDepth(w, w.attTeam);
    if (depthOf(w.attTeam, o.rec.x) > offV + 0.01 && depthOf(w.attTeam, o.rec.x) > PITCH.L / 2) {
      log(w, `${tag(c)} finds ${tag(o.rec)}, but he's offside`, 'bad');
      return simEnd(w, 'offside', o.rec);
    }
    Object.assign(w.ball, { state: 'flight', owner: null, from: { x: c.x, y: c.y }, to: o.to, t0: w.t, dur: o.dur, lofted: o.lofted, rec: o.rec, passer: c, odds: o.odds });
    (w.passLog ||= []).push({ odds: o.odds, ok: null });
    o.rec.target = o.to; o.rec.speed = sprintOf(o.rec); o.rec.mode = 'receive';
    const cross = o.lofted && o.d <= 40 && Math.abs(c.y - PITCH.W / 2) > 14 && depthOf(w.attTeam, c.x) > 72;
    const verb = cross ? 'crosses for' : o.lofted ? 'lofts it to' : o.through ? 'slides a through ball to' : o.gain < -3 ? 'plays it back to' : 'passes to';
    log(w, `${tag(c)} ${verb} ${tag(o.rec)} (${o.d.toFixed(0)} m)`, 'pass');
  } else if (o.kind === 'dribble') {
    c.target = o.to; c.speed = SIM.DRIBBLE_V; c.mode = 'dribble';
  } else if (o.kind === 'shoot') {
    return shoot(w, c, o.xg);
  } else {
    c.target = { x: c.x, y: c.y }; c.speed = 1; c.mode = 'hold';
  }
}

function shoot(w, c, xg) {
  const r = w.rng();
  const goalY = PITCH.W / 2 + (w.rng() - 0.5) * 6;
  const gx = w.attTeam === 'home' ? PITCH.L + 0.8 : -0.8;
  w.ball.shot = { from: { x: c.x, y: c.y }, to: { x: gx, y: goalY }, t0: w.t, dur: dist(c, { x: gx, y: goalY }) / 24 };
  w.ball.state = 'shot'; w.ball.owner = null;
  const result = r < xg ? 'goal' : r < xg + (1 - xg) * 0.45 ? 'saved' : r < xg + (1 - xg) * 0.75 ? 'blocked' : 'wide';
  log(w, `${tag(c)} shoots from ${dist(c, { x: gx, y: PITCH.W / 2 }).toFixed(0)} m (xG ${xg.toFixed(2)}): ${{ goal: 'GOAL', saved: 'saved', blocked: 'blocked', wide: 'wide' }[result]}`, result === 'goal' ? 'goal' : 'shot');
  w.pendingShot = { result, xg, at: { x: c.x, y: c.y } };
}

// Someone gets the ball under control after a pass or a loose ball.
function control(w, p) {
  const ball = w.ball, last = w.passLog?.at(-1);
  if (p.team !== w.attTeam) {
    if (last && last.ok === null) last.ok = false;
    log(w, `${tag(p)} gets to it first`, 'win');
    return simEnd(w, 'turnover', p, { x: ball.x, y: ball.y });
  }
  if (last && last.ok === null) last.ok = true;
  ball.state = 'held'; ball.owner = p; ball.lift = 0;
  p.mode = 'shape'; p.gotAt = w.t;
  w.nextDecide = w.t + 0.35;                                   // a touch to control it
}

function simEnd(w, kind, who, at) {
  w.outcome = { kind, t: w.t, at: at || { x: w.ball.x, y: w.ball.y }, who: who ? tag(who) : '', xg: w.pendingShot?.xg || 0, milestones: { ...w.milestones } };
}

// --- One tick ----------------------------------------------------------------
function simStep(w) {
  const dt = SIM.DT;
  w.t += dt;
  const ball = w.ball;
  if (w.t >= w.nextDecide) {
    w.nextDecide = w.t + SIM.DECIDE_EVERY;
    defendTargets(w);
    attackTargets(w);
    if (ball.state === 'held' && ball.owner.team === w.attTeam) carrierDecides(w);
    if (w.outcome) return;
  }
  // Pressers re-aim every tick at where the carrier is heading (0.3 s
  // ahead), goal-side, instead of chasing where he was. In midfield they
  // jockey ~1.5 m off to delay and block the forward pass; in our final
  // third they get touch-tight to win it.
  if (ball.state === 'held' && ball.owner.team === w.attTeam) {
    const c = ball.owner, g = { x: xAtDepth(w.defTeam, 0), y: PITCH.W / 2 };
    const gap = depthOf(w.defTeam, c.x) < SIM.TIGHT_ZONE ? 0.7 : 1.5;
    const ahead = { x: c.x + c.vx * 0.3, y: c.y + c.vy * 0.3 }, k = gap / Math.max(dist(ahead, g), 1);
    for (const d of simTeam(w, w.defTeam)) {
      if (d.mode === 'press') d.target = { x: ahead.x + (g.x - ahead.x) * k, y: ahead.y + (g.y - ahead.y) * k };
    }
  }
  // During a pass, the two defenders nearest the landing spot attack it.
  if (ball.state === 'flight') {
    const near = simTeam(w, w.defTeam).filter((d) => d.unit !== 'G').sort((a, b) => dist(a, ball.to) - dist(b, ball.to)).slice(0, 2);
    for (const d of near) { d.target = ball.to; d.speed = sprintOf(d); }
  }
  // Move everyone towards their target with a speed and acceleration cap.
  for (const p of w.players) {
    const dx = p.target.x - p.x, dy = p.target.y - p.y, d = Math.hypot(dx, dy);
    // Ease off in time to stop on the spot (v² = 2·a·d) instead of overrunning it.
    const want = d < 0.2 ? 0 : Math.min(p.speed, d / dt, Math.sqrt(2 * SIM.ACCEL * d));
    const tvx = d ? (dx / d) * want : 0, tvy = d ? (dy / d) * want : 0;
    // Reversing direction is slower than speeding up in a straight line.
    const turning = p.vx * tvx + p.vy * tvy < 0;
    const ax = tvx - p.vx, ay = tvy - p.vy, a = Math.hypot(ax, ay), cap = SIM.ACCEL * dt * (turning ? 0.55 : 1);
    const k = a > cap ? cap / a : 1;
    p.vx += ax * k; p.vy += ay * k;
    p.x = clamp(p.x + p.vx * dt, 0, PITCH.L); p.y = clamp(p.y + p.vy * dt, 0, PITCH.W);
  }
  if (ball.state === 'held') {
    const c = ball.owner;
    ball.x = c.x + attackDir(c.team) * 0.7; ball.y = c.y;
    // Tackles: sustained touch-tight pressure wins it about 0.4 times a
    // second, more often if he dribbles straight into the defender.
    // Nobody can be tackled on his first touch (~0.3 s after receiving).
    for (const d of w.t - (c.gotAt ?? -1) < 0.3 ? [] : simTeam(w, oppOf(c.team))) {
      const into = c.mode === 'dribble' && dist(d, c) < 0.8;
      if (dist(d, c) < SIM.TACKLE_R && w.rng() < (into ? SIM.INTO_P : SIM.TACKLE_P)) {
        log(w, `${tag(d)} wins it off ${tag(c)}`, 'win');
        return simEnd(w, 'turnover', d, { x: c.x, y: c.y });
      }
    }
  } else if (ball.state === 'flight') {
    const f = clamp((w.t - ball.t0) / ball.dur, 0, 1);
    ball.x = ball.from.x + (ball.to.x - ball.from.x) * f; ball.y = ball.from.y + (ball.to.y - ball.from.y) * f;
    ball.lift = ball.lofted ? Math.sin(Math.PI * f) : 0;
    // A ground pass can be cut out once it's clear of the passer's feet; a
    // lofted one only as it comes down. Not every touch wins it.
    const catchable = ball.lofted ? f > 0.85 : dist(ball, ball.from) > 1.5;
    if (catchable) {
      for (const d of simTeam(w, w.defTeam)) {
        if (dist(d, ball) < SIM.CONTROL_R * 0.9 && w.rng() < SIM.INTERCEPT_P) {
          w.passLog.at(-1).ok = false;
          log(w, `${tag(d)} intercepts`, 'win');
          return simEnd(w, 'turnover', d, { x: ball.x, y: ball.y });
        }
      }
    }
    if (f >= 1) {
      // It arrives: the receiver takes it if he's there, otherwise it runs
      // on as a loose ball and it's a race.
      const near = w.players.slice().sort((a, b) => dist(a, ball) - dist(b, ball))[0];
      if (dist(near, ball) <= SIM.CONTROL_R * 1.5) return control(w, near);
      const len = dist(ball.from, ball.to) || 1, v = ball.lofted ? 4 : 6;
      Object.assign(ball, { state: 'loose', vx: ((ball.to.x - ball.from.x) / len) * v, vy: ((ball.to.y - ball.from.y) / len) * v, lift: 0 });
    }
  } else if (ball.state === 'loose') {
    // Rolls and slows (about 3 m/s²); the two nearest from each side chase it.
    const sp = Math.hypot(ball.vx, ball.vy), slow = Math.max(0, sp - 3 * dt) / (sp || 1);
    ball.vx *= slow; ball.vy *= slow;
    ball.x = clamp(ball.x + ball.vx * dt, 0, PITCH.L); ball.y = clamp(ball.y + ball.vy * dt, 0, PITCH.W);
    for (const team of ['home', 'away']) {
      for (const p of simTeam(w, team).sort((a, b) => dist(a, ball) - dist(b, ball)).slice(0, 2)) { p.target = { x: ball.x, y: ball.y }; p.speed = sprintOf(p); p.mode = 'chase'; }
    }
    const near = w.players.slice().sort((a, b) => dist(a, ball) - dist(b, ball))[0];
    if (dist(near, ball) <= SIM.CONTROL_R) return control(w, near);
    if (ball.x <= 0 || ball.x >= PITCH.L || ball.y <= 0 || ball.y >= PITCH.W) {
      w.passLog.at(-1).ok = false;
      log(w, 'The ball runs out of play', 'win');
      return simEnd(w, 'turnover', null, { x: ball.x, y: ball.y });
    }
  } else if (ball.state === 'shot') {
    const s = ball.shot, f = clamp((w.t - s.t0) / s.dur, 0, 1);
    ball.x = s.from.x + (s.to.x - s.from.x) * f; ball.y = s.from.y + (s.to.y - s.from.y) * f;
    if (f >= 1) return simEnd(w, w.pendingShot.result === 'goal' ? 'goal' : 'shot');
  }
  // Milestones for the attack.
  if (ball.state === 'held') {
    const u = depthOf(w.attTeam, ball.x);
    if (u > 70 && !w.milestones.final3) { w.milestones.final3 = true; log(w, 'Into the final third', 'milestone'); }
    const inBox = u > PITCH.L - PITCH.boxD && Math.abs(ball.y - PITCH.W / 2) < PITCH.boxW / 2;
    if (inBox && !w.milestones.box) { w.milestones.box = true; log(w, 'Into the box', 'milestone'); }
  }
  if (w.t >= SIM.MAX_T) {
    log(w, 'They keep the ball but go nowhere', 'end');
    simEnd(w, 'held');
  }
}

// Run one move to the end. With `record`, keep every frame for playback.
function simRun(opts, record = false) {
  const w = simCreate(opts);
  const snap = () => w.frames.push({ t: w.t, p: w.players.map((p) => [p.x, p.y, p.mode]), b: [w.ball.x, w.ball.y, w.ball.lift || 0, w.ball.owner ? w.ball.owner.id : null] });
  if (record) snap();
  while (!w.outcome) { simStep(w); if (record) snap(); }
  return w;
}

// Simulation input from what's on the board. Each player keeps his
// formation slot as (depth from own goal, lateral position on the pitch),
// which is where the team shape puts him before the ball moves him.
function labInput(instr, seed = 1) {
  const players = state.players.filter(visible).map((p) => {
    const i = +p.id.split('-')[1], s = FORMATIONS[state.formations[p.team]][i];
    return { id: p.id, team: p.team, num: p.num, role: p.role, unit: p.unit, x: p.x, y: p.y,
      slot: [s[0], p.team === 'home' ? s[1] : PITCH.W - s[1]] };
  });
  const holder = carrier();
  return { players, ball: { ...state.ball }, attTeam: holder ? holder.team : state.possession, instr, seed };
}

// Many runs with different seeds: the spread a coach actually needs.
function simBatch(opts, n) {
  const res = { n, goal: 0, shot: 0, box: 0, final3: 0, turnover: 0, offside: 0, held: 0, xg: 0, time: 0, marks: [] };
  for (let i = 0; i < n; i++) {
    const w = simRun({ ...opts, seed: (opts.seed || 1) * 7919 + i });
    const o = w.outcome;
    res[o.kind === 'goal' ? 'goal' : o.kind]++;
    if (o.kind === 'goal') res.shot++;
    if (o.milestones.box) res.box++;
    if (o.milestones.final3) res.final3++;
    res.xg += o.xg;
    res.time += o.t;
    res.marks.push({ kind: o.kind, x: o.at.x, y: o.at.y });
  }
  res.xg /= n; res.time /= n;
  return res;
}

   (and the opponent if he wants), then either watches one run of the

// Mirror a situation through the centre spot, swapping the teams, so the
// same starting picture can be coached from the other side.
function mirrorSituation(s) {
  const flip = (list) => list.map((q) => ({ ...q, x: PITCH.L - q.x, y: PITCH.W - q.y, run: null }));
  return { ...s, homeFormation: s.awayFormation, awayFormation: s.homeFormation, home: flip(s.away), away: flip(s.home),
    ball: { x: PITCH.L - s.ball.x, y: PITCH.W - s.ball.y } };
}

// --- Effects ---------------------------------------------------------------
const fx = [];
function burst(x, y, color, big = false) { fx.push({ kind: 'burst', x, y, color, t0: performance.now(), dur: big ? 900 : 650, big }); requestRender(); }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const W = canvas.clientWidth, cols = [colors.home, colors.select, '#ffffff', '#34d399', colors.badge];
  for (let i = 0; i < 140; i++) {
    fx.push({ kind: 'bit', x: W / 2 + (Math.random() - 0.5) * W * 0.6, y: -10 - Math.random() * 80, vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length], t0: performance.now(), dur: 2200 });
  }
  requestRender();
}
function flash(kind) {
  const el = $('#flash');
  el.className = ''; void el.offsetWidth; el.className = kind;
}
function drawFx() {
  const now = performance.now();
  for (let i = fx.length - 1; i >= 0; i--) if (now - fx[i].t0 > fx[i].dur) fx.splice(i, 1);
  if (!fx.length) return;
  for (const f of fx) {
    const t = (now - f.t0) / f.dur;
    if (f.kind === 'burst') {
      usePitchSpace();
      ctx.strokeStyle = f.color;
      for (const k of f.big ? [0, 0.18, 0.36] : [0, 0.2]) {
        const tt = clamp(t - k, 0, 1);
        if (!tt) continue;
        ctx.globalAlpha = 1 - tt;
        ctx.lineWidth = Math.max(0.5 * (1 - tt), 1 / view.s);
        circle(f.x, f.y, 1 + tt * (f.big ? 12 : 7));
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      const dt = (now - f.t0) / 16;
      ctx.save();
      ctx.translate(f.x + f.vx * dt, f.y + f.vy * dt + 0.02 * dt * dt);
      ctx.rotate(f.rot + f.vr * dt);
      ctx.globalAlpha = 1 - t * t;
      ctx.fillStyle = f.c;
      ctx.fillRect(-4, -2.5, 8, 5);
      ctx.restore();
    }
  }
  requestRender();
}

const LAB_KEY = 'tacticsLab.lab.v1';
try {
  const saved = store.get(LAB_KEY, null);
  if (saved && SITUATIONS[saved.sit]) lab.sit = saved.sit;
  for (const t of ['home', 'away']) for (const k in DEFAULT_INSTR) if (saved?.instr?.[t]?.[k]) lab.instr[t][k] = saved.instr[t][k];
} catch { /* start clean */ }
const saveLab = () => store.set(LAB_KEY, { sit: lab.sit, instr: lab.instr });

const attackingTeam = () => (carrier() ? carrier().team : state.possession);
const teamName = (t) => (t === 'home' ? 'Blue' : 'Red');

function loadSituation(i) {
  if (anim || lab.play) return;
  lab.sit = i;
  loadScenario(validateScenario({ ...SITUATIONS[i].setup, pass: null }));
  const holder = nearestTo(SITUATIONS[i].setup.ball, attackingTeamFor(SITUATIONS[i].setup));
  if (holder && dist(holder, state.ball) > CARRY_R) giveBall(holder);
  lab.result = null; lab.marks = []; lab.trails = null; lab.watch = null; lab.coachNote = '';
  saveLab();
  renderLab();
  requestRender();
}
// The side with a player nearest the ball starts with it.
function attackingTeamFor(setup) {
  const near = (list) => Math.min(...list.map((q) => Math.hypot(q.x - setup.ball.x, q.y - setup.ball.y)));
  return near(setup.home) <= near(setup.away) ? 'home' : 'away';
}

// --- Watch one run ------------------------------------------------------------
function labWatch() {
  if (anim || lab.play || lab.busy) return;
  const seed = Math.floor(Math.random() * 1e9);
  const start = snapshot();
  const w = simRun({ ...labInput(lab.instr, seed) }, true);
  lab.watch = { events: w.events, outcome: w.outcome };
  lab.trails = null;
  lab.play = { w, start, t0: performance.now(), speed: lab.speed || 1, shown: 0 };
  selectNone();
  renderLab();
  requestAnimationFrame(labTick);
}
function selectNone() { state.selected = null; state.pendingPass = null; }

function labTick(now) {
  const pl = lab.play;
  if (!pl) return;
  const frames = pl.w.frames, t = ((now - pl.t0) / 1000) * pl.speed;
  const i = Math.min(frames.length - 1, Math.floor(t / SIM.DT)), k = Math.min(1, t / SIM.DT - i);
  const a = frames[i], b = frames[Math.min(frames.length - 1, i + 1)];
  // Interpolate between recorded frames for smooth motion.
  state.players.forEach((p) => {
    const j = pl.w.players.findIndex((q) => q.id === p.id);
    if (j < 0) return;
    p.x = a.p[j][0] + (b.p[j][0] - a.p[j][0]) * k;
    p.y = a.p[j][1] + (b.p[j][1] - a.p[j][1]) * k;
  });
  state.ball.x = a.b[0] + (b.b[0] - a.b[0]) * k;
  state.ball.y = a.b[1] + (b.b[1] - a.b[1]) * k;
  state.ballLift = a.b[2];
  // Show each event as it happens.
  const due = pl.w.events.filter((e) => e.t <= t + 1e-6).length;
  if (due > pl.shown) { pl.shown = due; renderLabLog(); const e = pl.w.events[due - 1]; if (e.kind !== 'milestone') ticker(e.text, e.kind); }
  if (i >= frames.length - 1) return labWatchDone();
  requestRender();
  requestAnimationFrame(labTick);
}

function labWatchDone() {
  const pl = lab.play;
  lab.play = null;
  state.ballLift = 0;
  // Keep a trace of the move on the pitch: the ball's path.
  lab.trails = pl.w.frames.filter((_, n) => n % 2 === 0).map((f) => ({ x: f.b[0], y: f.b[1] }));
  const o = pl.w.outcome;
  if (o.kind === 'goal') { flash('goal'); burst(o.at.x, o.at.y, colors.away, true); }
  else if (o.kind === 'turnover' || o.kind === 'offside') burst(o.at.x, o.at.y, '#4ade80', true);
  ticker(outcomeText(o, pl.w.attTeam), o.kind === 'goal' ? 'goal' : '');
  renderLab();
  requestRender();
}

function outcomeText(o, att) {
  const who = teamName(att);
  return { goal: `${who} score`, shot: `${who} get a shot away (xG ${o.xg.toFixed(2)})`, turnover: `${who} lose it${o.who ? ` to ${o.who}` : ''}`,
    offside: `${who} are caught offside`, held: `${who} keep it but can't get through` }[o.kind];
}

// Put the players back where the situation started.
function labReset() {
  if (anim || lab.play) return;
  loadSituation(lab.sit);
}

// --- Test many runs -----------------------------------------------------------
// Every test uses the same seeds, so two tests differ only because the
// instructions or starting positions differ, not by luck of the draw.
const TEST_RUNS = 100, TEST_SEED = 1;
function labTest() {
  if (anim || lab.play || lab.busy) return;
  lab.busy = true;
  renderLab();
  // Let the button repaint before the (fast, ~0.2 s) batch.
  setTimeout(() => {
    const att = attackingTeam();
    const r = simBatch(labInput(lab.instr, TEST_SEED), TEST_RUNS);
    r.att = att;
    r.label = describeInstr();
    lab.result = r;
    lab.marks = r.marks;
    lab.trails = null;
    lab.busy = false;
    renderLab();
    requestRender();
  }, 30);
}
function describeInstr() {
  const def = oppOf(attackingTeam()), att = attackingTeam();
  const d = lab.instr[def], a = lab.instr[att];
  return `${teamName(def)}: ${d.line} line, ${pressLabel(d.press).toLowerCase()}, ${d.width} · ${teamName(att)}: ${a.attWidth}, ${a.runs} runs, ${a.tempo}`;
}
const pressLabel = (v) => ({ off: 'Press in own third', mid: 'Press in own half', high: 'Press all over' }[v]);

// Numbers from the coached side's point of view (Blue).
function labStats(r) {
  const pct = (n) => Math.round((100 * n) / r.n);
  const we = r.att === 'home';
  const winsHigh = r.marks.filter((m) => m.kind === 'turnover' && depthOf(oppOf(r.att), m.x) > PITCH.L / 2).length;
  return we
    ? [
      { k: 'Shots', v: pct(r.shot), good: 'up', sub: `xG ${r.xg.toFixed(2)} per attack` },
      { k: 'Reached their box', v: pct(r.box), good: 'up', sub: `final third ${pct(r.final3)}%` },
      { k: 'Lost it', v: pct(r.turnover + r.offside), good: 'down', sub: `${pct(r.offside)}% offside` },
    ]
    : [
      { k: 'Shots against', v: pct(r.shot), good: 'down', sub: `xG ${r.xg.toFixed(2)} per attack` },
      { k: 'They reached our box', v: pct(r.box), good: 'down', sub: `our third ${pct(r.final3)}%` },
      { k: 'We won it back', v: pct(r.turnover + r.offside), good: 'up', sub: `${pct(winsHigh)}% in their half` },
    ];
}

// --- Drawing ----------------------------------------------------------------------
function drawLab() {
  usePitchSpace();
  if (lab.trails && lab.trails.length > 1) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = lineWidthM(0.2); ctx.setLineDash([0.6, 0.6]);
    ctx.beginPath(); lab.trails.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.stroke(); ctx.setLineDash([]);
  }
  if (!lab.marks.length || lab.play) return;
  // Where each tested attack ended: shots as rings (bigger = better chance),
  // ball won back as crosses, offside as flags.
  const r = playerR() * 0.55;
  for (const m of lab.marks) {
    if (m.kind === 'shot' || m.kind === 'goal') {
      ctx.strokeStyle = m.kind === 'goal' ? colors.select : colors.blocked; ctx.lineWidth = lineWidthM(0.2);
      circle(m.x, m.y, r * 0.9);
    } else if (m.kind === 'turnover' || m.kind === 'offside') {
      ctx.strokeStyle = m.kind === 'offside' ? colors.offside : 'rgba(255,255,255,0.7)'; ctx.lineWidth = lineWidthM(0.18);
      line(m.x - r * 0.6, m.y - r * 0.6, m.x + r * 0.6, m.y + r * 0.6); line(m.x - r * 0.6, m.y + r * 0.6, m.x + r * 0.6, m.y - r * 0.6);
    }
  }
}

function renderLab() {
  const on = appMode === 'lab';
  $('#labbar').hidden = !on;
  if (!on) return;
  const s = SITUATIONS[lab.sit], att = attackingTeam(), def = oppOf(att);
  const blueRole = att === 'home' ? 'attacking' : 'defending', redRole = att === 'away' ? 'attacking' : 'defending';
  const r = lab.result, pin = lab.pinned;
  const stats = r ? labStats(r) : null, base = pin ? labStats(pin) : null;
  const tiles = stats ? stats.map((st, i) => {
    let delta = '';
    if (base && pin !== r) {
      const dv = st.v - base[i].v;
      const better = dv === 0 ? '' : (dv > 0) === (st.good === 'up') ? 'good' : 'bad';
      delta = `<span class="delta ${better}">${dv > 0 ? '+' : ''}${dv} pts</span>`;
    }
    return `<div class="tile"><span class="k">${st.k}</span><span class="v">${st.v}%</span>${delta}<span class="sub">${st.sub}</span></div>`;
  }).join('') : '';
  setHTML($('#lab-sit'), `
    <label class="sr" for="sit-select">Situation</label>
    <select id="sit-select">${SITUATIONS.map((q, i) => `<option value="${i}" ${i === lab.sit ? 'selected' : ''}>${esc(q.name)}</option>`).join('')}</select>
    <p class="brief">${esc(s.brief)}</p>
    <p class="muted small">${teamName(att)} have the ball. Drag players to change the starting picture.</p>`);
  setHTML($('#lab-instr'), `
    <div class="team blue"><h3>Blue · ${blueRole}</h3>${instrHTML('home', blueRole)}</div>
    <details class="team red"><summary><h3>Red · ${redRole}</h3></summary>${instrHTML('away', redRole)}</details>`);
  setHTML($('#lab-results'), r ? `
    <div class="tiles">${tiles}</div>
    <p class="muted small">${TEST_RUNS} runs · ${esc(r.label)}${pin && pin !== r ? ` · compared with the pinned test` : ''}</p>
    <div class="row">
      <button class="btn" id="lab-pin">${pin === r ? 'Pinned' : 'Pin to compare'}</button>
      <button class="btn" id="lab-coach" ${lab.coachBusy ? 'disabled' : ''}>Ask the coach</button>
    </div>
    ${lab.coachNote ? `<div class="coachnote">${lab.coachNote.split(/\n\s*\n/).map((p) => `<p>${esc(p)}</p>`).join('')}</div>` : ''}
    <p class="legend"><span class="lg shot"></span>shot <span class="lg won"></span>ball won <span class="lg off"></span>offside</p>`
    : `<p class="muted">Test the move ${TEST_RUNS} times to see how often it works. ${esc(s.tip)}</p>`);
  renderLabLog();
  $('#lab-watch').disabled = !!lab.play || lab.busy;
  $('#lab-test').disabled = !!lab.play || lab.busy;
  $('#lab-test').textContent = lab.busy ? 'Testing…' : `Test ${TEST_RUNS}×`;
  $('#lab-speed').textContent = `${lab.speed || 1}×`;
}

function renderLabLog() {
  const wv = lab.play ? lab.play.w : null;
  const events = wv ? wv.events.slice(0, lab.play.shown) : lab.watch ? lab.watch.events : [];
  setHTML($('#lab-log'), events.length ? `<ol class="log">${events.map((e) => `<li class="${e.kind}"><span class="t">${e.t.toFixed(1)}s</span>${esc(e.text)}</li>`).join('')}</ol>`
    : '<p class="muted small">Watch a run to see the move step by step.</p>');
}

// Lower-third caption for the event that just happened.
let tickerTimer = 0;
function ticker(text, kind = '') {
  const el = $('#ticker');
  el.textContent = text; el.className = 'show ' + kind;
  clearTimeout(tickerTimer);
  tickerTimer = setTimeout(() => (el.className = kind), 1800);
}

$('#labpanel').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.instr) {
    const [team, key] = b.dataset.instr.split('.');
    lab.instr[team][key] = b.dataset.v;
    saveLab();
    renderLab();
  } else if (b.id === 'lab-pin') { lab.pinned = lab.result; renderLab(); }
  else if (b.id === 'lab-coach') askCoach();
});
$('#labpanel').addEventListener('change', (ev) => { if (ev.target.id === 'sit-select') loadSituation(+ev.target.value); });
$('#lab-watch').addEventListener('click', labWatch);
$('#lab-test').addEventListener('click', labTest);
$('#lab-reset').addEventListener('click', labReset);
$('#lab-speed').addEventListener('click', () => { lab.speed = (lab.speed || 1) === 1 ? 2 : 1; if (lab.play) { const t = (performance.now() - lab.play.t0) * lab.play.speed; lab.play.speed = lab.speed; lab.play.t0 = performance.now() - t / lab.speed; } renderLab(); });

// --- Ask the coach (AI) ----------------------------------------------------------------
// Turns the numbers into advice. Needs a model connection; the lab works fully without it.
async function askCoach() {
  const r = lab.result;
  if (!r || lab.coachBusy) return;
  lab.coachBusy = true; lab.coachNote = 'Thinking about your numbers…'; renderLab();
  const s = SITUATIONS[lab.sit], fmt = (x) => labStats(x).map((q) => `${q.k} ${q.v}% (${q.sub})`).join('; ');
  const prompt = `You are an experienced football coach helping another coach read a tactics simulation.
Situation: ${s.name}. ${s.brief}
The coach runs Blue. ${teamName(r.att)} have the ball.
Instructions tested: ${r.label}.
Result over ${r.n} simulated attacks: ${fmt(r)}.${lab.pinned && lab.pinned !== r ? `\nPinned earlier test (${lab.pinned.label}): ${fmt(lab.pinned)}.` : ''}
In two short paragraphs of plain text (no markdown, no lists), explain what the numbers suggest about Blue's approach and name one specific change to test next, using the instruction names above.`;
  try {
    const text = await askClaude(prompt, { maxTokens: 1500, onText: (_, all) => { lab.coachNote = all; renderLab(); } });
    lab.coachNote = text.replace(/^\s{0,3}#{1,6}\s+/gm, '').replace(/(\*\*|__|`)/g, '').trim();
  } catch (err) {
    lab.coachNote = err.unavailable ? `The coach needs an AI connection. ${err.message}` : `Couldn’t get advice: ${err.message}`;
  }
  lab.coachBusy = false;
  renderLab();
}

let appMode = 'lab';

/* ================================================================
   Toolbar, toasts, shortcuts
   ================================================================ */
function setTool(tool) {
  state.tool = tool;
  for (const b of document.querySelectorAll('[data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === tool));
  requestRender();
}
for (const b of document.querySelectorAll('[data-tool]')) b.addEventListener('click', () => setTool(b.dataset.tool));
document.getElementById('play').addEventListener('click', play);

let toastTimer = 0;
function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = kind), 2600);
}

window.addEventListener('keydown', (ev) => {
  if (ev.target.closest('input, textarea, select') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === 'v') setTool('move');
  else if (k === 'r') setTool('runs');
  else if (k === 'p') setTool('pass');
  else if (k === 'b') backToBase();
  else if (k === ' ') { ev.preventDefault(); appMode === 'lab' ? labWatch() : play(); }
  else if (k === 'c') { state.coverage = { control: 'zones', zones: 'off', off: 'control' }[state.coverage]; state.view = 'custom'; }
  else if (k === 'l') cycleView();
  else if (k === 'escape') state.selected = null;
  else if (k === 'delete' || k === 'backspace') {
    const p = state.players.find((q) => q.id === state.selected);
    if (p && p.run && !anim) p.run = null;
    else state.pendingPass = null;
  } else return;
  requestRender();
});

/* ================================================================
   Debug overlay (?debug): a known-coordinate marker, attack arrow,
   upright text and the pointer position in metres, to sanity-check
   the transform and its inverse.
   ================================================================ */
const DEBUG = new URLSearchParams(location.search).has('debug');
let debugPointer = null;

function drawDebug() {
  usePitchSpace();
  // Marker on the far box edge's corner: (105 - 16.5, 13.84).
  const mx = PITCH.L - PITCH.boxD, my = (PITCH.W - PITCH.boxW) / 2;
  ctx.fillStyle = '#ffcc00';
  dot(mx, my, 0.8);
  uprightAt(mx, my, () => {
    ctx.font = '600 2.2px system-ui, sans-serif';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`(${mx}, ${my})`, 1, -1);
  });

  // Attack direction arrow along the halfway line area.
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 0.5;
  line(40, 4, 65, 4);
  ctx.beginPath(); ctx.moveTo(65, 4); ctx.lineTo(62, 2.5); ctx.lineTo(62, 5.5); ctx.closePath(); ctx.fill();
  uprightAt(52.5, 7.5, () => {
    ctx.font = '600 2px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WE ATTACK', 0, 0);
  });

  if (debugPointer) {
    const p = toPitch(debugPointer.x, debugPointer.y);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`x ${p.x.toFixed(2)}  y ${p.y.toFixed(2)}  s ${view.s.toFixed(2)}px/m  ${view.portrait ? 'portrait' : 'landscape'}`, 10, 20);
  }
}

/* ================================================================
   Panel: readout, selected player, layers, saved tactics
   Panel HTML is only rewritten when its content changes, so a drag
   doesn't thrash the DOM.
   ================================================================ */

function laneStats(lanes) {
  const open = lanes.filter((l) => !l.blocker);
  const best = open.reduce((b, l) => (l.breaks > (b?.breaks ?? 0) ? l : b), null);
  return { open: open.length, total: lanes.length, best };
}

function updateReadout() {
  const h = A.homeShare * 100, c = A.carrier;
  const shape = (s) => (s ? `${s.width.toFixed(0)}×${s.depth.toFixed(0)} m, ${s.area.toFixed(0)} m²` : '—');
  const ls = laneStats(A.lanes);
  setHTML($('#readout'), `
    <div class="bar" aria-hidden="true"><i style="width:${h}%;background:var(--home)"></i><i style="flex:1;background:var(--away)"></i></div>
    <dl class="stats">
      <dt>Space owned</dt><dd>Blue ${h.toFixed(0)}% · Red ${(100 - h).toFixed(0)}%</dd>
      <dt>Ball</dt><dd>${c ? esc(who(c)) : `Loose (${state.possession} last)`}</dd>
      <dt>Lanes open</dt><dd>${c ? `${ls.open} of ${ls.total}` : '—'}</dd>
      <dt>Best line break</dt><dd>${ls.best ? `+${ls.best.breaks} to #${ls.best.to.num}` : '—'}</dd>
      <dt>Offside line</dt><dd>x = ${A.offsideX.toFixed(1)} m${A.offside.length ? ` · offside ${A.offside.map((p) => '#' + p.num).join(', ')}` : ''}</dd>
      <dt>Blue shape</dt><dd>${shape(A.shape.home)}</dd>
      <dt>Red shape</dt><dd>${shape(A.shape.away)}</dd>
    </dl>`);

  const s = A.selected;
  if (!s) { setHTML($('#selected'), '<p class="muted">Tap a player to see their space and options.</p>'); return; }
  const sl = laneStats(s === c ? A.lanes : A.selLanes);
  setHTML($('#selected'), `
    <dl class="stats">
      <dt>Player</dt><dd>${esc(who(s))}</dd>
      <dt>Space owned</dt><dd>${A.zones.get(s.id)?.area.toFixed(0) ?? 0} m²</dd>
      <dt>Passing lanes</dt><dd>${sl.open} of ${sl.total} open</dd>
      <dt>Best line break</dt><dd>${sl.best ? `+${sl.best.breaks} to #${sl.best.to.num}` : '—'}</dd>
      <dt>Offside</dt><dd>${A.offside.includes(s) ? 'Yes' : 'No'}</dd>
      <dt>Planned run</dt><dd>${s.run ? `${dist(s, s.run).toFixed(0)} m` : 'None'}</dd>
    </dl>
    ${s.run && !lab.play ? '<div class="row"><button class="btn" id="remove-run">Remove run</button></div>' : ''}`);
}
$('#selected').addEventListener('click', (ev) => {
  if (ev.target.id !== 'remove-run') return;
  const p = A.selected;
  if (p && !anim) { p.run = null; requestRender(); }
});

// Layers
$('#views').innerHTML = VIEW_ORDER.map((v) => `<button data-view="${v}">${VIEWS[v].label}</button>`).join('');
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => setView(b.dataset.view));
for (const b of document.querySelectorAll('[data-cov]')) b.addEventListener('click', () => { state.coverage = b.dataset.cov; state.view = 'custom'; requestRender(); });
for (const cb of document.querySelectorAll('[data-layer]')) cb.addEventListener('change', () => { state.layers[cb.dataset.layer] = cb.checked; if (cb.dataset.layer !== 'roles') state.view = 'custom'; requestRender(); });
function syncLayers() {
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
  const vb = $('#view-btn .wide');
  if (vb) vb.textContent = `: ${VIEWS[state.view]?.label || 'Custom'}`;
  for (const b of document.querySelectorAll('[data-cov]')) b.setAttribute('aria-pressed', String(b.dataset.cov === state.coverage));
  for (const cb of document.querySelectorAll('[data-layer]')) cb.checked = state.layers[cb.dataset.layer];
}

// Saved tactics
const SAVED_KEY = 'tacticsLab.saved.v1';
let saved = store.get(SAVED_KEY, []);
if (!Array.isArray(saved)) saved = [];
function renderSaved() {
  $('#saved-list').innerHTML = saved.length ? saved.map((s, i) => `
    <li><span class="grow">${esc(s.name)} <span class="muted">${esc(s.board.formations.home)} v ${esc(s.board.formations.away)}</span></span>
      <button class="btn" data-load="${i}">Load</button><button class="btn" data-del="${i}" aria-label="Delete ${esc(s.name)}">Delete</button></li>`).join('')
    : '<li class="muted">No saved setups yet.</li>';
}
$('#save-form').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const name = $('#save-name').value.trim() || `Setup ${saved.length + 1}`;
  saved.unshift({ name, board: snapshot() });
  if (!store.set(SAVED_KEY, saved)) toast('Saved for this session only: browser storage is unavailable', 'bad');
  else toast(`Saved “${name}”`);
  $('#save-name').value = '';
  renderSaved();
});
$('#saved-list').addEventListener('click', (ev) => {
  const load = ev.target.dataset.load, del = ev.target.dataset.del;
  if (load != null && !anim && !lab.play) {
    if (restore(saved[+load].board)) toast(`Loaded “${saved[+load].name}”`);
    requestRender();
  } else if (del != null) {
    saved.splice(+del, 1);
    store.set(SAVED_KEY, saved);
    renderSaved();
  }
});
renderSaved();

// Modes and the Board drawer. On wide landscape screens the drawer sits
// beside the pitch; otherwise it is a bottom sheet toggled from the top bar.
const isNarrow = () => !matchMedia('(min-width: 900px) and (orientation: landscape)').matches;
let panelOpen = !isNarrow();
function syncPanel() {
  $('#panel').hidden = !(appMode === 'board' && panelOpen);
  $('#labpanel').hidden = !(appMode === 'lab' && panelOpen);
  $('#panel-open').setAttribute('aria-expanded', String(panelOpen));
  $('#panel-open').textContent = panelOpen ? 'Hide panel' : 'Panel';
}
function setPanel(open) {
  if (!open && !isNarrow()) return;      // the side drawer stays put on wide screens
  panelOpen = open;
  syncPanel();
}
$('#panel-open').addEventListener('click', () => { panelOpen = !panelOpen; syncPanel(); });

function setMode(mode) {
  if (anim || lab.play) return;
  appMode = mode;
  store.set('tacticsLab.mode', mode);
  $('#mode-lab').setAttribute('aria-pressed', String(mode === 'lab'));
  $('#mode-board').setAttribute('aria-pressed', String(mode === 'board'));
  // The lab only moves players; runs and passes belong to the board.
  setTool(mode === 'lab' ? 'move' : state.tool || 'move');
  $('#toolbar').hidden = mode !== 'board';
  $('#labbar').hidden = mode !== 'lab';
  syncPanel();
  renderLab();
  requestRender();
}
$('#mode-lab').addEventListener('click', () => setMode('lab'));
$('#mode-board').addEventListener('click', () => setMode('board'));

for (const b of document.querySelectorAll('[data-tab]')) {
  b.addEventListener('click', () => {
    for (const t of document.querySelectorAll('[data-tab]')) t.setAttribute('aria-selected', String(t === b));
    for (const pane of document.querySelectorAll('[data-pane]')) pane.hidden = pane.dataset.pane !== b.dataset.tab;
  });
}
$('#view-btn').addEventListener('click', cycleView);

/* ================================================================
   Render loop (on demand) and resize
   ================================================================ */
let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    analyse();
    drawPitch();
    const board = appMode === 'board';
    if (board && state.coverage === 'control') drawControl();
    else if (board && state.coverage === 'zones') drawZones();
    if (board && state.layers.shape) drawShape();
    if (state.layers.offside && !lab.play) drawOffside();
    if (board && state.layers.lanes) { drawLanes(A.selLanes.filter((l) => !l.blocker), true); drawLanes(A.lanes, false); }
    if (!board) drawLab();
    if (board) { drawRuns(); drawPasses(); }
    if (DEBUG) drawDebug();
    drawPlayers();
    drawFx();
    updateReadout();
    syncControls();
    syncLayers();
    if (!anim && !drag) scheduleSave();
  });
}

// One dark palette on purpose (a night match), so tokens are read once.
readTokens();
renderBackground();
document.fonts?.ready.then(() => { renderBackground(); requestRender(); });

if (!restore(store.get(BOARD_KEY, null))) setupMatch('4-3-3', '4-4-2');
syncControls();
// First visit: open the lab on its first situation.
if (!store.get(BOARD_KEY, null)) loadSituation(lab.sit);
setMode(store.get('tacticsLab.mode', 'lab') === 'board' ? 'board' : 'lab');


new ResizeObserver(() => { layout(); requestRender(); }).observe(canvas);
// A devicePixelRatio change (moving between screens) doesn't always resize the element,
// so watch the current ratio and re-arm the query each time it changes.
function watchDpr() {
  matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
    .addEventListener('change', () => { layout(); requestRender(); watchDpr(); }, { once: true });
}
watchDpr();
</script>
