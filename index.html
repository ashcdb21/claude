$('#make-base').addEventListener('click', () => { makeBase(); requestRender(); });

function syncControls() {
  $('#formation-home').value = state.formations.home;
  $('#formation-away').value = state.formations.away;
  $('#possession').value = state.possession;
  $('#show-away').checked = state.showAway;
}

/* ================================================================
   AI adapter
   Every model call goes through askClaude(). Inside a host that provides
   window.claude.complete it uses that; otherwise it streams from the
   bundled server's /api/claude proxy, which holds the API key. Failures
   carry `unavailable` when there is simply no route to a model, so
   callers can fall back quietly instead of showing an error.
   ================================================================ */
class AIError extends Error {
  constructor(message, unavailable = false) { super(message); this.unavailable = unavailable; }
}

// Whether the bundled server has a key, asked once per page load. null means
// no answer (e.g. a plain static host), in which case calls are attempted anyway.
let proxyStatus;
function proxyReady() {
  proxyStatus ||= fetch('/api/status').then((r) => (r.ok ? r.json() : null)).then((j) => (j ? !!j.ai : null)).catch(() => null);
  return proxyStatus;
}

async function askClaude(prompt, { json = false, onText, signal, system, maxTokens } = {}) {
  let text = '';
  if (window.claude?.complete) {
    text = await window.claude.complete(system ? `${system}\n\n${prompt}` : prompt);
    onText?.(text, text);
  } else {
    if (location.protocol === 'file:') throw new AIError('AI features need the bundled server: run `node server.js` and open http://localhost:3000.', true);
    if ((await proxyReady()) === false) throw new AIError('ANTHROPIC_API_KEY is not set on the server. Add it to .env or the environment and restart.', true);
    let res;
    try {
      res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ prompt, system, maxTokens }),
        signal,
      });
    } catch (err) {
      if (err.name === 'AbortError') throw err;
      throw new AIError('Could not reach the Tactics Lab server. Is `node server.js` running?', true);
    }
    if (!res.ok) {
      let msg = `Server error ${res.status}`;
      try { msg = (await res.json()).error || msg; } catch {}
      // 404/405: a plain static host with no proxy. 503: the server has no key.
      throw new AIError(res.status === 404 || res.status === 405 ? 'This host has no /api/claude proxy: run `node server.js` to enable AI features.' : msg,
        [404, 405, 503].includes(res.status));
    }
    text = await readSSE(res, onText);
  }
  return json ? parseModelJSON(text) : text;
}

// Accumulate text deltas from an Anthropic Messages SSE stream.
async function readSSE(res, onText) {
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buf = '', text = '', stop = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0) {
      const event = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      const data = event.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('');
      if (!data) continue;
      let msg;
      try { msg = JSON.parse(data); } catch { continue; }
      if (msg.type === 'content_block_delta' && msg.delta?.type === 'text_delta') {
        text += msg.delta.text;
        onText?.(msg.delta.text, text);
      } else if (msg.type === 'message_delta' && msg.delta?.stop_reason) {
        stop = msg.delta.stop_reason;
      } else if (msg.type === 'error') {
        throw new AIError(`Model error: ${msg.error?.message || 'unknown'}`);
      }
    }
  }
  if (stop === 'refusal') throw new AIError('The model declined this request.');
  return text;
}

// Models sometimes wrap JSON in prose or code fences; take the outermost
// object or array and parse that.
function parseModelJSON(text) {
  const s = text.replace(/```(?:json)?/gi, '');
  const i = s.search(/[[{]/);
  const close = s[i] === '[' ? ']' : '}';
  const j = s.lastIndexOf(close);
  if (i < 0 || j <= i) throw new AIError('The model did not return JSON.');
  try { return JSON.parse(s.slice(i, j + 1)); } catch { throw new AIError('The model returned malformed JSON.'); }
}

/* ================================================================
   Scenario builder
   The model describes 2–4 one-phase scenarios as JSON. Nothing from it
   is trusted: every scenario is rebuilt from a known formation, with
   positions clamped to the pitch, runs capped at 20 m, bends clamped,
   text trimmed, and the pass kept only if its receiver exists. The
   built-in example set goes through the same validator.
   ================================================================ */
const RUN_CAP = 20;
const P = (num, x, y, rx, ry, bend = 0) => ({ num, x, y, run: rx == null ? null : { x: rx, y: ry, bend } });
const EXAMPLE_SET = {
  title: 'High press v playing out from the back',
  scenarios: [
    {
      name: 'Short to the split centre-back',
      theyDo: 'Their keeper rolls it to the left centre-back, who has split wide to the edge of the box.',
      weDo: '#11 curves his press from the inside so the centre-back can only go down the line, where #3 jumps their full-back.',
      cues: ['Keeper’s head goes down to the ball', 'Centre-back opens his body towards the touchline', 'Their full-back is still facing his own goal'],
      risk: 'If #11 runs straight at him, the inside pass to their #10 opens and the press is bypassed.',
      homeFormation: '4-3-3', awayFormation: '4-3-3', ball: { x: 99.6, y: 34 },
      home: [P(1, 38, 34), P(3, 60, 10, 74, 8, 0.1), P(4, 56, 26), P(5, 56, 42), P(2, 60, 58), P(6, 68, 34, 72, 31),
        P(8, 76, 24, 80, 23), P(10, 76, 44, 79, 45), P(11, 84, 22, 92, 16, -0.35), P(9, 86, 34, 92, 31, 0.2), P(7, 84, 50, 90, 52)],
      away: [P(1, 101, 34), P(2, 84, 5, 82, 4), P(5, 95, 15), P(4, 95, 53), P(3, 84, 63), P(6, 88, 34, 86, 30),
        P(10, 80, 22), P(8, 80, 46), P(7, 66, 9), P(9, 62, 34), P(11, 66, 59)],
      pass: { team: 'away', to: 5 },
    },
    {
      name: 'Pivot drops between the centre-backs',

const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : typeof v === 'string' && v.trim() !== '' && Number.isFinite(+v) ? +v : NaN);

// Rebuild one side from a formation, placing each slot from the entry with
// the same shirt number, or failing that the next unused entry.
function validateSide(entries, team, formation) {
  if (!Array.isArray(entries) || entries.length !== 11) return null;
  const clean = entries.map((e) => ({ num: num(e?.num), x: num(e?.x), y: num(e?.y), run: e?.run }));
  if (clean.some((e) => !Number.isFinite(e.x) || !Number.isFinite(e.y))) return null;
  const used = new Set();
  return FORMATIONS[formation].map((slot) => {
    let i = clean.findIndex((e, k) => !used.has(k) && e.num === slot[4]);
    if (i < 0) i = clean.findIndex((_, k) => !used.has(k));
    used.add(i);
    const e = clean[i], pos = cleanPt(e);
    let run = null;
    if (e.run && Number.isFinite(num(e.run.x)) && Number.isFinite(num(e.run.y))) {
      const end = cleanPt({ x: num(e.run.x), y: num(e.run.y) });
      const d = dist(pos, end);
      if (d > RUN_CAP) { end.x = pos.x + ((end.x - pos.x) * RUN_CAP) / d; end.y = pos.y + ((end.y - pos.y) * RUN_CAP) / d; }
      if (dist(pos, end) >= 2) run = { ...end, bend: clamp(num(e.run.bend) || 0, -MAX_BEND, MAX_BEND) };
    }
    return { num: slot[4], ...pos, run };
  });
}

function validateScenario(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const homeFormation = FORMATIONS[raw.homeFormation] ? raw.homeFormation : state.formations.home;
  const awayFormation = FORMATIONS[raw.awayFormation] ? raw.awayFormation : state.formations.away;
  const home = validateSide(raw.home, 'home', homeFormation);
  const away = validateSide(raw.away, 'away', awayFormation);
  if (!home || !away) return null;
  const ball = isPt({ x: num(raw.ball?.x), y: num(raw.ball?.y) }) ? cleanPt({ x: num(raw.ball.x), y: num(raw.ball.y) }) : null;
  let pass = null;
  if (raw.pass && (raw.pass.team === 'home' || raw.pass.team === 'away')) {
    const side = raw.pass.team === 'home' ? home : away;
    if (side.some((p) => p.num === num(raw.pass.to))) pass = { team: raw.pass.team, to: num(raw.pass.to) };
  }
  const cues = (Array.isArray(raw.cues) ? raw.cues : []).map((c) => str(c, 140)).filter(Boolean).slice(0, 4);
  return {
    name: str(raw.name, 60) || 'Untitled scenario', theyDo: str(raw.theyDo, 280), weDo: str(raw.weDo, 280),
    cues, risk: str(raw.risk, 280), homeFormation, awayFormation, home, away, ball, pass,
  };
}

function validateScenarioSet(raw) {
  const list = Array.isArray(raw) ? raw : raw?.scenarios;
  if (!Array.isArray(list)) throw new AIError('The model’s reply had no scenarios in it.');
  const scenarios = list.slice(0, 4).map(validateScenario).filter(Boolean);
  if (!scenarios.length) throw new AIError('None of the model’s scenarios were usable (each side needs 11 players with coordinates).');
  return { title: str(raw.title, 80) || 'Scenarios', scenarios, dropped: Math.min(list.length, 4) - scenarios.length };
}

// Put a validated scenario on the board and make it the base, so B replays it.
function loadScenario(s) {
  if (anim || state.match) return;
  setupMatch(s.homeFormation, s.awayFormation);
  for (const team of ['home', 'away']) {
    const side = team === 'home' ? s.home : s.away;
    state.players.filter((p) => p.team === team).forEach((p, i) => {
      Object.assign(p, { x: side[i].x, y: side[i].y, run: side[i].run ? { ...side[i].run } : null });
    });
  }
  // The ball must sit with someone on the passing side if there is a pass.
  const passTeam = s.pass?.team;
  const holder = passTeam ? nearestTo(s.ball || { x: PITCH.L / 2, y: PITCH.W / 2 }, passTeam) : null;
  if (s.ball) state.ball = { ...s.ball };
  if (holder && dist(holder, state.ball) > CARRY_R) giveBall(holder);
  state.showAway = true;
  if (s.pass) {
    const passer = carrier();
    const receiver = state.players.find((p) => p.team === s.pass.team && p.num === s.pass.to);
    if (passer && receiver && passer !== receiver) {
      const f = finalPos(receiver);
      state.pendingPass = { passerId: passer.id, receiverId: receiver.id, x: f.x, y: f.y };
    }
  }
  for (const p of state.players) { p.base = { x: p.x, y: p.y }; p.baseRun = copyRun(p.run); }
  state.baseBall = { ...state.ball };
  state.basePass = state.pendingPass ? { ...state.pendingPass } : null;
}

function scenarioPrompt(description) {

${COORDS_TEXT()}

How the board resolves a pass (runs finish first, then the ball is judged against where everyone ends up):
- A ground pass (35 m or shorter) is intercepted by any defender whose projection falls on the ball's straight path and who is within 1.0 + 0.045 × pass length metres of it.
- A pass over 35 m is lofted: it clears everyone in transit but is lost if a defender ends within 4 m of the landing point.
- Runs are at most 20 m. A run's "bend" in [-0.7, 0.7] curves it: positive bends towards the left of the direction of travel.

For each scenario give all 22 starting positions, a run for each player who moves (null otherwise), the ball's position (at the feet of the player who has it), and optionally one pass by the team in possession, named by the receiver's shirt number. Keep it realistic: players 2+ m apart, the ball within 2 m of its carrier.

Each of "home" and "away" must list all 11 players.

The situation: ${description}`;
}

/* ================================================================
   Match play
   Turn-based: the opponent (away, attacking towards x = 0) attacks, you
   defend. Each phase you may move each of your players within a ring
   around where they started the phase, never within 1.6 m of the ball.
   On lock-in the attacker plans runs (≤ 12 m) and one action, and the
   same engine that runs the board resolves it:
   • pass: resolvePass(), and offside if the receiver was beyond your
     offside line when the phase started;
   • dribble (≤ 8 m): lost if a defender is within 1.6 m of the path;

   ================================================================ */

// Where a player will be once the telegraphed runs are done.
const plannedAt = (q) => { const e = q.team === 'away' && state.match?.planned?.get(q.id); return e ? { x: e.x, y: e.y } : { x: q.x, y: q.y }; };

const inOurBox = (p) => p.x <= PITCH.boxD && p.y >= (PITCH.W - PITCH.boxW) / 2 && p.y <= (PITCH.W + PITCH.boxW) / 2;
function reachedTarget(win, pt) {

  if (win === 'final3') return pt.x < 35;
  if (win === 'box') return inOurBox(pt);
  return false;

const homeSide = () => state.players.filter((p) => p.team === 'home');
const awaySide = () => state.players.filter((p) => p.team === 'away');

// Keep a dragged defender inside their ring and out of the ball's 1.6 m.
function constrainDefender(p) {
  const m = state.match, s = m.starts.get(p.id), R = RING[m.difficulty];
  for (let k = 0; k < 3; k++) {
    const d = dist(p, s);
    if (d > R) { p.x = s.x + ((p.x - s.x) * R) / d; p.y = s.y + ((p.y - s.y) * R) / d; }
    const b = dist(p, state.ball);
    if (b < BALL_KEEPOUT) {
      const ux = b > 1e-6 ? (p.x - state.ball.x) / b : 1, uy = b > 1e-6 ? (p.y - state.ball.y) / b : 0;
      p.x = state.ball.x + ux * BALL_KEEPOUT; p.y = state.ball.y + uy * BALL_KEEPOUT;
    }
    clampToPitch(p);
  }
}

// --- Shots ------------------------------------------------------------
function evaluateShot(from, at = finalPos) {
  const keeper = homeSide().find((p) => p.unit === 'G');
  const blockers = homeSide().filter((p) => p.unit !== 'G');
  const lanes = GOAL_LANES.map((gy) => {
    const to = { x: 0, y: gy }, len = dist(from, to);
    const ux = (to.x - from.x) / len, uy = (to.y - from.y) / len;
    const along = (q) => (q.x - from.x) * ux + (q.y - from.y) * uy;
    const perp = (q) => Math.abs((q.x - from.x) * uy - (q.y - from.y) * ux);
    let blocker = null, bt = Infinity;
    for (const b of blockers) {
      const q = at(b), t = along(q);
      if (t > 0 && t < len && perp(q) < SHOT_BLOCK && t < bt) { blocker = b; bt = t; }
    }
    const kq = keeper && at(keeper);
    const kPerp = kq && along(kq) > 0 ? perp(kq) : Infinity;
    return { to, len, blocker, blockPoint: blocker && { x: from.x + ux * bt, y: from.y + uy * bt }, keeper, kMargin: kPerp - keeperReach(len) };
  });
  const open = lanes.filter((l) => !l.blocker);
  const best = open.sort((a, b) => b.kMargin - a.kMargin)[0] || null;
  const d = dist(from, { x: 0, y: 34 });
  return { lanes, best, saved: best ? best.kMargin <= 0 : null, odds: best && best.kMargin > 0 ? shotOdds(d) : 0, d };
}

// --- Heuristic opponent -----------------------------------------------
// Scores candidate run ends on free space, forward progress and whether
// they open a pass from the ball; then picks the best uncut pass, a shot
// when it's on, or else a dribble into the largest gap.
// The attackers commit to their runs at the start of each phase and the
// board shows them, so the lanes you see are the lanes you're defending.
// Up to four runners nearest the ball, each scored on free space, forward
// progress and whether the run opens a lane from the ball.
function planRuns() {
  const holder = carrier(), ball = state.ball;
  const home = homeSide();
  const space = (pt) => Math.min(...home.map((h) => dist(h, pt)));
  const ends = new Map();
  const runners = awaySide().filter((p) => p !== holder && p.unit !== 'G' && dist(p, ball) <= 45)
    .sort((a, b) => dist(a, ball) - dist(b, ball)).slice(0, 4);
  for (const p of runners) {
    let best = { x: p.x, y: p.y }, bestS = -Infinity;
    for (let a = 0; a < 16; a++) {
      for (const r of [0, 6, 12]) {
        if (r === 0 && a) continue;
        const ang = (a / 16) * Math.PI * 2;
        const c = { x: p.x + Math.cos(ang) * r, y: p.y + Math.sin(ang) * r };
        if (c.x < 1 || c.x > PITCH.L - 1 || c.y < 1 || c.y > PITCH.W - 1) continue;
        let s = Math.min(space(c), 10) + (p.x - c.x) * 0.35;
        if (!laneBlockedByHome(ball, c)) s += 3;
        for (const q of ends.values()) if (dist(q, c) < 6) s -= 3;
        if (s > bestS) { bestS = s; best = c; }
      }
    }
    // A slight curve away from the ball reads as a real run.
    if (dist(p, best) >= 3) ends.set(p.id, { ...best, bend: (best.y > ball.y ? -1 : 1) * attackDir('away') * 0.18 });
  }
  return ends;
}

function heuristicPlan() {
  const m = state.match, holder = carrier(), ball = state.ball;
  const home = homeSide(), away = awaySide();
  const space = (pt) => Math.min(...home.map((h) => dist(h, pt)));
  const ends = m.planned || new Map();
  const runs = [...ends].map(([id, e]) => ({ num: away.find((p) => p.id === id).num, x: e.x, y: e.y, bend: e.bend }));
  const at = plannedAt;

  // Best uncut pass.
  let pick = null;
  for (const r of away) {
    if (r === holder || m.offsideAtStart.has(r.id)) continue;
    const to = at(r), o = resolvePass('away', ball, to, r, at);
    if (o.result !== 'complete') continue;
    const v = (ball.x - to.x) + 2 * linesBroken(ball, to, 'away') + 0.4 * Math.min(space(to), 10) + (reachedTarget(m.win, to) ? 30 : 0);
    if (!pick || v > pick.v) pick = { r, to, v };
  }
  // A completed pass into the target wins outright: take it before anything else.
  if (pick && reachedTarget(m.win, pick.to)) {
    return { runs, action: { type: 'pass', to: pick.r.num }, thinking: `Nobody is on the line to our #${pick.r.num}, and he ends up inside your ${m.win === 'box' ? 'box' : 'zone'}.` };
  }
  // Shot?
  const shot = evaluateShot(ball);
  const lastChance = m.phase === m.total;
  if (shot.d < 26 && shot.best && !shot.saved && (shot.odds >= 0.2 || lastChance)) {
    return { runs, action: { type: 'shoot' }, thinking: `Your block leaves a clear lane at the ${shot.best.to.y < 34 ? 'near' : 'far'} side and your keeper can't cover it, so we shoot.` };
  }
  if (pick && pick.v > -8) {
    const gap = Math.min(space(pick.to), 20);
    const near = home.reduce((b, h) => (dist(h, pick.to) < dist(b, pick.to) ? h : b));
    return { runs, action: { type: 'pass', to: pick.r.num }, thinking: `Your #${near.num} is ${gap.toFixed(0)} m from where our #${pick.r.num} ends up and nobody is on the line of the pass, so we play it.` };
  }
  // Dribble into the largest gap.
  let dr = null;
  for (let a = 0; a < 16; a++) {
    const ang = (a / 16) * Math.PI * 2;
    const end = cleanPt({ x: ball.x + Math.cos(ang) * DRIBBLE_CAP, y: ball.y + Math.sin(ang) * DRIBBLE_CAP });
    const tackler = dribbleTackler(ball, end);
    const v = (tackler ? -100 : 0) + Math.min(space(end), 12) + (ball.x - end.x) * 0.5 + (reachedTarget(m.win, end) ? 30 : 0);
    if (!dr || v > dr.v) dr = { end, v };
  }
  return { runs, action: { type: 'dribble', x: dr.end.x, y: dr.end.y }, thinking: `Every pass is covered, but there are ${Math.min(space(dr.end), 12).toFixed(0)} m of space in front of the ball, so we carry it.` };
}

function laneBlockedByHome(from, to) {
  const len = dist(from, to);
  if (len < 1e-6) return false;
  const ux = (to.x - from.x) / len, uy = (to.y - from.y) / len, r = len > LOFT_OVER ? 0 : interceptRadius(len);
  return homeSide().some((h) => {
    const t = (h.x - from.x) * ux + (h.y - from.y) * uy;
    return len > LOFT_OVER ? dist(h, to) < LOFT_LOSE_R : t >= 0 && t <= len && Math.abs((h.x - from.x) * uy - (h.y - from.y) * ux) < r;
  });
}

function dribbleTackler(from, to) {
  const len = dist(from, to) || 1e-6;
  const ux = (to.x - from.x) / len, uy = (to.y - from.y) / len;
  let best = null, bt = Infinity;
  for (const h of homeSide()) {
    const t = clamp((h.x - from.x) * ux + (h.y - from.y) * uy, 0, len);
    const d = Math.hypot(h.x - (from.x + ux * t), h.y - (from.y + uy * t));
    if (d < DRIBBLE_TACKLE - 1e-6 && t < bt) { best = h; bt = t; }   // strictly within: a defender held at the 1.6 m keep-out can still be dribbled away from
  }
  return best;
}

// Clamp a plan from either opponent into something the engine can run.
function sanitizePlan(raw) {
  const holder = carrier();
  const away = awaySide();
  const byNum = (n) => away.find((p) => p.num === num(n));
  const runs = [];
  for (const r of Array.isArray(raw?.runs) ? raw.runs : []) {
    const p = byNum(r?.num);
    if (!p || p === holder || runs.some((q) => q.p === p) || !Number.isFinite(num(r.x)) || !Number.isFinite(num(r.y))) continue;
    const end = cleanPt({ x: num(r.x), y: num(r.y) }), d = dist(p, end);
    if (d > MATCH_RUN_CAP) { end.x = p.x + ((end.x - p.x) * MATCH_RUN_CAP) / d; end.y = p.y + ((end.y - p.y) * MATCH_RUN_CAP) / d; }
    if (dist(p, end) >= 1) runs.push({ p, run: { ...end, bend: clamp(num(r.bend) || 0, -MAX_BEND, MAX_BEND) } });
  }
  const a = raw?.action || {};
  let action = null;
  if (a.type === 'pass' && byNum(a.to) && byNum(a.to) !== holder) action = { type: 'pass', to: byNum(a.to) };
  else if (a.type === 'shoot') action = { type: 'shoot' };
  else if (a.type === 'dribble' && Number.isFinite(num(a.x)) && Number.isFinite(num(a.y))) {
    const end = cleanPt({ x: num(a.x), y: num(a.y) }), d = dist(state.ball, end);
    if (d > DRIBBLE_CAP) { end.x = state.ball.x + ((end.x - state.ball.x) * DRIBBLE_CAP) / d; end.y = state.ball.y + ((end.y - state.ball.y) * DRIBBLE_CAP) / d; }
    action = { type: 'dribble', x: end.x, y: end.y };
  }
  if (!action) return null;
  return { runs, action, thinking: str(raw.thinking, 300) || 'We look for the gap.' };
}

// --- Game flow ------------------------------------------------------------
let matchBoard = null;   // the board to restore when the game ends

function startMatch(setup, difficulty) {
  if (anim) return;
  if (!state.match) aiOff = false;
  if (!state.match) matchBoard = snapshot();
  state.match = null;
  const scenario = validateScenario({ ...setup, pass: null });
  loadScenario(scenario);
  state.pendingPass = state.basePass = null;
  for (const p of state.players) { p.run = p.baseRun = null; }
  const holder = nearestTo(setup.ball || state.ball, 'away');
  if (!carrier() || carrier().team !== 'away') giveBall(holder);
  state.match = {
    setup, difficulty, win: setup.win, total: setup.phases, phase: 1, status: 'defending',
    log: [], result: null, debrief: null, source: null,
  };
  beginPhase();
  setTool('move');
  state.selected = null;

  renderMatchUI();
}

function beginPhase() {
  const m = state.match;
  m.starts = new Map(homeSide().map((p) => [p.id, { x: p.x, y: p.y }]));
  m.planned = planRuns();
  m.status = 'defending';
}

// Offside is judged the moment the attack starts: after you've set your
// line and before anyone runs, so stepping up can catch attackers out.
function fixOffside() {
  const m = state.match;
  const line = offsideLine('away');
  m.offsideLineAtStart = line;
  m.offsideAtStart = new Set(awaySide().filter((p) => p !== carrier() && p.x < line - 1e-9).map((p) => p.id));
}

async function lockIn() {
  const m = state.match;
  if (!m || m.status !== 'defending' || anim) return;
  const T = computeThreats();
  m.worstOpen = Math.max(m.worstOpen || 0, T ? T.open : 0);
  m.status = 'thinking';
  fixOffside();
  state.selected = null;
  renderMatchUI();
  let plan = null;
  try { plan = await getOpponentPlan(); } catch { plan = null; }
  if (!state.match || state.match !== m) return;
  if (!plan) { plan = sanitizePlan(heuristicPlan()); m.source = 'heuristic'; }
  plan.runs = [...m.planned].map(([id, e]) => ({ p: state.players.find((q) => q.id === id), run: { x: e.x, y: e.y, bend: e.bend || 0 } }))
    .filter((r) => r.p && r.p !== carrier());
  m.status = 'resolving';
  renderMatchUI();
  resolvePhase(plan);
}

// Replaced in the AI phase; the heuristic is the fallback either way.
let getOpponentPlan = async () => null;

function resolvePhase(plan) {
  const m = state.match, holder = carrier();
  for (const { p, run } of plan.runs) p.run = run;
  const movers = plan.runs.map((r) => r.p);
  const entry = { phase: m.phase, thinking: plan.thinking, source: m.source, action: '', outcome: '' };
  const a = plan.action;
  let pass = null, extra = { entry, plan };

  if (a.type === 'pass') {
    const to = finalPos(a.to);
    entry.action = `Pass to #${a.to.num}`;
    if (m.offsideAtStart.has(a.to.id)) {
      extra.offside = true;
      pass = { passer: holder, to, receiver: a.to, outcome: { result: 'offside', winner: null, point: to, len: dist(state.ball, to) } };
    } else {
      pass = { passer: holder, to, receiver: a.to, outcome: resolvePass('away', { ...state.ball, id: holder.id }, to, a.to) };
    }
  } else if (a.type === 'dribble') {
    entry.action = `Dribble ${dist(state.ball, a).toFixed(0)} m`;
    holder.run = { x: a.x - (state.ball.x - holder.x), y: a.y - (state.ball.y - holder.y), bend: 0 };
    clampToPitch(holder.run);
    movers.push(holder);
    extra.tackler = dribbleTackler(state.ball, a);
  } else {
    const shot = evaluateShot(state.ball);
    entry.action = `Shot from ${shot.d.toFixed(0)} m`;
    let outcome;
    if (!shot.best) {
      const lane = shot.lanes[2];
      outcome = { result: 'blocked', winner: lane.blocker, point: lane.blockPoint, len: lane.len };
    } else if (shot.saved) {
      outcome = { result: 'saved', winner: shot.best.keeper, point: { x: 0.5, y: shot.best.to.y }, len: shot.best.len };
    } else {
      const goal = Math.random() < shot.odds;
      extra.odds = shot.odds;
      const y = goal ? shot.best.to.y : shot.best.to.y < 34 ? 28.8 : 39.2;
      outcome = { result: goal ? 'goal' : 'miss', winner: null, point: { x: -1, y }, len: shot.best.len };
    }
    pass = { passer: holder, to: outcome.point, receiver: null, outcome };
  }
  startAnim(movers, pass, { silent: true, extra });
}

onPlayFinished = (outcome, extra) => {
  const m = state.match;
  if (!m || !extra?.entry) return;
  const e = extra.entry;
  let over = null;   // { you: boolean, reason }
  const name = (p) => `${p.team === 'home' ? 'your' : 'their'} #${p.num}`;
  if (extra.offside) over = { you: true, reason: `Offside: their #${extra.plan.action.to.num} was beyond your line when the phase started.` };
  else if (outcome) {
    const r = outcome.result;
    if (r === 'intercepted') over = { you: true, reason: `Intercepted by ${name(outcome.winner)}.` };
    else if (r === 'lost') over = { you: true, reason: `Long ball won by ${name(outcome.winner)} (within 4 m of where it landed).` };
    else if (r === 'lost-space') over = { you: true, reason: `The pass ran to ${name(outcome.winner)}.` };
    else if (r === 'blocked') over = { you: true, reason: `Shot blocked by ${name(outcome.winner)}.` };
    else if (r === 'saved') over = { you: true, reason: 'Your keeper saves it.' };
    else if (r === 'miss') over = { you: true, reason: `The shot goes wide (${Math.round(extra.odds * 100)}% chance).` };
    else if (r === 'goal') over = { you: false, reason: `Goal. They scored (${Math.round(extra.odds * 100)}% chance).` };
    else e.outcome = `Found #${outcome.winner.num}.`;
    if (e.source === 'model' && extra.plan.action.type === 'pass' && outcome.result !== 'complete') e.note = 'The model expected this pass to be on; the engine disagreed.';
  } else if (extra.tackler) {
    giveBall(extra.tackler);
    over = { you: true, reason: `Dribble stopped by your #${extra.tackler.num}.` };
  } else e.outcome = 'Carried it forward.';

  if (!over) {
    const c = carrier();
    if (c && c.team === 'away' && reachedTarget(m.win, state.ball)) over = { you: false, reason: `They reached the target: ${WIN_TEXT[m.win]}.` };
    else if (m.phase >= m.total) over = { you: true, reason: `You held them out for all ${m.total} phases.` };
  }
  if (over) e.outcome = over.reason;
  m.log.push(e);
  // Effects where the moment happened.
  const green = '#34d399';
  if (extra.offside) burst(state.ball.x, state.ball.y, colors.offside);
  else if (extra.tackler) burst(extra.tackler.x, extra.tackler.y, green);
  else if (outcome && ['intercepted', 'lost', 'blocked', 'saved'].includes(outcome.result)) burst(outcome.point.x, outcome.point.y, green, true);
  else if (outcome?.result === 'goal') { burst(0, outcome.point.y, colors.away, true); flash('goal'); }
  if (over) {
    m.status = 'over';
    m.result = over;
    recordResult(over.you);
    m.stars = over.you ? (m.worstOpen ? (m.worstOpen <= 1 ? 2 : 1) : 3) : 0;
    const lvl = PRESETS.indexOf(m.setup);
    if (lvl >= 0 && m.stars > starsFor(lvl)) { progress.stars[lvl] = m.stars; store.set(PROGRESS_KEY, progress); }
    if (over.you) { confetti(); flash('win'); }
    else if (outcome?.result !== 'goal') flash('goal');
  } else {
    m.phase++;
    beginPhase();
    toast(`Phase ${m.phase} of ${m.total}: ${e.outcome}`);
  }
  renderMatchUI();
  requestRender();
};

// Win/loss record and streak, kept per browser.
const RECORD_KEY = 'tacticsLab.record.v1';
let record = store.get(RECORD_KEY, null);
if (!record || !Number.isFinite(record.w)) record = { w: 0, l: 0, streak: 0, best: 0 };
function recordResult(won) {
  if (won) { record.w++; record.streak++; record.best = Math.max(record.best, record.streak); }
  else { record.l++; record.streak = 0; }
  store.set(RECORD_KEY, record);
}
const recordText = () => `${record.w}W – ${record.l}L${record.streak > 1 ? ` · ${record.streak} in a row` : ''}${record.best > 1 ? ` · best ${record.best}` : ''}`;

function exitMatch() {
  if (anim) return;
  state.match = null;
  if (matchBoard) restore(matchBoard);
  matchBoard = null;
  renderMatchUI();
  requestRender();
}

// --- Live threats ----------------------------------------------------------
// While you set your shape, every pass from their carrier to where each
// player will be after the telegraphed runs is judged by resolvePass(),
// plus a shot check, so you can watch lanes close as you drag.
function computeThreats() {
  const holder = carrier();
  if (!holder || holder.team !== 'away') return null;
  const here = (q) => ({ x: q.x, y: q.y });
  const line = offsideLine('away');
  const passes = awaySide().filter((r) => r !== holder).map((r) => {
    const to = plannedAt(r);
    const o = resolvePass('away', { ...state.ball, id: holder.id }, to, r, plannedAt);
    const offside = r.x < line - 1e-9;
    const gain = state.ball.x - to.x, breaks = linesBroken(state.ball, to, 'away');
    const ok = o.result === 'complete' && !offside;
    // Only forward passes that gain ground or break a line are threats;
    // recycling it backwards or square is not.
    return { r, to, o, offside, gain, breaks, open: ok && (gain >= 6 || breaks > 0), safe: ok && gain < 6 && !breaks };
  });
  const shot = evaluateShot(state.ball, here);
  const shotOn = !!shot.best && !shot.saved && shot.d < 30;
  return { passes, shot, shotOn, open: passes.filter((p) => p.open).length, line };
}

function drawThreats(T) {
  usePitchSpace();
  const b = state.ball, r = playerR();
  ctx.lineCap = 'round';
  const danger = T.passes.filter((p) => p.open).sort((a, c) => c.gain - a.gain)[0];
  // Telegraphed runs: dashed arrows to a ghost of where each runner ends up.
  for (const [id, e] of state.match.planned || []) {
    const q = state.players.find((pl) => pl.id === id);
    if (!q) continue;
    const g = runGeom(q, e);
    ctx.strokeStyle = colors.awayRun; ctx.globalAlpha = 0.8; ctx.lineWidth = lineWidthM(0.18); ctx.setLineDash([0.8, 0.6]);
    ctx.beginPath(); ctx.moveTo(g.S.x, g.S.y); ctx.quadraticCurveTo(g.C.x, g.C.y, g.E.x, g.E.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 0.5; ctx.strokeStyle = colors.away; ctx.lineWidth = lineWidthM(0.2);
    circle(e.x, e.y, r * 0.85);
    ctx.globalAlpha = 1;
  }
  for (const p of T.passes) {
    const to = p.to;
    if (p.safe) {
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = lineWidthM(0.12);
      line(b.x, b.y, to.x, to.y);
    } else if (p.open) {
      // Glow then core, heavier for the most dangerous pass.
      const w = p === danger ? 0.9 : 0.55;
      ctx.strokeStyle = colors.away;
      ctx.globalAlpha = 0.25; ctx.lineWidth = Math.max(w * 2.4, 6 / view.s); line(b.x, b.y, to.x, to.y);
      ctx.globalAlpha = 0.95; ctx.lineWidth = Math.max(w, 2 / view.s); line(b.x, b.y, to.x, to.y);
      ctx.globalAlpha = 1;
    } else if (p.offside && p.o.result === 'complete') {
      ctx.strokeStyle = colors.offside; ctx.globalAlpha = 0.6;
      ctx.lineWidth = lineWidthM(0.14); ctx.setLineDash([0.5, 0.7]);
      line(b.x, b.y, to.x, to.y); ctx.setLineDash([]); ctx.globalAlpha = 1;
    } else if (dist(b, to) < 32 && !p.safe) {
      // Cut: a faint stub up to where it dies, marked with a cross.
      const at = p.o.point;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = lineWidthM(0.12); ctx.setLineDash([0.4, 0.6]);
      line(b.x, b.y, at.x, at.y); ctx.setLineDash([]);
      const k = r * 0.45;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = lineWidthM(0.2);
      line(at.x - k, at.y - k, at.x + k, at.y + k); line(at.x - k, at.y + k, at.x + k, at.y - k);
    }
  }
  if (T.shotOn) {
    const to = T.shot.best.to;
    ctx.strokeStyle = colors.away; ctx.globalAlpha = 0.9;
    ctx.lineWidth = Math.max(0.5, 2 / view.s); ctx.setLineDash([1.2, 0.6]);
    line(b.x, b.y, to.x, to.y); ctx.setLineDash([]); ctx.globalAlpha = 1;
    badge((b.x + to.x) / 2, (b.y + to.y) / 2, `Shot ${Math.round(T.shot.odds * 100)}%`);
  }
}

function updateHud() {
  const m = state.match, hud = $('#hud');
  if (!m || m.status === 'over') { hud.hidden = true; return; }
  hud.hidden = false;
  const pips = Array.from({ length: m.total }, (_, i) => `<i class="${i + 1 < m.phase ? 'done' : i + 1 === m.phase ? 'now' : ''}"></i>`).join('');
  let cells = `<div class="cell"><span class="k">Phase ${m.phase} of ${m.total}</span><span class="pips">${pips}</span></div>
    <div class="cell obj"><span class="k">Stop them</span><span class="v">${esc(WIN_SHORT[m.win])}</span></div>`;
  const T = A.threats;
  if (m.status !== 'defending') cells += `<div class="cell"><span class="k">Opponent</span><span class="v pulse">${m.status === 'thinking' ? 'Reading you…' : 'Attacking…'}</span></div>`;
  else if (T) {
    cells += `<div class="cell"><span class="k">Open lanes</span><span class="v ${T.open ? 'bad' : 'good'}">${T.open ? T.open : 'None ✓'}</span></div>
      <div class="cell"><span class="k">Shot</span><span class="v ${T.shotOn ? 'bad' : 'good'}">${T.shotOn ? Math.round(T.shot.odds * 100) + '%' : 'Covered'}</span></div>`;
  }
  setHTML(hud, cells);
}

// --- Effects ---------------------------------------------------------------
const fx = [];
function burst(x, y, color, big = false) { fx.push({ kind: 'burst', x, y, color, t0: performance.now(), dur: big ? 900 : 650, big }); requestRender(); }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const W = canvas.clientWidth, cols = [colors.home, colors.select, '#ffffff', '#34d399', colors.badge];
  for (let i = 0; i < 140; i++) {
    fx.push({ kind: 'bit', x: W / 2 + (Math.random() - 0.5) * W * 0.6, y: -10 - Math.random() * 80, vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length], t0: performance.now(), dur: 2200 });
  }
  requestRender();
}
function flash(kind) {
  const el = $('#flash');
  el.className = ''; void el.offsetWidth; el.className = kind;
}
function drawFx() {
  const now = performance.now();
  for (let i = fx.length - 1; i >= 0; i--) if (now - fx[i].t0 > fx[i].dur) fx.splice(i, 1);
  if (!fx.length) return;
  for (const f of fx) {
    const t = (now - f.t0) / f.dur;
    if (f.kind === 'burst') {
      usePitchSpace();
      ctx.strokeStyle = f.color;
      for (const k of f.big ? [0, 0.18, 0.36] : [0, 0.2]) {
        const tt = clamp(t - k, 0, 1);
        if (!tt) continue;
        ctx.globalAlpha = 1 - tt;
        ctx.lineWidth = Math.max(0.5 * (1 - tt), 1 / view.s);
        circle(f.x, f.y, 1 + tt * (f.big ? 12 : 7));
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      const dt = (now - f.t0) / 16;
      ctx.save();
      ctx.translate(f.x + f.vx * dt, f.y + f.vy * dt + 0.02 * dt * dt);
      ctx.rotate(f.rot + f.vr * dt);
      ctx.globalAlpha = 1 - t * t;
      ctx.fillStyle = f.c;
      ctx.fillRect(-4, -2.5, 8, 5);
      ctx.restore();
    }
  }
  requestRender();
}

// --- Match drawing ---------------------------------------------------------
function drawMatch() {
  const m = state.match;
  usePitchSpace();
  // Target zone.
  ctx.save();
  ctx.fillStyle = colors.away; ctx.globalAlpha = 0.1;
  ctx.strokeStyle = colors.away;
  ctx.lineWidth = lineWidthM(0.3);
  ctx.setLineDash([1.2, 0.8]);
  const zone = m.win === 'half' ? [0, 0, PITCH.L / 2, PITCH.W] : m.win === 'final3' ? [0, 0, 35, PITCH.W]
    : [0, (PITCH.W - PITCH.boxW) / 2, PITCH.boxD, PITCH.boxW];
  if (m.win !== 'score') { ctx.fillRect(...zone); ctx.globalAlpha = 0.7; ctx.strokeRect(...zone); }
  ctx.restore();
  if (m.status !== 'defending') return;
  if (A.threats) drawThreats(A.threats);
  // Each defender leaves a tether back to where they started the phase;
  // the movement ring shows only for the player you're touching.
  const R = RING[m.difficulty];
  const active = (drag && drag.target.team === 'home' && drag.target) || homeSide().find((p) => p.id === state.selected || p.id === state.hover);
  ctx.save();
  ctx.lineWidth = lineWidthM(0.12);
  for (const p of homeSide()) {
    const s = m.starts.get(p.id);
    ctx.fillStyle = 'rgba(191,219,254,0.55)';
    dot(s.x, s.y, 0.35);
    if (dist(p, s) > 0.5) { ctx.strokeStyle = 'rgba(191,219,254,0.45)'; line(s.x, s.y, p.x, p.y); }
  }
  if (active) {
    const s = m.starts.get(active.id);
    ctx.strokeStyle = 'rgba(191,219,254,0.85)';
    ctx.fillStyle = 'rgba(191,219,254,0.1)';
    ctx.lineWidth = lineWidthM(0.18);
    ctx.beginPath(); ctx.arc(s.x, s.y, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.setLineDash([0.4, 0.4]);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = lineWidthM(0.12);
  circle(state.ball.x, state.ball.y, BALL_KEEPOUT);
  ctx.restore();
}
